найчастіше залишаються на все життя."], "ul": ["Регулярна рухова активність.", "Здоровий сон.", "Збалансоване харчування.", "Позитивне мислення й спілкування.", "Вчасні медичні огляди."]}, {"h": "Баскетбол. Кидки однією рукою зверху в стрибку (хлопці) та обома руками зверху (дівчата) з місця", "p": ["Кидок у стрибку однією рукою: гравець присідає, вистрибує вертикально, у найвищій точці розгинає руку вгору-вперед і кистю посилає м’яч. Головне — стрибати вгору, а не вперед.", "Кидок обома руками зверху: м’яч тримають над головою, пальці обох рук розведені; кидок виконують розгинанням рук і одночасним рухом кистей. Він потребує менше сили й підходить для середньої відстані."], "ul": ["Стрибок вертикальний, без нахилу.", "Кидок у найвищій точці стрибка.", "Обидві кисті працюють однаково (кидок двома руками).", "Не опускай м’яч перед кидком — його легко вибити.", "Приземлення на те саме місце."]}, {"h": "Гандбол. Кидок м’яча з замахом зверху. Український гандбол", "p": ["Кидок з замахом зверху складається з фаз: замах (рука з м’ячем відходить назад-вгору), крок протилежною ногою вперед, поворот тулуба, хлист руки й кисті, завершення руху вниз. Чим ширший і правильніший замах, тим сильніший кидок.", "Гандбол в Україні має давні традиції. Жіноча команда київського «Спартака» багаторазово вигравала Кубок європейських чемпіонів, а запорізькі «Мотор» і ЗТР добре відомі в Європі."], "ul": ["Замах — лікоть на рівні плеча або вище.", "Крок протилежною ногою дає силу.", "Тулуб повертається до воріт.", "Кисть завершує рух униз.", "Не кидай з прямою рукою — можна травмувати плече."]}], "f": "Жіноча гандбольна команда київського «Спартака» — одна з найтитулованіших клубних команд в історії європейського гандболу.", "pr": ["Виконай вправи на розвиток витривалості: ходьба на місці з високим підніманням колін 3×2 хв, присідання в повільному темпі 3×15, відпочинок між серіями.", "Намалюй або опиши фази кидка з замахом зверху (4–5 фаз) у вигляді схеми."], "q": ["Як підвищити рівень свого здоров’я?", "Чим відрізняється кидок у стрибку від кидка з місця?", "З яких фаз складається кидок із замахом зверху?", "Які українські гандбольні клуби ти знаєш?"]}, {"n": "72", "t": "«Активні парки». Фоли в баскетболі. 7-метровий кидок у навчальній грі з гандболу", "g": "Учень знатиме, як скористатися можливостями «Активних парків», правила фолів у баскетболі та поведінку гравців під час 7-метрового кидка.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Локація", "визначене місце, облаштоване для певного виду діяльності."], ["Персональний фол", "порушення правил, пов’язане з неправильним фізичним контактом із суперником."], ["Командний фол", "фол, що зараховується команді; після певної кількості командних фолів за чверть суперник пробиває штрафні."], ["Вилучення на 2 хвилини", "покарання в гандболі, коли гравець тимчасово залишає майданчик, а команда грає в меншості."]], "th": [{"h": "Здоровий спосіб життя. «Активні парки» — локації здорової України", "p": ["У межах проєкту в парках і громадських просторах облаштовують локації з тренажерами, біговими доріжками, майданчиками та маршрутами. Там можуть проходити безкоштовні тренування з інструкторами для дітей, дорослих і людей старшого віку.", "Такі локації роблять рухову активність доступною: не потрібно купувати абонемент, достатньо прийти у зручний час."], "ul": ["Дізнайся, чи є така локація у твоїй громаді.", "Перед заняттям на тренажерах — розминка.", "Користуйся тренажерами за інструкцією на табличці.", "Займайся разом з родиною чи друзями.", "Бережи обладнання — воно для всіх."]}, {"h": "Баскетбол. Навчальна гра: фоли та покарання", "p": ["Фол фіксують за штовхання, утримання, удар по руці, блокування корпусом із рухом назустріч. Якщо фол був під час кидка, гравцю призначають штрафні кидки; якщо ні — команда вводить м’яч з-за бокової лінії.", "Гравець, який отримав 5 фолів, залишає гру. Тому розумний захисник діє ногами й корпусом, а не руками."], "ul": ["Фол під час кидка — 2 штрафні (3 — якщо кидок з-за дуги).", "Влучний кидок + фол — очки зараховують і ще 1 штрафний.", "5 персональних фолів — гравець вибуває.", "Неспортивна поведінка карається технічним фолом.", "Суддя показує фол піднятою рукою зі стиснутим кулаком."]}, {"h": "Гандбол. Навчальна гра. Штрафний кидок", "p": ["Під час 7-метрового кидка всі гравці, крім кидаючого й воротаря, стоять за лінією вільного кидка (9 м). Кидок виконують протягом 3 секунд після свистка судді.", "У навчальній грі вдосконалюємо дії і кидаючого (спокій, вибір кута), і воротаря (позиція, реакція). За грубі порушення в гандболі гравця вилучають на 2 хвилини."], "ul": ["Кидок — після свистка судді.", "Опорна нога не відривається до вильоту м’яча.", "Інші гравці — за лінією 9 м.", "Воротар не виходить ближче ніж до лінії 4 м.", "Повторне грубе порушення — суворіше покарання."]}], "f": "У баскетболі гравець, який отримав п’ять фолів, більше не може брати участі в матчі, навіть якщо до кінця залишилися лічені секунди.", "pr": ["Виконай вправи на розвиток швидкості: швидкі оплески 3×10 с, «тепінг» стопами сидячи 3×10 с, гра на реакцію «долоні» з членом родини.", "Знайди найближчий до дому майданчик чи парк для занять і склади план тренування там (5–6 вправ)."], "q": ["Що пропонують локації «Активних парків»?", "Що таке фол у баскетболі?", "Скільки фолів може отримати гравець до вибуття з гри?", "Де стоять гравці під час 7-метрового кидка в гандболі?"]}, {"n": "73", "t": "Помилки у скандинавській ходьбі. Прискорення на 5 м. Взаємодія воротаря і гравця", "g": "Учень знатиме типові помилки у скандинавській ходьбі, техніку старту з різних положень та взаємодію воротаря з захисниками.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Техніка ходьби з палицями", "узгоджена робота рук і ніг, коли палиця ставиться під кутом і рука відштовхується назад."], ["Стартове положення", "поза, з якої гравець починає рух: стоячи, сидячи, лежачи, спиною вперед тощо."], ["Стартова швидкість", "здатність набрати швидкість за мінімальний час на короткому відрізку."], ["Взаємодія", "узгоджені дії двох або кількох гравців для досягнення спільної мети."]], "th": [{"h": "Здоровий спосіб життя. Скандинавська ходьба: основні помилки", "p": ["Скандинавська ходьба корисна, лише якщо виконувати її правильно. Багато початківців просто несуть палиці в руках або ставлять їх перед собою, як під час звичайної прогулянки з тростиною.", "Правильно: палиця ставиться приблизно на рівні середини кроку, під кутом, рука відштовхується назад і кисть розкривається. Рука і протилежна нога рухаються разом."], "ul": ["Помилка: палиці надто довгі або короткі.", "Помилка: палиця ставиться попереду ноги.", "Помилка: однойменна рука і нога рухаються разом.", "Помилка: сутулість, погляд униз.", "Помилка: стиснутий кулак протягом усього руху."]}, {"h": "Баскетбол. Прискорення на 5 м з різних стартових положень", "p": ["Перші кроки в баскетболі вирішують, хто першим опиниться біля м’яча. Тому тренують старти з різних положень: зі стійки, сидячи, лежачи, спиною вперед, після стрибка.", "Головне — швидко перенести вагу тіла вперед і робити короткі, часті перші кроки, активно працюючи руками."], "ul": ["Нахил тулуба вперед на старті.", "Перші кроки — короткі й часті.", "Руки зігнуті, активна робота.", "Старт за сигналом, а не до нього.", "Виконується лише в залі чи на майданчику."]}, {"h": "Гандбол. Взаємодія воротаря і гравця. Ігри", "p": ["Воротар і захисники мають діяти разом. Захисник закриває одну частину воріт (наприклад, ближній кут), а воротар — іншу. Якщо вони не домовилися, суперник забиває у вільний простір.", "Воротар бачить усе поле, тому він підказує захисникам голосом. Після відбитого м’яча воротар швидко передає м’яч партнеру для контратаки."], "ul": ["Захисник блокує руками напрямок кидка.", "Воротар закриває іншу частину воріт.", "Воротар голосом керує захистом.", "Після сейву — швидка передача вперед.", "Ігри — з дотриманням правил і повагою."]}], "f": "Для скандинавської ходьби довжину палиць часто підбирають так, щоб під час ходьби рука була зігнута в лікті приблизно під прямим кутом.", "pr": ["Виконай вправи на розвиток гнучкості: нахили вперед сидячи, «метелик», розтягування задньої поверхні стегна лежачи, повороти тулуба сидячи — по 20 с кожна.", "Запиши 4 основні помилки у скандинавській ходьбі та як їх виправити."], "q": ["Які основні помилки трапляються у скандинавській ходьбі?", "Навіщо тренувати старти з різних положень?", "Як воротар і захисник ділять ворота?", "Чому воротар має керувати захистом голосом?"]}, {"n": "74", "t": "Конкурси без визначення переможців. Передачі м’яча у стрибку. Естафети з елементами гандболу", "g": "Учень знатиме, як брати участь у конкурсах без переможців, техніку передачі в стрибку та правила естафет з гандбольними елементами.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Конкурс без визначення переможців", "захід, у якому оцінюють участь і старання, а не місце."], ["Передача у стрибку", "передача, виконана в повітрі, коли гравець вистрибнув, щоб передати м’яч над захисником."], ["Фінт", "обманний рух, що змушує суперника помилитися."], ["Командний дух", "єдність і взаємопідтримка учасників команди."]], "th": [{"h": "Здоровий спосіб життя. Участь у конкурсах і змаганнях без визначення переможців", "p": ["Такі конкурси допомагають відчути радість руху без страху програти. Кожен отримує можливість показати свої вміння, а учасників відзначають за старанність, творчість чи підтримку інших.", "Це добрий спосіб спробувати нове: танцювальний флешмоб, челендж на рівновагу, творчу естафету чи конкурс на найкращу руханку."], "ul": ["Головне — участь і настрій.", "Підтримуй інших учасників.", "Пробуй нові види активності.", "Оцінюй свій поступ, а не чужий.", "Дякуй організаторам і суперникам."]}, {"h": "Баскетбол. Передачі м’яча у стрибку", "p": ["Передачу у стрибку виконують, щоб перекинути м’яч через захисника або змінити рішення в повітрі (наприклад, замість кидка віддати м’яч вільному партнеру). Гравець вистрибує, у найвищій точці передає м’яч двома руками з-над голови або однією рукою.", "Важливо: якщо гравець вистрибнув з м’ячем, він має позбутися м’яча до приземлення, інакше буде пробіжка."], "ul": ["Передача — у найвищій точці стрибка.", "Рішення ухвалюй до стрибка.", "Не приземляйся з м’ячем у руках.", "Цілься в руки партнера.", "Не стрибай на захисника."]}, {"h": "Гандбол. Естафети з елементами гандболу", "p": ["Естафети з гандбольними елементами поєднують біг, ведення м’яча, передачі й кидки по воротах. Вони тренують техніку у швидкому темпі та виховують командний дух.", "Наприклад: ведення м’яча до фішки, передача партнеру, кидок у ціль, повернення бігом. За пробіжку чи неточну передачу команда отримує штрафне завдання."], "ul": ["Ведення м’яча — однією рукою, від підлоги.", "Передачі — точно в руки.", "Кидок — тільки в ціль, не в людей.", "Виконуй правило трьох кроків.", "Естафету передавай з рук у руки."]}], "f": "У гандболі, як і в баскетболі, дозволено вести м’яч ударами об підлогу, але вести його двома руками одночасно заборонено.", "pr": ["Виконай вправи на розвиток спритності: підкидання м’ячика і ловіння за спиною, ловіння м’ячика після відскоку від стіни з поворотом, стійка на одній нозі з оплеском під коліном.", "Придумай конкурс без визначення переможців для свого класу (дистанційно) і запиши його умови."], "q": ["Чим корисні конкурси без визначення переможців?", "Коли варто виконувати передачу у стрибку?", "Яке порушення трапиться, якщо приземлитися з м’ячем після стрибка?", "Які елементи гандболу можна включити в естафету?"]}, {"n": "75", "t": "Оздоровчі конкурси. Кидки зверху: вдосконалення. Змагання й суддівство в гандболі", "g": "Учень знатиме види конкурсів на уроках, удосконалить знання про кидок зверху з місця та знатиме, як проводять змагання з гандболу й суддівські жести.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Фізкультурно-оздоровча діяльність", "заняття фізичними вправами для зміцнення здоров’я, відпочинку та гарного настрою."], ["Суддівський жест", "умовний знак рукою, яким суддя показує рішення гравцям і глядачам."], ["Попередження", "перше покарання в гандболі, яке суддя показує жовтою карткою."], ["Дискваліфікація", "відсторонення гравця до кінця гри, яке позначають червоною карткою."]], "th": [{"h": "Здоровий спосіб життя. Конкурси з різних видів фізкультурно-оздоровчої діяльності", "p": ["На уроках можна проводити конкурси руханок, виконання вправ на поставу, рівновагу, гнучкість, творчих розминок під музику. Їх оцінюють за правильністю виконання, оригінальністю та злагодженістю.", "Дистанційно такі конкурси проводять у відеоформаті: учень записує коротке відео виконання вправ або демонструє їх у прямому ефірі."], "ul": ["Конкурс руханок під музику.", "Конкурс на найкращу поставу.", "Челендж на рівновагу.", "Творча розминка в парі.", "Оцінювання — за правильністю і творчістю."]}, {"h": "Баскетбол. Кидки однією рукою зверху в стрибку (хлопці) та обома руками зверху (дівчата): вдосконалення", "p": ["Продовжуємо відпрацьовувати кидки. Для вдосконалення корисні серії: 5 кидків з однієї точки, потім зміна місця. Важливо, щоб кожен кидок виконувався однаково — це запорука стабільності.", "Перевіряй себе: чи стрибок вертикальний, чи м’яч летить по дузі, чи завершується рух кистю. Якщо м’яч часто відскакує від передньої дужки — додай сили ніг і підніми дугу."], "ul": ["Однаковий ритм перед кожним кидком.", "Кидай з різних точок, але однаково.", "Рахуй влучання з кожної серії.", "Аналізуй промахи: недоліт, переліт, убік.", "Відпочинок між серіями."]}, {"h": "Гандбол. Проведення змагань, правила, гра", "p": ["Змагання з гандболу проводить суддівська бригада: двоє суддів на майданчику, а також секретар і хронометрист. Судді використовують свисток і жести, щоб показувати рішення.", "Покарання: попередження (жовта картка), вилучення на 2 хвилини, дискваліфікація (червона картка). Під час навчальних змагань учні можуть по черзі бути суддями."], "ul": ["Пробіжка або затримка м’яча — оберти стиснутими кулаками один навколо одного.", "Подвійне ведення — рух долонею вгору-вниз.", "2-хвилинне вилучення — піднята рука з двома випрямленими пальцями.", "Попередження й дискваліфікацію показують картками — жовтою і червоною.", "Рішення судді не обговорюють."]}], "f": "У гандболі два судді працюють на майданчику одночасно, кожен відповідає за свою частину поля.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, віджимання 3×10, планка 3×30 с, «човник» на животі 3×12.", "Запиши 4 суддівські жести в гандболі та намалюй один з них."], "q": ["Які конкурси оздоровчої діяльності можна провести на уроці?", "Як удосконалювати кидки в кошик?", "Хто входить до суддівської бригади в гандболі?", "Які покарання бувають у гандболі?"]}, {"n": "76", "t": "Фізкультпаузи в навчанні. «Перекладання» м’яча. Гандбол: зонний захист", "g": "Учень знатиме, як і коли виконувати оздоровчі вправи протягом навчального дня, техніку «перекладання» м’яча та основи зонного захисту в гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Фізкультпауза", "коротка перерва на 3–5 хвилин з фізичними вправами під час навчання."], ["Перекладання м’яча", "зміна руки ведення перед собою, коли м’яч ударом об підлогу переходить з однієї руки в іншу."], ["Зонний захист", "система захисту, у якій кожен гравець відповідає за свою ділянку майданчика."], ["Схема 6:0", "розстановка в гандболі, коли всі шість польових гравців захищаються в одну лінію біля зони воротаря."]], "th": [{"h": "Здоровий спосіб життя. Оздоровчі рухи на різних етапах навчання", "p": ["Протягом навчального дня є різні етапи: перед уроками, під час уроків, на перервах, після навчання. На кожному з них можна виконати корисні рухи: ранкову зарядку, фізкультхвилинку, рухливу перерву, прогулянку.", "Особливо важливі вправи для очей, шиї, спини та кистей, адже під час роботи за комп’ютером саме вони найбільше втомлюються."], "ul": ["Ранок — руханка 10 хвилин.", "Під час уроку — фізкультхвилинка 1–2 хв.", "Перерва — встань, пройдися, потягнися.", "Вправи для очей: подивися вдалину, поморгай.", "Вечір — прогулянка, легке розтягування."]}, {"h": "Баскетбол. «Перекладання» м’яча при опорі захисника", "p": ["Коли захисник перекриває шлях, гравець змінює руку ведення: сильний удар м’яча об підлогу перед собою під кутом, і м’яч переходить в іншу руку. Одночасно гравець робить крок у новий бік і прискорюється.", "«Перекладання» має бути низьким і швидким, щоб захисник не встиг вибити м’яч. Найкраще його виконувати на відстані близько метра від суперника."], "ul": ["Удар м’яча — нижче колін.", "М’яч переходить перед собою, а не збоку.", "Крок і прискорення в новому напрямку.", "Не дивись на м’яч.", "Тренуй спочатку на місці, потім у русі."]}, {"h": "Гандбол. Навчальна гра: зонний захист", "p": ["У навчальній грі вивчаємо зонний захист. Найпростіша розстановка — 6:0: усі шість польових гравців стоять уздовж лінії зони воротаря і рухаються разом за м’ячем. Кожен відповідає за свою ділянку.", "Захисник, у зоні якого м’яч, виходить уперед, щоб заважати кидку; сусіди підстраховують. Після атаки суперника гравці знову повертаються в лінію."], "ul": ["Тримайте лінію, не розривайте її.", "Рухайтеся разом у бік м’яча.", "Виходь назустріч гравцю з м’ячем у своїй зоні.", "Сусіди підстраховують.", "Підіймайте руки, щоб блокувати кидки."]}], "f": "Правило «20-20-20» для очей: кожні 20 хвилин дивись 20 секунд на предмет, що знаходиться приблизно за 6 метрів (20 футів).", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, присідання 3×20 у спокійному темпі, «степ» 3×30.", "Склади комплекс фізкультпаузи на 3 хвилини для навчання за комп’ютером (вправи для очей, шиї, спини, кистей)."], "q": ["Які оздоровчі вправи можна виконувати під час навчального дня?", "Як виконати «перекладання» м’яча?", "Що таке зонний захист?", "Як діють гравці в захисті за схемою 6:0?"]}, {"n": "77", "t": "Формування навичок ЗСЖ. Штрафний кидок: стабільність. Навчальна гра в гандбол: позиції в нападі", "g": "Учень знатиме, як формуються корисні навички, як підвищити стабільність штрафного кидка та назви позицій гравців у гандбольному нападі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Навичка", "дія, доведена повторенням до автоматизму."], ["Передкидковий ритуал", "однакова послідовність дій перед кидком, яка допомагає зосередитися."], ["Крайній гравець", "нападник у гандболі, що діє біля бокової лінії, ближче до кута."], ["Лінійний гравець", "нападник у гандболі, що діє біля лінії зони воротаря, між захисниками."]], "th": [{"h": "Здоровий спосіб життя. Формування вмінь і навичок ЗСЖ", "p": ["Навичка формується повторенням. Спершу дія потребує зусиль (наприклад, щоранку робити зарядку), згодом стає звичною. Щоб звичка закріпилася, її потрібно виконувати регулярно протягом кількох тижнів.", "Допомагають нагадування, трекер звичок, підтримка друзів і прив’язка нової дії до вже звичної (наприклад, руханка після чистки зубів)."], "ul": ["Почни з однієї маленької звички.", "Виконуй її в той самий час.", "Познач виконання в трекері.", "Не картай себе за пропуск — продовжуй.", "Додавай нову звичку, коли попередня закріпилася."]}, {"h": "Баскетбол. Штрафний кидок: стабільність", "p": ["Штрафний кидок — це про техніку й спокій. Найкращий спосіб підвищити влучність — однаковий ритуал перед кожним кидком: кілька ударів м’яча об підлогу, глибокий вдих, погляд на кошик.", "Тренуй штрафні серіями й рахуй відсоток влучань. Корисно кидати штрафні й тоді, коли ти втомлений, — так, як у грі."], "ul": ["Однаковий ритуал перед кожним кидком.", "Глибокий вдих, спокійний видих.", "Погляд на ціль, а не на м’яч.", "Завершення руху кистю.", "Рахуй влучання й відстежуй поступ."]}, {"h": "Гандбол. Навчальна гра: позиції в нападі", "p": ["У гандбольному нападі кожен гравець має свою позицію: двоє крайніх (біля бокових ліній), двоє напівсередніх і центральний (розігруючий) — у другій лінії, а лінійний діє біля зони воротаря, серед захисників.", "Напівсередні часто кидають з дальньої відстані, крайні — з гострого кута, лінійний — після передачі зблизька. Центральний організовує атаку."], "ul": ["Крайні — біля кутів майданчика.", "Напівсередні — кидки з 9 м.", "Центральний — розігрує атаку.", "Лінійний — боротьба біля зони воротаря.", "Усі позиції пов’язані передачами."]}], "f": "У гандболі лінійного гравця часто називають «півотом» — він постійно бореться із захисниками біля зони воротаря.", "pr": ["Виконай вправи на розвиток швидкості: швидкі рухи руками «боксер» 3×10 с, швидкий «тепінг» стопами сидячи 3×10 с, ловіння падаючого м’ячика після сигналу.", "Склади трекер звичок на 2 тижні з 3 корисними звичками і почни його заповнювати."], "q": ["Як формується навичка?", "Що допомагає закріпити корисну звичку?", "Як підвищити стабільність штрафного кидка?", "Які позиції гравців у гандбольному нападі ти знаєш?"]}, {"n": "78", "t": "Інтерактивні вправи. Позиційний напад з центровим. Гандбол: контратака", "g": "Учень знатиме, що таке інтерактивні оздоровчі вправи, як організувати позиційний напад з центровим і як проводити контратаку в гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Інтерактивні вправи", "вправи, що виконуються у взаємодії з партнером, групою чи цифровим застосунком."], ["Позиційний напад", "організована атака, коли гравці займають свої позиції й діють за планом."], ["Центровий", "високий гравець, що діє біля кошика, отримує м’яч і завершує атаку зблизька."], ["Контратака", "швидкий перехід у напад після заволодіння м’ячем."]], "th": [{"h": "Здоровий спосіб життя. Інтерактивні оздоровчі вправи", "p": ["Інтерактивні вправи виконують разом з іншими: у парах, групах або за відеозавданням чи грою на екрані. Вони цікаві тим, що учасники реагують одне на одного: повторюють рухи, змагаються, підтримують.", "Приклади: «дзеркало» (повторюй рухи партнера), руханка за відео, танцювальний челендж, вправи з рахунком за сигналом."], "ul": ["«Дзеркало» в парі.", "Руханка за відео з класом.", "Челендж на рівновагу з друзями.", "«Заборонений рух» — гра на увагу.", "Танцювальні вправи під музику."]}, {"h": "Баскетбол. Організація позиційного нападу з одним центровим гравцем", "p": ["У позиційному нападі гравці займають місця: захисник з м’ячем (розігруючий), двоє крайніх, форвард і центровий біля кошика. Центровий отримує м’яч поблизу щита, розвертається і кидає або повертає м’яч партнерові.", "Щоб центровий отримав м’яч, він «закриває» захисника тілом, а партнери вчасно роблять передачу. Інші гравці рухаються, звільняючи місце."], "ul": ["Центровий — спиною до кошика, біля зони.", "Передача центровому — низька, точна.", "Після передачі — рух у вільне місце.", "Пам’ятай про правило 3 секунд.", "Терпіння: шукайте найкращу позицію для кидка."]}, {"h": "Гандбол. Навчальна гра: контратака", "p": ["Контратака — один з найефективніших способів забити. Після сейву воротаря чи перехоплення команда стрімко атакує, поки суперник не повернувся в захист. Найчастіше вперед біжать крайні гравці.", "Воротар робить довгу точну передачу, а гравці завершують атаку кидком з близької відстані."], "ul": ["Після втрати м’яча суперником — одразу вперед.", "Крайні біжать по флангах.", "Воротар — швидка довга передача.", "Кидок зблизька, у протилежний від воротаря кут.", "Якщо контратака не вдалася — позиційний напад."]}], "f": "У баскетболі нападникові не можна перебувати в зоні під кошиком суперника довше 3 секунд поспіль — тому центровий постійно рухається.", "pr": ["Виконай вправи на розвиток спритності: «дзеркало» з членом родини 2 хв, підкидання й ловіння м’ячика різними руками, стійка на одній нозі з заплющеними очима.", "Намалюй схему позиційного нападу в баскетболі з одним центровим і познач позиції всіх п’яти гравців."], "q": ["Що таке інтерактивні оздоровчі вправи?", "Яка роль центрового у позиційному нападі?", "Що таке контратака в гандболі?", "Хто найчастіше завершує контратаку?"]}, {"n": "79", "t": "Інтервальні вправи з таймером. Захист від швидкого прориву. Взаємодії в гандболі", "g": "Учень знатиме, як виконувати інтервальні оздоровчі вправи, як організувати захист проти швидкого прориву та прості взаємодії в гандбольному нападі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Інтервальне тренування", "чергування коротких періодів роботи й відпочинку за таймером."], ["Повернення в захист", "швидкий біг гравців до свого кошика відразу після втрати м’яча."], ["Чисельна перевага", "ситуація, коли нападників у певній частині майданчика більше, ніж захисників."], ["Схрещування", "взаємодія двох нападників, коли вони перебігають один повз одного й передають м’яч, збиваючи захисників."]], "th": [{"h": "Здоровий спосіб життя. Інтерактивні оздоровчі вправи за таймером", "p": ["Інтервальний формат зручний для занять удома й онлайн: усі виконують вправу 20–30 секунд, потім відпочивають 20–30 секунд. Таймер на екрані чи телефоні допомагає тримати ритм, а спільне виконання з класом додає мотивації.", "Для оздоровлення обирають вправи помірної інтенсивності без стрибків, якщо поруч є сусіди знизу або мало місця."], "ul": ["Робота 20–30 с, відпочинок 20–30 с.", "Присідання, планка, «супермен», віджимання від стіни.", "Повільний «скелелаз», марширування на місці.", "Після комплексу — розтягування.", "Стеж за диханням: не затримуй його."]}, {"h": "Баскетбол. Організація дій проти швидкого прориву", "p": ["Щоб зупинити швидкий прорив, команда має миттєво перемкнутися із нападу в захист. Найближчий до м’яча гравець заважає першій передачі, інші біжать до свого кошика, обличчям до гри, де можливо.", "Якщо захисників менше, ніж нападників, вони займають позицію біля кошика й захищають найнебезпечнішу зону, затримуючи атаку, доки не повернуться партнери."], "ul": ["Втратив м’яч — одразу назад.", "Найближчий тисне на гравця з м’ячем.", "Першим захищай кошик, потім — гравців.", "Не дозволяй легких кидків з-під кошика.", "Перемовляйтеся: хто кого бере."]}, {"h": "Гандбол. Навчальна гра: взаємодії в нападі", "p": ["У навчальній грі вчимося простих взаємодій. Схрещування: гравець з м’ячем біжить у бік партнера, а той перебігає за його спиною й отримує передачу. Захисники плутаються, хто кого має опікати.", "Ще одна взаємодія — «віддав і відкрився»: віддав передачу, ривком вийшов на вільне місце й отримав м’яч назад."], "ul": ["Взаємодію виконують у русі, не стоячи.", "Передача — на хід, точно.", "Тримай м’яч не більше 3 секунд.", "Після передачі — не зупиняйся.", "Шукай чисельну перевагу на одному з флангів."]}], "f": "Найважливіші секунди швидкого прориву — перші: якщо одразу затримати першу передачу, суперникові вже важко атакувати з перевагою.", "pr": ["Виконай інтервальний комплекс на розвиток сили: присідання, віджимання, планка, «місток» — 30 с роботи / 30 с відпочинку, 2 кола.", "Намалюй схему схрещування двох гандболістів у нападі й підпиши дії кожного."], "q": ["Як побудувати інтервальне тренування вдома?", "Що мають робити гравці одразу після втрати м’яча?", "Як захищатися, коли нападників більше, ніж захисників?", "Що таке схрещування в гандболі?"]}, {"n": "80", "t": "Підсумок ІІІ чверті: здоровий спосіб життя, баскетбол, гандбол. Діагностувальна робота", "g": "Учень повторить головне з модулів чверті, знатиме, як підготуватися до діагностувальної роботи і як оцінити свої досягнення.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Діагностувальна робота", "перевірка рівня знань і вмінь учня з вивченої теми."], ["Самооцінювання", "оцінювання власних результатів, успіхів і того, що треба покращити."], ["Ключові компетентності", "здатності, які знадобляться в житті: співпраця, ініціативність, турбота про здоров’я, навчання впродовж життя."], ["Челендж", "виклик, у якому учасники виконують завдання й передають естафету іншим."]], "th": [{"h": "Здоровий спосіб життя. Підсумок і діагностувальна робота", "p": ["Ми вивчили: що таке ЗСЖ, роль режиму, харчування, загартовування й гігієни, шкоду шкідливих звичок, профілактику травм, скандинавську ходьбу, оздоровчий туризм і проєкт «Активні парки».", "Діагностувальна робота може містити тестові питання, практичні завдання (руханка, вправи на поставу) і творчі завдання — квест, флешмоб, челендж. Оцінюють і знання, і вміння, і ставлення: старанність, співпрацю, чесну гру."], "ul": ["Повтори терміни ЗСЖ з конспектів.", "Склади власну руханку — її можуть попросити показати.", "Пригадай правила самоконтролю: пульс, самопочуття.", "Повтори 3 групи практик: накопичувальні, збережувальні, руйнівні.", "Оціни себе: що вдалося, що покращити."]}, {"h": "Баскетбол. Підсумок модуля", "p": ["Ми вдосконалили ведення без зорового контролю й з опором захисника, передачі різними способами, кидки з місця, після двох кроків і в стрибку, штрафний кидок. Вивчили командні дії: напад «вісімкою», швидкий прорив, позиційний напад з центровим і захист.", "Практичну частину оцінюють за технікою виконання: правильна стійка, робота ніг і рук, відсутність порушень."], "ul": ["Повтори основні порушення: пробіжка, подвійне ведення, 3 секунди.", "Повтори, скільки очок дає кожен вид кидка.", "Пригадай фази кидка однією рукою з місця.", "Пригадай схеми командних дій.", "Перед практичним тестуванням — ґрунтовна розминка."]}, {"h": "Гандбол. Підсумок модуля", "p": ["Ми вивчили пересування, ловіння й передачі, кидки зверху й із замахом, 7-метровий і вільний кидки, гру воротаря, зонний захист 6:0, позиції в нападі, контратаку, суддівські жести й історію українського гандболу.", "Готуючись до перевірки, повтори правила гри та техніку основних прийомів. Пам’ятай: оцінюють не лише результат, а й правильність виконання."], "ul": ["Правила: 3 кроки, 3 секунди, зона воротаря.", "Розміри: майданчик 40×20 м, ворота 3×2 м.", "Покарання: попередження, 2 хвилини, дискваліфікація.", "Позиції: крайні, напівсередні, центральний, лінійний.", "Аналізуй свої результати разом з учителем."]}], "f": "", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, «степ» 3×30, повільні присідання 2×20 — і запиши пульс до та після.", "Напиши самооцінювання за чверть: 3 речі, які ти навчився, 2 — які хочеш покращити, 1 — що сподобалося найбільше."], "q": ["Які складники здорового способу життя ти вивчив цієї чверті?", "Назви основні порушення правил у баскетболі та гандболі.", "Чим відрізняється зонний захист від індивідуального?", "Як ти оцінюєш свої досягнення за чверть?"]}]}, {"name": "IV чверть. COOL GAMES, футбол, бадмінтон", "lessons": [{"n": "81", "t": "Безпека на уроках IV чверті. Знайомство з Cool Games, футболом і бадмінтоном", "g": "Учень знатиме правила безпеки на заняттях з Cool Games, футболу й бадмінтону та розумітиме, що вивчатиме в IV чверті.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Cool Games", "сучасні командні ігри та естафети з нестандартним інвентарем, що поєднують рух, кмітливість і творчість."], ["Волан", "снаряд у бадмінтоні з корком і оперенням (пір’яним або пластиковим)."], ["Щитки", "захисне спорядження для гомілок у футболі."], ["Ракетка", "спортивне знаряддя з ручкою та натягнутою сіткою для удару по волану чи м’ячу."]], "th": [{"h": "Cool Games. Що це таке і як грати безпечно", "p": ["Cool Games — це командні ігри й естафети з нестандартним інвентарем, які розвивають не лише фізичні якості, а й мислення, кмітливість і творчість. Тут важливі співпраця і чесна гра.", "Оскільки ігри проходять у швидкому темпі й часто з незвичним інвентарем, особливо важливо уважно слухати пояснення правил і дотримуватися дистанції."], "ul": ["Користуйся інвентарем лише за призначенням.", "Не біжи назустріч іншим учасникам.", "Чекай свого етапу за лінією старту.", "Після естафети — склади інвентар на місце.", "Повідом учителя про пошкоджений інвентар."]}, {"h": "Футбол. Знайомство з модулем і правила безпеки", "p": ["Футбол — найпопулярніша командна гра у світі. У цьому модулі ми вдосконалимо ведення, удари, зупинки, відбирання м’яча, вкидання, вивчимо фінти й командні дії.", "Футбол — контактна гра, тому важливо грати в зручному взутті, дотримуватися правил і не робити небезпечних підкатів."], "ul": ["Взуття — відповідне покриттю, зашнуроване.", "Щитки захищають гомілки.", "Не бий по м’ячу, коли поруч нога суперника.", "Не штовхай і не підставляй ногу.", "Удари по воротах — лише за командою вчителя."]}, {"h": "Бадмінтон. Знайомство з модулем і правила безпеки", "p": ["Бадмінтон — гра ракетками й воланом через сітку. Ми вивчимо подачі, прийом подачі, удари справа й зліва, удари біля сітки, «смеш» і правила навчальної гри.", "Головні ризики — удар ракеткою партнера, розтягнення під час випадів і травми очей від волана."], "ul": ["Тримай безпечну відстань від інших гравців.", "Не замахуйся ракеткою, коли хтось поруч.", "У парній грі домовляйтеся, хто б’є, щоб не зачепити партнера ракеткою.", "Розминай плечі, кисті, гомілкостопи.", "Не перелазь під сіткою, коли йде гра."]}], "f": "Волан у бадмінтоні традиційно має 16 пір’їн, закріплених у корковій основі.", "pr": ["Виконай вправи на розвиток спритності: підкидання м’ячика і ловіння після оплеску, перекидання м’ячика з руки в руку під коліном, стійка на одній нозі з поворотами голови.", "Запиши по 3 правила безпеки для Cool Games, футболу і бадмінтону."], "q": ["Що таке Cool Games?", "Які правила безпеки важливі у футболі?", "Чим небезпечний замах ракеткою поруч з іншими?", "Яке спорядження захищає футболіста?"]}, {"n": "82", "t": "Девіз Cool Games. Футбольні клуби, вправи футболіста. Основні правила бадмінтону", "g": "Учень пояснюватиме девіз Cool Games, знатиме відомі футбольні клуби, спеціальні вправи футболіста, особливості підготовки бадмінтоністів та основні правила гри.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Девіз", "коротка фраза, що виражає головну ідею руху чи команди."], ["Футбольний клуб", "спортивна організація, що має команди різного віку й бере участь у змаганнях."], ["Розіграш", "обмін ударами від подачі до моменту, коли волан торкнувся підлоги або сталося порушення."], ["Сет (гейм)", "частина матчу в бадмінтоні, що триває до 21 очка."]], "th": [{"h": "Cool Games. Девіз «Будь розумним, активним, творчим!»", "p": ["Девіз Cool Games пояснює, які якості розвивають ці ігри. «Розумним» — думати, як швидше й краще виконати завдання. «Активним» — рухатися й брати участь. «Творчим» — придумувати нові рішення та варіанти ігор.", "На практиці це означає, що в естафетах і іграх перемагає не лише найшвидший, а й найкмітливіший і найзлагодженіший."], "ul": ["Плануйте дії в команді перед стартом.", "Кожен учасник має свою роль.", "Шукайте нестандартні рішення в межах правил.", "Підтримуйте одне одного.", "Після гри — обговоріть, що можна покращити."]}, {"h": "Футбол. Українські та зарубіжні клуби. ЗРВ та спеціальні вправи футболіста", "p": ["В Україні відомі клуби «Динамо» (Київ) і «Шахтар» (Донецьк) мають єврокубкові трофеї: «Динамо» двічі вигравало Кубок володарів кубків, «Шахтар» — Кубок УЄФА. Серед зарубіжних клубів — «Реал» і «Барселона» (Іспанія), «Баварія» (Німеччина), «Манчестер Юнайтед» і «Ліверпуль» (Англія).", "Розминка футболіста включає загальні вправи для всього тіла й спеціальні: біг з високим підніманням стегна, захльостування гомілки, випади, рухи стопою по м’ячу, легкі передачі."], "ul": ["Оберти в суглобах — від шиї до гомілкостопів.", "Біг з різними завданнями.", "Випади й легке розтягування.", "Ведення та передачі в легкому темпі.", "Розминка — 10–15 хвилин перед грою."]}, {"h": "Бадмінтон. Фізична підготовка з урахуванням віку і статі. Основні правила", "p": ["Бадмінтоністу потрібні швидкість, спритність, витривалість і гнучкість кисті й плечей. У підлітковому віці основну увагу приділяють координації та швидкості; навантаження для хлопців і дівчат добирають з урахуванням їхніх сил.", "Правила: гра до 21 очка, очко отримує той, хто виграв розіграш (незалежно від подачі). Для перемоги в сеті потрібна перевага 2 очки (але не більше ніж до 30). Матч — до двох виграних сетів."], "ul": ["Подача виконується по діагоналі.", "Волан, що впав у межах майданчика, — очко.", "Волан за межами — очко суперникові.", "Не можна торкатися сітки ракеткою чи тілом.", "Не можна бити волан двічі поспіль."]}], "f": "Київське «Динамо» стало першим клубом з СРСР, який виграв єврокубок, — Кубок володарів кубків 1975 року.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, випади на місці 3×10 на кожну ногу, планка 3×30 с.", "Запиши 5 основних правил бадмінтону і поясни своїми словами девіз Cool Games."], "q": ["Як ти розумієш девіз «Будь розумним, активним, творчим!»?", "Які єврокубки вигравали українські клуби?", "До скількох очок триває сет у бадмінтоні?", "Які фізичні якості потрібні бадмінтоністу?"]}, {"n": "83", "t": "Суддівство Cool Games. Пересування футболіста з м’ячем. Стійки під час подачі", "g": "Учень знатиме принципи суддівства в Cool Games, способи пересування футболіста з м’ячем і без нього та стійки під час подачі в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Суддя", "особа, яка стежить за дотриманням правил і визначає результат гри."], ["Штрафні секунди", "час, що додається до результату команди за порушення правил естафети."], ["Володіння м’ячем", "уміння контролювати м’яч під час руху й під тиском суперника."], ["Поле подачі", "частина майданчика, з якої виконують подачу і в яку вона має потрапити."]], "th": [{"h": "Cool Games. Поглиблене вивчення правил суддівства", "p": ["Суддя в Cool Games стежить, щоб кожен етап виконувався правильно: старт після сигналу, повне виконання завдання, правильна передача естафети, використання інвентарю за правилами. Рішення судді — остаточне.", "За порушення можуть нараховуватися штрафні бали або секунди, а за грубу чи нечесну поведінку — дискваліфікація етапу. Головне в суддівстві — неупередженість і уважність."], "ul": ["Суддя оголошує правила до старту.", "Фальстарт — штраф або перезапуск.", "Невиконане завдання — повторити або штраф.", "Суддя однаково ставиться до всіх команд.", "Свої сумніви команда висловлює спокійно через капітана."]}, {"h": "Футбол. Біг боком і спиною вперед. Поєднання пересувань з володінням м’ячем", "p": ["Футболіст постійно змінює спосіб пересування: біг уперед, боком, спиною вперед. Біг спиною вперед допомагає захисникові бачити суперника й м’яч, біг боком — швидко зміщуватися вздовж лінії.", "Пересування з м’ячем поєднують з веденням: ривок — зупинка м’яча — поворот — ведення в новий бік. Важливо не втрачати контроль над м’ячем."], "ul": ["Біг спиною: невеликий нахил уперед, короткі кроки.", "Біг боком: приставні кроки, без схрещування.", "М’яч — на відстані одного кроку.", "Голова піднята, контроль поля.", "Змагання наввипередки — лише на рівній поверхні."]}, {"h": "Бадмінтон. Стійки під час подачі. Учбова гра", "p": ["Подачу виконують з правого поля, якщо рахунок подаючого парний, і з лівого — якщо непарний. Тому розрізняють правобічну і лівобічну стійки. Для довгої високої подачі гравець стоїть трохи далі від лінії, для короткої — ближче.", "Стійка подаючого: ноги нерухомі, одна попереду, вага на задній нозі, ракетка відведена. Стійка того, хто приймає: ноги на ширині плечей, коліна зігнуті, ракетка піднята перед собою."], "ul": ["Під час подачі обидві ноги стоять на підлозі.", "Подача — знизу, по діагоналі.", "Подаючий і приймаючий стоять у своїх полях.", "Не наступай на лінії поля подачі.", "У навчальній грі — рахуй уголос."]}], "f": "У бадмінтоні подачу роблять із правого поля, коли в подаючого парна кількість очок, і з лівого — коли непарна.", "pr": ["Виконай вправи на розвиток витривалості: ходьба на місці з високим підніманням колін 3×2 хв, присідання в спокійному темпі 3×15, «степ» 3×30.", "Намалюй схему майданчика для бадмінтону і познач, з якого поля подають при рахунку 0, 3, 8 і 11."], "q": ["Яке головне правило для судді в Cool Games?", "Навіщо футболісту біг спиною вперед?", "З якого поля подають у бадмінтоні при парному рахунку?", "Яка стійка гравця, що приймає подачу?"]}, {"n": "84", "t": "Результат і чесна гра в Cool Games. Удари по м’ячу в русі. Прийом подачі", "g": "Учень знатиме, як визначають результат у Cool Games, техніку ударів по м’ячу в русі та вправи на координацію й прийом подачі в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Протокол", "документ, у який суддя записує результати команд."], ["Фейр-плей", "чесна гра: повага до правил, суперника й судді."], ["Удар з льоту", "удар по м’ячу, що летить, до того як він торкнеться землі."], ["Координація", "здатність узгоджувати рухи різних частин тіла."]], "th": [{"h": "Cool Games. Визначення результату й чесна гра", "p": ["Результат естафети чи гри визначає суддя за протоколом: час, кількість балів, штрафи. Буває, що враховують і творчість чи злагодженість команди — це оголошують заздалегідь.", "Фейр-плей — основа Cool Games. Команди дякують суперникам, визнають свої помилки і не намагаються обдурити суддю."], "ul": ["Результат: час + штрафи або бали.", "Суддя записує все в протокол.", "Нічия можлива — повтор етапу чи додаткове завдання.", "Чесна гра важливіша за перемогу.", "Команди дякують одна одній після гри."]}, {"h": "Футбол. Удари по м’ячу, що котиться, і по м’ячу, що летить", "p": ["Бити по м’ячу, що рухається, складніше, ніж по нерухомому: треба вгадати момент і підлаштувати крок. Опорну ногу ставлять збоку від м’яча з урахуванням його руху, щоб удар припав саме на центр м’яча.", "На точність б’ють внутрішньою стороною стопи, на дальність — підйомом (шнурками). По м’ячу, що летить, б’ють з льоту чи з напівльоту, тримаючи погляд на м’ячі."], "ul": ["Стеж за м’ячем до моменту удару.", "Опорна нога — поруч із м’ячем.", "Носок ударної ноги — натягнутий.", "Корпус над м’ячем — удар низом.", "Не відкидайся назад — м’яч полетить угору."]}, {"h": "Бадмінтон. Вправи на координацію. Прийом подачі", "p": ["Бадмінтон вимагає узгодження ніг, руки й погляду. Корисні вправи: жонглювання воланом на ракетці, пересування за сигналом, ловіння волана рукою, «тіньовий» бадмінтон (імітація ударів без волана).", "Прийом подачі: стань у центрі свого поля в готовій стійці, ракетку тримай перед собою. На коротку подачу — швидкий випад уперед, на довгу — крок назад і удар зверху."], "ul": ["Готова стійка: коліна зігнуті, ракетка вгорі.", "Стеж за воланом від моменту удару.", "Коротка подача — крок-випад до сітки.", "Довга подача — відхід назад.", "Після удару — повернення в центр."]}], "f": "Девіз чесної гри «фейр-плей» прийшов з англійської мови і означає «чесна гра».", "pr": ["Виконай вправи на розвиток швидкості: «тепінг» стопами сидячи 3×10 с, швидкі оплески 3×10 с, ловіння лінійки, яку відпускає партнер.", "Виконай «тіньовий» бадмінтон без ракетки і волана: імітація ударів зверху та знизу на місці 3×10 повторень, без стрибків."], "q": ["Як суддя визначає результат у Cool Games?", "Що таке фейр-плей?", "Якою частиною стопи бити на точність, а якою — на дальність?", "Як прийняти коротку і довгу подачу в бадмінтоні?"]}, {"n": "85", "t": "Залучення до суддівства Cool Games. Рухливі ігри з елементами футболу. Удари з виходом до сітки", "g": "Учень зможе виконувати обов’язки помічника судді, знатиме рухливі ігри з елементами футболу та техніку ударів біля сітки в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Помічник судді", "учасник суддівської бригади, що стежить за окремим етапом чи лінією."], ["Хронометрист", "суддя, який фіксує час."], ["Удар біля сітки", "м’який короткий удар, після якого волан ледь перелітає сітку."], ["Випад", "широкий крок уперед із перенесенням ваги на передню ногу."]], "th": [{"h": "Cool Games. Практика залучення до суддівства", "p": ["Учні по черзі стають суддями: старшим суддею, помічником на етапі, хронометристом. Це вчить відповідальності, уважності та справедливості. Суддівство — теж спосіб брати участь у грі.", "Перед початком судді домовляються, хто за що відповідає, і разом перевіряють розташування інвентарю."], "ul": ["Старший суддя — сигнал старту й остаточне рішення.", "Помічник — стежить за правильністю етапу.", "Хронометрист — фіксує час.", "Секретар — записує результати.", "Суддя не вболіває — він об’єктивний."]}, {"h": "Футбол. Рухливі ігри з елементами футболу", "p": ["Рухливі ігри з м’ячем закріплюють ведення, передачі й удари в цікавій формі. Наприклад: «Квадрат» — гравці по колу передають м’яч, а один у центрі намагається його перехопити; «Влуч у ворітця» — передачі в маленькі ворота з фішок.", "Такі ігри можна проводити на невеликій площі, в них кожен часто торкається м’яча."], "ul": ["«Квадрат» — точні передачі в одне-два торкання.", "«Влуч у ворітця» — точність передач.", "Естафета з веденням між фішками.", "Грай чесно, без підніжок.", "Після гри — коротке обговорення."]}, {"h": "Бадмінтон. Удари по волану з виходом до сітки", "p": ["Коли суперник грає коротко, треба швидко вийти до сітки й відповісти коротким м’яким ударом, щоб волан ледь перелетів сітку. Вихід виконують кількома швидкими кроками, завершуючи випадом ногою, однойменною з рукою, що тримає ракетку.", "Ракетка рухається м’яко, лише кистю й пальцями; сильний удар біля сітки відправить волан у аут або дасть супернику легкий «смеш»."], "ul": ["Вихід — 2–3 швидкі кроки й випад.", "Ракетка перед собою, на рівні сітки.", "Удар м’який, «дотиком».", "Не торкайся сітки.", "Після удару — повернення в центр."]}], "f": "Удари біля сітки в бадмінтоні — це «тонка робота»: волан має ледь перелетіти сітку й одразу падати вниз.", "pr": ["Виконай вправи на розвиток гнучкості: випад з утриманням 20 с на кожну ногу, розтягування плечей і кистей, нахили вперед сидячи, «метелик».", "Опиши обов’язки 4 суддів у Cool Games і запиши, яку роль ти хотів би виконувати."], "q": ["Які обов’язки має хронометрист?", "Які рухливі ігри з елементами футболу ти знаєш?", "Як виконувати вихід до сітки в бадмінтоні?", "Чому удар біля сітки має бути м’яким?"]}, {"n": "86", "t": "Суддівство Cool Games. Естафети з перешкодами. Нападний удар «смеш»", "g": "Учень удосконалить уміння суддівства, знатиме правила зустрічних і колових естафет та техніку нападного удару «смеш».", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Зустрічна естафета", "естафета, у якій учасники однієї команди стоять двома колонами одна навпроти одної."], ["Колова естафета", "естафета, у якій учасники біжать по колу й передають естафету в одному місці."], ["Смеш", "сильний нападний удар зверху, що посилає волан круто вниз на половину суперника."], ["Смуга перешкод", "маршрут із завданнями, які треба подолати: оббігти, переступити, пролізти."]], "th": [{"h": "Cool Games. Практика суддівства", "p": ["Сьогодні учні суддять самостійно під наглядом учителя. Важливо вчасно помічати порушення, правильно рахувати бали й чітко оголошувати рішення.", "Після кожного етапу судді коротко обговорюють спірні моменти. Так вони вчаться приймати справедливі рішення."], "ul": ["Свисток або голосовий сигнал — чіткий.", "Порушення — одразу й спокійно оголошуй.", "Записуй результат одразу після етапу.", "Спірний момент — порадься з іншими суддями.", "Поважай команди, будь доброзичливим."]}, {"h": "Футбол. Зустрічні і колові естафети з подоланням смуги перешкод", "p": ["Естафети з перешкодами поєднують біг, стрибки, ведення м’яча, перенесення та розставляння предметів, кидки в ціль і ловіння м’яча. Вони розвивають спритність і швидкість у грі.", "У зустрічній естафеті учасник біжить до протилежної колони й передає естафету; у коловій — оббігає коло й передає естафету в точці старту. Порушення — фальстарт чи пропуск завдання."], "ul": ["Не пропускай перешкоди.", "Розставляй предмети акуратно, не кидай.", "Передавай естафету лише за лінією.", "Повертайся в кінець своєї колони.", "Не заважай іншим командам."]}, {"h": "Бадмінтон. Нападний удар «смеш»", "p": ["«Смеш» — найсильніший удар у бадмінтоні. Його виконують по високому волану над головою: гравець відводить ракетку за спину, повертається боком до сітки, а потім хльостким рухом руки б’є волан у найвищій точці, спрямовуючи його круто вниз.", "Важлива роль кисті: вона завершує удар. Після «смешу» гравець одразу повертається в центр, адже суперник може відбити волан."], "ul": ["Ставай під волан і трохи позаду нього.", "Вільна рука вказує на волан.", "Удар у найвищій точці, перед собою.", "Кисть завершує рух униз.", "Розмінай плече й лікоть перед ударами."]}], "f": "«Смеш» у бадмінтоні вважають одним із найшвидших ударів у спорті: волан одразу після удару летить дуже швидко, але потім різко гальмує через оперення.", "pr": ["Виконай вправи на розвиток спритності: імітація удару «смеш» без ракетки 3×10 повільно і з правильною технікою, підкидання і ловіння м’ячика різними руками.", "Придумай смугу перешкод для естафети з 5 завдань для шкільного майданчика й намалюй її схему."], "q": ["Чим зустрічна естафета відрізняється від колової?", "Які завдання можуть бути в смузі перешкод?", "Опиши техніку удару «смеш».", "Що робити після виконання «смешу»?"]}, {"n": "87", "t": "Власні естафети Cool Games. Ведення з обведенням. Удари зліва зверху", "g": "Учень знатиме, як створити власну естафету, вдосконалить ведення з обведенням і знатиме види ударів закритим боком ракетки зверху.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Сценарій естафети", "план із переліком етапів, завдань, інвентарю та правил."], ["Обведення", "прийом, яким гравець з м’ячем обходить суперника."], ["Закритий бік ракетки", "бік ракетки, яким б’ють зліва (для правші) — тильною стороною долоні вперед."], ["Високо-далекий удар", "удар, що посилає волан високо й далеко до задньої лінії суперника."]], "th": [{"h": "Cool Games. Створення своїх варіантів естафет", "p": ["Придумати естафету — творче завдання в дусі девізу Cool Games. Спершу визначте мету (що розвиває естафета), потім етапи й завдання, інвентар, правила та як визначати результат.", "Хороша естафета безпечна, зрозуміла й цікава для всіх, у тому числі для тих, хто менш підготовлений."], "ul": ["Мета: швидкість, спритність, кмітливість?", "3–5 етапів з різними завданнями.", "Інвентар — безпечний і доступний.", "Чіткі правила і штрафи.", "Перевірте естафету на собі, перш ніж пропонувати іншим."]}, {"h": "Футбол. Вдосконалення ведення м’яча з прискоренням, ривками й обведенням", "p": ["На великій швидкості м’яч відпускають трохи далі, але не втрачають контролю. Перед суперником гравець уповільнюється, торкається м’яча частіше й виконує обведення — зміщення вбік або обманний рух.", "Ведуть м’яч зовнішньою частиною підйому (найшвидше), внутрішньою стороною стопи (для зміни напрямку) та підошвою (для зупинки й розвороту)."], "ul": ["На швидкості — рідше торкання, але м’яч під контролем.", "Перед суперником — частіші дотики.", "Обведення — різка зміна напрямку.", "Голова піднята.", "Після обведення — прискорення."]}, {"h": "Бадмінтон. Вправи на гнучкість. Фронтальні удари закритим боком ракетки зверху", "p": ["Для ударів зліва зверху потрібні гнучкі плечі й кисть. Перед ударами розтягни плечовий пояс, роби оберти кистями.", "Удари зверху бувають: високий (високо-далекий, до задньої лінії), атакувальний (швидший і нижчий), плаский (паралельно до підлоги) і нападний (донизу). Зліва гравець повертається спиною до сітки, ракетка рухається від грудей назустріч волану, а кисть виконує різкий «хлист»."], "ul": ["Хват змінюється: великий палець — на широку грань ручки.", "Розворот спиною до сітки.", "Удар у найвищій точці.", "Кисть різко розгинається.", "Після удару — швидкий розворот і повернення в центр."]}], "f": "Для ударів зліва досвідчені бадмінтоністи змінюють хват, щоб великий палець упирався в ручку, — так удар стає сильнішим.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, віджимання 3×10, планка 3×30 с, обертання кистей із пляшкою води 3×15.", "Склади сценарій власної естафети Cool Games: мета, 4 етапи, інвентар, правила, штрафи."], "q": ["Що має містити сценарій естафети?", "Якою частиною стопи найзручніше вести м’яч на швидкості?", "Які бувають удари зверху в бадмінтоні?", "Як змінюється хват для удару зліва?"]}, {"n": "88", "t": "Інклюзивні естафети Cool Games. Рухливі ігри з футболом. Удари зліва зверху: помилки", "g": "Учень знатиме, як зробити естафету доступною для всіх, нові рухливі ігри з футболом і типові помилки в ударах зліва зверху.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Інклюзія", "участь кожної людини в спільній діяльності незалежно від її можливостей."], ["Адаптація правил", "зміна правил гри, щоб вона була цікавою і доступною для всіх учасників."], ["Стінка", "комбінація у футболі: передача партнеру й отримання м’яча назад у одне торкання."], ["Перехід", "швидке переміщення гравця по майданчику до місця удару."]], "th": [{"h": "Cool Games. Створення інклюзивних естафет", "p": ["Створюючи естафету, подумай, чи зможе в ній взяти участь кожен. Наприклад, можна передбачити варіанти завдань різної складності, працювати в парах, замінити біг ходьбою або завданням на кмітливість.", "Інклюзивна естафета — це не «полегшена гра», а гра, у якій кожен має свою роль і може принести команді користь."], "ul": ["Варіанти завдань різної складності.", "Етапи на кмітливість, а не тільки на швидкість.", "Робота в парах і трійках.", "Кожен учасник має свою роль.", "Підтримка і повага замість кепкування."]}, {"h": "Футбол. Рухливі ігри з елементами футболу", "p": ["Продовжуємо грати: «Футбольний теніс» (м’яч перекидають ногою через лаву чи стрічку), «Відбери м’яч» (двоє проти одного в обмеженому квадраті), «Стінка» (передача партнеру і рух уперед на віддачу).", "У кожній грі — своя мета: точність, відбирання, взаємодія. Ігри короткі, з частою зміною ролей."], "ul": ["«Футбольний теніс» — контроль м’яча.", "«Відбери м’яч» — захист і відкривання.", "«Стінка» — передача й рух уперед.", "Змінюйте ролі, щоб усі спробували.", "Грайте без грубості."]}, {"h": "Бадмінтон. Удари закритим боком ракетки зверху: типові помилки", "p": ["Удари зліва зверху даються складно, тому їх вдосконалюють поступово, спочатку без волана. Головні помилки — неправильний хват, удар не в найвищій точці, відсутність розвороту корпусу.", "Важливо швидко перейти до волана, щоб опинитися під ним, а не тягтися рукою. Після удару одразу повертайся в центр."], "ul": ["Помилка: хват «сковородою».", "Помилка: удар з опущеним ліктем.", "Помилка: волан позаду тебе.", "Помилка: рука працює без кисті.", "Помилка: стоїш на місці після удару."]}], "f": "Інклюзивні ігри допомагають усім учасникам відчути, що вони потрібні команді, — і часто стають найцікавішими.", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, присідання в спокійному темпі 3×20, «тіньовий» бадмінтон 3×1 хв.", "Переглянь свою естафету з минулого уроку і зміни її так, щоб у ній міг узяти участь кожен однокласник."], "q": ["Що таке інклюзивна естафета?", "Як адаптувати правила гри для всіх учасників?", "Що таке «стінка» у футболі?", "Назви 3 типові помилки в ударах зліва зверху."]}, {"n": "89", "t": "Cool Games: планування команди. Ривок і удар по воротах. Бадмінтон: види ударів", "g": "Учень знатиме, як команда планує проходження естафети, техніку ривка до м’яча з ударом по воротах і застосування коротких подач, м’яких та високо-далеких ударів у грі.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Капітан команди", "учасник, який координує дії команди й спілкується із суддею."], ["Стратегія", "загальний план дій для досягнення перемоги."], ["Коротка подача", "подача, після якої волан низько перелітає сітку й падає біля передньої лінії поля подачі."], ["М’який удар", "повільний, акуратний удар, що посилає волан близько за сітку."]], "th": [{"h": "Cool Games. Вивчення та використання естафет: планування команди", "p": ["Перед естафетою команда разом вирішує, хто виконуватиме який етап. Сильні сторони кожного учасника варто використати: хтось швидкий, хтось точний, хтось уважний до деталей.", "Капітан стежить за порядком, підбадьорює й нагадує правила. Добре спланована естафета проходить без плутанини та зайвих штрафів."], "ul": ["Обговоріть етапи до старту.", "Розподіліть ролі за сильними сторонами.", "Капітан — голос команди перед суддею.", "Підбадьорюйте одне одного.", "Після естафети — короткий аналіз."]}, {"h": "Футбол. Прискорення та ривки з м’ячем, ривок до м’яча з ударом по воротах", "p": ["У грі часто вирішують перші метри: хто швидше до м’яча, той і володіє ним. Ривок з м’ячем виконують, відпускаючи м’яч на 1–2 кроки вперед і наздоганяючи його.", "Удар після ривка: останній крок трохи довший, опорна нога поруч із м’ячем, корпус над м’ячем, удар підйомом у кут воріт. Важливо не втратити рівновагу на швидкості."], "ul": ["Ривок — короткі швидкі кроки.", "Останній крок перед ударом — ширший.", "Погляд на м’яч під час удару.", "Цілься в кути воріт.", "Удари по воротах — лише коли воротар готовий."]}, {"h": "Бадмінтон. Навчальна гра з короткими подачами, м’якими та високо-далекими ударами", "p": ["У навчальній грі чергуємо короткі та довгі удари, щоб змусити суперника рухатися по всьому майданчику. Коротка подача не дає суперникові атакувати одразу, м’який удар біля сітки витягує його вперед, а високо-далекий відсуває назад.", "Головна тактика — грати туди, де суперника немає, і змінювати темп."], "ul": ["Коротка подача — низько над сіткою.", "М’який удар — дотиком.", "Високо-далекий — до задньої лінії.", "Чергуй довгі й короткі удари.", "Повертайся в центр після кожного удару."]}], "f": "У бадмінтоні гравець за одну гру може пробігти чималу відстань, бо постійно переміщується між сіткою та задньою лінією.", "pr": ["Виконай вправи на розвиток швидкості: «тепінг» стопами сидячи 3×10 с, швидкі оплески 3×10 с, гра «долоні» на реакцію з членом родини.", "Намалюй схему майданчика для бадмінтону і стрілками покажи, куди ти посилатимеш волан, щоб суперник найбільше рухався."], "q": ["Яка роль капітана в естафеті Cool Games?", "Як виконати удар по воротах після ривка з м’ячем?", "Навіщо в бадмінтоні чергувати короткі й довгі удари?", "Що таке коротка подача?"]}, {"n": "90", "t": "Cool Games: комунікація. Відбирання м’яча у випаді. Подача з обертанням", "g": "Учень знатиме, як спілкуватися в команді під час естафет, техніку відбирання м’яча вибиванням у випаді та правильну коротку подачу в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Комунікація", "обмін інформацією між учасниками команди словами чи жестами."], ["Відбирання м’яча", "прийом, яким захисник заволодіває м’ячем або вибиває його в суперника."], ["Вибивання у випаді", "відбирання, коли захисник широким кроком виносить ногу й вибиває м’яч у суперника."], ["Подача з обертанням", "подача, під час якої ракетка ковзає по корку волана, надаючи йому обертання."]], "th": [{"h": "Cool Games. Вивчення та використання естафет: комунікація в команді", "p": ["Під час естафети часу на довгі пояснення немає. Тому команда домовляється про короткі сигнали: «готовий!», «давай!», жест рукою. Чітка комунікація допомагає уникнути помилок і штрафів.", "Важливо говорити доброзичливо: підтримка прискорює краще, ніж критика."], "ul": ["Короткі домовлені сигнали.", "Називай партнера на ім’я.", "Підбадьорюй, а не критикуй.", "Слухай капітана.", "Після гри — обговорення, що спрацювало."]}, {"h": "Футбол. Відбирання м’яча вибиванням у випаді", "p": ["Коли суперник з м’ячем рухається назустріч, зліва чи справа, захисник наближається, вибирає момент, коли м’яч відірвався від ноги суперника, і широким випадом вибиває його носком або внутрішньою стороною стопи.", "Не можна бити по ногах суперника — потрібно грати лише в м’яч. Після відбору треба швидко взяти м’яч під контроль або передати партнеру."], "ul": ["Не поспішай — чекай моменту.", "Випад робиш ногою, ближчою до м’яча.", "Вага на опорній нозі, рівновага.", "Грай у м’яч, а не в ноги.", "Після відбору — передача або ведення."]}, {"h": "Бадмінтон. Подача з нижнім боковим обертанням (тест на влучність)", "p": ["Коротку подачу виконують зліва чи справа знизу: волан тримають за оперення перед собою, ракетка ковзає по корку збоку, надаючи волану обертання. Волан низько перелітає сітку й падає в ближню зону поля подачі.", "Перевірка: з 10 подач рахують, скільки волан потрапив у ближню зону. Для самооцінки порівнюй свій результат з попередніми спробами — головне, щоб він зростав."], "ul": ["Удар — нижче пояса.", "Ноги нерухомі, обидві на підлозі.", "Рух ракетки — короткий і м’який.", "Волан — низько над сіткою.", "Запиши результат і стеж за поступом."]}], "f": "Обертання волана після подачі ускладнює його прийом: суперникові важче точно вгадати траєкторію.", "pr": ["Виконай вправи на розвиток гнучкості: випади з утриманням 20 с, нахили вперед сидячи, розтягування плечей і кистей, повороти тулуба.", "Опиши, як готуватися до тесту з короткої подачі і як ти оцінюватимеш свій результат з 10 спроб."], "q": ["Які сигнали можна використовувати в команді під час естафети?", "Коли найкраще вибивати м’яч у суперника?", "Як виконати коротку подачу з обертанням?", "Як оцінюють подачу в тесті «10 спроб»?"]}, {"n": "91", "t": "Cool Games: нестандартний інвентар. Гра в малих складах. Тактика в бадмінтоні", "g": "Учень знатиме правила безпеки з нестандартним інвентарем, особливості гри в малих складах і тактичні прийоми в одиночному бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Нестандартний інвентар", "предмети, які використовують в іграх не за звичним призначенням: обручі, кеглі, кубики, стрічки."], ["Малий склад", "гра з меншою кількістю гравців (наприклад, 3×3 або 4×4) на меншому полі."], ["Тактика", "спосіб ведення гри з урахуванням сил своїх і суперника."], ["Темп гри", "швидкість, з якою гравці виконують дії та обмінюються ударами."]], "th": [{"h": "Cool Games. Естафети з нестандартним інвентарем", "p": ["В естафетах Cool Games часто використовують незвичні предмети: обручі, кеглі, кубики, м’ячі різного розміру, стрічки. Це робить ігри цікавішими й потребує кмітливості.", "Нестандартний інвентар вимагає обережності: його не кидають у людей, не стають на нього ногами, якщо це не передбачено правилами."], "ul": ["Пояснення, як користуватися предметом, — до старту.", "Не кидай інвентар у інших.", "Повертай предмети на місце.", "Пошкоджений інвентар — прибери з гри.", "Шукай розумні способи виконати завдання."]}, {"h": "Футбол. Рухливі ігри та гра в малих складах", "p": ["Гра в малих складах (3×3, 4×4) на невеликому полі дає кожному гравцеві більше торкань м’яча. Тут доводиться швидко ухвалювати рішення, відкриватися й одразу повертатися в захист.", "Можна грати в маленькі ворота без воротарів або з обмеженням торкань, щоб частіше передавати м’яч."], "ul": ["Кожен і нападає, і захищається.", "Відкривайся для передачі.", "Грай у 1–2 торкання.", "Змінюйте склади команд.", "Повага до суперника й чесна гра."]}, {"h": "Бадмінтон. Навчальна гра: тактика одиночної гри", "p": ["В одиночній грі мета — змусити суперника рухатися й помилитися. Удари в кути (передні й задні) та зміна темпу ускладнюють йому прийом.", "Після кожного удару повертайся в центр майданчика — з цієї точки легше дістати волан у будь-якому куті."], "ul": ["Грай у вільні від суперника зони.", "Чергуй довгі й короткі удари.", "Змінюй темп: повільний — швидкий.", "Повертайся в центр.", "Атакуй «смешем» лише по високому волану."]}], "f": "Гра в малих складах дає кожному гравцеві значно більше торкань м’яча, ніж гра повними командами на великому полі.", "pr": ["Виконай вправи на розвиток спритності: підкидання і ловіння м’ячика різними руками, «перехресні» доторки лікоть–коліно 3×20, стійка на одній нозі з заплющеними очима 3×15 с.", "Придумай естафету з 3 предметами, які є вдома (подушка, пластикова пляшка, шкарпетки), — без бігу, і запиши її правила."], "q": ["Що таке нестандартний інвентар і як із ним поводитися?", "Чим корисна гра в малих складах?", "Яка головна тактика одиночної гри в бадмінтон?", "Чому важливо повертатися в центр майданчика?"]}, {"n": "92", "t": "Cool Games на кмітливість. Стрибки з імітацією удару. Пересування в бадмінтоні", "g": "Учень знатиме, як поєднувати рух і завдання на кмітливість, техніку стрибка з діставанням підвішеного м’яча та правильні пересування бадмінтоніста.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Інтелектуальний етап", "етап естафети, на якому потрібно розв’язати задачу, загадку чи головоломку."], ["Імітація", "виконання руху без предмета, щоб відпрацювати техніку."], ["Вибір місця", "уміння вчасно опинитися в точці, де можна виконати удар."], ["Сплит-степ", "невеликий підскок у момент удару суперника, що готує гравця до швидкого руху."]], "th": [{"h": "Cool Games. Естафети з завданнями на кмітливість", "p": ["Девіз Cool Games закликає бути розумним, тому в естафети включають етапи, де треба подумати: скласти пазл, розв’язати приклад, відповісти на питання, викласти слово з карток.", "Такі етапи вирівнюють шанси команд: перемагає той, хто вміє і швидко рухатися, і тверезо мислити під тиском часу."], "ul": ["Інтелектуальний етап — після рухового, щоб відновити дихання.", "Завдання — відповідні вікові.", "Помилка — повтор або штраф.", "Командна допомога — за правилами.", "Не кричи підказки іншим командам."]}, {"h": "Футбол. Стрибки з імітацією удару головою та ногою; діставання підвішеного м’яча", "p": ["Вправи розвивають стрибучість і вміння вибирати момент для удару по високому м’ячу. Учень з місця чи з розбігу вистрибує й торкається підвішеного м’яча лобом або ногою.", "Стрибок виконують поштовхом однієї ноги з розбігу або двох ніг з місця. Шию тримають напруженою, очі відкриті, удар виконують середньою частиною лоба."], "ul": ["Розбіг невеликий, контрольований.", "Стрибок угору, а не вперед.", "Очі — на м’ячі до моменту дотику.", "Приземлення м’яке, на обидві ноги.", "Стрибкові вправи — тільки в залі, не вдома."]}, {"h": "Бадмінтон. Елементи навчальної гри: пересування по майданчику", "p": ["Бадмінтоніст пересувається приставними й схресними кроками, випадами. У момент удару суперника виконують невеликий підскок (сплит-степ), щоб бути готовим рухатися в будь-який бік.", "Шлях до волана має бути найкоротшим: до сітки — кроками вперед і випадом, назад — приставними чи схресними кроками боком."], "ul": ["Сплит-степ у момент удару суперника.", "Вперед — кроки й випад.", "Назад — боком, не спиною.", "Ракетка завжди перед собою.", "Після удару — повернення в центр."]}], "f": "Удар головою у футболі виконують лобом: ця частина голови найміцніша й дозволяє точно спрямувати м’яч.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, «місток» лежачи 3×12, віджимання 3×10, вправи для шиї (повільні нахили й повороти голови) 2×8.", "Склади 3 завдання на кмітливість для інтелектуального етапу естафети Cool Games."], "q": ["Навіщо в естафети включають інтелектуальні етапи?", "Якою частиною голови виконують удар по м’ячу?", "Що таке сплит-степ і навіщо він потрібен?", "Як бадмінтоніст пересувається до задньої лінії?"]}, {"n": "93", "t": "Cool Games: розминка й відновлення. Стрибки з розбігу. Серії ударів по діагоналі", "g": "Учень знатиме, як правильно розминатися та відновлюватися під час естафет, вибирати момент стрибка з розбігу та виконувати серії ударів справа й зліва по діагоналі.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Відновлення", "повернення організму до спокійного стану після навантаження."], ["Заминка", "спокійні вправи й розтягування наприкінці заняття."], ["Розбіг", "біг перед стрибком чи ударом для набору швидкості."], ["Діагональ", "лінія, що з’єднує протилежні кути майданчика."]], "th": [{"h": "Cool Games. Розминка та відновлення під час естафет", "p": ["Естафети — інтенсивне навантаження, тому перед ними обов’язкова розминка, а між етапами — правильне відновлення: спокійна ходьба, глибоке дихання, вода невеликими ковтками.", "Після естафет проводять заминку: ходьба, розтягування основних м’язів, вправи на дихання. Так пульс поступово повертається до норми."], "ul": ["Розминка — 7–10 хвилин.", "Між етапами — не сідай одразу, походи.", "Глибокий вдих носом, видих ротом.", "Пий потроху.", "Заминка — розтягування і спокійне дихання."]}, {"h": "Футбол. Стрибки з розбігу до підвішеного м’яча", "p": ["Сьогодні основна увага — вибір моменту стрибка. Якщо вистрибнути зарано, м’яч пролетить над тобою; запізно — він уже опуститься. Тому стежать за м’ячем і роблять стрибок так, щоб торкнутися його в найвищій точці.", "Тренування з підвішеним м’ячем безпечне, бо м’яч рухається передбачувано. Після кожної спроби варто аналізувати, чи вчасно був стрибок."], "ul": ["Розбіг — 3–5 кроків.", "Відштовхування — однією ногою.", "Мах руками вгору.", "Удар у найвищій точці.", "Між спробами — відпочинок."]}, {"h": "Бадмінтон. Серії ударів справа та зліва з партнером по діагоналі", "p": ["Гравці стоять у протилежних кутах і обмінюються ударами по діагоналі: справа, зліва, по черзі. Мета — утримати волан у грі якомога довше, точно спрямовуючи його партнерові.", "Така вправа розвиває стабільність ударів і вміння швидко змінювати хват ракетки між ударами справа й зліва."], "ul": ["Удар справа — відкритим боком ракетки.", "Удар зліва — закритим боком.", "Змінюй хват між ударами.", "Рахуйте кількість ударів у серії.", "Мета — стабільність, а не сила."]}], "f": "Пульс після навантаження відновлюється швидше в тих, хто регулярно тренується, — це одна з ознак гарної витривалості.", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, «степ» 3×30, повільні присідання 2×20; між серіями — заминка з розтягуванням.", "Склади комплекс заминки з 5 вправ на розтягування і дихання після естафети."], "q": ["Чому після естафети не варто одразу сідати?", "Що таке заминка?", "Як вибрати момент стрибка до високого м’яча?", "Навіщо в бадмінтоні серії ударів по діагоналі?"]}, {"n": "94", "t": "Cool Games: підрахунок результату. Удари по підвішених м’ячах. Парний бадмінтон", "g": "Учень знатиме різні способи визначення результату естафет, техніку ударів по підвішених м’ячах на різній висоті та розстановку гравців у парній грі.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Залік", "спосіб підрахунку результату в змаганнях (за часом, за балами, за кількістю виконань)."], ["Бонусні бали", "додаткові бали за виконання особливого завдання."], ["Парна гра", "гра в бадмінтон двома гравцями з кожного боку сітки."], ["Розстановка «один за одним»", "атакувальне положення пари, коли один гравець біля сітки, а другий — позаду."]], "th": [{"h": "Cool Games. Способи визначення результату естафет", "p": ["Результат можна рахувати по-різному: за часом (хто швидше), за балами (за кожне правильно виконане завдання), за кількістю виконань (скільки разів встигли за хвилину). Можна поєднувати способи, додаючи бонусні бали за творчість чи злагодженість.", "Спосіб підрахунку оголошують до старту, щоб усі команди мали рівні умови."], "ul": ["Залік за часом.", "Залік за балами.", "Залік за кількістю виконань.", "Штрафи за порушення.", "Бонус за творчість чи командну роботу."]}, {"h": "Футбол. Стрибки з ударом головою чи ногою по м’ячах на різній висоті", "p": ["Підвішені м’ячі на різній висоті вчать підлаштовувати стрибок: до нижнього достатньо невеликого підскоку, до верхнього — розбігу й сильного поштовху. Удар ногою по високому м’ячу виконують підйомом або внутрішньою стороною стопи.", "Вправу виконують по черзі, з достатньою відстанню між учасниками."], "ul": ["Вибери м’яч, що відповідає твоїм силам.", "Низький м’яч — з місця.", "Високий — з розбігу.", "Удар ногою — без втрати рівноваги.", "Приземлення — на обидві ноги."]}, {"h": "Бадмінтон. Елементи навчальної гри: парна гра", "p": ["У парному бадмінтоні використовують ширший майданчик. Під час атаки гравці стають «один за одним»: передній грає біля сітки, задній б’є «смеші». Під час захисту — «поруч»: кожен відповідає за свою половину.", "Важлива домовленість: хто б’є по волану в центрі, щоб не зачепити один одного ракеткою."], "ul": ["Атака — «один за одним».", "Захист — «поруч».", "Домовтеся про волан у центрі.", "Говоріть: «мій», «твій».", "Подача в парній грі — по діагоналі."]}], "f": "У парному бадмінтоні використовують ширше поле, ніж в одиночному, а зона подачі відрізняється за довжиною.", "pr": ["Виконай вправи на розвиток швидкості: швидкі оплески 3×10 с, «тепінг» руками по столу 3×10 с, ловіння лінійки.", "Придумай систему нарахування балів для естафети з 4 етапів (бали, штрафи, бонуси) і запиши її."], "q": ["Які способи підрахунку результату естафет ти знаєш?", "Як підлаштувати стрибок під м’ячі на різній висоті?", "Як розташовуються гравці пари під час атаки та захисту?", "Чому в парній грі треба домовлятися про волан у центрі?"]}, {"n": "95", "t": "Cool Games: повага й підтримка. Жонглювання м’ячем. Рахунок і помилки в бадмінтоні", "g": "Учень знатиме, як підтримувати дружню атмосферу в естафетах, техніку жонглювання м’ячем і правила рахунку та типові порушення в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Жонглювання", "багаторазове підбивання м’яча різними частинами тіла, не даючи йому впасти."], ["Відчуття м’яча", "здатність гравця точно контролювати силу і напрямок дотику до м’яча."], ["Помилка (фол) у бадмінтоні", "порушення, після якого очко отримує суперник."], ["Аут", "потрапляння волана за межі майданчика."]], "th": [{"h": "Cool Games. Естафети: повага та підтримка", "p": ["Перемога приємна, але ще важливіше, щоб усі отримали задоволення від гри. Команди підтримують своїх учасників і поважають суперників: не кепкують з помилок, допомагають піднятися тому, хто впав.", "Повага стосується й суддів: їхні рішення приймають спокійно."], "ul": ["Підбадьорюй своїх.", "Аплодуй суперникам за гарний етап.", "Не кепкуй з помилок.", "Приймай рішення судді.", "Дякуй усім після гри."]}, {"h": "Футбол. Жонглювання м’ячем правою і лівою ногою, стегном", "p": ["Жонглювання розвиває відчуття м’яча й координацію. М’яч підбивають підйомом (носок натягнутий), стегном (стегно паралельно до підлоги) і чергують праву й ліву ногу.", "Починають з одного дотику і ловіння м’яча руками, потім два-три дотики й поступово більше. Рахуй свій рекорд і намагайся його покращити."], "ul": ["Підбивай м’яч невисоко — до рівня пояса.", "Носок натягнутий.", "Стегно — паралельне до підлоги.", "Чергуй ноги.", "Тримай рівновагу на опорній нозі."]}, {"h": "Бадмінтон. Навчальна гра: рахунок і типові порушення", "p": ["У навчальній грі вчимося правильно рахувати. Подаючий оголошує рахунок перед кожною подачею, свій — першим. Очко отримує той, хто виграв розіграш.", "Порушення: волан влучив у аут, не перелетів сітку, торкання сітки ракеткою чи тілом, подвійний удар, удар по волану на чужій половині, подача вище дозволеної висоти."], "ul": ["Рахунок оголошує подаючий.", "Аут — волан за лініями.", "Не торкайся сітки.", "Один удар на одну сторону.", "Чесно визнавай свої помилки."]}], "f": "Жонглювання м’ячем — улюблена вправа футболістів: вона тренує координацію, рівновагу й точність дотику.", "pr": ["Виконай вправи на розвиток гнучкості: розтягування стегна стоячи біля опори, нахили вперед сидячи, «метелик», оберти стопами — по 20 с.", "Опиши письмово техніку жонглювання підйомом і стегном та намалюй правильне положення стопи й стегна в момент дотику до м’яча."], "q": ["Як виявляти повагу до суперників у естафетах?", "Що розвиває жонглювання м’ячем?", "Хто оголошує рахунок у бадмінтоні?", "Назви 3 порушення в бадмінтоні."]}, {"n": "96", "t": "Cool Games під музику. Зупинки м’яча. Етикет і чесна гра в бадмінтоні", "g": "Учень знатиме, як проводити естафети в ритмі музики, способи зупинки м’яча і правила етикету в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Ритм", "чергування рухів через рівні проміжки часу."], ["Зупинка м’яча", "прийом, яким гравець гасить швидкість м’яча й бере його під контроль."], ["Амортизація", "м’яке поступливе гасіння швидкості м’яча рухом частини тіла назад."], ["Етикет", "правила ввічливої поведінки, прийняті в певному середовищі."]], "th": [{"h": "Cool Games. Естафети під музику й у ритмі", "p": ["Музика додає естафетам енергії й допомагає тримати ритм. Наприклад: поки грає музика — виконуємо рухове завдання, коли зупиняється — замираємо або виконуємо інше завдання.", "Ритмічні етапи розвивають увагу, координацію та вміння діяти синхронно з командою."], "ul": ["Рухи — у такт музиці.", "Зупинилася музика — завмер.", "Синхронні рухи всієї команди.", "Гучність музики — помірна, щоб чути суддю.", "Безпечна дистанція між учасниками."]}, {"h": "Футбол. Зупинки м’яча грудьми, внутрішньою та зовнішньою частиною стопи", "p": ["Зупинка грудьми (для хлопців): назустріч м’ячу виставляють груди, а в момент дотику трохи відхиляються назад, і м’яч опускається до ніг. Зупинка внутрішньою частиною стопи — найнадійніша для м’ячів, що котяться.", "Зупинку зовнішньою частиною стопи використовують у русі, щоб одразу змістити м’яч убік від суперника. Головне — амортизація: частина тіла поступається назад у момент дотику."], "ul": ["Стеж за м’ячем до дотику.", "Гаси швидкість м’яким рухом назад.", "Після зупинки м’яч — під контролем, поруч.", "Зупинка в русі — відразу в потрібному напрямку.", "Тренуй обидві ноги."]}, {"h": "Бадмінтон. Навчальна гра: етикет і чесна гра", "p": ["Бадмінтон — гра джентльменів. Гравці вітаються перед грою й тиснуть руки після неї, чесно визнають, якщо волан торкнувся їх чи ракетки. Спірні волани біля ліній вирішують спокійно, а в разі сумнівів — переграють розіграш.", "Не можна відволікати суперника криками чи рухами під час його удару."], "ul": ["Привітай суперника перед грою.", "Чесно визнавай торкання волана.", "Спірний волан — переграйте.", "Не відволікай суперника.", "Подякуй за гру."]}], "f": "У бадмінтоні суперники після гри традиційно тиснуть один одному руки над сіткою.", "pr": ["Виконай вправи на розвиток спритності під музику: крокові рухи на місці в такт, «перехресні» доторки, рухи руками в ритмі — 3 хвилини без зупинки.", "Склади короткий «кодекс чесної гри» з 5 правил для бадмінтону."], "q": ["Як музика допомагає в естафетах?", "Що таке амортизація під час зупинки м’яча?", "Коли використовують зупинку зовнішньою частиною стопи?", "Які правила етикету є в бадмінтоні?"]}, {"n": "97", "t": "Cool Games: рефлексія. Маневрування у футболі. Стабільність серій ударів", "g": "Учень зможе аналізувати свої дії після естафети, знатиме принципи маневрування у футболі та способи підвищення стабільності серій ударів у бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Рефлексія", "аналіз власних дій, почуттів і результатів."], ["Маневрування", "переміщення гравців для створення переваги або закриття простору."], ["Компактність", "розташування гравців команди близько один до одного в захисті."], ["Стабільність", "здатність багато разів поспіль виконувати рух однаково точно."]], "th": [{"h": "Cool Games. Аналіз естафет і рефлексія", "p": ["Після естафети команда коротко обговорює: що вдалося, що заважало, що зробити інакше наступного разу. Так команда вчиться на власному досвіді.", "Рефлексія — це не пошук винних, а пошук рішень. Кожен може поділитися своїми почуттями і пропозиціями."], "ul": ["Що вдалося найкраще?", "Де ми втратили час?", "Чи всі розуміли свою роль?", "Що змінимо наступного разу?", "Подякуй кожному учасникові."]}, {"h": "Футбол. Маневрування в захисті та атаці", "p": ["В атаці гравці розширюють гру, займають вільні зони, створюють варіанти для передачі. У захисті — навпаки, команда стає компактною, закриває простір у центрі й зміщується в бік м’яча.", "Раціонально використовують вивчені прийоми: просту передачу замість ризикованого обведення, удар, коли є нагода, а не тоді, коли хочеться."], "ul": ["Атака — ширина й рух без м’яча.", "Захист — компактність.", "Зміщуйтеся всією командою за м’ячем.", "Обирайте найпростіше ефективне рішення.", "Спілкуйтеся на полі."]}, {"h": "Бадмінтон. Серії ударів справа та зліва по діагоналі: стабільність", "p": ["Продовжуємо серії по діагоналі, але тепер ставимо мету — рекорд кількості ударів у серії без помилки. Для цього потрібні правильний хват, вчасна підготовка ракетки та повернення в стійку після кожного удару.", "Корисно вести облік: скільки ударів у найдовшій серії, де найчастіше помиляєшся — справа чи зліва."], "ul": ["Готуй ракетку заз
