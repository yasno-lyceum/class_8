<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 8 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk8", "name": "Фізична культура · 8 клас", "short": "Фізкультура 8", "themes": [{"name": "І чверть. Легка атлетика, волейбол, спорт заради розвитку", "lessons": [{"n": "1", "t": "Безпека на уроках фізкультури. Модулі І чверті: легка атлетика, волейбол, спорт заради розвитку", "g": "Учень знатиме основні правила безпеки на уроках фізичної культури, ознайомиться з модулями І чверті та зрозуміє, як фізична активність розвиває соціальні навички.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Інструктаж з безпеки", "пояснення правил поведінки, які допомагають уникнути травм під час занять."], ["Варіативний модуль", "розділ програми з фізичної культури, який обирають для вивчення залежно від інтересів учнів і умов школи."], ["Ключові компетентності", "знання, уміння й навички, потрібні людині в житті: спілкування, співпраця, турбота про здоров'я тощо."], ["Сталий розвиток", "розвиток, за якого люди задовольняють свої потреби, не шкодячи довкіллю та майбутнім поколінням."], ["Соціальна активність", "готовність брати участь у житті класу, школи й громади, допомагати іншим і діяти спільно."]], "th": [{"h": "Безпека на уроках фізичної культури", "p": ["Будь-яке заняття починається з безпеки. Більшість травм трапляється не через складні вправи, а через неуважність, поспіх, невідповідний одяг або пропущену розминку. Якщо дотримуватися простих правил, заняття будуть і корисними, і безпечними.", "Безпека пов'язана і зі сталим розвитком: дбайливе ставлення до спортивного інвентарю, чистота на майданчику, повага до інших — усе це частина відповідальної поведінки."], "ul": ["Займайся у зручному спортивному одязі та взутті з неслизькою підошвою.", "Зніми прикраси, годинник, сховай гострі предмети.", "Завжди починай з розминки й закінчуй заминкою (спокійними вправами та розтяжкою).", "Виконуй вправи лише з дозволу вчителя чи дорослого, не штовхайся, не заважай іншим.", "Про біль, запаморочення чи погане самопочуття одразу повідом дорослого.", "Перед заняттями вдома перевір, чи є навколо достатньо вільного місця."]}, {"h": "Модулі І чверті: легка атлетика, волейбол, спорт заради розвитку", "p": ["У І чверті ти вивчатимеш три модулі. Легка атлетика — це біг, стрибки та метання, які розвивають швидкість, силу й витривалість. Волейбол — командна гра з м'ячем через сітку, що вчить точності, реакції та командної взаємодії.", "Спорт заради розвитку — модуль, у якому спорт використовують як засіб розвитку особистості: співпраці, лідерства, поваги та вміння дружно діяти в команді."], "ul": ["Легка атлетика — «королева спорту», основа підготовки в багатьох інших видах спорту.", "Волейбол розвиває спритність, координацію рухів і швидкість реакції.", "Спорт заради розвитку вчить спілкуватися, домовлятися й підтримувати інших.", "Усі модулі разом формують ключові компетентності: здоров'я, співпрацю, самоорганізацію.", "Для дистанційного навчання важливо вивчати теорію та виконувати безпечні вправи вдома."]}, {"h": "Спорт заради розвитку. Соціальна активність", "p": ["Фізична культура — це не лише м'язи й нормативи. Під час ігор та командних вправ ми вчимося домовлятися, допомагати іншим, брати відповідальність і поважати суперника. Ці навички знадобляться у школі, у сім'ї та в майбутній роботі.", "Соціально активна людина не стоїть осторонь: вона може запропонувати гру, допомогти організувати змагання, підтримати новачка чи друга, якому щось не вдається."], "ul": ["Пропонуй ідеї для спільних ігор і змагань.", "Підтримуй товаришів словом, а не критикою.", "Дотримуйся правил і чесної гри.", "Бери участь у шкільних спортивних заходах і флешмобах.", "Вчися працювати в команді, навіть якщо в ній люди з різними можливостями."]}], "f": "Слова «фізична культура» підкреслюють, що рухова активність — це частина загальної культури людини, так само як мова чи мистецтво.", "pr": ["Запиши в зошит 5 найважливіших, на твою думку, правил безпеки на уроках фізичної культури та поясни, чому обрав саме їх.", "Виконай вправи на координацію рухів: по черзі торкайся правою рукою лівого коліна і лівою рукою правого коліна (2 підходи по 20 разів), потім стій на одній нозі із заплющеними очима по 15 секунд на кожній нозі (поруч зі стіною для страховки)."], "q": ["Чому перед заняттям обов'язково потрібна розминка?", "Які три модулі ти вивчатимеш у І чверті?", "Що означає бути соціально активним у спорті?", "Як пов'язані безпека, дбайливе ставлення до інвентарю та сталий розвиток?"]}, {"n": "2", "t": "Безпека в легкій атлетиці, дихання й питний режим, втома. Профілактика травм у волейболі", "g": "Учень знатиме правила безпеки в легкій атлетиці, як правильно дихати й пити воду під час навантаження, як розпізнати втому та запобігати травмам у волейболі.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Втома", "тимчасове зниження працездатності організму після навантаження, яке минає після відпочинку."], ["Питний режим", "правила вживання води до, під час і після фізичних занять для запобігання зневодненню."], ["Профілактика травматизму", "заходи, що допомагають запобігти травмам: розминка, правильна техніка, справний інвентар."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою, тобто з великим розмахом у суглобах."], ["Загальнорозвивальні вправи (ЗРВ)", "прості вправи для різних груп м'язів, які готують організм до основного навантаження."]], "th": [{"h": "Легка атлетика. Правила безпеки, дихання, питний режим і втома", "p": ["На легкоатлетичних заняттях бігають, стрибають і метають, тому важливо стежити за напрямком руху, не перетинати бігову доріжку й не стояти в секторі для метання. Під час бігу дихай рівномірно, носом і ротом одночасно, не затримуй дихання. Воду пий невеликими ковтками до і після заняття, а в спеку — і під час перерв.", "Втома — природна реакція організму. Вона буває легкою (почервоніння, пітливість), середньою (сильне почервоніння, часте дихання) і значною (блідість, порушення координації, запаморочення). Втома корисна, бо після відпочинку організм стає сильнішим, але перевтома шкідлива."], "ul": ["Не перебігай доріжку, по якій біжать інші, і не заходь у сектор для метання.", "Метай лише за командою вчителя і тільки в одному напрямку.", "Пий воду маленькими ковтками, не чекай сильної спраги.", "Ознаки сильної втоми: блідість, нудота, запаморочення — це сигнал зупинитися.", "Відпочинок і сон допомагають організму відновитися після навантаження."]}, {"h": "Волейбол. Профілактика травм, ЗРВ і вправи на гнучкість", "p": ["У волейболі найчастіше травмуються пальці, гомілковостопні та колінні суглоби. Щоб цього уникнути, обов'язково розігрівай кисті, пальці, плечі й ноги, приземляйся на обидві ноги і не стій під сіткою, коли поруч приземляється інший гравець.", "Гнучкість допомагає швидко тягнутися за м'ячем і знижує ризик розтягнень. Вправи на гнучкість виконують плавно, без ривків, після розминки."], "ul": ["Розминай пальці та кисті: стискання й розтискання, обертання кистями.", "Виконуй нахили, повороти тулуба, махи руками для розминки плечей.", "Під час розтяжки затримуйся в положенні 15–20 секунд, без болю.", "Не грай на мокрій або слизькій підлозі.", "Слідкуй за м'ячем і попереджай партнера вигуком «Мій!»."]}, {"h": "Спорт заради розвитку. Безпека на заходах і вплив рухової активності на організм", "p": ["Правила безпеки діють не лише на уроках, а й під час позаурочних занять, змагань і свят. На масових заходах важливо слухати організаторів, знати, де вихід, і не створювати тисняви. Кожна рухлива чи спортивна гра має свої правила, і їх дотримання робить гру чесною й безпечною.", "Регулярні фізичні вправи зміцнюють серце й легені, м'язи та кістки, покращують настрій і сон, допомагають краще навчатися."], "ul": ["На змаганнях слухай суддів і організаторів.", "Не біжи в натовпі, тримайся своєї групи.", "Перед грою з'ясуй її правила й межі майданчика.", "Рух покращує кровообіг і роботу мозку.", "Фізична активність допомагає знімати стрес."]}], "f": "Навіть невелика втрата води організмом може знизити працездатність і увагу, тому питний режим важливий не лише для спортсменів.", "pr": ["Склади пам'ятку «Ознаки втоми та що робити», розподіливши ознаки на легку, середню і значну втому.", "Виконай вправи на координацію рухів і гнучкість: «млин» руками (10 разів), нахили вперед до носків ніг сидячи (затримка 15 секунд, 3 рази), стійка на одній нозі з руками в сторони (по 20 секунд)."], "q": ["Як правильно дихати під час бігу?", "Назви три стадії втоми та їхні ознаки.", "Які травми найчастіше трапляються у волейболі і як їм запобігти?", "Як фізична активність впливає на організм людини?"]}, {"n": "3", "t": "Біг на різні дистанції, спецвправи. Передачі через сітку. Фізичне виховання й особистість", "g": "Учень знатиме особливості бігу на короткі, середні та довгі дистанції, техніку передач м'яча зверху та знизу і роль фізичних вправ у становленні особистості.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Спринт", "біг на короткі дистанції з максимальною швидкістю."], ["Спеціальні бігові вправи", "вправи, що відпрацьовують окремі елементи бігу: біг з високим підніманням стегна, із закиданням гомілки, семенячий біг."], ["Передача зверху", "прийом у волейболі, коли м'яч передають двома руками над лобом подушечками пальців."], ["Передача знизу", "прийом у волейболі, коли м'яч відбивають передпліччями з'єднаних рук на рівні пояса."]], "th": [{"h": "Легка атлетика. Біг на короткі, середні та довгі дистанції. Спеціальні вправи", "p": ["Короткі дистанції (спринт) пробігають з максимальною швидкістю, тут важливі швидкий старт і частота кроків. На середніх дистанціях потрібно поєднувати швидкість і витривалість та правильно розподіляти сили. Довгі дистанції біжать у рівномірному темпі, з економним рухом і рівним диханням.", "Спеціальні бігові та стрибкові вправи вчать правильної техніки: високо піднімати стегно, ставити ногу на передню частину стопи, активно працювати руками."], "ul": ["Біг з високим підніманням стегна — розвиває силу ніг і частоту кроків.", "Біг із закиданням гомілки — вчить швидко згинати ногу після поштовху.", "Семенячий біг — дрібні швидкі кроки на передній частині стопи.", "Стрибки з ноги на ногу (багатоскоки) — розвивають силу поштовху.", "Типова помилка: біг на п'ятах і скуті плечі."]}, {"h": "Волейбол. Передачі м'яча двома руками зверху та знизу через сітку в парах", "p": ["Передача зверху: стань у стійку, ноги трохи зігнуті, руки підняті над лобом, пальці утворюють «ковшик». М'яч приймають подушечками пальців і відштовхують випрямленням рук і ніг. Передачу знизу виконують, коли м'яч летить низько: руки з'єднані, передпліччя рівні, удар роблять рухом ніг, а не замахом рук.", "У парах через сітку стежать, щоб м'яч летів по дузі й над сіткою, точно до партнера."], "ul": ["Перед передачею виходь під м'яч, а не тягнися до нього.", "Зверху — працюють пальці, а не долоні.", "Знизу — руки прямі, м'яч приймають на передпліччя, а не на кисті.", "Поштовх починається з ніг.", "Типова помилка: м'яч «ляскає» по долонях або летить без дуги."]}, {"h": "Спорт заради розвитку. Фізичні вправи у становленні особистості", "p": ["Займаючись фізичними вправами, людина вчиться ставити цілі, долати труднощі й не здаватися. Спорт формує дисципліну, наполегливість, відповідальність і вміння працювати в команді.", "Особистість — це не лише знання, а й характер. Регулярні тренування допомагають стати впевненішим, організованішим і доброзичливішим до інших."], "ul": ["Фізичні вправи виховують силу волі.", "Систематичні тренування вчать самодисципліни.", "Командні ігри вчать поважати товаришів і суперників.", "Досягнення маленьких цілей додає впевненості.", "Спорт допомагає краще розуміти себе і свої можливості."]}], "f": "У волейболі м'яч не можна ловити або тримати — його лише відбивають, тому техніка рук така важлива.", "pr": ["Намалюй схему або опиши словами положення рук під час передачі м'яча зверху та знизу.", "Виконай вправи на координацію: імітація роботи рук під час бігу стоячи на місці (3 рази по 30 секунд), ходьба на носках по кімнаті (1 хвилина)."], "q": ["Чим відрізняється біг на короткі й довгі дистанції?", "Назви три спеціальні бігові вправи.", "Якою частиною рук приймають м'яч під час передачі зверху?", "Які якості особистості розвиває спорт?"]}, {"n": "4", "t": "Біг на короткі й середні дистанції. Прийом м'яча від сітки. Мотивація до занять спортом", "g": "Учень знатиме техніку бігу на короткі та середні дистанції, правила прийому м'яча після відскоку від сітки та способи підтримувати мотивацію до занять.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Низький старт", "положення бігуна перед стартом на коротку дистанцію з опорою на руки й ноги."], ["Високий старт", "старт зі стійки, який використовують у бігу на середні та довгі дистанції."], ["Фінішний ривок", "прискорення на останніх метрах дистанції."], ["Мотивація", "внутрішнє спонукання, що змушує людину діяти заради досягнення мети."]], "th": [{"h": "Легка атлетика. Біг на короткі та середні дистанції", "p": ["Біг складається з чотирьох частин: старт, стартовий розгін, біг по дистанції та фінішування. На коротких дистанціях використовують низький старт за командами «На старт!», «Увага!», «Руш!». На середніх — високий старт за командами «На старт!» і «Руш!».", "На середніх дистанціях важливо не почати надто швидко, бо сили закінчаться задовго до фінішу. Дихання має бути ритмічним."], "ul": ["Стартовий розгін — поступово піднімай тулуб, збільшуй довжину кроку.", "Руки зігнуті в ліктях і працюють уздовж тулуба.", "Фінішуй, не зменшуючи швидкості, а пробігаючи лінію фінішу.", "Після фінішу не зупиняйся різко — перейди на ходьбу.", "Типова помилка: озиратися під час бігу."]}, {"h": "Волейбол. Прийом м'яча, що відскочив від сітки", "p": ["За правилами м'яч, який торкнувся сітки під час розіграшу, залишається в грі, і команда може його прийняти. Після відскоку від сітки м'яч зазвичай падає швидко й близько до неї, тому його приймають передачею знизу.", "Траєкторія відскоку залежить від того, в яку частину сітки влучив м'яч: від верхнього краю він падає майже вертикально, від середини — відлітає трохи вперед."], "ul": ["Стій боком або вполоборота до сітки, щоб бачити м'яч.", "Низько присідай, руки готові до передачі знизу.", "Не торкайся сітки — це порушення.", "Спрямовуй м'яч угору, щоб партнер міг зіграти далі.", "Команда має не більше трьох торкань м'яча на своєму боці."]}, {"h": "Спорт заради розвитку. Мотивація до занять фізичною культурою", "p": ["Мотивація буває зовнішньою (похвала, нагорода, оцінка) і внутрішньою (задоволення від руху, бажання бути здоровим і сильним). Найдовше працює внутрішня мотивація, коли тобі самому цікаво займатися.", "Щоб не кидати заняття, ставлять невеликі досяжні цілі, ведуть щоденник тренувань і радіють навіть маленьким успіхам."], "ul": ["Обери вид активності, який приносить радість.", "Став конкретну ціль: наприклад, щодня 10 хвилин вправ.", "Записуй свої результати й порівнюй із попередніми, а не з іншими.", "Займайся з друзями — це додає інтересу.", "Не карай себе за пропуски, просто продовжуй."]}], "f": "Ведення щоденника тренувань допомагає бачити власний прогрес, а це одна з найсильніших причин не кидати заняття.", "pr": ["Запиши 3 особисті причини, чому тобі варто займатися фізичною культурою, і одну конкретну ціль на цей місяць.", "Виконай комплекс вправ на поставу: стань спиною до стіни, торкаючись її потилицею, лопатками, сідницями і п'ятами, постій 1 хвилину; потім 10 разів зведи лопатки разом."], "q": ["З яких частин складається біг на коротку дистанцію?", "Які команди подають під час низького старту?", "Як правильно прийняти м'яч, що відскочив від сітки?", "Чим відрізняється внутрішня мотивація від зовнішньої?"]}, {"n": "5", "t": "Стрибок у довжину з місця. Верхня та нижня подачі у волейболі. Моральні й вольові якості", "g": "Учень знатиме техніку стрибка у довжину з місця, способи виконання верхньої й нижньої подачі у волейболі та роль фізичного виховання у формуванні характеру.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Стрибок у довжину з місця", "стрибок поштовхом обох ніг уперед із приземленням на обидві ноги."], ["Подача", "введення м'яча в гру ударом рукою з-за лицьової лінії."], ["Нижня пряма подача", "подача, під час якої м'яч б'ють знизу, долонею чи основою кисті, стоячи обличчям до сітки."], ["Вольові якості", "риси характеру, що допомагають долати труднощі: наполегливість, витримка, рішучість."]], "th": [{"h": "Легка атлетика. Стрибки у довжину з місця", "p": ["Стрибок у довжину з місця складається з підготовки, поштовху, польоту та приземлення. Стань ноги на ширині стоп, зроби мах руками назад із напівприсіданням, потім потужно відштовхнися обома ногами, одночасно махнувши руками вперед-угору.", "У польоті підтягни коліна до грудей, а перед приземленням винеси ноги вперед. Приземляйся м'яко на обидві ноги, згинаючи коліна, і не падай назад."], "ul": ["Поштовх виконують одночасно обома ногами.", "Мах руками допомагає стрибнути далі.", "Результат вимірюють від лінії до найближчого сліду (зазвичай п'ят).", "Типова помилка: поштовх по черзі ногами або падіння назад.", "Стрибки виконують лише на нековзкій поверхні або в ямі з піском."]}, {"h": "Волейбол. Подачі м'яча — верхня та нижня", "p": ["Подача вводить м'яч у гру. Її виконують з-за лицьової лінії, не наступаючи на неї. Нижня пряма подача найпростіша: стань лівою ногою вперед (для правші), підкинь м'яч невисоко перед собою і вдар знизу основою долоні.", "Верхня пряма подача складніша: м'яч підкидають над головою трохи перед собою, а удар виконують долонею зверху, наче кидок м'яча. Вона швидша й сильніша."], "ul": ["Подавати можна лише після свистка судді.", "М'яч має перелетіти сітку, не торкнувшись її, і впасти в межах майданчика суперника.", "Підкидання — невисоке й точне.", "Дивись на м'яч до моменту удару.", "Типова помилка: заступ на лицьову лінію під час подачі."]}, {"h": "Спорт заради розвитку. Формування моральних і вольових якостей", "p": ["Моральні якості — це чесність, справедливість, повага, доброзичливість. Під час гри вони проявляються, коли ти визнаєш свою помилку, допомагаєш суперникові підвестися, поважаєш рішення судді.", "Вольові якості формуються, коли ти не кидаєш вправу на півдорозі, тренуєшся навіть без настрою, долаєш страх перед новим елементом."], "ul": ["Чесність — визнавати порушення правил.", "Наполегливість — повторювати вправу, поки не вийде.", "Витримка — зберігати спокій у напруженій ситуації.", "Рішучість — сміливо пробувати нове.", "Повага — однаково ставитися до партнерів і суперників."]}], "f": "У волейболі подача — єдиний прийом, який гравець виконує повністю самостійно, без участі партнерів.", "pr": ["Опиши послідовність фаз стрибка у довжину з місця і назви одну типову помилку для кожної фази.", "Виконай вправи на поставу: «кішечка» (прогин і округлення спини на четвереньках, 10 разів), «човник» лежачи на животі (3 рази по 10 секунд)."], "q": ["З яких фаз складається стрибок у довжину з місця?", "Чим відрізняється нижня пряма подача від верхньої?", "Які правила потрібно дотримуватися під час подачі?", "Наведи приклад прояву вольової якості у спорті."]}, {"n": "6", "t": "Дихання й питний режим, біологічне значення втоми. Рухлива гра. Рух, мислення та спортивна етика", "g": "Учень зрозуміє, чому втома корисна для розвитку організму, як дихати й пити воду під час занять, а також як рух впливає на мислення і які існують правила спортивної етики.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Відновлення", "процес повернення організму до нормального стану після фізичного навантаження."], ["Зневоднення", "стан, коли організм втратив більше води, ніж отримав."], ["Когнітивні здібності", "здібності, пов'язані з мисленням: увага, пам'ять, мислення, швидкість прийняття рішень."], ["Спортивна етика", "правила поведінки у спорті, засновані на чесності та повазі."]], "th": [{"h": "Легка атлетика. Дихання, питний режим і біологічне значення втоми", "p": ["Під час навантаження м'язам потрібно більше кисню, тому дихання частішає. У рівномірному бігу корисно узгоджувати дихання з кроками, наприклад, вдих на кілька кроків і видих на кілька кроків. Воду варто пити до заняття, малими ковтками в перервах і після.", "Біологічне значення втоми в тому, що вона захищає організм від надмірного навантаження. А під час відпочинку організм не просто відновлюється, а стає трохи сильнішим, ніж до тренування. Тому важливо правильно чергувати навантаження й відпочинок."], "ul": ["Ознаки зневоднення: сильна спрага, сухість у роті, головний біль, втома.", "Краще пити чисту воду, а не солодкі газовані напої.", "Після тренування відпочинок так само важливий, як і саме тренування.", "Повноцінний сон — головний засіб відновлення.", "Не тренуйся на межі сил щодня — чергуй легкі й важчі дні."]}, {"h": "Волейбол. Рухлива гра для розвитку фізичних якостей", "p": ["Рухливі ігри з м'ячем допомагають розвивати швидкість реакції, спритність і координацію, необхідні у волейболі. Наприклад, гра «Піонербол» (гра через сітку з ловінням і киданням м'яча) готує до справжнього волейболу: учні вчаться стежити за м'ячем і займати місце на майданчику.", "У грі важливо дотримуватися правил, стежити за партнерами і не штовхатися."], "ul": ["Рухливі ігри розвивають реакцію та орієнтування на майданчику.", "Гра з перекиданням м'яча через сітку вчить оцінювати траєкторію.", "Перед грою — розминка кистей і ніг.", "Грай чесно, поважай рішення ведучого.", "Після гри — спокійна ходьба та вправи на дихання."]}, {"h": "Спорт заради розвитку. Рух і мислення. Правила спортивної етики", "p": ["Фізична активність покращує кровопостачання мозку, тому після руханки легше зосередитися й запам'ятати матеріал. Ігри, де потрібно швидко ухвалювати рішення, тренують увагу та мислення.", "Спортивна етика — це правила поведінки, що роблять спорт чесним і приємним для всіх: повага до суперника, суддів і глядачів, відмова від обману та образ."], "ul": ["Коротка руханка між уроками допомагає краще вчитися.", "Ігри на реакцію тренують увагу.", "Привітай суперника до гри і подякуй після неї.", "Не ображай інших і не сперечайся грубо із суддею.", "Визнавай перемогу суперника гідно."]}], "f": "Явище, коли після тренування й відпочинку організм стає сильнішим, ніж був, називають суперкомпенсацією.", "pr": ["Склади свій «питний режим» на день із тренуванням: коли і скільки приблизно склянок води ти вип'єш.", "Виконай вправи на поставу: ходьба по кімнаті з книжкою на голові (2 хвилини), підйоми на носки біля стіни (15 разів)."], "q": ["Чому втома важлива для розвитку тренованості?", "Як зрозуміти, що в організмі не вистачає води?", "Як фізична активність впливає на мислення?", "Назви три правила спортивної етики."]}, {"n": "7", "t": "Стрибкові й бігові вправи. Підготовка волейболістів, передача зверху. Ігри для спілкування", "g": "Учень знатиме, як підбирати спеціальні вправи для бігу, особливості фізичної підготовки волейболістів залежно від віку і статі та як ігрові вправи покращують комунікацію.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Стрибкові вправи", "вправи з відштовхуванням і польотом, що розвивають силу та швидкість ніг."], ["Стрибучість", "здатність високо й швидко стрибати завдяки силі й швидкості м'язів ніг."], ["Комунікативні навички", "вміння слухати, говорити, домовлятися й розуміти інших."], ["Групова взаємодія", "спільна робота кількох людей для досягнення загальної мети."]], "th": [{"h": "Легка атлетика. Стрибкові та бігові вправи. Біг на короткі та середні дистанції", "p": ["Стрибкові вправи (стрибки на двох ногах, з ноги на ногу, через низькі перешкоди) роблять поштовх сильнішим, а бігові вправи покращують техніку. Їх виконують після розминки, на рівній поверхні, по 15–30 метрів із відпочинком.", "Перед бігом на дистанцію ці вправи «вмикають» потрібні м'язи. Після бігу важливо не сідати одразу, а походити й відновити дихання."], "ul": ["Стрибки виконують легко, на передній частині стопи.", "Не роби забагато стрибків поспіль — це перевантажує суглоби.", "Бігові вправи — 2–3 повторення кожної.", "Під час бігу на середні дистанції тримай рівний темп.", "Відновлюй дихання ходьбою після кожного прискорення."]}, {"h": "Волейбол. Фізична підготовка з урахуванням віку і статі. Передача зверху через сітку", "p": ["Волейболістам потрібні стрибучість, швидкість реакції, спритність і сила рук та плечей. Підлітки 13–14 років активно ростуть, тому навантаження збільшують поступово, приділяючи увагу техніці та гнучкості, а не важким вагам. Хлопці й дівчата можуть мати різні темпи розвитку сили, тому навантаження добирають індивідуально.", "Передачу зверху через сітку в парах виконують по дузі, щоб м'яч приземлявся точно до партнера."], "ul": ["Розвиток стрибучості — стрибкові вправи без обтяжень.", "Розвиток реакції — ігри з сигналами та ловінням.", "Сила рук — віджимання, вправи з легким м'ячем.", "Передача зверху: руки над лобом, пальці «ковшиком», поштовх ногами.", "Підвищуй навантаження поступово, прислухайся до самопочуття."]}, {"h": "Спорт заради розвитку. Ігрові вправи для комунікації та взаємодії", "p": ["Командні ігри неможливі без спілкування: треба домовитися про ролі, підказати партнеру, підтримати після помилки. Спеціальні ігрові вправи (передати м'яч у колі, назвавши ім'я, пройти естафету в парі, виконати завдання без слів) розвивають уміння слухати й співпрацювати.", "Ефективна група — та, де кожен знає своє завдання, а всі разом рухаються до однієї мети."], "ul": ["Розподіліть ролі перед грою.", "Говоріть коротко й чітко: «Мій!», «Пас!», «Назад!».", "Слухайте капітана і одне одного.", "Хваліть за вдалі дії, а не лише вказуйте на помилки.", "Після гри обговоріть, що вдалося і що можна покращити."]}], "f": "У волейболі гравці постійно перемовляються короткими вигуками — так вони уникають зіткнень і розподіляють, хто прийматиме м'яч.", "pr": ["Придумай гру для 4–6 друзів, у якій без спілкування неможливо перемогти. Опиши її правила.", "Виконай вправи на поставу та силу спини: «супермен» лежачи на животі (піднімання рук і ніг, 3 рази по 10 секунд), зведення лопаток стоячи (15 разів)."], "q": ["Навіщо виконувати спеціальні стрибкові та бігові вправи?", "Які фізичні якості найважливіші для волейболіста?", "Чому навантаження підліткам збільшують поступово?", "Які комунікативні навички розвивають командні ігри?"]}, {"n": "8", "t": "Стрибкові вправи, стрибок у довжину з місця. Прийом м'яча від сітки. Командна взаємодія у грі", "g": "Учень удосконалить знання техніки стрибка у довжину з місця, прийому м'яча від сітки та навчиться пояснювати принципи ефективної групової взаємодії.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Приземлення", "завершальна фаза стрибка, під час якої спортсмен м'яко опускається на ноги, згинаючи коліна."], ["Амортизація", "пом'якшення удару під час приземлення завдяки згинанню ніг."], ["Розіграш", "частина гри від подачі до моменту, коли м'яч вийшов з гри."], ["Командний дух", "почуття єдності та взаємної підтримки серед членів команди."]], "th": [{"h": "Легка атлетика. Стрибкові та бігові вправи. Стрибок у довжину з місця", "p": ["Щоб стрибок у довжину з місця був дальшим, треба поєднати силу ніг із правильним махом руками. Стрибкові вправи (стрибки вгору з присіду, багаторазові стрибки на двох ногах) підсилюють поштовх.", "Особливу увагу приділяй приземленню: коліна згинаються, руки виносяться вперед, щоб не впасти назад і не втратити результат."], "ul": ["Перед стрибком — напівприсід і мах руками назад.", "Поштовх і мах руками вперед виконуються одночасно.", "Під час приземлення згинай коліна для амортизації.", "Руки вперед — щоб не завалитися назад.", "Виконуй кілька спроб з відпочинком між ними."]}, {"h": "Волейбол. Прийом м'яча, що відскочив від сітки", "p": ["Прийом м'яча від сітки часто рятує розіграш, коли передача вийшла невдалою. Гравець має заздалегідь зайняти позицію на відстані близько метра від сітки, низько присісти й приймати м'яч передачею знизу.", "Важливо пам'ятати: якщо після відскоку від сітки м'яч торкнувся гравця, це рахується як торкання команди, тож залишаються лише наступні з трьох дозволених."], "ul": ["Займай позицію заздалегідь, не біжи до сітки в останній момент.", "Тримай руки з'єднаними й прямими.", "Направляй м'яч угору, до центру майданчика.", "Стеж, щоб не торкнутися сітки тілом.", "Тренуйся з партнером, який кидає м'яч у сітку."]}, {"h": "Спорт заради розвитку. Ігрові вправи для командної взаємодії", "p": ["Командна взаємодія — це вміння діяти разом: передавати м'яч тому, хто в кращій позиції, страхувати партнера, допомагати слабшим. Вправи на кшталт «Вузол» (команда розплутує переплетені руки) чи естафети, де всі мають фінішувати разом, вчать думати про спільний результат.", "Важлива частина командної роботи — вміння як вести, так і підтримувати лідера."], "ul": ["Спільна мета важливіша за особистий успіх.", "Кожен член команди цінний.", "Довіра будується на чесності та підтримці.", "Лідер допомагає, а не наказує.", "Обговорення після гри допомагає вчитися на помилках."]}], "f": "У волейболі блок не вважається торканням команди, тож після блоку команда все одно має три торкання.", "pr": ["Згадай випадок, коли твоя команда (у спорті, навчанні чи вдома) досягла успіху разом. Опиши, що допомогло.", "Виконай вправи для розвитку фізичних якостей: присідання (3 підходи по 15 разів), планка на ліктях (3 підходи по 20–30 секунд), підйоми на носки (20 разів)."], "q": ["Чому під час приземлення потрібно згинати коліна?", "Яку позицію займає гравець, щоб прийняти м'яч від сітки?", "Скільки торкань м'яча має команда на своєму боці у волейболі?", "Що таке командний дух і як його розвивати?"]}, {"n": "9", "t": "Бігові вправи й вправи для метань. Верхня та нижня подачі. Контроль емоцій і тривожність", "g": "Учень знатиме підготовчі вправи для метань, удосконалить знання техніки подач і навчиться способам контролювати емоції під час невдач.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Метання", "легкоатлетична вправа, у якій снаряд кидають якомога далі."], ["Кидок із-за голови", "спосіб метання, коли рука з м'ячем рухається від-за голови вперед-угору."], ["Тривожність", "стан хвилювання й неспокою перед важливою подією або після невдачі."], ["Самоконтроль емоцій", "уміння помічати свої почуття й керувати ними, не втрачаючи спокою."]], "th": [{"h": "Легка атлетика. Спеціальні бігові вправи, вправи для метань", "p": ["Перед метанням розігрівають плечовий суглоб, лікті та кисті, а також м'язи тулуба, бо кидок починається з ніг і тулуба, а закінчується рукою. Імітаційні вправи (кидок без м'яча, з гумовим джгутом) допомагають засвоїти рух без ризику.", "Метання виконують лише за командою вчителя, в одному напрямку, коли в секторі нікого немає."], "ul": ["Кругові рухи плечима й руками — розминка плечового суглоба.", "Імітація кидка: рука відводиться назад, потім — швидкий рух вперед-угору.", "Поворот тулуба додає силу кидку.", "Не метай назустріч одне одному.", "Йди по снаряд лише за командою."]}, {"h": "Волейбол. Подачі м'яча — верхня та нижня", "p": ["Щоб подача була стабільною, важливо однаково підкидати м'яч щоразу. Для нижньої подачі м'яч підкидають невисоко або тримають на долоні, для верхньої — над ударною рукою на висоту близько метра.", "Під час удару рука жорстка, удар виконують серединою долоні або її основою. Після подачі гравець одразу заходить на майданчик і займає своє місце."], "ul": ["Тренуй підкидання окремо від удару.", "Нижня подача — надійніша для початківців.", "Верхня подача — швидша, але вимагає точності.", "Після подачі швидко займи позицію.", "Типова помилка: удар пальцями замість долоні."]}, {"h": "Спорт заради розвитку. Контроль над емоціями, тривожність під час невдач", "p": ["У спорті невдачі неминучі: промах, програна партія, помилка на подачі. Важливо не ображатися на себе чи інших, а зробити висновок і рухатися далі. Тривожність буває корисною, бо мобілізує, але сильна тривога заважає думати й рухатися.", "Допомагають прості прийоми: глибоке повільне дихання, коротка фраза підтримки собі («Наступного разу вийде»), зосередження на наступній дії, а не на помилці."], "ul": ["Дихання «4–4»: вдих на 4 рахунки, видих на 4 рахунки.", "Помилка — це досвід, а не поразка.", "Зосередься на тому, що можеш змінити.", "Підтримуй партнера, який помилився.", "Після гри проаналізуй, що вдалося, а що варто покращити."]}], "f": "Багато спортсменів мають свої короткі ритуали перед подачею чи стартом — це допомагає заспокоїтися й зосередитися.", "pr": ["Напиши 3 фрази підтримки, які ти можеш сказати собі після невдачі на уроці чи змаганні.", "Виконай вправи для розвитку фізичних якостей: кругові рухи плечима (по 10 вперед і назад), імітація кидка без предмета (10 разів кожною рукою), присідання (2 підходи по 15)."], "q": ["Навіщо розминати плечовий суглоб перед метанням?", "Чим відрізняється підкидання м'яча для нижньої та верхньої подачі?", "Які прийоми допомагають заспокоїтися після невдачі?", "Чи може тривожність бути корисною? Поясни."]}, {"n": "10", "t": "Біг 30 м. Передача м'яча зверху за спину в парах. Проведення рухливих ігор", "g": "Учень знатиме техніку бігу на 30 м, передачі м'яча двома руками зверху за спину та правила організації рухливих ігор.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Біг на 30 м", "контрольна вправа для оцінювання швидкості, яку виконують з максимальною швидкістю."], ["Швидкісні якості", "здатність виконувати рухи за мінімальний час."], ["Передача за спину", "передача м'яча зверху назад, через голову, без розвороту до партнера."], ["Ведучий гри", "учасник, який пояснює правила, стежить за їх виконанням і починає гру."]], "th": [{"h": "Легка атлетика. Біг 30 м", "p": ["Біг на 30 метрів перевіряє швидкість. На такій короткій дистанції найважливіші старт і стартовий розгін: потрібно якомога швидше набрати максимальну швидкість. Стартують з низького або високого старту залежно від вимог.", "Біжать по прямій, не озираючись, з активною роботою рук і фінішують, пробігаючи лінію фінішу на повній швидкості."], "ul": ["Перед бігом — розминка та 2–3 короткі прискорення.", "Реагуй на команду «Руш!» якомога швидше.", "Перші кроки — короткі й часті, далі довжина кроку зростає.", "Дивись уперед, а не під ноги.", "Пробігай фініш, не гальмуючи перед ним."]}, {"h": "Волейбол. Передача м'яча двома руками зверху за спину в парах", "p": ["Передачу за спину використовують, щоб обманути суперника або передати м'яч гравцю позаду. Гравець виходить під м'яч, приймає його над головою, але спрямовує назад: прогинається в грудному відділі, а руки рухаються вгору-назад.", "У парах один партнер набрасує м'яч, другий стоїть до нього спиною на відстані 2–3 метрів і передає м'яч назад."], "ul": ["М'яч приймають трохи вище й ближче до чола, ніж при звичайній передачі.", "Рух рук — угору й назад.", "Прогин у спині помірний, без різких рухів.", "Не дивись назад під час передачі.", "Типова помилка: м'яч летить вертикально вгору замість назад."]}, {"h": "Спорт заради розвитку. Проведення рухливих ігор та інтерактивних вправ", "p": ["Організувати гру — це відповідальність. Ведучий має обрати гру з урахуванням віку та місця, чітко пояснити правила, показати межі майданчика, розподілити команди й стежити за безпекою.", "Інтерактивні вправи — це вправи, у яких учасники активно взаємодіють: передають, домовляються, міняються ролями."], "ul": ["Обери безпечне місце без перешкод.", "Поясни правила коротко й зрозуміло, перевір, чи всі зрозуміли.", "Ділі команди рівномірно за силами.", "Стеж, щоб усі брали участь, ніхто не залишався осторонь.", "Після гри підсумуй результати й подякуй учасникам."]}], "f": "Навіть у найкращих спринтерів реакція на стартовий сигнал займає частки секунди — швидше відреагувати людина фізично не може.", "pr": ["Опиши правила однієї рухливої гри, яку ти міг би провести з однокласниками: мета, кількість гравців, правила, безпека.", "Виконай вправи для розвитку фізичних якостей: біг на місці з високим підніманням стегна (3 рази по 15 секунд, на килимку, без стрибків), планка (3 рази по 30 секунд)."], "q": ["Що найважливіше в бігу на 30 метрів?", "Як виконують передачу м'яча зверху за спину?", "Які обов'язки має ведучий рухливої гри?", "Що таке інтерактивні вправи?"]}, {"n": "11", "t": "Метання м'ячів різного діаметра. Передача м'яча за спину в трійках. Ігри з парашутом", "g": "Учень знатиме техніку метання м'ячів різного діаметра на дальність, передачі за спину в трійках і правила ігор з ігровим парашутом.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Метання на дальність", "метання снаряда з метою кинути його якомога далі."], ["Кут вильоту", "кут, під яким снаряд вилітає з руки; від нього залежить дальність польоту."], ["Ігровий парашут", "велике кругле кольорове полотно з ручками, яке використовують для командних ігор."], ["Передача в трійках", "вправа, у якій троє гравців по черзі передають м'яч, змінюючи напрямок."]], "th": [{"h": "Легка атлетика. Метання м'ячів різного діаметра на дальність", "p": ["Малий м'яч метають однією рукою з-за голови, великий (наприклад, набивний) — двома руками з-за голови або від грудей. Дальність залежить від швидкості руки, участі ніг і тулуба та кута вильоту: м'яч має летіти вперед-угору, а не в землю чи прямо вгору.", "Перед кидком вага тіла на задній нозі, під час кидку переходить на передню, тулуб розвертається, рука «наздоганяє»."], "ul": ["Малий м'яч — хват пальцями, кидок однією рукою.", "Великий м'яч — двома руками, з участю ніг і тулуба.", "Кидай вперед-угору, а не вниз.", "Метай лише за командою, у визначеному напрямку.", "Типова помилка: кидок тільки рукою, без ніг і тулуба."]}, {"h": "Волейбол. Передача м'яча двома руками зверху за спину в трійках", "p": ["Гравці стоять на одній лінії: крайні дивляться на середнього. Середній гравець приймає м'яч від одного партнера і передає його за спину другому, потім розвертається, і вправа повторюється.", "Ця вправа вчить точно спрямовувати м'яч і швидко змінювати положення тіла."], "ul": ["Відстань між гравцями — 3–4 метри.", "Середній гравець виходить точно під м'яч.", "Після передачі за спину — швидкий розворот.", "Передачі виконують по високій дузі.", "Міняйтеся місцями, щоб кожен був у центрі."]}, {"h": "Спорт заради розвитку. Ігри та вправи з ігровим парашутом", "p": ["Ігровий парашут об'єднує всіх учасників: щоб виконати завдання, потрібно діяти синхронно. Учасники тримають полотно за ручки по колу й разом піднімають, опускають, хвилюють його.", "Популярні вправи: «Хвилі» (утворювати хвилі різної висоти), «Купол» (разом підняти парашут і швидко присісти під ним), «Обмін місцями» (за сигналом пробігти під парашутом), перекочування м'ячика по полотну."], "ul": ["Тримай парашут обома руками, не відпускай без команди.", "Рухайтеся разом, за сигналом ведучого.", "Під парашутом не біжи назустріч іншим.", "Ігри підходять для будь-якого рівня підготовки — це інклюзивна активність.", "Парашут вчить співпраці: успіх залежить від усіх."]}], "f": "Ігри з парашутом часто використовують для інклюзивних занять, бо в них можуть брати участь діти з різним рівнем фізичної підготовки.", "pr": ["Придумай власну гру або вправу з ігровим парашутом і опиши її правила.", "Для самовдосконалення виконай комплекс ранкової гімнастики з 6 вправ (нахили, повороти, присідання, махи руками, вправа на поставу, планка) і запиши, як почуваєшся після нього."], "q": ["Від чого залежить дальність метання?", "Як метають великий м'яч, а як малий?", "Як виконується передача за спину в трійках?", "Чого вчать ігри з ігровим парашутом?"]}, {"n": "12", "t": "Вправи для метань, біг 30 м. Рухлива гра. Естафети й руханки", "g": "Учень повторить техніку метань і бігу на 30 м, знатиме, як рухливі ігри розвивають фізичні якості, та як організовують естафети й руханки.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Естафета", "командне змагання, у якому учасники по черзі виконують завдання й передають естафету наступному."], ["Руханка", "коротка весела серія рухів, часто під музику, для бадьорості й гарного настрою."], ["Спритність", "здатність швидко й точно виконувати рухи та змінювати їх відповідно до ситуації."], ["Швидкість реакції", "час від появи сигналу до початку руху у відповідь на нього."]], "th": [{"h": "Легка атлетика. Вправи для метань. Біг 30 м", "p": ["Вправи для метань — кидки м'яча у стіну, імітація кидка, вправи для сили рук і тулуба — готують до основного метання. Правильний кидок — це «хвиля» руху від ніг до кисті.", "У бігу на 30 метрів відпрацьовують швидкий старт: реагуй на сигнал, перші кроки роби короткими й частими."], "ul": ["Кидок починається з ніг і тулуба.", "Лікоть веде руку під час кидка.", "На старті тулуб нахилений уперед.", "Руки працюють енергійно, але розслаблено.", "Розминка обов'язкова перед і метанням, і спринтом."]}, {"h": "Волейбол. Рухлива гра для розвитку фізичних якостей", "p": ["У волейболі потрібна швидка реакція на політ м'яча й рух суперника. Рухливі ігри на кшталт «Не дай м'ячу впасти» (група перебиває м'яч, не даючи йому торкнутися підлоги) чи «Мисливці й качки» розвивають реакцію, спритність і орієнтування.", "Ігри з елементами волейболу зручні для відпрацювання передач у невимушеній формі."], "ul": ["Тримай ігрову стійку: ноги зігнуті, вага на передній частині стоп.", "Стеж за м'ячем і партнерами одночасно.", "Реагуй на зміну ситуації якомога швидше.", "Не штовхайся, бережи себе й інших.", "Гра — це насамперед задоволення й тренування."]}, {"h": "Спорт заради розвитку. Елементи рухливих та спортивних ігор, естафет, руханок", "p": ["Естафети вчать відповідальності перед командою: кожен етап важливий. Руханки підіймають настрій і допомагають зібратися на початку уроку або в перерві.", "Під час естафет важливо чітко передавати естафету (предмет або дотик), не починати етап раніше і не заважати іншим командам."], "ul": ["Перед естафетою поясніть правила й порядок учасників.", "Передача естафети — лише за лінією.", "Вболівайте за свою команду й поважайте суперників.", "Руханка — 2–5 хвилин простих рухів.", "Включайте в естафети різні завдання: біг, ведення м'яча, вправи на влучність."]}], "f": "Естафетний біг є частиною програми Олімпійських ігор: команди з чотирьох бігунів передають естафетну паличку в спеціальній зоні.", "pr": ["Склади руханку з 6–8 рухів під улюблену пісню і запиши послідовність рухів.", "Для самовдосконалення виконай вправи для рук і тулуба: віджимання від стіни або підлоги (2 підходи по 10), «скручування» лежачи на спині (2 підходи по 12)."], "q": ["Чому кидок має починатися з ніг і тулуба?", "Як рухливі ігри допомагають волейболістам?", "Які правила потрібно дотримуватися під час естафет?", "Чим корисна руханка?"]}, {"n": "13", "t": "Вправи для метань, біг 30 м. Взаємодія ліній під час прийому подачі. Власні естафети", "g": "Учень знатиме, як гравці передньої й задньої ліній взаємодіють під час прийому подачі, та навчиться складати власні естафети й ігрові завдання.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Передня лінія", "три гравці волейбольної команди, які розташовані ближче до сітки і можуть атакувати й блокувати біля неї."], ["Задня лінія", "три гравці, що стоять далі від сітки й найчастіше приймають подачу."], ["Прийом подачі", "перша передача команди після подачі суперника."], ["Розстановка", "розташування гравців на майданчику в певному порядку."]], "th": [{"h": "Легка атлетика. Вправи для метань. Біг 30 м", "p": ["Для поліпшення результату в метанні корисно розвивати силу м'язів рук, плечей і тулуба, а також гнучкість плечового суглоба. Для бігу на 30 метрів — швидкість реакції та силу ніг.", "Тренування будуть ефективними, якщо виконувати вправи технічно правильно й чергувати навантаження з відпочинком."], "ul": ["Для метання: віджимання, вправи з гумовим джгутом, обертання руками.", "Для спринту: старти з різних положень, прискорення.", "Відпочинок між прискореннями — до повного відновлення дихання.", "Порівнюй власні результати з попередніми.", "Не тренуйся через біль."]}, {"h": "Волейбол. Взаємодія гравців передньої та задньої ліній під час прийому подачі", "p": ["Команда у волейболі має шість гравців: троє на передній лінії і троє на задній. Подачу найчастіше приймають гравці задньої лінії, а гравці передньої допомагають або готуються до атаки. Перша передача має бути спрямована до гравця, який робитиме другу передачу (пасувальника).", "Щоб не було зіткнень і «порожніх» зон, гравці заздалегідь домовляються, хто яку зону відповідає, і голосно кличуть м'яч."], "ul": ["Гравці задньої лінії приймають подачу передачею знизу.", "Гравці передньої лінії не заважають і готуються до атаки.", "Хто першим крикнув «Мій!» — той і приймає.", "Перша передача — вгору, до центру біля сітки.", "До подачі гравці повинні стояти у своїй розстановці."]}, {"h": "Спорт заради розвитку. Створення власних естафет та ігор", "p": ["Придумати свою естафету — творче завдання, що розвиває фантазію, лідерство й відповідальність. Добра естафета має зрозумілу мету, просте обладнання, однакові умови для команд і безпечні завдання.", "Після проведення варто запитати учасників, що їм сподобалося, і вдосконалити гру."], "ul": ["Визнач мету: швидкість, влучність, співпраця чи логіка.", "Обери безпечний інвентар: м'ячі, обручі, кеглі.", "Однакова кількість учасників у командах.", "Передбач правила на випадок порушень.", "Додай творчий елемент: загадку, пазл, рух під музику."]}], "f": "У волейболі розстановка гравців перед подачею суворо визначена, а гравці переходять за годинниковою стрілкою, коли команда отримує право подавати.", "pr": ["Склади власну естафету з трьох етапів, яку можна провести у спортзалі. Опиши інвентар і правила.", "Виконай вправи на спритність, безпечні вдома: підкинь і злови м'ячик або згорнуту шкарпетку однією рукою (20 разів кожною), переклади м'ячик з руки в руку навколо тулуба (10 кругів у кожен бік)."], "q": ["Скільки гравців на передній і задній лініях у волейболі?", "Хто найчастіше приймає подачу і куди спрямовує перший пас?", "Як гравці уникають зіткнень під час прийому?", "Що має бути в добре продуманій естафеті?"]}, {"n": "14", "t": "Метання малого м'яча з розбігу. Навчальна гра у волейбол. Танцювальні рухи", "g": "Учень знатиме техніку метання малого м'яча з розбігу, основні правила навчальної гри у волейбол і значення танцювальних рухів для розвитку.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Розбіг", "прискорення перед кидком або стрибком, яке додає швидкість."], ["Схресний крок", "крок у розбігу, коли права і ліва ноги перехрещуються для підготовки до кидка."], ["Навчальна гра", "гра за спрощеними або основними правилами для закріплення вивчених прийомів."], ["Ритм", "чергування рухів і пауз з певною швидкістю й акцентами."]], "th": [{"h": "Легка атлетика. Метання малого м'яча на дальність з розбігу", "p": ["Метання з розбігу складається з розбігу, підготовки до кидка (відведення руки назад і схресний крок), фінального зусилля та гальмування. Розбіг невеликий, головне — не втратити швидкість у момент кидка.", "Під час фінального зусилля ліва нога (для правші) ставиться вперед і впирається, тіло «хлистом» передає силу від ніг до руки."], "ul": ["Розбіг — рівномірний, з поступовим прискоренням.", "За кілька кроків до кидка відведи руку з м'ячем назад.", "Схресний крок дозволяє розвернути тулуб.", "Не заступай за лінію метання.", "Метай лише за командою та в безпечному напрямку."]}, {"h": "Волейбол. Навчальна гра з елементами волейболу", "p": ["У навчальній грі закріплюють подачу, передачі й прийом. Мета гри — приземлити м'яч на боці суперника або змусити його помилитися. Команда може торкнутися м'яча не більше трьох разів, один гравець не може торкатися м'яча двічі поспіль (окрім торкання на блоці).", "Гра може йти за спрощеними правилами: наприклад, дозволяють ловити першу подачу або грати на меншому майданчику."], "ul": ["Очко отримує команда, що виграла розіграш.", "М'яч, що впав на лінію, вважається в майданчику.", "Не можна торкатися сітки й переступати центральну лінію.", "Гравці переходять по колу після виграшу права подачі.", "Поважайте суддю й суперників."]}, {"h": "Спорт заради розвитку. Танцювальні рухи різних стилів", "p": ["Танець — це теж фізична активність, яка розвиває координацію, почуття ритму, гнучкість і витривалість. Він допомагає самовиражатися й створює гарний настрій.", "Існують різні стилі: народні танці, хіп-хоп, сучасні та бальні. Кожен стиль має свої характерні рухи."], "ul": ["Народний танець — плавні рухи рук, притупи, кружляння.", "Хіп-хоп — пружні рухи, акценти під біт.", "Сучасний танець — вільні рухи, поєднання різних елементів.", "Танці розвивають координацію та пам'ять.", "Почни з розминки, щоб не травмуватися."]}], "f": "Український гопак уважається одним із найвідоміших народних танців світу і вимагає від виконавців неабиякої сили та спритності.", "pr": ["Обери один стиль танцю й опиши 3–4 його характерні рухи.", "Виконай вправи на координацію рухів: «дзеркальні» рухи руками (права вгору — ліва вбік, 10 разів), крок уперед-назад під рахунок «1–2–3–4» (2 хвилини)."], "q": ["З яких частин складається метання м'яча з розбігу?", "Навіщо потрібен схресний крок?", "Які основні правила навчальної гри у волейбол?", "Які фізичні якості розвивають танці?"]}, {"n": "15", "t": "Багатоскоки, біг 60 м. Підвідні вправи для нападаючого удару. Танцювальні комбінації", "g": "Учень знатиме техніку багатоскоків і бігу на 60 м, підготовчі вправи для нападаючого удару та як поєднувати танцювальні рухи в комбінацію.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Багатоскоки", "серія стрибків з ноги на ногу з максимальною довжиною кожного кроку."], ["Нападаючий удар", "удар по м'ячу однією рукою у стрибку з метою перебити його на бік суперника."], ["Підвідні вправи", "вправи, які поступово готують до вивчення складного руху."], ["Танцювальна комбінація", "кілька танцювальних рухів, поєднаних у певній послідовності."]], "th": [{"h": "Легка атлетика. Багатоскоки. Біг 60 м", "p": ["Багатоскоки — серія стрибків з ноги на ногу, у яких кожен поштовх сильний, а махова нога виноситься високо вперед. Вони розвивають силу і стрибучість. Виконуються після розминки на м'якій нековзкій поверхні, на коротких відрізках.", "Біг на 60 метрів — спринтерська дистанція. Після швидкого старту важливо втримати максимальну швидкість до фінішу."], "ul": ["Поштовх — енергійний, з повним випрямленням ноги.", "Махова нога піднімається стегном уперед.", "Руки допомагають махом.", "Біг на 60 м: старт, розгін, біг по дистанції, фініш.", "Не напружуй плечі й обличчя під час спринту."]}, {"h": "Волейбол. Підвідні вправи для нападаючого удару", "p": ["Нападаючий удар — найефективніший спосіб виграти очко. Він складається з розбігу (2–3 кроки), стрибка, удару по м'ячу та приземлення. Спочатку вчаться елементам окремо: розбігу зі стрибком, замаху й удару рукою по м'ячу на місці.", "Підвідні вправи: удари по м'ячу в стіну, імітація замаху, стрибки з розбігу до сітки без м'яча."], "ul": ["Удар виконують відкритою долонею, по верхній частині м'яча.", "Замах — рука зігнута над головою, лікоть високо.", "Стрибок — з двох ніг, після розбігу.", "Приземлення — на обидві ноги, м'яко.", "Не торкайся сітки під час удару."]}, {"h": "Спорт заради розвитку. Вивчення танцювальних рухів і поєднання їх у комбінації", "p": ["Щоб скласти танцювальну комбінацію, спочатку вивчають окремі рухи, а потім поєднують їх у послідовність під рахунок «вісімками» (8 рахунків). Корисно повторювати комбінацію повільно, а потім пришвидшувати під музику.", "Спільне виконання комбінації в групі вчить синхронності й взаємопідтримки."], "ul": ["Вивчай рухи по одному.", "Рахуй під музику «вісімками».", "Поєднуй рухи плавно, без пауз.", "Повторюй комбінацію кілька разів, поступово пришвидшуючись.", "Грайте в «дзеркало» — повторюйте рухи партнера."]}], "f": "У танцях і аеробіці рахунок «вісімками» зручний тому, що більшість популярної музики складається з музичних фраз по 8 долей.", "pr": ["Склади танцювальну комбінацію з 4 рухів на 2 «вісімки» та запиши її (рух і кількість рахунків).", "Виконай вправи для розвитку фізичних якостей: присідання (3 підходи по 15), випади на місці (по 10 на кожну ногу), планка (3 рази по 30 секунд)."], "q": ["Що таке багатоскоки і для чого їх виконують?", "З яких фаз складається нападаючий удар?", "Навіщо потрібні підвідні вправи?", "Як скласти танцювальну комбінацію?"]}, {"n": "16", "t": "Стрибок у висоту «переступанням». Нападаючий удар з підкидання. Фітнес-технології", "g": "Учень знатиме техніку стрибка у висоту способом «переступання», виконання нападаючого удару з власного підкидання та сучасні фітнес-технології.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Стрибок «переступанням»", "стрибок у висоту, під час якого спортсмен переходить через планку боком, почергово переносячи ноги."], ["Поштовхова нога", "нога, якою спортсмен відштовхується під час стрибка."], ["Планка", "горизонтальна перекладина, через яку стрибають у висоту."], ["Фітнес-технології", "сучасні системи фізичних вправ для зміцнення здоров'я і гарного самопочуття."]], "th": [{"h": "Легка атлетика. Стрибки у висоту з розбігу способом «переступання»", "p": ["Розбіг виконують під кутом 30–45° до планки, з боку махової ноги. Поштовх виконують дальньою від планки ногою, а махову ногу піднімають прямою вгору над планкою. Потім поштовхову ногу переносять через планку, тіло проходить боком.", "Приземлюються на махову ногу, а потім на поштовхову, лише на м'які мати або в яму з піском."], "ul": ["Розбіг — 5–7 кроків, під кутом до планки.", "Поштовх — дальньою від планки ногою.", "Мах — прямою ногою вгору.", "Почергове перенесення ніг через планку.", "Стрибай лише за наявності мата та під наглядом учителя."]}, {"h": "Волейбол. Нападаючий удар з власного підкидання", "p": ["Щоб навчитися удару, спочатку виконують його без стрибка: гравець підкидає м'яч перед собою трохи вище голови і б'є по ньому відкритою долонею зверху-вниз. Згодом додають стрибок.", "Рух нагадує кидок: лікоть угорі, рука, наче «хлист», випрямляється, кисть наприкінці «накриває» м'яч, щоб він полетів униз."], "ul": ["Підкидання — точне, перед ударним плечем.", "Удар — у найвищій точці досяжності руки.", "Кисть «накриває» м'яч зверху.", "Вправу виконують у стіну або через сітку партнеру.", "Типова помилка: удар кулаком або прямою рукою без замаху."]}, {"h": "Спорт заради розвитку. Сучасні фітнес-технології", "p": ["Фітнес — це заняття фізичними вправами для здоров'я, гарного самопочуття та фігури. Сучасні фітнес-технології — це, наприклад, аеробіка, степ-аеробіка, пілатес, йога, функціональний тренінг, стретчинг.", "Багато видів фітнесу можна виконувати вдома з мінімальним обладнанням, головне — підібрати навантаження відповідно до свого рівня."], "ul": ["Аеробіка — ритмічні рухи під музику для серця й витривалості.", "Пілатес — вправи на силу м'язів кору та правильну поставу.", "Стретчинг — вправи на розтягування для гнучкості.", "Функціональний тренінг — вправи, схожі на рухи в повсякденному житті.", "Підліткам краще займатися з вагою власного тіла."]}], "f": "Пілатес отримав назву від прізвища свого засновника — Джозефа Пілатеса, який розробив цю систему вправ у XX столітті.", "pr": ["Обери одну сучасну фітнес-технологію та опиши, для кого вона підходить і що розвиває.", "Виконай вправи для розвитку фізичних якостей: махи прямою ногою вперед біля опори (по 10 кожною), «скручування» (2 підходи по 12), «ластівка» на одній нозі (по 10 секунд)."], "q": ["Як виконують розбіг у стрибку способом «переступання»?", "Як правильно виконати нападаючий удар з власного підкидання?", "Назви три сучасні фітнес-технології.", "Що розвиває стретчинг?"]}, {"n": "17", "t": "Стрибок «зігнувши ноги». Передача через сітку, прийом від сітки. Ігри для відпочинку", "g": "Учень знатиме техніку стрибка у довжину з розбігу способом «зігнувши ноги», повторить передачі й прийом м'яча від сітки та дізнається, як спорт допомагає активно відпочивати.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Стрибок «зігнувши ноги»", "спосіб стрибка у довжину з розбігу, коли в польоті поштовхову ногу підтягують до махової і обидві зігнуті ноги виносять уперед."], ["Брусок для відштовхування", "біла дошка біля ями з піском, з якої виконують поштовх у стрибку в довжину."], ["Заступ", "порушення, коли спортсмен наступив за лінію бруска; спроба не зараховується."], ["Активний відпочинок", "відновлення сил за допомогою легкої рухової діяльності."]], "th": [{"h": "Легка атлетика. Стрибки у довжину з розбігу способом «зігнувши ноги»", "p": ["Стрибок складається з розбігу, поштовху, польоту та приземлення. Розбіг має бути рівномірно прискореним, щоб останні кроки були найшвидшими. Поштовх виконують однією ногою з бруска, махову ногу виносять зігнутою вперед-угору.", "У польоті поштовхову ногу підтягують до махової, тіло «групується», а перед приземленням ноги виносять уперед. Приземлюються в пісок, згинаючи коліна та подаючи тіло вперед."], "ul": ["Розбіг — однакової довжини в кожній спробі.", "Не дивись на брусок під час розбігу — це гальмує.", "Поштовх — швидкий, з випрямленням ноги.", "Приземлення — на обидві ноги, тіло вперед.", "Стрибай лише в розпушений пісок."]}, {"h": "Волейбол. Передача зверху через сітку в парах. Прийом м'яча від сітки", "p": ["Ці два прийоми поєднують, щоб навчитися грати в реальних ситуаціях: передача може влучити в сітку, і тоді партнер має прийняти м'яч після відскоку. Головне — швидко оцінити траєкторію і зайняти правильну позицію.", "Передачу зверху виконують точно, по дузі, вище сітки, щоб м'яч не зачепив її."], "ul": ["Передача зверху — пальцями, з поштовхом ніг.", "Прийом від сітки — передачею знизу, у низькій стійці.", "Стеж за м'ячем увесь час.", "Після кожного прийому повертайся в ігрову стійку.", "Міняйтеся ролями з партнером."]}, {"h": "Спорт заради розвитку. Спорт та рухливі ігри для активного відпочинку", "p": ["Активний відпочинок — це прогулянки, велосипед, ігри на свіжому повітрі, туризм, плавання. Він краще відновлює сили, ніж лежання на дивані, особливо після тривалого сидіння за партою чи комп'ютером.", "Рухливі ігри у дворі чи парку — чудовий спосіб провести час з друзями й родиною."], "ul": ["Гуляй на свіжому повітрі щодня.", "Чергуй розумову роботу з руховими перервами.", "Обирай ігри, у які можуть грати всі охочі.", "Дбай про безпеку: місце без машин і перешкод.", "Активний відпочинок покращує сон і настрій."]}], "f": "Брусок для відштовхування в стрибках у довжину традиційно білого кольору, а поряд іноді розміщують смугу з пластиліну, щоб суддям було видно заступ.", "pr": ["Намалюй схему стрибка у довжину з розбігу способом «зігнувши ноги» з підписами чотирьох фаз.", "Виконай комплекс загальної фізичної підготовки: присідання (3×15), віджимання від підлоги або стіни (3×10), планка (3×30 секунд), «човник» лежачи на животі (3×10 секунд)."], "q": ["З яких фаз складається стрибок у довжину з розбігу?", "Що відбувається з ногами в польоті у способі «зігнувши ноги»?", "Як прийняти м'яч, що відскочив від сітки?", "Чим активний відпочинок корисніший за пасивний?"]}, {"n": "18", "t": "Повторний біг 2×200 м. Нападаючий удар. Рухливі ігри для активного відпочинку", "g": "Учень знатиме, що таке повторний біг і як його виконувати, удосконалить знання техніки нападаючого удару та навчиться обирати ігри для активного відпочинку.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Повторний біг", "метод тренування, коли дистанцію пробігають кілька разів з відпочинком між повтореннями."], ["Інтервал відпочинку", "час між повтореннями вправи, потрібний для часткового відновлення."], ["Швидкісна витривалість", "здатність довго підтримувати високу швидкість."], ["Розбіг для удару", "2–3 кроки до сітки перед стрибком для нападаючого удару."]], "th": [{"h": "Легка атлетика. Повторний біг 2×200 м", "p": ["Повторний біг 2×200 м означає, що дистанцію 200 метрів пробігають двічі з відпочинком між забігами. Такий біг розвиває швидкісну витривалість — здатність довго бігти швидко.", "Важливо правильно розподілити сили: не вкладати все в перші 50 метрів, а тримати високий, але рівний темп. Під час відпочинку ходять, а не сидять, і відновлюють дихання."], "ul": ["Перед бігом — розминка та бігові вправи.", "Темп — високий, але рівний на всій дистанції.", "Відпочинок — у ходьбі, до відновлення дихання.", "Друга спроба має бути не набагато повільнішою за першу.", "При запамороченні — зупинитися й повідомити вчителя."]}, {"h": "Волейбол. Підвідні вправи для нападаючого удару, удар з власного підкидання", "p": ["Розбіг для удару зазвичай складається з 2–3 кроків, останній крок — найширший, з постановкою обох ніг для стрибка. Руки під час розбігу відводяться назад, а під час стрибка — махом угору.", "Поєднуючи розбіг, стрибок і удар з власного підкидання, гравець поступово переходить до справжнього нападаючого удару після передачі партнера."], "ul": ["Останній крок розбігу — широкий, з п'ятки на носок.", "Мах обома руками вгору допомагає стрибнути вище.", "Удар — у найвищій точці стрибка.", "Приземлення — на дві ноги, коліна зігнуті.", "Повторюй кожен елемент окремо, а потім разом."]}, {"h": "Спорт заради розвитку. Рухливі ігри для активного відпочинку", "p": ["Для відпочинку на природі чи у дворі підходять ігри, які не потребують складного інвентарю: «Квач», «Хованки», «Вибивний», бадмінтон, фрізбі, ігри з м'ячем. Вони об'єднують і дорослих, і дітей.", "Головне правило ігор для відпочинку — радість і безпека, а не перемога за будь-яку ціну."], "ul": ["Підбирай гру відповідно до кількості учасників.", "Враховуй вік і можливості всіх гравців.", "Обирай безпечне місце.", "Пий воду й робіть перерви.", "Запрошуй до гри тих, хто стоїть осторонь."]}], "f": "Дистанція 200 метрів на стадіоні включає поворот, тому спринтерам доводиться бігти по віражу, нахиляючи тіло всередину.", "pr": ["Склади список із 5 ігор для активного відпочинку з родиною та коротко опиши одну з них.", "Виконай комплекс загальної фізичної підготовки: підйоми на носки (3×20), присідання (3×15), «скручування» (3×12), розтяжка ніг і спини (5 хвилин)."], "q": ["Що означає запис «2×200 м»?", "Яку фізичну якість розвиває повторний біг?", "Скільки кроків зазвичай має розбіг для нападаючого удару?", "Яке головне правило ігор для відпочинку?"]}, {"n": "19", "t": "Стрибок «зігнувши ноги». Одиночне блокування. Спорт для відпочинку", "g": "Учень удосконалить знання техніки стрибка у довжину способом «зігнувши ноги» та знатиме, як виконувати одиночне блокування нападаючого удару у волейболі.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Блокування", "захисна дія гравців передньої лінії біля сітки, щоб перешкодити атакуючому удару суперника."], ["Одиночний блок", "блокування, яке виконує один гравець."], ["Розбіг у стрибках", "прискорення перед поштовхом, від якого залежить швидкість і дальність стрибка."], ["Контрольна позначка", "мітка на доріжці, яка допомагає точно потрапляти на брусок."]], "th": [{"h": "Легка атлетика. Стрибки з розбігу способом «зігнувши ноги»", "p": ["Щоб стрибок був успішним, потрібно точно потрапити на брусок. Для цього вимірюють розбіг кроками і ставлять контрольну позначку. Розбіг починають завжди з тієї самої ноги.", "Найпоширеніші помилки — гальмування перед бруском, низький поштовх і приземлення назад. Їх виправляють спеціальними вправами: стрибки з короткого розбігу, стрибки через низьку перешкоду в яму."], "ul": ["Відміряй свій розбіг і запам'ятай його.", "Останні кроки — найшвидші.", "Поштовх — вперед-угору, а не лише вгору.", "Приземлення — тіло подається вперед.", "Після спроби виходь з ями вперед або вбік, не назад."]}, {"h": "Волейбол. Одиночне блокування нападаючого удару", "p": ["Блок виконують гравці передньої лінії. Гравець стоїть біля сітки, руки на рівні плечей, ноги на ширині плечей. Побачивши, куди бігтиме нападник, він переміщується, вистрибує вгору і виносить прямі руки над сіткою, щоб «закрити» м'яч.", "Пальці розставлені, кисті напружені, руки близько одна до одної, щоб м'яч не пройшов між ними."], "ul": ["Стрибай трохи пізніше за нападника.", "Руки виносять над сіткою вперед, на бік суперника.", "Не торкайся сітки під час блоку.", "Блокувати можуть лише гравці передньої лінії.", "Приземлюйся на обидві ноги на своєму боці."]}, {"h": "Спорт заради розвитку. Спорт для активного відпочинку", "p": ["Активний відпочинок може бути не лише ігровим, а й спортивним: катання на велосипеді, роликах, ковзанах, похід, плавання. Перш ніж займатися, варто подбати про захисне спорядження.", "Сімейні спортивні вихідні зміцнюють здоров'я та стосунки в родині."], "ul": ["Велосипед і ролики — тільки в шоломі й захисті.", "Плавати — лише в дозволених місцях під наглядом дорослих.", "Похід — з водою, аптечкою, зручним взуттям.", "Плануй навантаження відповідно до своїх сил.", "Залучай до активностей родину й друзів."]}], "f": "У волейболі блок на подачу суперника заборонений — подачу потрібно прийняти.", "pr": ["Опиши в зошиті, як правильно виконувати одиночний блок, і назви три помилки, яких слід уникати.", "Виконай комплекс загальної фізичної підготовки: присідання біля стіни «стільчик» (3×30 секунд), віджимання (3×10), «місток» лежачи на спині — підйом таза (3×12)."], "q": ["Як ставлять контрольну позначку для розбігу?", "Хто має право блокувати у волейболі?", "Як мають бути розташовані руки під час блоку?", "Яке спорядження потрібне для катання на роликах?"]}, {"n": "20", "t": "Метання малого м'яча з розбігу. Передача зверху через сітку. Ігри на свіжому повітрі", "g": "Учень закріпить знання техніки метання малого м'яча з розбігу та передачі зверху через сітку, дізнається про користь ігор на свіжому повітрі.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Фінальне зусилля", "найважливіша частина метання, коли сила ніг і тулуба передається на руку і снаряд."], ["Гальмування", "зупинка після кидка, щоб не
