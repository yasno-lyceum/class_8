поєднує кидки зверху, збоку й знизу, змінює силу і напрямок. Так суперникові важче ухилитися. Можна також робити обманний замах, а кидати іншим способом.", "Під час гри стеж за власною безпекою і безпекою інших."], "ul": ["Чергуй кидки зверху, збоку, знизу.", "Обманний замах — для неочікуваності.", "Цілься в тулуб і ноги.", "Слідкуй за кількома суперниками.", "Грай чесно."]}, {"h": "Аеробіка. Флешмоб. Діагностувальна робота (ГР1)", "p": ["Діагностувальна робота за групою результатів ГР1 перевіряє, чого ти навчився за чверть; конкретні завдання та критерії повідомить учитель. Найчастіше оцінюють техніку виконання вправ, узгодженість рухів із музикою та дотримання правил безпеки.", "Щоб підготуватися, повтори базові кроки, свою комбінацію та правила ігор. Оціни себе: чи виконуєш рухи чітко, у ритмі, без помилок."], "ul": ["Повтори базові й додаткові кроки.", "Відрепетируй свою частину флешмобу.", "Перевір синхронність з музикою.", "Оцінюй себе: техніка, ритм, впевненість.", "Зверни увагу на поставу під час виконання."]}], "f": "", "pr": ["Склади для себе чек-лист підготовки до діагностувальної роботи: 5 пунктів, які потрібно повторити (вправи, кроки, правила).", "Виконай присідання та напівприсідання: присідання (3×12), напівприсідання з утриманням 5 секунд (3×10), комбінація аеробіки з 4 кроків (2 повтори)."], "q": ["Які навички застосовують у навчальній грі в петанк?", "Навіщо поєднувати різні кидки в доджболі?", "Як підготуватися до діагностувальної роботи за групою ГР1?", "Як підготуватися до виконання флешмобу?"]}, {"n": "47", "t": "Навчальна гра в петанк. Кидок з підкидання й відскоку. Програма аеробіки. Діагностика ГР2", "g": "Учень знатиме техніку кидка м'яча з власного підкидання й після відскоку від підлоги, закріпить знання петанку й аеробіки та підготується до діагностувальної роботи за групою ГР2.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Кидок після відскоку", "кидок, коли м'яч спочатку ударяють об підлогу, а потім ловлять і кидають або він відскакує в ціль."], ["Кидок з власного підкидання", "кидок м'яча після того, як гравець сам підкинув і спіймав або вдарив його."], ["Критерії оцінювання", "ознаки, за якими визначають, наскільки добре виконано завдання."], ["Самооцінювання", "перевірка своїх знань і вмінь за певними критеріями."]], "th": [{"h": "Петанк. Навчальна гра", "p": ["У навчальній грі закріплюють тактичні рішення: коли підкладати кулю, а коли вибивати; куди кинути кошонет; як використати рельєф майданчика.", "Гра — гарна нагода перевірити, наскільки добре ти знаєш правила і вмієш підраховувати очки."], "ul": ["Пам'ятай черговість кидків.", "Обирай тактику відповідно до ситуації.", "Враховуй рельєф майданчика.", "Підраховуй очки чесно.", "Поважай суперника."]}, {"h": "Доджбол. Кидок з власного підкидання та після удару в підлогу", "p": ["Кидок з власного підкидання розвиває координацію: гравець підкидає м'яч, ловить і одразу кидає в ціль. Кидок після удару в підлогу дозволяє змінити траєкторію м'яча, щоб він підлетів до ніг суперника знизу.", "Ці вправи вчать контролювати м'яч і передбачати його відскок."], "ul": ["Підкидання — невисоке й точне.", "Швидкий перехід від ловіння до кидка.", "Удар у підлогу — під кутом, щоб м'яч відскочив до цілі.", "Тренуй на різних відстанях.", "Уважно стеж за траєкторією."]}, {"h": "Аеробіка. Показова програма. Діагностувальна робота (ГР2)", "p": ["Діагностувальна робота за групою результатів ГР2 — ще один етап перевірки вивченого за чверть; її завдання та критерії оцінювання повідомить учитель. Корисно бути готовим відповісти на питання про правила безпеки, вплив аеробіки на організм, структуру заняття, термінологію, правила петанку і доджболу.", "Готуючись, повтори конспекти чверті, складай короткі відповіді на питання та перевір себе за допомогою тестів наприкінці уроків."], "ul": ["Повтори правила безпеки трьох модулів.", "Знай структуру заняття з аеробіки.", "Пам'ятай терміни: Low/High impact, базові кроки.", "Повтори правила петанку і доджболу.", "Перевір себе тестами після уроків."]}], "f": "", "pr": ["Склади 6 питань для самоперевірки за темами чверті (по 2 з петанку, доджболу та аеробіки) і дай на них відповіді.", "Виконай вправи з м'ячем: перекидання м'яча з руки в руку (1 хвилина), підкидання невисоко й ловіння двома руками (20 разів), передача м'яча навколо тулуба (10 кругів у кожен бік)."], "q": ["Як виконують кидок після удару м'ячем у підлогу?", "Навіщо тренувати кидок з власного підкидання?", "Які теми чверті варто повторити перед діагностувальною роботою?", "Які тактичні рішення ухвалюють у петанку?"]}, {"n": "48", "t": "Підсумковий урок ІІ чверті: петанк, доджбол, аеробіка. Діагностувальна робота (ГР3)", "g": "Учень повторить основні знання з петанку, доджболу та аеробіки, підсумує вивчене і підготується до діагностувальної роботи за групою ГР3.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Пошукові завдання", "творчі завдання, у яких учні самостійно шукають цікаві факти й приклади та діляться ними з класом."], ["Квест", "гра-пошук із послідовністю завдань, які потрібно виконати, щоб досягти фінальної мети."], ["Ключові компетентності", "знання й уміння, потрібні людині в житті: спілкування, співпраця, турбота про здоров'я, ініціативність."], ["Рефлексія", "аналіз власних дій і результатів для подальшого вдосконалення."]], "th": [{"h": "Петанк. Підсумок", "p": ["Ти дізнався про походження петанку, правила гри, формати (тет-а-тет, дуплет, тріплет), стійки й захват кулі, кидок кошонета, стратегію пойнтингу й стрільби. На уроках ти також грав у народні рухливі ігри, що розвивають рівновагу, спритність і увагу.", "Петанк вчить зосередженості, точності й тактичного мислення."], "ul": ["Мета — покласти кулю ближче до кошонета.", "Кидок — із кола, ноги разом.", "Гра до 13 очок.", "Пойнтер підкладає, стрілок вибиває.", "Безпека: не стояти перед тим, хто кидає."]}, {"h": "Доджбол. Підсумок", "p": ["Ти вивчив правила доджболу, кидки зверху, збоку і знизу, кидки після підкидання і відскоку, ловіння, ухилення, розташування гравців і командну взаємодію.", "Доджбол розвиває реакцію, спритність, влучність і вміння діяти в команді."], "ul": ["Влучили — вибуваєш, спіймав — вибуває той, хто кидав.", "Кидки в голову заборонені.", "Розосередженість на майданчику.", "Командна атака кількома м'ячами.", "Чесна гра й повага до суперника."]}, {"h": "Аеробіка. Підсумок. Ігри, квести, флешмоби, челенджі", "p": ["Ти ознайомився з історією аеробіки, її впливом на організм, термінологією, базовими й додатковими кроками, рухами руками, вправами Low, Middle та High impact, структурою заняття, методами побудови комбінацій і створенням флешмобу.", "Діагностувальна робота за групою результатів ГР3 завершує перевірку вивченого за чверть; її завдання повідомить учитель. Пошукові завдання, квести, флешмоби й челенджі допомагають показати не лише вміння, а й ініціативу, співпрацю та турботу про здоров'я."], "ul": ["Заняття: розминка, основна частина, заминка.", "Базові кроки: марш, степ-тач, ві-степ, грейпвайн, мамбо.", "Безпека: без заборонених вправ і перерозгинань.", "Флешмоб — синхронність і доступність рухів.", "Рефлексія: що вдалося і що покращити."]}], "f": "", "pr": ["Придумай спортивний квест для класу з 4 завдань (по одному з петанку, доджболу, аеробіки та одне творче) і опиши його правила.", "Для самовдосконалення виконай свою комбінацію аеробіки під музику, а потім запиши рефлексію: що вдалося найкраще за чверть і над чим ти хочеш попрацювати."], "q": ["Які основні правила гри в петанк?", "Назви види кидків у доджболі.", "З яких частин складається заняття з аеробіки?", "Що нового ти дізнався за чверть і що хочеш удосконалити?"]}]}, {"name": "ІІІ чверть. Здоровий спосіб життя, баскетбол, гандбол", "lessons": [{"n": "49", "t": "Безпека на уроках ІІІ чверті. Знайомство зі здоровим способом життя, баскетболом і гандболом", "g": "Учень знатиме правила безпеки на заняттях і розумітиме, що вивчатиме в модулях «Здоровий спосіб життя», «Баскетбол» і «Гандбол».", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Інструктаж з безпеки", "пояснення правил поведінки, які допомагають уникнути травм під час занять."], ["Розминка", "комплекс вправ, що готує м’язи, суглоби й серце до основного навантаження."], ["Спортивна форма", "зручний одяг і взуття, які не заважають рухам і захищають від травм."], ["Модуль", "окремий розділ навчальної програми, присвячений одному виду рухової активності."]], "th": [{"h": "Здоровий спосіб життя. Безпека на заняттях і вдома", "p": ["Цієї чверті ми вивчатимемо три модулі: здоровий спосіб життя, баскетбол і гандбол. Перш ніж починати будь-які вправи, важливо знати правила безпеки. Вони діють і в спортзалі, і вдома, коли ти займаєшся самостійно.", "Більшість травм стається через поспіх, відсутність розминки, невідповідне взуття або неуважність. Тому спокійна підготовка до заняття — це вже половина успіху."], "ul": ["Займайся у зручному спортивному одязі та взутті з неслизькою підошвою.", "Звільни місце для вправ: прибери стільці, іграшки, дроти.", "Знімай прикраси, годинник, шпильки, що можуть травмувати.", "Обов’язково починай з розминки 5–7 хвилин.", "Якщо з’явився біль, запаморочення чи нудота — зупинись і скажи дорослим.", "Пий воду невеликими ковтками, провітрюй кімнату."]}, {"h": "Баскетбол. Що ми вивчатимемо і як грати безпечно", "p": ["Баскетбол — командна гра з м’ячем, у якій потрібно закинути м’яч у кошик суперника. У цьому модулі ми повторимо ведення, передачі, кидки та вивчимо командні дії в нападі й захисті.", "Баскетбол — швидка гра з частими зупинками й стрибками, тому особливо важливо берегти гомілковостопні суглоби й пальці рук."], "ul": ["Ловлячи м’яч, тримай пальці розслабленими й трохи розведеними.", "Приземляйся після стрибка м’яко, на обидві ноги, згинаючи коліна.", "Не штовхай і не тримай суперника руками.", "Не вішайся на кошик і не підтягуйся на щиті.", "Під час кидків іншими гравцями не стій під кошиком без потреби."]}, {"h": "Гандбол. Що ми вивчатимемо і як грати безпечно", "p": ["Гандбол — командна гра, у якій м’яч передають і кидають руками, щоб влучити у ворота суперника. Ми вивчатимемо пересування, ловіння й передачі, кидки по воротах, гру воротаря та основні правила.", "У гандболі багато контакту й сильних кидків, тому треба стежити за руками, кистями та поведінкою біля воріт."], "ul": ["Не кидай м’яч у голову гравцю чи воротарю.", "Не заходь у зону воротаря, якщо ти польовий гравець.", "Виконуй кидки лише за командою вчителя, коли перед воротами нікого немає.", "Розминай кисті, плечі та лікті перед кидками.", "Поважай суперника: гра має бути чесною."]}], "f": "У гандбол і баскетбол грають руками, але в гандболі м’яч кидають у ворота, а в баскетболі — у кошик, що висить на висоті 3,05 м.", "pr": ["Повтори правила безпеки на уроках фізичної культури та запиши 5 найважливіших для занять удома.", "Склади й виконай власну розминку з 6–8 вправ (нахили голови, оберти руками, нахили тулуба, присідання, оберти стопами)."], "q": ["Чому перед заняттям обов’язково потрібна розминка?", "Які правила безпеки важливі в баскетболі?", "Чого не можна робити біля воріт у гандболі?", "Що робити, якщо під час вправ з’явився біль?"]}, {"n": "50", "t": "Що таке ЗСЖ, «Активні парки». Ведення без зорового контролю. Загальні вправи гандболіста", "g": "Учень пояснюватиме, що таке здоровий спосіб життя, знатиме про проєкт «Активні парки», ведення м’яча без зорового контролю та загальні вправи гандболіста.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Здоровий спосіб життя", "щоденна поведінка людини, що зберігає і зміцнює її фізичне, психічне й соціальне здоров’я."], ["Активні парки", "національний проєкт, який створює в парках і громадських просторах умови для безкоштовних занять руховою активністю."], ["Асинхронне ведення", "ведення м’яча, коли рухи руки не збігаються з ритмом кроків, наприклад з різною частотою ударів."], ["Зоровий контроль", "спостереження очима за м’ячем; досвідчений гравець веде м’яч, дивлячись на поле, а не на м’яч."]], "th": [{"h": "Здоровий спосіб життя. Що це таке і як нам допомагають «Активні парки»", "p": ["Здоровий спосіб життя (ЗСЖ) — це не одна дія, а щоденні звички: достатній сон, рух, корисна їжа, гігієна, уміння відпочивати й відмова від шкідливих звичок. Здоров’я буває фізичним (тіло), психічним (настрій, емоції) і соціальним (стосунки з людьми).", "«Активні парки — локації здорової України» — національний проєкт, що облаштовує в парках і громадських місцях майданчики та розміщує розклади безкоштовних тренувань для всіх охочих. Це зручна нагода рухатися на свіжому повітрі разом з родиною чи друзями."], "ul": ["Спи 8–10 годин на добу.", "Рухайся щонайменше годину щодня.", "Їж різноманітно: овочі, фрукти, каші, білкові продукти.", "Обмежуй час перед екраном.", "Знайди у своїй громаді місце для активного відпочинку."]}, {"h": "Баскетбол. Пересування, зупинки, стійки та ведення без зорового контролю", "p": ["У баскетболі гравець постійно поєднує біг, зупинки, повороти й стійки з веденням, передачами та кидками. Основна стійка: ноги на ширині плечей, коліна зігнуті, вага на передній частині стопи, спина рівна.", "Ведення без зорового контролю означає, що ти відчуваєш м’яч пальцями, а очима стежиш за партнерами й суперниками. Асинхронне ведення — коли ритм ударів м’яча і кроків різний; воно допомагає краще контролювати м’яч і змінювати темп."], "ul": ["Відбивай м’яч пальцями, а не долонею.", "Тримай м’яч збоку від себе, на рівні пояса.", "Захищай м’яч тілом і вільною рукою (без штовхання).", "Типова помилка — дивитися тільки на м’яч.", "Зупинку виконуй у стрибку або двома кроками, з низькою стійкою."]}, {"h": "Гандбол. Загальні вправи гандболіста", "p": ["Загальні вправи розвивають усі групи м’язів і готують організм до гри: біг, стрибки, присідання, віджимання, вправи для рук і плечей. У гандболі особливо важливі сильні руки, гнучкі плечі та швидкі ноги.", "Будь-яке заняття починається з легкого розігріву, а закінчується вправами на розтягування. Під час вправ треба дотримуватися дистанції з іншими учнями."], "ul": ["Оберти руками вперед і назад.", "Нахили та повороти тулуба.", "Присідання та випади.", "Віджимання від стіни або підлоги.", "Вправи для кистей: стискання й розтискання пальців, оберти кистями."]}], "f": "Проєкт «Активні парки» пропонує тренування в парках безкоштовно — займатися може кожен, незалежно від віку.", "pr": ["Виконай 3 вправи на розвиток спритності, безпечні вдома: перекидання тенісного м’ячика з руки в руку, ловіння м’ячика після відскоку від стіни, швидка зміна положення сидячи–стоячи.", "Напиши 5 звичок здорового способу життя, які вже є у тебе, і 2, які хочеш додати."], "q": ["Що таке здоровий спосіб життя?", "Що пропонує проєкт «Активні парки»?", "Чому баскетболіст має вести м’яч без зорового контролю?", "Які загальні вправи корисні для гандболіста?"]}, {"n": "51", "t": "Міжнародний досвід оздоровчого фізичного виховання. Баскетбольні естафети. Гнучкість у гандболі", "g": "Учень дізнається про оздоровче фізичне виховання в різних країнах, правила естафет з елементами баскетболу та вправи на гнучкість для гандболіста.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Оздоровче фізичне виховання", "заняття фізичними вправами, головна мета яких — зміцнення здоров’я, а не спортивні рекорди."], ["Естафета", "командне змагання, у якому учасники по черзі виконують завдання, передаючи естафету наступному."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою."], ["Амплітуда руху", "розмах руху, тобто наскільки далеко може рухатися частина тіла в суглобі."]], "th": [{"h": "Здоровий спосіб життя. Досвід інших країн", "p": ["У багатьох країнах світу фізичне виховання школярів спрямоване насамперед на здоров’я та радість від руху. Популярні щоденні рухливі перерви, уроки на свіжому повітрі, шкільні спортивні клуби, сімейні спортивні свята.", "Всесвітня організація охорони здоров’я радить дітям і підліткам щонайменше 60 хвилин рухової активності середньої чи високої інтенсивності щодня. Цей досвід використовують і в Україні."], "ul": ["Рухливі перерви між уроками.", "Уроки та ігри на свіжому повітрі.", "Шкільні та клубні секції за інтересами.", "Сімейні походи, велопрогулянки.", "Головне — регулярність, а не рекорди."]}, {"h": "Баскетбол. Естафета з елементами техніки", "p": ["Естафета з баскетбольними завданнями допомагає закріпити ведення, передачі й кидки у швидкому темпі. Учасники виконують завдання по черзі й передають м’яч наступному гравцю команди.", "Перемагає та команда, що діє швидко й без помилок: втрата м’яча чи порушення правил ведення можуть коштувати штрафу."], "ul": ["Ведення м’яча змійкою між фішками.", "Передача м’яча партнеру двома руками від грудей.", "Кидок у кошик після ведення.", "Передавай естафету лише з рук у руки або за сигналом.", "Не штовхай суперників і стеж за своєю доріжкою."]}, {"h": "Гандбол. Спеціальні вправи для розвитку гнучкості", "p": ["Гандболісту потрібні гнучкі плечі, хребет і тазостегнові суглоби: замах для кидка, стрибки й випади вимагають великої амплітуди рухів. Гнучкість також зменшує ризик розтягнень.", "Вправи на гнучкість виконують після розминки, плавно, без ривків. Положення розтягування утримують 15–30 секунд, дихаючи спокійно."], "ul": ["Відведення прямих рук назад, тримаючись за стіну.", "Нахили вперед до прямих ніг сидячи.", "Випади вперед і вбік.", "Повороти тулуба з руками в сторони.", "Не розгойдуйся і не терпи різкого болю."]}], "f": "Всесвітня організація охорони здоров’я рекомендує дітям і підліткам рухатися щонайменше 60 хвилин щодня.", "pr": ["Виконай комплекс з 5 вправ на розвиток гнучкості (нахили, випади, «метелик», розтягування плечей біля стіни), утримуючи кожне положення 20 секунд.", "Розпитай рідних або знайди відомості, як займаються фізкультурою школярі в іншій країні, і запиши 3 цікаві факти."], "q": ["Яка мета оздоровчого фізичного виховання?", "Скільки хвилин рухової активності на день рекомендують підліткам?", "Які правила потрібно дотримуватися в естафеті?", "Як правильно виконувати вправи на гнучкість?"]}, {"n": "52", "t": "Загартовування й гігієна. «Човниковий» біг 4×9 м. Сила й розтягування в гандболі", "g": "Учень знатиме правила загартовування й особистої гігієни, техніку «човникового» бігу 4×9 м та вправи на силу й розтягування.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Загартовування", "поступове привчання організму до впливу холоду, тепла, повітря й води для зміцнення імунітету."], ["Особиста гігієна", "правила догляду за тілом, одягом і взуттям для збереження здоров’я."], ["Прикладне фізичне виховання", "розвиток рухових умінь, потрібних у побуті та майбутній професії."], ["Човниковий біг", "біг з кількома різкими розворотами на коротких відрізках, що розвиває спритність і швидкість."]], "th": [{"h": "Здоровий спосіб життя. Оздоровче та прикладне фізвиховання, загартовування, гігієна", "p": ["Оздоровче фізичне виховання зміцнює серце, легені, м’язи й імунітет. Прикладне фізичне виховання готує до життєвих ситуацій: уміння правильно піднімати вантаж, долати перешкоди, довго ходити пішки.", "Загартовування починають тоді, коли людина здорова, і проводять поступово та регулярно. Особиста гігієна після занять — обов’язкова: душ, чистий одяг, сухе взуття."], "ul": ["Принцип поступовості: температуру води знижуй потроху.", "Принцип регулярності: щодня, а не час від часу.", "Повітряні ванни та провітрювання кімнати.", "Обтирання вологим рушником, контрастне вмивання.", "Після тренування — душ і зміна одягу.", "При застуді загартовування припиняють."]}, {"h": "Баскетбол. «Човниковий» біг 4×9 м", "p": ["Цей тест визначає спритність і швидкість. Учень пробігає відрізок 9 м чотири рази, торкаючись рукою лінії або переносячи кубик на кожному розвороті. Час фіксує вчитель секундоміром.", "Секрет хорошого результату — не сама швидкість, а вміння швидко гальмувати й розвертатися. Перед розворотом знижуй центр ваги, роби короткі кроки, а після торкання лінії різко відштовхуйся."], "ul": ["Старт з високої стійки, одна нога попереду.", "Перед лінією — гальмування та низька стійка.", "Розворот через плече, торкання лінії рукою.", "Не перетинай чужу доріжку.", "Біг виконують лише в залі чи на майданчику, не вдома."]}, {"h": "Гандбол. Вправи на силу та розтягування", "p": ["Сила рук, плечей, спини й ніг потрібна для потужних кидків і стрибків. Сила без гнучкості може призвести до травм, тому після силових вправ обов’язково розтягують м’язи.", "Силові вправи виконують з правильною технікою, без затримки дихання; кількість повторень збільшують поступово."], "ul": ["Віджимання від підлоги або лави.", "Присідання з рівною спиною.", "Планка на ліктях 20–40 секунд.", "«Човник» лежачи на животі для м’язів спини.", "Розтягування плечей, грудей і стегон після вправ."]}], "f": "Слово «гігієна» походить від імені давньогрецької богині здоров’я Гігієї.", "pr": ["Виконай вправи на розвиток гнучкості: нахил вперед сидячи, розтягування плечей біля стіни, випад з утриманням 20 секунд.", "Склади план загартовування на тиждень (провітрювання, повітряні ванни, вмивання прохолодною водою) з поступовим ускладненням."], "q": ["Які основні принципи загартовування?", "Чим прикладне фізичне виховання відрізняється від оздоровчого?", "Як правильно виконувати розворот у «човниковому» бігу?", "Навіщо після силових вправ розтягувати м’язи?"]}, {"n": "53", "t": "Засоби зміцнення здоров’я. Ведення з передачею в колонах. Швидкість і спритність", "g": "Учень називатиме засоби зміцнення здоров’я, виконуватиме ведення з передачею в колонах і знатиме, як попередити травми в гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Засоби зміцнення здоров’я", "фізичні вправи, сили природи, режим і гігієна, які покращують стан організму."], ["Працездатність", "здатність тривалий час ефективно виконувати розумову чи фізичну роботу."], ["Швидкість", "здатність виконувати рухи за мінімальний час."], ["Спритність", "здатність швидко опановувати нові рухи й точно змінювати їх відповідно до ситуації."], ["Травматизм", "сукупність травм, що виникають у певних умовах, наприклад на заняттях спортом."]], "th": [{"h": "Здоровий спосіб життя. Засоби зміцнення здоров’я і навчання", "p": ["Основні засоби зміцнення здоров’я: фізичні вправи, сили природи (сонце, повітря, вода), режим дня, раціональне харчування та гігієна. Разом вони роблять організм витривалим і стійким до хвороб.", "Учні, які регулярно рухаються, краще зосереджуються, швидше запам’ятовують і менше втомлюються. Навіть коротка руханка між уроками повертає бадьорість і підвищує продуктивність навчання."], "ul": ["Фізкультхвилинки під час виконання домашніх завдань.", "Прогулянки після уроків.", "Чергування розумової та фізичної праці.", "Достатній сон перед навчальним днем.", "Сніданок, що дає енергію."]}, {"h": "Баскетбол. Ведення м’яча з наступною передачею у колонах", "p": ["Учні стоять у двох колонах одна навпроти одної. Перший гравець веде м’яч до середини, передає його першому гравцеві зустрічної колони і стає в її кінець. Вправа вчить поєднувати ведення й передачу без зупинки.", "Передачу виконують двома руками від грудей: м’яч тримають пальцями, лікті опущені, руки розгинають уперед, кисті завершують рух назовні."], "ul": ["Під час ведення дивись на партнера, а не на м’яч.", "Передавай м’яч у руки партнеру на рівні грудей.", "Після передачі одразу звільни місце.", "Помилка — пробіжка (кроки з м’ячем у руках).", "Помилка — подвійне ведення."]}, {"h": "Гандбол. Вправи на швидкість і спритність. Попередження травматизму", "p": ["Швидкість і спритність допомагають гандболісту випередити суперника, вчасно відкритися для передачі й швидко повернутися в захист. Їх розвивають короткими прискореннями, стрибками, вправами з м’ячем на реакцію.", "Щоб уникнути травм, гравці розминаються, дотримуються правил і не вступають у небезпечний контакт. Найчастіше травмуються пальці, гомілкостопи та коліна."], "ul": ["Старти за сигналом з різних положень.", "Ловіння м’яча після відскоку від стіни.", "Зміна напрямку бігу за командою.", "Не грай у пошкодженому чи незашнурованому взутті.", "Повідом учителя про будь-яку травму одразу."]}], "f": "Навіть 5 хвилин руханки між заняттями допомагають мозку відпочити й краще засвоювати нову інформацію.", "pr": ["Виконай 3 вправи на розвиток спритності вдома: підкидання і ловіння шкарпеткового м’ячика однією рукою, стійка на одній нозі з поворотами голови, швидкий доторк долонями до колін і плечей за рахунком.", "Склади й запиши 3 фізкультхвилинки по 2 хвилини для перерв під час домашнього завдання."], "q": ["Назви основні засоби зміцнення здоров’я.", "Як рухова активність впливає на навчання?", "Як правильно виконати передачу двома руками від грудей?", "Які травми найчастіше трапляються в гандболі та як їх уникнути?"]}, {"n": "54", "t": "Мотивація до збереження здоров’я. Штрафний кидок у баскетболі. Пересування гравця в гандболі", "g": "Учень розумітиме, як формувати мотивацію до здорового способу життя, знатиме техніку штрафного кидка і способи пересування гандболіста.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Мотивація", "внутрішнє спонукання людини до дії, бажання досягти мети."], ["Штрафний кидок", "кидок у кошик з лінії штрафного кидка без перешкод, що приносить 1 очко."], ["Лінія штрафного кидка", "лінія на відстані близько 4,6 м від щита, з-за якої виконують штрафний кидок."], ["Приставний крок", "пересування вбік, коли одна нога приставляється до іншої без схрещування."]], "th": [{"h": "Здоровий спосіб життя. Мотивація до збереження здоров’я", "p": ["Звички формуються тоді, коли ми розуміємо, навіщо вони нам. Мотивація до здорового способу життя виникає, коли людина бачить результат: більше сил, гарний настрій, краща фігура, успіхи в навчанні та спорті.", "Важливі особисті якості для ЗСЖ — самодисципліна, наполегливість, відповідальність і вміння казати «ні» тому, що шкодить."], "ul": ["Став конкретні маленькі цілі.", "Відзначай свої успіхи в щоденнику.", "Займайся з друзями — так цікавіше.", "Обирай активність, яка тобі подобається.", "Не порівнюй себе з іншими — порівнюй з собою вчорашнім."]}, {"h": "Баскетбол. Штрафний кидок", "p": ["Штрафний кидок призначають за фол. Гравець стоїть за лінією штрафного кидка, і йому ніхто не заважає. Кожне влучання приносить команді 1 очко.", "Кидок виконують однією рукою від плеча: ноги на ширині плечей, коліна трохи зігнуті, м’яч на пальцях кидальної руки, друга рука підтримує збоку. Рух починається з ніг, продовжується розгинанням руки й закінчується м’яким рухом кисті. М’яч летить по дузі."], "ul": ["Стань рівно, носки — у напрямку кошика.", "Дивись на передню дужку кошика.", "Лікоть кидальної руки — під м’ячем.", "Не наступай на лінію до того, як м’яч торкнеться кошика.", "Помилка — кидок лише руками без роботи ніг."]}, {"h": "Гандбол. Пересування гравця та вплив фізичних вправ", "p": ["Гандболіст пересувається звичайним бігом, приставними кроками, бігом спиною вперед, стрибками. У захисті найчастіше використовують приставні кроки в низькій стійці, щоб завжди бути між суперником і воротами.", "Регулярні вправи зміцнюють м’язи й кістки, тренують серце й легені, покращують координацію та настрій."], "ul": ["Стійка: ноги трохи ширше за плечі, коліна зігнуті.", "Приставні кроки без схрещування ніг.", "Біг спиною вперед, дивлячись на гру.", "Швидкий старт після зупинки.", "Руки підняті — готові до перехоплення."]}], "f": "Під час штрафного кидка ніхто не заважає гравцеві, тому влучність залежить лише від його техніки та вміння зосередитися — це чудова нагода для «легкого» очка.", "pr": ["Виконай вправи на розвиток сили: присідання 3×12, віджимання від стіни або підлоги 3×8, планка 3×20 секунд.", "Напиши свою «мотиваційну картку»: 3 цілі щодо здоров’я на місяць і як ти перевірятимеш їх виконання."], "q": ["Що допомагає сформувати мотивацію до здорового способу життя?", "Скільки очок приносить штрафний кидок?", "Опиши послідовність рухів під час штрафного кидка.", "Як пересувається гандболіст у захисті?"]}, {"n": "55", "t": "ЗСЖ у школі. Гра «М’яч у стіну». Пересування гандболіста в нападі та захисті", "g": "Учень знатиме, як школа підтримує здоровий спосіб життя, правила рухливої гри «М’яч у стіну» та способи пересування гандболістів у нападі й захисті.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Здоров’язбережувальне середовище", "умови в школі, що допомагають учням зберігати здоров’я: режим, рух, безпека, харчування."], ["Рухлива гра", "гра з простими правилами, в якій учасники активно рухаються й виконують ігрові завдання."], ["Відкривання", "рух гравця нападу без м’яча на вільне місце, щоб отримати передачу."], ["Опіка", "захисна дія, коли гравець тримається поруч із суперником і заважає йому отримати м’яч."]], "th": [{"h": "Здоровий спосіб життя. Реалізація ЗСЖ у школі", "p": ["Школа допомагає учням вести здоровий спосіб життя: уроки фізичної культури, фізкультхвилинки, спортивні секції, дні здоров’я, безпечні умови навчання. У дистанційній школі багато залежить від самого учня та родини.", "Позитивне ставлення до ЗСЖ виховується прикладом, спільними заняттями і тим, що рух приносить задоволення, а не сприймається як покарання."], "ul": ["Роби перерви кожні 30–40 хвилин за комп’ютером.", "Слідкуй за поставою під час навчання.", "Беріть участь у шкільних спортивних подіях.", "Підтримуй друзів у їхніх спортивних цілях.", "Відзначай корисні звички, а не тільки результати."]}, {"h": "Баскетбол. Рухлива гра «М’яч у стіну»", "p": ["Гравці по черзі кидають м’яч у стіну й ловлять його після відскоку або передають наступному. Хто не впіймав м’яч чи кинув неточно — отримує штрафне очко або виконує завдання. Гра розвиває точність передач, реакцію й спритність.", "Варіанти ускладнення: ловити однією рукою, після відскоку від підлоги, з поворотом, змінювати відстань до стіни."], "ul": ["Кидай м’яч у визначену зону стіни.", "Ловлячи, витягни руки назустріч м’ячу.", "Не стій занадто близько до інших гравців.", "Не кидай м’яч з надмірною силою.", "Грай у залі або на майданчику, не біля вікон."]}, {"h": "Гандбол. Пересування в нападі та захисті", "p": ["У нападі гравці постійно рухаються: відкриваються для передачі, змінюють напрямок, виходять на вільні місця. Мета — створити можливість для кидка по воротах.", "У захисті гравці стоять перед своєю зоною воріт, пересуваються приставними кроками та стежать за м’ячем і суперниками. Захисники допомагають один одному, щільно закриваючи проходи до воріт."], "ul": ["Нападник: ривок, зупинка, зміна напрямку.", "Нападник: відкривайся туди, де немає захисника.", "Захисник: низька стійка, руки вгору.", "Захисник: тримайся між суперником і воротами.", "Усі: стежте за м’ячем і партнерами."]}], "f": "Гру з м’ячем біля стіни люблять у багатьох країнах — це один із найпростіших способів потренувати ловіння навіть самотужки.", "pr": ["Виконай вправи на розвиток витривалості, безпечні вдома: марширування на місці 3 хв, 3 серії по 30 «степів» на нижню сходинку чи низьку стійку, відпочинок 1 хв між серіями.", "Придумай і запиши ідею для дня здоров’я в класі (3–4 активності для дистанційного формату)."], "q": ["Як школа може допомагати учням вести здоровий спосіб життя?", "Які правила гри «М’яч у стіну»?", "Що таке відкривання в гандболі?", "Як пересуваються гандболісти в захисті?"]}, {"n": "56", "t": "Воля до перемоги, організованість, дисципліна. Передачі в трійках. Правила гри в гандбол", "g": "Учень розумітиме роль вольових якостей у спорті й житті, виконуватиме ведення з передачею в трійках і знатиме основні правила гандболу.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Воля", "здатність свідомо долати труднощі для досягнення мети."], ["Дисципліна", "дотримання встановлених правил і порядку."], ["Зона воротаря", "ділянка перед воротами, обмежена лінією на відстані 6 м, у якій може перебувати лише воротар."], ["Пробіжка в гандболі", "порушення, коли гравець робить з м’ячем у руках більше трьох кроків."]], "th": [{"h": "Здоровий спосіб життя. Виховання волі, організованості й дисципліни", "p": ["Спорт виховує характер. Щоб тренуватися регулярно, потрібна воля; щоб грати в команді — організованість і дисципліна. Ці якості потім допомагають і в навчанні, і в роботі.", "Воля до перемоги — це не грубість, а бажання викластися на повну чесно, за правилами, і не здаватися навіть тоді, коли важко."], "ul": ["Плануй заняття заздалегідь і дотримуйся плану.", "Доводь розпочату вправу до кінця.", "Приходь на тренування вчасно.", "Виконуй вказівки вчителя чи тренера.", "Поважай суперника й суддю."]}, {"h": "Баскетбол. Ведення з передачею у трійках", "p": ["Три гравці рухаються вперед на однаковій відстані один від одного. Центральний гравець веде м’яч, потім передає його крайньому, той — знову в центр, і так до кошика. Вправа вчить тримати ширину та темп атаки.", "Передачі виконують на хід партнеру, тобто трохи попереду нього, щоб він не зупинявся."], "ul": ["Тримайте однакову дистанцію 3–4 м.", "Передача — на рівні грудей, на хід.", "Не роби більше двох кроків з м’ячем у руках.", "Закінчуйте вправу кидком у кошик.", "Говоріть: клич партнера на ім’я."]}, {"h": "Гандбол. Поєднання пересувань і основні правила гри", "p": ["У команді на майданчику 7 гравців: 6 польових і воротар. Розмір майданчика — 40×20 м, ворота — 3×2 м. Гравець може тримати м’яч не довше 3 секунд і робити з ним не більше 3 кроків.", "Не можна торкатися м’яча ногами нижче коліна (крім воротаря в своїй зоні), заходити польовому гравцеві в зону воротаря, штовхати, тримати чи бити суперника."], "ul": ["Матч дорослих — два тайми по 30 хвилин.", "Порушення: пробіжка, подвійне ведення, заступ у зону.", "За грубі порушення — попередження, вилучення на 2 хвилини.", "7-метровий кидок призначають за порушення, що зірвало явну нагоду забити.", "Гра починається і продовжується з центру після гола."]}], "f": "Гандбольні ворота мають розмір 3×2 м — значно менші за футбольні, тому кидок має бути дуже точним.", "pr": ["Виконай вправи на розвиток спритності: ловіння м’ячика після відскоку від підлоги, перекидання його за спиною з руки в руку, стрибки на місці з поворотом на 90° (на килимку).", "Запиши 6 основних правил гандболу своїми словами."], "q": ["Як спорт виховує волю й дисципліну?", "Скільки кроків і секунд можна тримати м’яч у гандболі?", "Хто може перебувати в зоні воротаря?", "Як виконується вправа «ведення з передачею у трійках»?"]}, {"n": "57", "t": "Популяризація ЗСЖ. Кидок після двох кроків. Пересування без м’яча в гандболі", "g": "Учень знатиме способи популяризації здорового способу життя, техніку кидка після двох кроків і пересування гандболіста без м’яча.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Популяризація", "поширення знань та інтересу до чогось серед великої кількості людей."], ["Флешмоб", "заздалегідь спланована масова акція, у якій люди одночасно виконують певні дії."], ["Кидок після двох кроків", "кидок у русі, який виконують після ловіння м’яча чи ведення, зробивши два кроки."], ["Ривок", "раптове швидке прискорення на короткій дистанції."]], "th": [{"h": "Здоровий спосіб життя. Популяризація серед молоді", "p": ["Щоб більше молодих людей обирали ЗСЖ, його варто показувати цікавим і модним. Для цього проводять челенджі, флешмоби, спортивні свята, створюють відео й дописи про корисні звички.", "Підлітки краще сприймають приклад однолітків, ніж повчання. Тому кожен може стати амбасадором здоров’я у своєму колі."], "ul": ["Організуй з друзями спортивний челендж.", "Діліться ідеями корисних рецептів.", "Запроси родину на спільну прогулянку.", "Створи плакат чи допис про корисну звичку.", "Будь прикладом сам."]}, {"h": "Баскетбол. Кидок м’яча в русі після двох кроків", "p": ["Це один із найважливіших прийомів. Праворуч від кошика: впіймай м’яч під праву ногу — крок правою, крок лівою — відштовхнися лівою вгору й кинь правою рукою, покладаючи м’яч у кошик через щит.", "Перший крок — довгий, щоб захистити м’яч, другий — коротший, щоб перевести рух угору. Ліворуч виконують дзеркально: крок лівою, правою, кидок лівою."], "ul": ["Відлік кроків — з моменту ловіння м’яча.", "Відштовхування — вгору, а не вперед.", "Цілься у верхній кут квадрата на щиті.", "Помилка — три кроки (пробіжка).", "Приземлення м’яке, на обидві ноги."]}, {"h": "Гандбол. Пересування без м’яча, зміна напрямку", "p": ["Більшу частину гри гравець рухається без м’яча. Від його вміння вчасно відкритися залежить, чи зможе команда атакувати. Різка зміна напрямку допомагає відірватися від захисника.", "Зміну напрямку виконують так: короткий гальмувальний крок, перенесення ваги на опорну ногу, поштовх у новому напрямку. Корисно спочатку зробити оманливий рух в інший бік."], "ul": ["Гальмуй низько, зігнувши коліна.", "Відштовхуйся зовнішньою ногою.", "Слідкуй за м’ячем через плече.", "Не біжи туди, де вже стоїть партнер.", "Тренуй зміну напрямку в обидва боки."]}], "f": "Слово «флешмоб» прийшло з англійської і буквально означає «миттєвий натовп».", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, «місток» (сідничний) лежачи на спині 3×12, віджимання 3×8.", "Намалюй схему кидка після двох кроків праворуч від кошика: познач кроки і місце кидка."], "q": ["Як можна популяризувати здоровий спосіб життя серед однолітків?", "Опиши послідовність кроків під час кидка праворуч від кошика.", "Яка типова помилка в кидку після двох кроків?", "Як виконати різку зміну напрямку в гандболі?"]}, {"n": "58", "t": "Популяризація активного способу життя. Напад «вісімкою». Ловіння й передачі в гандболі", "g": "Учень знатиме, як зробити рухову активність доступною, схему нападу «вісімкою» в баскетболі та техніку ловіння й передач у гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Активний спосіб життя", "спосіб життя, у якому рух є щоденною частиною розпорядку."], ["Доступність рухової активності", "можливість займатися спортом безкоштовно, поруч з домом і людям з різними можливостями."], ["Напад «вісімкою»", "командна система нападу в баскетболі, коли гравці переміщуються траєкторією, схожою на цифру 8."], ["Передача з плеча", "основна передача в гандболі однією рукою після замаху від плеча."]], "th": [{"h": "Здоровий спосіб життя. Активний спосіб життя і вільний доступ до руху", "p": ["Рухатися простіше, коли поруч є безкоштовні майданчики, парки, велодоріжки, шкільні спортзали відкриті для громади. Важливо, щоб займатися могли й люди з інвалідністю.", "Кожен може знайти свій вид активності: прогулянки, велосипед, танці, ігри з м’ячем, плавання. Головне — регулярність."], "ul": ["Ходи пішки або їзди велосипедом на короткі відстані.", "Користуйся сходами замість ліфта.", "Знайди найближчий спортмайданчик.", "Запрошуй друзів на активне дозвілля.", "Поважай і підтримуй людей з різними можливостями."]}, {"h": "Баскетбол. Організація нападу «вісімкою»", "p": ["Під час нападу «вісімкою» гравці по черзі передають м’яч і пробігають за спиною партнера, якому віддали передачу, утворюючи траєкторію, схожу на вісімку. Така система змушує захисників постійно переміщатися і створює вільні місця.", "Головне — постійний рух, точні передачі та вміння вчасно скористатися проходом до кошика."], "ul": ["Передав м’яч — біжи за спину партнера.", "Тримай дистанцію, щоб не заважати один одному.", "Шукай момент для проходу під кошик.", "Не затримуй м’яч надовго.", "Спочатку вправу виконують повільно, без захисників."]}, {"h": "Гандбол. Ловіння та передачі м’яча на місці та в русі", "p": ["Ловлять м’яч двома руками: пальці розведені, великі та вказівні пальці утворюють «віконце», руки трохи зігнуті й поступаються назад, гасячи швидкість м’яча.", "Найпоширеніша передача — однією рукою від плеча: м’яч відводять назад, лікоть на рівні плеча, далі — поворот тулуба, хлист рукою та кистю в бік партнера. У русі передачу роблять на хід партнера."], "ul": ["Дивись на м’яч до моменту, коли впіймаєш.", "Не ловити м’яч прямими пальцями — можна травмуватися.", "Передача — точно в руки або трохи попереду.", "Кидальна рука після передачі «проводжає» м’яч.", "Тренуй передачі обома руками."]}], "f": "У баскетболі тактичну систему часто малюють на спеціальній дошці зі схемою майданчика — так тренер пояснює гравцям їхні маршрути.", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці з високим підніманням колін 3×1 хв, «степ» на низьку сходинку 3×30 разів, відпочинок між серіями.", "Намалюй схему нападу «вісімкою» для трьох гравців, позначивши стрілками рух гравців і м’яча."], "q": ["Що означає вільний доступ до рухової активності?", "У чому суть нападу «вісімкою»?", "Як правильно ловити гандбольний м’яч?", "Як виконується передача однією рукою від плеча?"]}, {"n": "59", "t": "ЗСЖ і шкідливі звички. Реакція на зоровий сигнал. Передачі в русі парами", "g": "Учень пояснюватиме шкоду шкідливих звичок, знатиме, як реагувати на зоровий сигнал у баскетболі, та виконувати передачі в парах зі зміною місць.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Шкідлива звичка", "повторювана дія, що завдає шкоди здоров’ю людини чи оточенню."], ["Залежність", "стан, коли людина не може самостійно відмовитися від певної речовини чи дії."], ["Зоровий сигнал", "знак, який гравець бачить очима (жест, прапорець, рух м’яча) і на який має швидко відреагувати."], ["Поворот на місці", "обертання гравця з м’ячем на опорній нозі, яку не можна відривати від підлоги."]], "th": [{"h": "Здоровий спосіб життя. Несумісність ЗСЖ і шкідливих звичок", "p": ["Куріння (зокрема електронних сигарет і вейпів), алкоголь, наркотики, а також надмірне сидіння в гаджетах руйнують здоров’я. Вони погіршують роботу серця й легенів, пам’ять, настрій і спортивні результати.", "Відмовитися від шкідливої звички складніше, ніж не починати. Спорт, цікаві захоплення та підтримка друзів допомагають сказати впевнене «ні»."], "ul": ["Нікотин звужує судини й знижує витривалість.", "Алкоголь шкодить мозку й печінці, особливо в підлітковому віці.", "Надмірний час у гаджетах порушує сон і поставу.", "Уміння відмовити — ознака сили, а не слабкості.", "Якщо потрібна допомога — звернися до дорослих, яким довіряєш."]}, {"h": "Баскетбол. Прискорення, зупинки, повороти та зміна напрямку за зоровим сигналом", "p": ["У грі немає свистка, який підкаже, коли бігти: гравець реагує на те, що бачить. Тому вправи за зоровим сигналом тренують швидкість реакції та уважність.", "Наприклад: учитель піднімає руку — прискорення; опускає — зупинка; показує вбік — зміна напрямку. Зупинку виконують стрибком на обидві ноги або двома кроками, поворот — на опорній нозі."], "ul": ["Тримай голову піднятою, стеж за сигналом.", "Зупиняйся в низькій стійці, щоб не втратити рівновагу.", "Повертайся на передній частині стопи опорної ноги.", "Не відривай опорну ногу під час повороту з м’ячем.", "Між повтореннями — короткий відпочинок."]}, {"h": "Гандбол. Передача в русі парами зі зміною місць", "p": ["Двоє гравців рухаються вперед паралельно, передаючи м’яч один одному. Після передачі гравець перебігає за спиною партнера на його бік, і пара змінюється місцями. Вправа вчить точних передач у русі й орієнтації на майданчику.", "Пам’ятай про правило трьох кроків: впіймавши м’яч, гравець має швидко передати його далі."], "ul": ["Передача — трохи попереду партнера, на хід.", "Не більше трьох кроків з м’ячем.", "Після передачі — ривок за спину партнера.", "Підтримуй постійну відстань 3–5 м.", "Подавай голосовий сигнал, коли готовий прийняти м’яч."]}], "f": "Нікотин звужує кровоносні судини, тому м’язи отримують менше кисню — і витривалість спортсмена помітно знижується.", "pr": ["Виконай вправи на розвиток швидкості, безпечні вдома: швидкі рухи руками «боксер» сидячи 3×10 с, швидкий «тепінг» стопами сидячи на стільці 3×10 с, ловіння лінійки, яку відпускає партнер.", "Напиши 5 аргументів, якими ти переконав би друга відмовитися від вейпа."], "q": ["Чому здоровий спосіб життя несумісний зі шкідливими звичками?", "Як нікотин впливає на витривалість?", "Як виконати зупинку й поворот у баскетболі?", "Як виконують передачі в парах зі зміною місць?"]}, {"n": "60", "t": "Профілактика травм. Ведення з опором захисника. Передачі з різною траєкторією", "g": "Учень знатиме правила безпечної поведінки, як захищати м’яч під час ведення від захисника та виконувати передачі з різною траєкторією.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Профілактика травм", "заходи, що зменшують ризик пошкоджень під час занять."], ["Перша допомога", "невідкладні дії, які виконують до прибуття медиків, щоб зменшити наслідки травми."], ["Укривання м’яча", "прийом, коли гравець ставить тіло між м’ячем і захисником."], ["Траєкторія", "лінія, якою рухається м’яч у повітрі (пряма, дугоподібна, з відскоком)."]], "th": [{"h": "Здоровий спосіб життя. Профілактика травматизму і безпечна поведінка", "p": ["Більшість травм можна попередити: якісна розминка, справний інвентар, правильна техніка й дисципліна на заняттях. Також важливо вміти діяти, якщо травма все ж трапилась.", "При забої чи розтягненні допомагає холод (лід, загорнутий у тканину), спокій і підвищене положення кінцівки. Про будь-яку травму треба повідомити дорослих."], "ul": ["Розминка перед кожним заняттям.", "Справне взуття й інвентар.", "Дотримання дистанції в групі.", "Не займайся, коли хворієш чи дуже втомився.", "При травмі: зупинись, холод, спокій, повідом дорослих."]}, {"h": "Баскетбол. Ведення м’яча з опором захисника", "p": ["Коли поруч захисник, ведення стає нижчим і щільнішим. Гравець розташовується боком до суперника, веде м’яч дальньою від нього рукою, а ближньою рукою (зігнутою) захищає простір.", "Не можна штовхати захисника рукою — це фол. Головне — постійно бачити поле, щоб вчасно віддати передачу."], "ul": ["Низьке ведення — до рівня колін.", "Тіло між м’ячем і захисником.", "Зміна руки ведення, коли захисник переходить на інший бік.", "Не зупиняй ведення без потреби — повторно почати не можна.", "Голова піднята."]}, {"h": "Гандбол. Різноманітні передачі з різною траєкторією", "p": ["Гандболісти передають м’яч по прямій (найшвидше), по дузі (через руки захисника) та з відскоком від підлоги (під руками захисника). Вибір залежить від того, де стоять партнер і суперник.", "Передача з відскоком: м’яч направляють у підлогу приблизно на двох третинах відстані до партнера, щоб він піймав його на рівні пояса."], "ul": ["Пряма передача — коли між вами немає суперника.", "Передача по дузі — через підняті руки захисника.", "Передача з відскоком — під руками захисника.", "Не роби передачу «наосліп».", "Тренуй передачі на різні відстані."]}], "f": "Холод на місце забою допомагає зменшити набряк, але лід завжди кладуть через тканину, щоб не пошкодити шкіру.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, планка на ліктях 3×30 с, віджимання 3×10.", "Запиши алгоритм першої допомоги при розтягненні гомілковостопного суглоба (4–5 кроків)."], "q": ["Які заходи допомагають попередити травми?", "Що робити при забої чи розтягненні?", "Як правильно вести м’яч, коли поруч захисник?", "Коли в гандболі доречна передача з відскоком?"]}, {"n": "61", "t": "Рухливі ігри для здоров’я. Кидок після двох кроків ліворуч. Перехоплення м’яча", "g": "Учень знатиме роль рухливих ігор у здоровому способі життя, техніку кидка після двох кроків з лівого боку та прийоми перехоплення м’яча.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Оздоровча вправа", "вправа, що покращує стан організму без надмірного навантаження."], ["Ігровий метод", "спосіб навчання і тренування через гру зі сюжетом та правилами."], ["Перехоплення", "захисний прийом, коли гравець заволодіває м’ячем під час передачі суперників."], ["Ведуча рука", "рука, якою гравець виконує кидок або ведення; спортсмен має вміти діяти обома руками."]], "th": [{"h": "Здоровий спосіб життя. Рухливі ігри, естафети та вправи оздоровчого характеру", "p": ["Рухливі ігри — це радість, спілкування та користь для здоров’я одночасно. Вони тренують швидкість, спритність і увагу, вчать дотримуватися правил і працювати в команді.", "Оздоровчі вправи — дихальні, на поставу, на рівновагу — можна виконувати щодня навіть у невеликій кімнаті."], "ul": ["Перед грою — домовтеся про правила.", "Грайте чесно, підтримуйте одне одного.", "Обирайте безпечне місце для гри.", "Дихальні вправи — глибокий вдих носом, повільний видих ротом.", "Вправи на поставу — біля стіни, торкаючись її потилицею, лопатками, сідницями й п’ятами."]}, {"h": "Баскетбол. Кидок після двох кроків з лівого боку", "p": ["Ми вже вивчали кидок праворуч. Тепер — ліворуч: впіймай м’яч під ліву ногу, зроби крок лівою, потім правою, відштовхнися правою вгору й кинь лівою рукою. Спочатку це незручно, але гравець, який атакує з обох боків, значно небезпечніший.", "Тренуй рух спочатку без м’яча, потім з м’ячем у руках без ведення, а далі — після ведення."], "ul": ["Ліва рука веде, ліва рука кидає.", "Права рука захищає м’яч до останнього моменту.", "Коліно маховової ноги піднімається вгору.", "Кидок через щит — у верхній кут квадрата.", "Помилка — кидок «не тією» рукою з незручного боку."]}, {"h": "Гандбол. Перехоплення м’яча під час передачі", "p": ["Захисник стежить і за м’ячем, і за суперником. Коли нападник збирається віддати передачу, захисник робить ривок на лінію польоту м’яча й забирає його. Найкраще перехоплювати передачі, які видно заздалегідь — повільні або дугоподібні.", "Важливо не штовхати й не хапати суперника: перехоплення має бути чистим, тільки за м’ячем."], "ul": ["Стань трохи збоку від суперника, ближче до м’яча.", "Стеж за очима й рукою нападника.", "Ривок — у момент передачі.", "Після перехоплення — швидка атака.", "Не ризикуй, якщо після невдачі суперник опиниться сам перед воротами."]}], "f": "Баскетбол придумали 1891 року як гру для занять у спортзалі взимку, коли на вулиці тренуватися було незручно.", "pr": ["Виконай вправи на розвиток спритності: підкидання м’ячика і ловіння після оплеску, ловіння м’ячика лівою рукою 20 разів, ходьба по прямій лінії п’ятка до носка.", "Згадай або придумай рухливу гру для 4–6 учасників і запиши її правила."], "q": ["Чому рухливі ігри корисні для здоров’я?", "Опиши кидок після двох кроків з лівого боку.", "Як захиснику правильно перехопити передачу?", "Чому важливо вміти атакувати обома руками?"]}, {"n": "62", "t": "Розпорядок дня, харчування, рух. Швидкий прорив. Кидки правою й лівою рукою зверху", "g": "Учень складатиме правильний розпорядок дня, знатиме принципи здорового харчування, схему швидкого прориву та техніку кидка зверху.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Режим дня", "розпорядок, що визначає час сну, навчання, харчування, руху й відпочинку."], ["Раціональне харчування", "збалансоване за кількістю та складом харчування відповідно до потреб організму."], ["Швидкий прорив", "стрімка атака команди одразу після заволодіння м’ячем, поки суперник не встиг повернутися в захист."], ["Кидок зверху", "основний кидок у гандболі однією рукою із замахом над плечем."]], "th": [{"h": "Здоровий спосіб життя. Розпорядок дня, харчування, рухова активність", "p": ["Правильний розпорядок дня допомагає організму працювати як годинник: лягати й прокидатися в один і той самий час, чергувати навчання та відпочинок, харчуватися регулярно.", "Здорова тарілка — це половина овочів і фруктів, чверть — каші, хліб чи макарони, чверть — м’ясо, риба, яйця, бобові. Пий воду, обмежуй солодкі напої та фастфуд."], "ul": ["Сніданок обов’язковий.", "4–5 прийомів їжі на день невеликими порціями.", "Не їж перед екраном.", "Останній прийом їжі — за 2 години до сну.", "Щодня — хоча б година руху."]}, {"h": "Баскетбол. Організація нападу швидким проривом", "p": ["Швидкий прорив починається одразу після підбирання м’яча під своїм кошиком або перехоплення. Перший гравець робить довгу передачу вперед або веде м’яч до центру, двоє партнерів біжать по краях. Мета — атакувати, поки захисників менше, ніж нападників.", "Швидкий прорив закінчують кидком після двох кроків або передачею вільному партнеру."], "ul": ["Перша передача — швидка й точна.", "Крайні гравці біжать по флангах.", "Центральний гравець веде м’яч.", "Не затримуй м’яч — швидкість вирішує.", "Якщо прорив не вдався — переходьте до позиційного нападу."]}, {"h": "Гандбол. Кидки правою й лівою рукою зверху", "p": ["Кидок зверху — найсильніший і найчастіший у гандболі. Гравець відводить м’яч назад-угору (лікоть на рівні плеча або вище), робить крок протилежною ногою вперед, повертає тулуб і хльостким рухом руки та кисті кидає м’яч.", "Уміння кидати й неосновною рукою робить гравця непередбачуваним. Спочатку кидки виконують у стіну чи сітку, без воротаря."], "ul": ["Ліва нога вперед — кидок правою (і навпаки).", "Сила кидка йде від ніг через тулуб до руки.", "Кисть завершує рух униз.", "Помилка — кидок «з-за вуха» без повороту тулуба.", "Перед кидками — розминка плечей і кистей."]}], "f": "Мозок підлітка особливо чутливий до нестачі сну — саме під час сну він «упорядковує» вивчене за день.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, «супермен» лежачи на животі 3×12, віджимання від підлоги або стіни 3×10.", "Склади свій режим дня на навчальний день і порівняй його з рекомендаціями уроку."], "q": ["Які правила раціонального харчування ти знаєш?", "Чому важливо лягати спати в один і той самий час?", "Як організувати швидкий прорив у баскетболі?", "Опиши техніку кидка зверху в гандболі."]}, {"n": "63", "t": "Прогулянки, дихання, руханка. Накривання м’яча. Кидки по воротах у гандболі", "g": "Учень знатиме правила корисної прогулянки й ранкової гімнастики, техніку накривання м’яча в баскетболі та кидків по воротах у гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Ранкова гімнастика", "комплекс легких вправ після сну, що допомагає організму прокинутися."], ["Носове дихання", "дихання через ніс, під час якого повітря очищується, зволожується й зігрівається."], ["Накривання м’яча", "захисний прийом у баскетболі, коли гравець у стрибку блокує кидок суперника рукою."], ["Кут воріт", "найважча для воротаря ділянка воріт біля стійки й поперечини."]], "th": [{"h": "Здоровий спосіб життя. Прогулянки, правильне дихання, ранкова гімнастика", "p": ["Піші прогулянки на свіжому повітрі — простий і корисний засіб здоров’я. Йди рівно, з піднятою головою й розправленими плечима, дихай глибоко: вдих через ніс, видих ротом.", "Ранкова гімнастика (руханка) триває 10–15 хвилин: вправи для шиї, рук, тулуба й ніг, від легких до інтенсивніших, і спокійне завершення."], "ul": ["Прогулянка щонайменше 30 хвилин щодня.", "Одяг — за погодою, шарами.", "Руханка — у провітреній кімнаті.", "Від верхніх частин тіла до нижніх.", "Ранкова пробіжка — тільки у безпечних місцях і за згодою дорослих."]}, {"h": "Баскетбол. Накривання м’яча", "p": ["Накривання (блок-шот) — захисник вистрибує й торкається м’яча долонею, коли суперник кидає. Робити це треба по м’ячу, а не по руці кидаючого, інакше буде фол.", "Не можна торкатися м’яча, коли він уже летить донизу до кошика, — це порушення. Головне — правильно обрати момент стрибка й не стрибати на оманливий рух."], "ul": ["Стрибай вертикально, не на суперника.", "Рука, якою накриваєш, — прямо вгору.", "Відбивай м’яч убік, до партнерів.", "Не стрибай на фінт.", "Приземлення — на обидві ноги, м’яко."]}, {"h": "Гандбол. Кидки по воротах", "p": ["Щоб забити, мало кинути сильно — треба кинути точно. Найважче воротарю відбити м’ячі, що летять у кути воріт: верхні та нижні. Кидаючи, стеж за положенням воротаря й цілься у вільну частину воріт.", "Кидок виконують з-за лінії зони воротаря (6 м). Можна кинути у стрибку над зоною воротаря: відштовхнутися треба до лінії, а приземлитися в зоні дозволено лише тоді, коли м’яч уже випущено з рук."], "ul": ["Дивись на воротаря перед кидком.", "Цілься у кути, а не в центр.", "Не наступай на лінію зони до кидка.", "Не кидай у голову воротаря.", "Тренуй кидки з різних позицій."]}], "f": "Через ніс повітря зігрівається і зволожується — тому взимку носове дихання допомагає берегти горло.", "pr": ["Склади й виконай власну ранкову руханку з 8 вправ (від шиї до стоп), запиши її в зошит.", "Виконай вправи на розвиток спритності: підкидання і ловіння м’ячика різними руками, «перехресні» доторки лікоть–коліно 3×20, стійка на одній нозі із заплющеними очима 3×15 с."], "q": ["Як правильно дихати під час прогулянки?", "Як побудувати ранкову гімнастику?", "Коли накривання м’яча вважається порушенням?", "У які частини воріт найкраще цілитися в гандболі?"]}, {"n": "64", "t": "ЗФП оздоровчого спрямування. Передачі зверху і знизу. 7-метровий і вільний кидки", "g": "Учень знатиме, що таке загальна фізична підготовка, як чергувати передачі зверху й знизу та виконувати штрафний (7-метровий) і вільний кидки.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Загальна фізична підготовка", "всебічний розвиток сили, швидкості, витривалості, гнучкості й спритності."], ["Передача двома руками зверху", "передача з-над голови, зручна для високих гравців і передач через захисника."], ["7-метровий кидок", "штрафний кидок у гандболі з лінії 7 м, коли між кидаючим і воротами лише воротар."], ["Вільний кидок", "кидок, яким відновлюють гру після порушення; виконують з місця порушення або з лінії 9 м."]], "th": [{"h": "Здоровий спосіб життя. ЗФП оздоровчого спрямування, ігри без визначення переможців", "p": ["Загальна фізична підготовка (ЗФП) розвиває всі рухові якості разом і є основою для будь-якого виду спорту. Оздоровча ЗФП — це помірне навантаження, яке приносить задоволення й не виснажує.", "Оздоровчі ігри та естафети без визначення переможців допомагають кожному учневі відчути успіх, зосередитися на русі й співпраці, а не на суперництві."], "ul": ["Сила: присідання, віджимання, планка.", "Витривалість: ходьба, плавання, велосипед.", "Гнучкість: нахили, розтягування.", "Спритність: ігри з м’ячем, координаційні вправи.", "Швидкість: короткі прискорення, вправи на реакцію."]}, {"h": "Баскетбол. Чергування прийомів ловіння і передач двома руками зверху та знизу", "p": ["Передачу зверху виконують з-над голови: м’яч тримають над лобом, лікті зігнуті, коротким рухом передпліч і кистей посилають його партнеру. Вона зручна через захисника.", "Передачу знизу виконують з рівня пояса, коли партнер поруч чи ближче до підлоги. Чергування різних передач робить гру менш передбачуваною."], "ul": ["Ловлячи високий м’яч — руки вгору.", "Ловлячи низький — присідай, а не нахиляйся.", "Передача зверху — не відводь м’яч за голову.", "Передача знизу — м’який рух від стегна.", "Партнер має бути готовий: дивись йому в очі."]}, {"h": "Гандбол. Штрафний і вільний кидки з опорного положення", "p": ["7-метровий кидок призначають, якщо порушення правил зірвало явну нагоду забити. Гравець стоїть за лінією 7 м, опорна нога не відривається від підлоги, доки м’яч не вилетить. Воротар може вийти назустріч не ближче ніж до лінії 4 м.", "Вільний кидок виконують після свистка з місця порушення; якщо порушення було біля зони воротаря — з лінії 9 м. Захисники мають стояти на відстані щонайменше 3 м."], "ul": ["Кидок з опорного положення — одна нога на підлозі.", "Не можна торкатися лінії до вильоту м’яча.", "Обирай кут і не змінюй рішення в останню мить.", "Обманний замах — можливий, але без зупинки руху.", "Вільний кидок можна виконати і передачею партнеру."]}], "f": "У гандболі для 7-метрового кидка на майданчику є окрема коротка лінія, а для воротаря — позначка на відстані 4 м від воріт.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, планка 3×30 с, віджимання 3×10, «місток» лежачи 3×12.", "Склади тижневий план ЗФП: по одній вправі на кожну рухову якість на кожен день."], "q": ["Які рухові якості розвиває ЗФП?", "Чим корисні естафети без визначення переможців?", "Коли призначають 7-метровий кидок у гандболі?", "Як правильно виконати передачу двома руками зверху?"]}, {"n": "65", "t": "Скандинавська ходьба й туризм. Кидок однією рукою з місця. Стійка воротаря", "g": "Учень знатиме переваги скандинавської ходьби й туризму, техніку кидка однією рукою з місця та стійку воротаря в гандболі.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Скандинавська ходьба", "оздоровча ходьба зі спеціальними палицями, у якій працюють м’язи і ніг, і рук, і тулуба."], ["Оздоровчий туризм", "піші, велосипедні чи інші подорожі з метою відпочинку та зміцнення здоров’я."], ["Кидок однією рукою від плеча", "основний кидок у кошик з місця, коли м’яч посилається однією рукою по дузі."], ["Стійка воротаря", "вихідне положення воротаря: ноги на ширині плечей, коліна зігнуті, руки підняті долонями вперед."]], "th": [{"h": "Здоровий спосіб життя. Скандинавська ходьба та оздоровчий туризм", "p": ["Скандинавська ходьба з’явилася у Фінляндії як літнє тренування лижників. Палиці допомагають рухатися і задіюють м’язи рук, плечей і спини, а навантаження на коліна зменшується.", "Оздоровчий туризм — походи на природу, екскурсії пішки чи велосипедом. Він тренує витривалість, загартовує й дає змогу краще пізнати рідний край."], "ul": ["Довжину палиць підбирають за зростом.", "Рука й протилежна нога рухаються одночасно.", "Палиця ставиться під кутом, а не вертикально.", "У похід — зручне взуття, вода, головний убір.", "Ходи групою і попереджай дорослих про маршрут."]}, {"h": "Баскетбол. Кидок м’яча однією рукою з місця", "p": ["Це основа всіх кидків. Стань обличчям до кошика, ноги на ширині плечей, однойменна нога (для правші — права) трохи попереду. М’яч на пальцях правої руки над правим плечем, ліва рука підтримує збоку.", "Злегка присідаєш — випрямляєш ноги — розгинаєш руку вгору-вперед — кисть робить «помах» униз. Після кидку рука залишається витягнутою, ніби «проводжаючи» м’яч."], "ul": ["Лікоть під м’ячем, а не вбік.", "М’яч не лежить на долоні.", "Ліва рука лише підтримує, не штовхає.", "Висока дуга польоту.", "Спочатку кидай ближче до кошика, потім збільшуй відстань."]}, {"h": "Гандбол. Гра воротаря: стійка та переміщення у воротах", "p": ["Воротар — останній захисник команди. Його стійка: ноги трохи ширше за плечі, коліна зігнуті, вага на передній частині стоп, руки підняті й зігнуті, долоні вперед. Так він може швидко рушити в будь-який бік.", "Воротар переміщується приставними кроками по дузі перед воротами, завжди стаючи між м’ячем і центром воріт. Чим ближче він до кидаючого, тим менше відкритих частин воріт."], "ul": ["Пересування — приставними кроками, без схрещування ніг.", "Займай позицію на лінії «м’яч — центр воріт».", "Не відступай занадто глибоко в ворота.", "Стеж за м’ячем, а не за рухами гравця.", "Воротарю потрібні захисні засоби, якщо це передбачено."]}], "f": "Скандинавська ходьба виникла у Фінляндії: спершу лижники тренувалися з палицями влітку, а згодом це заняття стало популярним серед усіх охочих.", "pr": ["Виконай вправи на розвиток витривалості: ходьба на місці з активною роботою рук (як у скандинавській ходьбі) 3×2 хв, «степ» на низьку сходинку 3×30.", "Склади план пішого походу вихідного дня з родиною: маршрут, спорядження, правила безпеки."], "q": ["Чим скандинавська ходьба відрізняється від звичайної?", "Як правильно виконати кидок однією рукою з місця?", "Яка стійка воротаря в гандболі?", "Як воротар обирає позицію у воротах?"]}, {"n": "66", "t": "Самоконтроль у скандинавській ходьбі. Набивні м’ячі. Відбивання м’ячів воротарем", "g": "Учень знатиме, як дозувати навантаження у скандинавській ходьбі й контролювати самопочуття, як безпечно працювати з обтяженнями та відбивати м’ячі у воротах.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Самоконтроль", "регулярне спостереження за своїм самопочуттям, пульсом і змінами в організмі під час занять."], ["Частота серцевих скорочень (ЧСС)", "кількість ударів серця за хвилину; показник навантаження."], ["Набивний м’яч", "важкий м’яч (медбол) для силових і швидкісно-силових вправ."], ["Відбивання", "дія воротаря, коли він рукою, ногою або тілом змінює напрямок польоту м’яча від воріт."]], "th": [{"h": "Здоровий спосіб життя. Скандинавська ходьба з урахуванням віку і статі. Самоконтроль", "p": ["Скандинавська ходьба підходить людям різного віку. Підліткам можна ходити швидше й довше, людям старшого віку — у спокійному темпі. Навантаження збільшують поступово, починаючи з 20–30 хвилин.", "Самоконтроль допомагає не перевтомитися. Пульс вимірюють на зап’ясті чи шиї: рахують удари за 15 секунд і множать на 4. Під час ходьби людина має змогу розмовляти, не задихаючись."], "ul": ["Вимірюй пульс до і після заняття.", "Тест розмови: можеш говорити — темп відповідний.", "Записуй самопочуття, сон, апетит.", "Тривога: біль у грудях, запаморочення — зупинитися.", "Пульс має відновлюватися за кілька хвилин відпочинку."]}, {"h": "Баскетбол. Вправи з обтяженнями та набивними м’ячами", "p": ["Набивні м’ячі розвивають силу рук, плечей і корпусу, потрібну для далеких передач, кидків і боротьби за підбирання. Вправи виконують у парах або біля стіни під наглядом учителя.", "Вагу м’яча підбирають за силами учня. Важливо зберігати рівну спину й не кидати м’яч у партнера, який не готовий."], "ul": ["Кидок набивного м’яча від грудей двома руками партнеру.", "Кидок з-за голови.", "Присідання з м’ячем у руках.", "Повороти тулуба з м’ячем.", "Не кидати м’яч догори над собою."]}, {"h": "Гандбол. Відбивання м’ячів однією та двома руками", "p": ["Високі м’ячі воротар відбиває двома руками, виносячи долоні назустріч м’ячу, або однією рукою, якщо м’яч летить у кут. Важливо не просто торкнутися, а відвести м’яч убік від воріт.", "Під час відбивання воротар робить крок або випад у бік м’яча, щоб закрити більшу частину воріт. Очі весь час стежать за м’ячем."], "ul": ["Два руки — для м’ячів у центр на рівні голови.", "Одна рука — для м’ячів у кут.", "Пальці напружені, долоня рівна.", "Відбивай убік, а не перед собою.", "Перед тренуванням — розминка пальців і кистей."]}], "f": "Щоб швидко виміряти пульс, досить порахувати удари за 15 секунд і помножити на 4.", "pr": ["Виконай вправи на розвиток швидкості: швидкі оплески над головою й перед собою 3×10 с, «тепінг» руками по столу 3×10 с, ловіння лінійки.", "Виміряй свій пульс у спокої, після 20 присідань і через 2 хвилини відпочинку; запиши результати в щоденник самоконтролю."], "q": ["Як контролювати навантаження під час скандинавської ходьби?", "Як виміряти пульс?", "Яких правил безпеки дотримуватися з набивним м’ячем?", "Коли воротар відбиває м’яч однією, а коли двома руками?"]}, {"n": "67", "t": "Безпека в оздоровчих заняттях. Серійні стрибки. Відбивання м’ячів воротарем", "g": "Учень знатиме правила безпеки в оздоровчих заняттях, техніку серійних стрибків з діставанням предметів і вдосконалить знання про гру воротаря.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Стрибучість", "здатність людини високо й швидко відштовхуватися від опори."], ["Поштовх однієї ноги", "відштовхування від підлоги однією ногою, яке використовують у стрибках у русі."], ["Плиометрика", "стрибкові вправи, що розвивають вибухову силу м’язів ніг."], ["Реакція воротаря", "швидкість відповіді воротаря на кидок."]], "th": [{"h": "Здоровий спосіб життя. Профілактика травматизму в різних оздоровчих заняттях", "p": ["Травми трапляються не тільки на уроках, а й під час катання на велосипеді, роликах, ковзанах, у походах. Безпека залежить від правильного спорядження, знання правил і обережності.", "Шолом, наколінники й налокітники значно зменшують ризик серйозних травм під час катання. У походах важливо мати аптечку і зручне взуття."], "ul": ["Велосипед, ролики, самокат — тільки в шоломі.", "Купатися лише в дозволених місцях.", "Перевіряй спорядження перед заняттям.", "Не займайся в темряві на невідомій місцевості.", "Попереджай дорослих, куди йдеш."]}, {"h": "Баскетбол. Серійні стрибки поштовхом однієї ноги з діставанням предметів", "p": ["Ця вправа розвиває стрибучість, потрібну для кидків, підбирань і накривань. Учні з невеликого розбігу відштовхуються однією ногою й торкаються рукою підвішеного предмета (стрічки, м’ячика), а потім повторюють стрибок серією.", "Виконують стрибки лише в залі на відповідному покритті, після ґрунтовної розминки, з поступовим збільшенням висоти."], "ul": ["Мах протилежною ногою і рукою вгору.", "Приземлення м’яке, на передню частину стопи.", "Відштовхуйся то правою, то лівою ногою.", "Не стрибай при болю в колінах чи гомілках.", "Вдома стрибкові вправи не виконують."]}, {"h": "Гандбол. Гра воротаря: відбивання м’ячів однією і двома руками", "p": ["Сьогодні вдосконалюємо відбивання в різних зонах воріт. Низькі м’ячі воротар відбиває ногою або рукою з випадом, високі — руками у стрибку чи кроком убік. Найкращий воротар не той, хто стрибає ефектніше, а той, хто правильно займає позицію.", "Тренування воротаря починається з легких кидків на розминку, потім швидкість кидків поступово зростає."], "ul": ["Високий м’яч — руки вгору й убік.", "Низький м’яч — випад і нога або рука вниз.", "Після відбивання — швидко повернутися в стійку.", "Кидаючим — не кидати сильно в голову.", "Воротар має право на розминку перед грою."]}], "f": "Шолом під час катання на велосипеді значно зменшує ризик тяжких травм голови — тому в багатьох країнах він обов’язковий для дітей.", "pr": ["Виконай вправи на розвиток спритності: стійка на одній нозі з перекиданням м’ячика з руки в руку 3×30 с, підкидання і ловіння м’ячика після повороту на 180°, «дзеркальні» рухи руками.", "Склади пам’ятку з безпеки для катання на велосипеді чи роликах (5–6 пунктів)."], "q": ["Яке спорядження зменшує ризик травм під час катання?", "Навіщо баскетболісту стрибучість?", "Як правильно приземлятися після стрибка?", "Як воротар відбиває низькі м’ячі?"]}, {"n": "68", "t": "Змагання без переможців і похід. Помилки в кидку з місця. Ігрові вправи з кидками", "g": "Учень знатиме, як організувати оздоровчі змагання й похід, виправлятиме помилки в кидку з місця та застосовуватиме кидки по воротах в ігрових вправах.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Туристичний похід", "організована подорож пішки з визначеним маршрутом, метою і спорядженням."], ["Аптечка", "набір засобів для надання першої допомоги."], ["Влучність", "здатність потрапляти м’ячем у ціль."], ["Ігрова вправа", "вправа, у якій технічний прийом виконують в умовах, наближених до гри."]], "th": [{"h": "Здоровий спосіб життя. Підсумкові змагання без визначення переможців. Оздоровчий похід", "p": ["Змагання без переможців — це свято руху, де кожен виконує завдання й отримує похвалу за участь і старання. Такі заходи особливо добрі для тих, хто ще тільки починає займатися.", "Оздоровчий похід потребує підготовки: маршрут, погода, одяг, їжа й вода, аптечка, телефон. Похід організовують дорослі, а учні дотримуються правил групи."], "ul": ["Мета змагань — участь і настрій, а не місце.", "У поході — йти групою, не відставати.", "Рюкзак — не більше 10–15 % маси тіла.", "Не пий воду з неперевірених джерел.", "Залишай після себе чисте місце."]}, {"h": "Баскетбол. Кидок однією рукою з місця: типові помилки", "p": ["Повторюємо кидок з місця й шукаємо помилки. Найчастіші — лікоть убік, м’яч на долоні, кидок без роботи ніг, низька траєкторія та «поштовх» другою рукою.", "Щоб їх виправити, кидай з близької відстані, тримаючи лише кидальну руку на м’ячі, та постійно повторюй однакову послідовність рухів."], "ul": ["Лікоть убік → м’яч летить криво.", "М’яч на долоні → немає контролю.", "Без ніг → бракує сили.", "Низька дуга → м’яч б’ється в дужку.", "Друга рука штовхає → м’яч обертається неправильно."]}, {"h": "Гандбол. Ігрові вправи з кидками по воротах", "p": ["Ігрові вправи наближають кидок до реальної гри: гравець отримує передачу, обходить захисника чи пасивного суперника й кидає з різних позицій. Так тренують і техніку, і прийняття рішень.", "Наприклад: «два на одного» — двоє нападників проти одного захисника; хто вільний, той кидає. Або кидок після швидкої передачі з крайньої позиції."], "ul": ["Вибирай найвигіднішу позицію для кидка.", "Кидай, коли воротар зрушив з місця.", "Не затримуйся з м’ячем більше 3 секунд.", "Захисник діє чесно, без штовхань.", "Після кидка — швидко повертайся в захист."]}], "f": "Важкий рюкзак шкодить поставі, тому в похід беруть лише найнеобхідніше, а спільні речі розподіляють між учасниками групи.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, планка бокова 2×20 с на кожен бік, віджимання 3×10.", "Склади список спорядження для одноденного походу й правила поведінки в групі."], "q": ["Чим корисні змагання без визначення переможців?", "Що потрібно взяти в одноденний похід?", "Назви 3 типові помилки в кидку однією рукою з місця.", "Як виконують ігрову вправу «два на одного»?"]}, {"n": "69", "t": "Задоволення від ЗСЖ. Захист від атакувальних прийомів. Естафети з пересуваннями", "g": "Учень розумітиме, як ЗСЖ впливає на настрій, знатиме основи індивідуального захисту в баскетболі та правила естафет з пересуваннями.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Ендорфіни", "речовини, що виробляються в організмі під час фізичної активності й покращують настрій."], ["Індивідуальний захист", "система захисту, у якій кожен гравець опікає конкретного суперника."], ["Захисна стійка", "низька стійка з широко розставленими ногами й розведеними руками для протидії нападнику."], ["Естафетна передача", "передача права виконувати етап наступному учасникові команди."]], "th": [{"h": "Здоровий спосіб життя. Задоволення здоровим способом життя", "p": ["Здоровий спосіб життя — це не обмеження, а джерело радості. Під час руху організм виробляє ендорфіни — «гормони щастя», тому після тренування з’являється гарний настрій і бадьорість.", "Задоволення приносять і маленькі перемоги: перша пройдена дистанція, більше віджимань, ніж минулого тижня, спокійний сон, похвала друзів."], "ul": ["Обирай активність до душі.", "Помічай, як змінюється самопочуття.", "Ведіть з другом спільний щоденник звичок.", "Хвали себе за регулярність.", "Не перевантажуйся — втома забирає радість."]}, {"h": "Баскетбол. Протидія атакувальним прийомам суперника", "p": ["Захисник має завадити нападникові вести м’яч, передавати й кидати. Для цього він займає позицію між нападником і своїм кошиком, у низькій стійці, на відстані витягнутої руки.", "Проти ведення — пересування приставними кроками, щоб не пропустити суперника. Проти кидка — рука вгору перед м’ячем. Проти передачі — рука на лінії можливої передачі. Захищатися треба ногами, а не руками: штовхання — це фол."], "ul": ["Не схрещуй ноги під час пересування.", "Не стрибай на кожен обманний рух.", "Тримай одну руку вгорі, другу — збоку.", "Стеж за поясом нападника — він не обманює.", "Після кидка суперника — закрий його від кошика."]}, {"h": "Гандбол. Естафети з вправами на пересування", "p": ["Естафети з пересуваннями закріплюють способи руху гандболіста: біг, приставні кроки, біг спиною вперед, зміну напрямку. Вони тренують швидкість і спритність у веселій формі.", "Кожен етап має чітке завдання, а наступний учасник починає лише після передачі естафети. Важливо виконати рух правильно, а не лише швидко."], "ul": ["Етап 1: приставні кроки обличчям до центру.", "Етап 2: біг спиною вперед.", "Етап 3: обігання фішок змійкою.", "Передача естафети — доторком долоні.", "Не перебігай на чужу доріжку."]}], "f": "Після помірного тренування настрій покращується, а відчуття тривоги часто зменшується — це помічали і науковці, і самі спортсмени.", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, присідання повільно 2×20, «скелелаз» у повільному темпі 3×20 с.", "Протягом 3 днів записуй свій настрій до і після фізичних вправ; зроби висновок."], "q": ["Чому рух покращує настрій?", "Як захисник має протидіяти веденню м’яча?", "Чому в захисті важливо працювати ногами, а не руками?", "Які завдання можуть бути в естафеті з пересуваннями?"]}, {"n": "70", "t": "Три групи практик здоров’я. Навчальні ігри в баскетбол і гандбол: правила", "g": "Учень розрізнятиме практики, що накопичують, зберігають чи руйнують здоров’я, та знатиме, як поводитися в навчальній грі з баскетболу й гандболу.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Здоров’янакопичувальні практики", "дії, що збільшують резерви здоров’я: тренування, загартовування, якісний сон."], ["Здоров’язбережувальні практики", "дії, що захищають від втрати здоров’я: гігієна, безпечна поведінка, щеплення, режим."], ["Здоров’яруйнівні практики", "дії, що шкодять здоров’ю: шкідливі звички, малорухливість, недосипання."], ["Навчальна гра", "гра за спрощеними чи повними правилами, мета якої — закріпити техніку й тактику."]], "th": [{"h": "Здоровий спосіб життя. Складові ЗСЖ: три групи практик", "p": ["Усе, що ми робимо щодня, можна поділити на три групи. Здоров’янакопичувальні практики додають сил: рух, загартовування, корисна їжа. Здоров’язбережувальні — захищають: гігієна, безпека, режим. Здоров’яруйнівні — забирають здоров’я: куріння, алкоголь, недосипання, малорухливість.", "Мета — збільшувати перші дві групи й зменшувати третю."], "ul": ["Накопичувальні: щоденний рух, спорт, прогулянки.", "Накопичувальні: загартовування, повноцінний сон.", "Збережувальні: миття рук, чистка зубів, режим.", "Збережувальні: шолом, ремінь безпеки, ПДР.", "Руйнівні: шкідливі звички, фастфуд, ніч у гаджетах."]}, {"h": "Баскетбол. Навчальна гра: основні порушення", "p": ["У навчальній грі ми застосовуємо все вивчене. Гра триває за правилами, а порушення зупиняють гру. Найпоширеніші порушення: пробіжка, подвійне ведення, аут, порушення правила 3 секунд у зоні під кошиком.", "Фол — це порушення, пов’язане з неправильним контактом із суперником (штовхання, утримання, удар по руці). За фол під час кидка призначають штрафні кидки."], "ul": ["Пробіжка — кроки з м’ячем у руках без ведення.", "Подвійне ведення — ведення двома руками або повторне після зупинки.", "3 секунди — довге перебування нападника в зоні.", "Аут — м’яч за межами майданчика.", "Поважай рішення судді."]}, {"h": "Гандбол. Навчальна гра: організація та розстановка", "p": ["У навчальній грі в гандбол кожна команда має воротаря й польових гравців. Починають гру з центру майданчика після свистка. Гравці розподіляють обов’язки: хтось більше атакує, хтось стежить за захистом.", "Навчальна гра може проходити за спрощеними правилами (менша кількість гравців, менший майданчик), щоб кожен частіше торкався м’яча."], "ul": ["Початок гри — передача з центру.", "Після гола — знову з центру командою, що пропустила.", "Не заходити в зону воротаря.", "Тримати м’яч до 3 секунд, до 3 кроків.", "Після гри — подякувати суперникам."]}], "f": "Навіть вибір сходів замість ліфта — це маленька здоров’янакопичувальна практика.", "pr": ["Виконай вправи на розвиток спритності: жонглювання двома м’ячиками (чи шкарпетками), перекидання м’ячика навколо тулуба, стійка «ластівка» 3×15 с на кожній нозі.", "Розподіли свої звички за трьома групами практик (накопичувальні, збережувальні, руйнівні) і запиши в таблицю."], "q": ["Наведи приклади здоров’янакопичувальних практик.", "Чим відрізняються збережувальні практики від накопичувальних?", "Які основні порушення правил у баскетболі?", "Як починається гра в гандбол після гола?"]}, {"n": "71", "t": "ЗСЖ і рівень здоров’я. Кидок у стрибку. Кидок із замахом зверху. Український гандбол", "g": "Учень розумітиме, як ЗСЖ підвищує рівень здоров’я, знатиме техніку кидка у стрибку та кидка із замахом зверху й цікаві факти про український гандбол.", "k": "Модулі: Здоровий спосіб життя · Баскетбол · Гандбол", "terms": [["Рівень здоров’я", "ступінь здатності організму протистояти хворобам і навантаженням."], ["Кидок у стрибку", "кидок, який гравець виконує у найвищій точці стрибка."], ["Замах", "рух відведення руки з м’ячем назад перед кидком для набору сили."], ["Фаза кидка", "окрема частина руху: підготовка, замах, кидок, завершення."]], "th": [{"h": "Здоровий спосіб життя. Шлях до високого рівня здоров’я", "p": ["Рівень здоров’я — не постійна величина: його можна підвищувати. Люди, які регулярно рухаються, правильно харчуються й добре сплять, рідше хворіють, швидше відновлюються і краще почуваються.", "Важливо, що позитивні звички, сформовані в підлітковому віці,
