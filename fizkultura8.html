 переступити лінію метання."], ["Траєкторія", "лінія, по якій летить м'яч."], ["Постава", "звичне положення тіла людини, коли вона стоїть, сидить або рухається."]], "th": [{"h": "Легка атлетика. Метання малого м'яча на дальність з розбігу", "p": ["Під час повторення метання з розбігу зверни увагу на зв'язок розбігу і кидка: швидкість не має губитися на останніх кроках. Фінальне зусилля виконується від ніг через тулуб до руки.", "Після кидка спортсмен робить крок уперед і гальмує, щоб не переступити лінію. Заступ — це невдала спроба."], "ul": ["Розбіг — без різкого гальмування перед кидком.", "Рука з м'ячем відведена назад, прямо.", "Кидок — над плечем, лікоть високо.", "Гальмування — перенесення ваги на передню ногу.", "Метати можна лише в безпечній зоні."]}, {"h": "Волейбол. Передача м'яча двома руками зверху через сітку в парах", "p": ["Точність передачі залежить від положення під м'ячем. Гравець має стояти так, щоб м'яч опускався над його лобом. Кисті утворюють «ковшик», великі пальці спрямовані до обличчя.", "Траєкторія передачі через сітку має бути високою дугою: м'яч перелітає сітку з запасом і опускається до партнера."], "ul": ["Виходь під м'яч заздалегідь.", "Плечі й корпус спрямовані в бік передачі.", "Поштовх — випрямленням ніг і рук.", "Після передачі — супровід м'яча руками.", "Вправа на рахунок: скільки передач без помилок."]}, {"h": "Спорт заради розвитку. Рухливі ігри на свіжому повітрі", "p": ["Ігри на свіжому повітрі загартовують організм і покращують роботу дихальної системи. Восени можна грати в «Квача», футбол, «Вибивного», проводити естафети в парку.", "Одяг для ігор надворі має відповідати погоді: зручний, багатошаровий, щоб можна було зняти зайвий шар під час гри і вдягнути після неї."], "ul": ["Вдягайся за погодою, у кілька шарів.", "Не пий холодну воду одразу після гри.", "Грай подалі від доріг.", "Ігри надворі покращують настрій і сон.", "Після гри одягнися тепліше, щоб не застудитися."]}], "f": "Перебування на денному світлі допомагає організму виробляти вітамін D, потрібний для міцних кісток.", "pr": ["Опиши, як правильно вдягнутися для активних ігор надворі восени.", "Виконай вправи для формування постави: стійка біля стіни (1 хвилина), «кішечка» (10 разів), підняття рук угору стоячи з прямою спиною (15 разів)."], "q": ["Що таке фінальне зусилля в метанні?", "Чому заступ за лінію метання — це невдала спроба?", "Як має бути розташований гравець під м'ячем під час передачі зверху?", "Як одягатися для ігор на свіжому повітрі?"]}, {"n": "21", "t": "Рівномірний біг 1000/1500 м. Взаємодія ліній у волейболі. Ігри та проєктна діяльність", "g": "Учень знатиме, як правильно бігти на витривалість у рівномірному темпі, як взаємодіють лінії у волейболі та як скласти спортивний міні-проєкт.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Рівномірний біг", "біг з постійною швидкістю на всій дистанції."], ["Витривалість", "здатність довго виконувати роботу без зниження її ефективності."], ["Страхування", "дії гравця, який готовий підхопити м'яч, якщо партнер помилиться."], ["Проєкт", "завдання з чіткою метою, планом і результатом, яке виконують самостійно або в групі."]], "th": [{"h": "Легка атлетика. Рівномірний біг 1000 м (дівчата), 1500 м (хлопці)", "p": ["На довгих дистанціях головне — рівномірний темп і рівне дихання. Якщо стартувати занадто швидко, сили закінчаться на половині дистанції. Біжать з високого старту, крок вільний, тулуб прямий, руки працюють розслаблено.", "На останніх 100–200 метрах можна прискоритися, якщо залишилися сили. Після фінішу не зупиняйся різко — перейди на ходьбу."], "ul": ["Розподіляй сили рівно на всю дистанцію.", "Дихай ритмічно, носом і ротом.", "Ставь стопу м'яко, з передньої частини або перекатом.", "Не біжи на повну з перших метрів.", "Погане самопочуття — сигнал зменшити темп і повідомити вчителя."]}, {"h": "Волейбол. Взаємодія гравців передньої та задньої ліній", "p": ["Гравці задньої лінії відповідають за прийом подач і захист від ударів, а передньої — за атаку і блок. Під час атаки свого партнера інші гравці страхують його: стоять навпівприсіді поруч, щоб підхопити м'яч, якщо він відскочить від блоку.", "Узгодженість дій досягається тоді, коли кожен знає свою зону відповідальності та постійно спілкується з командою."], "ul": ["Кожен гравець відповідає за свою зону.", "Під час атаки партнера — страхування.", "Гравець задньої лінії не може атакувати м'яч вище сітки з передньої зони.", "Голосові команди допомагають уникнути помилок.", "Після розіграшу команда повертається на свої позиції."]}, {"h": "Спорт заради розвитку. Ігри для активного відпочинку. Проєктна діяльність", "p": ["Спортивний проєкт — це, наприклад, організація змагання у класі, створення плану активних вихідних для родини, відеоруханка чи дослідження рухової активності однокласників. Проєкт має мету, план дій, розподіл обов'язків і результат.", "Проєктна діяльність розвиває самостійність, творчість і вміння працювати в команді."], "ul": ["Сформулюй мету проєкту.", "Склади план і розподіли обов'язки.", "Визнач строки виконання.", "Продумай, як представиш результат.", "Оціни, що вийшло і що можна покращити."]}], "f": "Бігуни на довгі дистанції часто використовують «розмовний тест»: якщо під час бігу можна сказати коротку фразу, темп підходить для тренування витривалості.", "pr": ["Склади план міні-проєкту «Активні вихідні нашої родини»: мета, 3 активності, необхідне спорядження, правила безпеки.", "Для самовдосконалення виконай комплекс: ходьба на місці з високим підніманням колін (2 хвилини), присідання (2×15), розтяжка ніг (5 хвилин), і запиши свій пульс до і після комплексу."], "q": ["Чому на довгих дистанціях важливий рівномірний темп?", "Що таке страхування у волейболі?", "Які обов'язки мають гравці передньої і задньої ліній?", "З яких кроків складається проєкт?"]}, {"n": "22", "t": "Метання м'ячів різного діаметра. Навчальна гра у волейбол. Чесна гра", "g": "Учень закріпить знання техніки метання м'ячів різного діаметра, правил навчальної гри у волейбол і принципів чесної гри.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Набивний м'яч", "важкий м'яч, який використовують для розвитку сили та для метань двома руками."], ["Чесна гра (фейр-плей)", "принцип спорту, за яким гравці дотримуються правил і поважають суперника."], ["Партія", "частина волейбольного матчу, що триває до певної кількості очок."], ["Спортивна поведінка", "вміння гідно вигравати й програвати, поважати всіх учасників змагання."]], "th": [{"h": "Легка атлетика. Метання м'ячів різного діаметра на дальність", "p": ["Метання м'ячів різного розміру й ваги розвиває силу та координацію. Набивний м'яч кидають двома руками від грудей або з-за голови, а малий — однією рукою. Важливо, щоб у кидку брали участь ноги й тулуб.", "Безпека під час метань: метають лише за сигналом, в одному напрямку, по снаряди йдуть усі разом за командою."], "ul": ["Набивний м'яч з-за голови: ноги на ширині плечей, прогин, кидок.", "Від грудей: лікті в сторони, різке випрямлення рук.", "Малий м'яч: кидок однією рукою з-за голови.", "Не кидай м'яч у людей.", "Обирай вагу набивного м'яча відповідно до сил."]}, {"h": "Волейбол. Навчальна гра", "p": ["У навчальній грі закріплюють усі вивчені прийоми: подачу, прийом, передачу, нападаючий удар, блок. Сучасний волейбольний матч складається з партій до 25 очок (п'ята, вирішальна — до 15) з перевагою щонайменше у 2 очки.", "У навчальній грі вчитель може спрощувати правила, щоб усі учні брали участь і відпрацьовували техніку."], "ul": ["Три торкання на команду.", "Один гравець не торкається м'яча двічі поспіль.", "Не можна торкатися сітки.", "Перехід гравців після виграшу подачі.", "Поважайте рішення судді."]}, {"h": "Спорт заради розвитку. Правила чесної гри: боротися, вигравати і програвати", "p": ["Чесна гра (фейр-плей) означає грати за правилами, не обманювати, поважати суперника і суддю. Справжній спортсмен бореться до кінця, але не ціною здоров'я інших.", "Вміти вигравати — означає не хизуватися і не принижувати суперника. Вміти програвати — визнати перемогу іншого, привітати його й працювати над помилками."], "ul": ["Тисни руку суперникові до і після гри.", "Визнавай свої порушення.", "Допомагай суперникові, якщо він травмувався.", "Не сперечайся грубо з суддею.", "Поразка — це досвід, а не кінець."]}], "f": "Міжнародний комітет фейр-плей вручає нагороди спортсменам за вчинки чесної гри, навіть якщо ті не перемогли.", "pr": ["Напиши короткий кодекс чесної гри для свого класу з 5 правил.", "Виконай комплекс загальної фізичної підготовки: віджимання (3×10), присідання (3×15), планка бокова (по 20 секунд на кожен бік), «човник» (3×10 секунд)."], "q": ["Як кидають набивний м'яч від грудей?", "До скількох очок триває партія у волейболі?", "Що означає принцип фейр-плей?", "Як гідно програвати?"]}, {"n": "23", "t": "Рівномірний біг 1000/1500 м. Взаємодія ліній, навчальна гра. Рух у повсякденному житті", "g": "Учень удосконалить знання про біг на витривалість, взаємодію гравців у навчальній грі та навчиться поєднувати рухову активність із повсякденними справами.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Пульс", "кількість ударів серця за хвилину, яку можна порахувати на зап'ясті або шиї."], ["Темп бігу", "швидкість, з якою спортсмен долає дистанцію."], ["Розподіл сил", "план бігу, за яким спортсмен економить енергію, щоб вистачило до фінішу."], ["Рухова активність", "будь-які рухи протягом дня: ходьба, ігри, домашні справи, тренування."]], "th": [{"h": "Легка атлетика. Рівномірний біг 1000 м (дівчата), 1500 м (хлопці)", "p": ["Для контролю навантаження використовують пульс: його рахують за 10 або 15 секунд і множать на 6 або 4. Після бігу пульс має поступово знижуватися; якщо він довго залишається дуже високим, навантаження було надмірним.", "Хороший прийом — розділити дистанцію на частини і бігти кожну з однаковим темпом."], "ul": ["Пульс рахують на зап'ясті або на шиї.", "Після бігу — ходьба, вправи на дихання.", "Біжи в рівному темпі, без ривків.", "Тренуй витривалість регулярно, а не раз на місяць.", "Після бігу розтягни м'язи ніг."]}, {"h": "Волейбол. Взаємодія гравців передньої та задньої ліній. Навчальна гра", "p": ["Типова схема розіграшу: прийом подачі гравцем задньої лінії — передача пасувальнику біля сітки — нападаючий удар гравцем передньої лінії. Так команда використовує всі три торкання.", "У навчальній грі важливо не «стояти й чекати», а постійно рухатися, займати позицію і допомагати партнерам."], "ul": ["Перше торкання — прийом, друге — передача, третє — атака.", "Пасувальник стоїть біля сітки.", "Нападник готується до удару заздалегідь.", "Інші гравці страхують.", "Після розіграшу — швидко на свої місця."]}, {"h": "Спорт заради розвитку. Поєднання рухових дій із повсякденною діяльністю", "p": ["Не обов'язково йти в спортзал, щоб бути активним. Можна ходити пішки замість поїздки, підніматися сходами, робити руханку між уроками, допомагати вдома з прибиранням.", "Невеликі рухові перерви кожні 30–40 хвилин сидіння покращують кровообіг і зосередженість."], "ul": ["Ходи пішки на короткі відстані.", "Піднімайся сходами замість ліфта.", "Роби руханку між онлайн-уроками.", "Допомагай удома — це теж рух.", "Обмежуй час перед екраном."]}], "f": "Пульс зручно рахувати, приклавши два пальці (вказівний і середній) до зап'ястя з боку великого пальця.", "pr": ["Порахуй свій пульс у спокої, а потім після 20 присідань. Запиши обидва результати і час, за який пульс повернувся до початкового.", "Виконай комплекс загальної фізичної підготовки: присідання (3×15), віджимання (3×10), планка (3×30 секунд), «скручування» (3×12)."], "q": ["Як порахувати пульс?", "Як побудований типовий розіграш у волейболі?", "Як можна бути активним протягом дня без спортзалу?", "Навіщо робити рухові перерви під час навчання?"]}, {"n": "24", "t": "Підсумковий урок І чверті: легка атлетика, волейбол, спорт заради розвитку", "g": "Учень повторить основні знання з легкої атлетики, волейболу і спорту заради розвитку та підготується до діагностувальної роботи.", "k": "Модулі: Легка атлетика · Волейбол · Спорт заради розвитку", "terms": [["Діагностувальна робота", "перевірка знань і вмінь, яка показує, чого учень навчився за певний період."], ["Загальна фізична підготовка (ЗФП)", "розвиток основних фізичних якостей: сили, швидкості, витривалості, гнучкості, спритності."], ["Челендж", "виклик або завдання, яке учасники виконують і передають іншим."], ["Флешмоб", "заздалегідь спланована масова акція, під час якої учасники одночасно виконують однакові дії."]], "th": [{"h": "Легка атлетика. Підсумок", "p": ["За чверть ти вивчив біг на короткі, середні та довгі дистанції, стрибки у довжину з місця та з розбігу, стрибки у висоту способом «переступання», метання м'ячів. Ти знаєш, як правильно дихати й пити воду, як розпізнати втому й контролювати пульс.", "Головні правила легкої атлетики: розминка, правильна техніка, безпечне виконання метань і стрибків."], "ul": ["Біг: старт, розгін, біг по дистанції, фініш.", "Стрибки: розбіг, поштовх, політ, приземлення.", "Метання: розбіг, фінальне зусилля, гальмування.", "Витривалість — рівномірний темп і правильне дихання.", "Ознаки втоми та контроль пульсу."]}, {"h": "Волейбол. Підсумок", "p": ["Ти вивчив передачі зверху і знизу, передачі за спину, прийом м'яча від сітки, верхню та нижню подачі, нападаючий удар, одиночний блок і взаємодію гравців передньої та задньої ліній.", "Ти знаєш основні правила: три торкання на команду, заборона торкатися сітки, перехід гравців, підрахунок очок у партії."], "ul": ["Передачі: зверху — пальцями, знизу — передпліччями.", "Подачі: верхня і нижня, з-за лицьової лінії.", "Нападаючий удар: розбіг, стрибок, удар, приземлення.", "Блок — лише гравці передньої лінії.", "Схема: прийом — передача — атака."]}, {"h": "Спорт заради розвитку. Підсумок. Творчі завдання, ігри, челенджі", "p": ["Ти дізнався, як спорт розвиває особистість, вольові й моральні якості, комунікацію та командну взаємодію. Ти вчився контролювати емоції, проводити ігри, створювати естафети і танцювальні комбінації, ознайомився з фітнес-технологіями та правилами чесної гри.", "Творче завдання: знайди цікавий факт про позитивний вплив спорту на людину або історію відомого спортсмена й розкажи про це однокласникам."], "ul": ["Спорт виховує волю, чесність, повагу.", "Командна взаємодія — спілкування й підтримка.", "Контроль емоцій — дихання й позитивні думки.", "Ігри, естафети, флешмоби й челенджі об'єднують.", "Активний відпочинок — частина здорового способу життя."]}], "f": "", "pr": ["Склади 5 питань для вікторини за темами чверті (по одному з легкої атлетики, волейболу, спорту заради розвитку та два на вибір) із відповідями.", "Для самовдосконалення придумай спортивний челендж, безпечний для виконання вдома (наприклад, «30 днів планки» з поступовим збільшенням часу), і опиши його правила."], "q": ["Назви фази стрибка у довжину з розбігу.", "Які основні прийоми волейболу ти вивчив за чверть?", "Що таке чесна гра і як її дотримуватися?", "Як визначити свій стан втоми під час занять?"]}]}, {"name": "ІІ чверть. Петанк, доджбол, аеробіка", "lessons": [{"n": "25", "t": "Ознайомлення з модулями ІІ чверті: петанк, доджбол, аеробіка. Історія та загальна характеристика", "g": "Учень ознайомиться з модулями ІІ чверті, дізнається про походження петанку, доджболу й аеробіки та знатиме загальні правила безпеки на заняттях.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Петанк", "французька спортивна гра, у якій металеві кулі кидають якомога ближче до маленької дерев'яної кульки — кошонета."], ["Кошонет", "маленька кулька-ціль у петанку, яку ще називають «свинкою»."], ["Доджбол", "командна гра з м'ячем, мета якої — влучити м'ячем у суперників і самому ухилитися від влучання."], ["Аеробіка", "система ритмічних фізичних вправ під музику, що зміцнює серце, легені та м'язи."]], "th": [{"h": "Петанк. Історія та загальна характеристика", "p": ["Петанк виник на півдні Франції на початку XX століття. Назва походить від місцевого виразу, що означає «ноги разом»: гравці кидають кулі, стоячи нерухомо в колі, а не з розбігу. Тому в петанк можуть грати люди різного віку і фізичної підготовки.", "Гравці по черзі кидають металеві кулі, намагаючись покласти їх якомога ближче до кошонета або вибити кулі суперника. Перемагає той, хто першим набере 13 очок."], "ul": ["Грати можна один на один, два на два або три на три.", "Кидки виконують з кола, ноги не відриваються від землі.", "Очки отримує команда, чиї кулі ближче до кошонета.", "Грають на ґрунтовому або гравійному майданчику.", "Не стій перед тим, хто кидає, і не кидай, поки хтось на майданчику."]}, {"h": "Доджбол. Історія та загальна характеристика", "p": ["Доджбол виріс із дитячих ігор у «вибивного», відомих у багатьох країнах. Назва англійською означає «ухилитися від м'яча». Сучасний доджбол став спортивною грою з власними правилами та змаганнями.", "Дві команди на розділеному лінією майданчику кидають м'ячі в суперників. Гравець, у якого влучили, вибуває, а якщо гравець спіймав м'яч — вибуває той, хто кинув."], "ul": ["Використовують м'які м'ячі, безпечні для гравців.", "Не можна переходити центральну лінію.", "Кидки в голову, як правило, заборонені.", "Перемагає команда, яка вибила всіх суперників або має більше гравців наприкінці часу.", "Гра розвиває реакцію, спритність і командну тактику."]}, {"h": "Аеробіка. Історія та загальна характеристика", "p": ["Слово «аеробіка» пов'язане з аеробним (кисневим) способом енергозабезпечення: під час ритмічних тривалих вправ м'язи отримують енергію за участі кисню. Аеробіка поширилася у світі в другій половині XX століття як доступна оздоровча система.", "Сьогодні існують оздоровча аеробіка (для здоров'я і гарного самопочуття) та спортивна аеробіка (змагальний вид спорту зі складними елементами)."], "ul": ["Вправи виконують під музику, у певному темпі.", "Аеробіка розвиває витривалість, координацію, гнучкість.", "Займайся у зручному одязі та взутті, на нековзкій поверхні.", "Пий воду, контролюй самопочуття.", "Почни з простих кроків і поступово ускладнюй."]}], "f": "У петанк грають ті самі кулі в різних країнах світу, а змагання проводяться навіть на рівні чемпіонатів світу.", "pr": ["Вивчи правила безпеки для трьох модулів чверті й запиши по 3 правила для петанку, доджболу та аеробіки.", "Виконай коротку розминку під музику (5 хвилин): ходьба на місці, кроки в сторони, рухи руками вгору й у сторони, нахили."], "q": ["Звідки походить петанк і що означає його назва?", "Що відбувається, якщо гравець у доджболі спіймав м'яч?", "Чим оздоровча аеробіка відрізняється від спортивної?", "Які загальні правила безпеки діють на заняттях цієї чверті?"]}, {"n": "26", "t": "Поняття про петанк. Основні правила доджболу. Безпека в аеробіці та здоровий спосіб життя", "g": "Учень знатиме основні поняття петанку, головні правила доджболу, правила безпеки під час аеробіки та складові здорового способу життя.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Ігрове коло", "коло на майданчику для петанку, з якого гравець виконує кидок."], ["Кон (раунд)", "частина гри в петанк, після якої підраховують очки."], ["Вибування", "вихід гравця з гри в доджболі після влучання в нього м'ячем."], ["Здоровий спосіб життя", "спосіб життя, що включає рух, правильне харчування, сон, гігієну та відмову від шкідливих звичок."]], "th": [{"h": "Петанк. Поняття про петанк", "p": ["Гра в петанк складається з конів. На початку кону гравець креслить коло, стає в нього й кидає кошонет. Потім команди по черзі кидають кулі: першою кидає команда, що кидала кошонет, далі — та команда, чия куля не найближча до кошонета.", "Коли всі кулі кинуто, підраховують очки: команда-переможець кону отримує по одному очку за кожну свою кулю, що лежить ближче до кошонета, ніж найкраща куля суперника."], "ul": ["Гравець стоїть у колі обома ногами.", "Кидок — лише після того, як попередня куля зупинилася.", "Першою кидає команда, яка розпочала кон.", "Очки отримує лише одна команда в кожному коні.", "Гра триває до 13 очок."]}, {"h": "Доджбол. Основні правила гри", "p": ["Майданчик поділено навпіл центральною лінією. На початку гри м'ячі кладуть на центральній лінії, і команди за сигналом біжать по них. Гравець, у якого влучили м'ячем, вибуває. Якщо м'яч спіймали в руки — вибуває той, хто кинув, а в команду може повернутися гравець, що вибув раніше.", "Можна відбивати м'яч іншим м'ячем, який тримаєш у руках. Виходити за межі майданчика заборонено."], "ul": ["Влучання в тіло — гравець вибуває.", "Спіймав м'яч — вибуває той, хто кидав.", "Заступ за центральну лінію — порушення.", "Кидки в голову заборонені.", "Грають лише м'якими м'ячами."]}, {"h": "Аеробіка. Правила безпеки. Здоров'я та здоровий спосіб життя", "p": ["Аеробіку виконують після розминки, у зручному взутті з амортизуючою підошвою, на рівній і нековзкій поверхні. Між учасниками має бути достатньо місця, щоб не зачепити одне одного руками.", "Аеробіка — частина здорового способу життя. Здоров'я залежить від руху, харчування, сну, гігієни, гарних стосунків і відмови від шкідливих звичок."], "ul": ["Тримай дистанцію до сусідів витягнутими руками.", "Не займайся відразу після їжі.", "Контролюй дихання — воно не повинне збиватися дуже сильно.", "Спи 8–10 годин на добу.", "Харчуйся різноманітно, пий достатньо води."]}], "f": "У петанку спірні відстані між кулями й кошонетом вимірюють рулеткою або спеціальними вимірювальними інструментами.", "pr": ["Склади свій режим дня, у якому є місце для руху, сну, навчання та відпочинку.", "Виконай ранкову гігієнічну гімнастику (РГГ) з 6–8 вправ: ходьба на місці, повороти голови (плавно), кола руками, нахили, присідання, вправа на поставу, розтяжка."], "q": ["Як підраховують очки в петанку?", "Що відбувається, якщо в доджболі гравця влучили м'ячем?", "Які правила безпеки потрібно дотримуватися під час аеробіки?", "Назви складові здорового способу життя."]}, {"n": "27", "t": "Стратегія гри в петанк. Фізична підготовка доджболістів. Вплив аеробіки на організм", "g": "Учень знатиме основи стратегії в петанку, які фізичні якості потрібні в доджболі та як аеробіка впливає на дихальну, серцево-судинну й опорно-рухову системи.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Пойнтер", "гравець у петанку, який кидає кулі так, щоб вони лягли якомога ближче до кошонета."], ["Стрілок (тиратор)", "гравець у петанку, який вибиває кулі суперника прямим кидком."], ["Серцево-судинна система", "серце й судини, що доставляють кров з киснем до всіх органів."], ["Опорно-руховий апарат", "кістки, суглоби, зв'язки та м'язи, які дають змогу тримати тіло й рухатися."]], "th": [{"h": "Петанк. Стратегія гри. Розвиток петанкового спорту", "p": ["У петанку є два основні способи кидка: «підкласти» кулю ближче до кошонета (пойнтинг) або вибити кулю суперника (стрільба). У команді гравці часто розподіляють ролі: пойнтер точно «кладе» кулі, а стрілок прибирає небезпечні кулі суперника.", "Стратегія залежить від ситуації: якщо куля суперника лежить дуже близько, краще її вибити; якщо далеко — підкласти свою. Сьогодні петанк розвивається як спорт для всіх: у нього грають у клубах, на змаганнях і просто у дворах."], "ul": ["Перед кидком оціни, де лежать усі кулі.", "Порада: якщо ти найближче — не поспішай, нехай кидає суперник.", "Кулі можна зберігати на кінець кону.", "Розподіл ролей у команді підвищує ефективність.", "Петанк розвиває точність, зосередженість і тактичне мислення."]}, {"h": "Доджбол. Особливості фізичної підготовки доджболістів", "p": ["У доджболі потрібна швидка реакція (щоб ухилитися або спіймати м'яч), спритність, швидкість переміщень і сила рук для точних сильних кидків. Важлива також витривалість, бо гра йде в постійному русі.", "Для підготовки використовують ігри на реакцію, вправи з м'ячем, бокові переміщення, вправи для сили рук і плечей."], "ul": ["Реакція — ловіння м'яча, кинутого з різних відстаней.", "Спритність — ухиляння, нахили, бокові кроки.", "Сила рук — віджимання, кидки м'яча у стіну.", "Витривалість — рухливі ігри.", "Гнучкість плечей — кругові рухи, розтяжка."]}, {"h": "Аеробіка. Вплив вправ на дихальну, серцево-судинну та опорно-рухову системи", "p": ["Під час аеробіки серце скорочується частіше, і з часом воно стає сильнішим та ефективнішим. Дихання поглиблюється, легені краще вентилюються. Ритмічні рухи зміцнюють м'язи, кістки й суглоби, покращують поставу та координацію.", "Щоб вплив був позитивним, навантаження збільшують поступово, а вправи виконують технічно правильно."], "ul": ["Серце: зміцнюється, краще переносить навантаження.", "Дихання: збільшується об'єм легень, дихання стає глибшим.", "М'язи: стають сильнішими та витривалішими.", "Кістки й суглоби: зміцнюються, зберігають рухливість.", "Нервова система: покращується настрій, зменшується стрес."]}], "f": "У петанку влучний кидок, коли куля стрільця вибиває кулю суперника й залишається на її місці, називають «карро».", "pr": ["Намалюй схему ситуації в петанку (кошонет і кілька куль двох команд) і поясни, що краще зробити наступному гравцеві: підкласти кулю чи вибити.", "Виконай вправи для формування постави: стійка біля стіни (1 хвилина), «човник» (3×10 секунд), «кішечка» (10 разів)."], "q": ["Чим відрізняється роль пойнтера і стрілка в петанку?", "Які фізичні якості потрібні доджболістові?", "Як аеробіка впливає на серце і легені?", "Чому навантаження в аеробіці потрібно збільшувати поступово?"]}, {"n": "28", "t": "Ігрові стійки петанкиста, вправи для рук. Правила доджболу. Термінологія аеробіки", "g": "Учень знатиме ігрові стійки в петанку, основи гри в доджбол і основні терміни оздоровчої аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Стійка петанкиста", "положення гравця в колі під час кидка: стоячи або присівши."], ["Ухилення", "рух тіла в доджболі, щоб уникнути влучання м'яча."], ["Базовий крок", "простий крок аеробіки, з якого складаються комбінації."], ["Степ", "крок або підйом на спеціальну платформу в аеробіці."]], "th": [{"h": "Петанк. Ігрові стійки петанкиста. Вправи для рук, безпека", "p": ["Кидати кулю можна стоячи або присівши. Стійка присівши дає кращий контроль при пойнтингу на коротку відстань: гравець стоїть на передній частині стоп, коліна зігнуті, рука опущена. Стійка стоячи частіше використовується для стрільби або дальніх кидків.", "Перед грою розминають кисті, лікті й плечі: кула важка, і непідготовлені суглоби можуть перевантажитися."], "ul": ["Обидві ноги в колі, не відриваються до приземлення кулі.", "Корпус спрямований до цілі.", "Розминай пальці, кисті та плечі.", "Куля важка: не кидай її в напрямку людей.", "Не підходь до майданчика, коли хтось кидає."]}, {"h": "Доджбол. Правила та основи гри", "p": ["Гра в доджбол поєднує атаку (кидки в суперників) і захист (ухилення, ловіння, відбивання). Добрий гравець постійно рухається, стежить за кількома суперниками і швидко ухвалює рішення.", "Порушення правил: перехід центральної лінії, вихід за межі майданчика, кидок у голову, утримання м'яча надто довго (якщо таке обмеження введене)."], "ul": ["Атака: точний швидкий кидок у тулуб або ноги.", "Захист: ухилення, ловіння, відбивання м'ячем.", "Не стій на місці — рухайся.", "Тримай м'яч, щоб відбиватися ним.", "Поважай рішення судді."]}, {"h": "Аеробіка. Термінологія сучасної оздоровчої аеробіки", "p": ["В аеробіці використовують спеціальні терміни, переважно англійського походження, щоб тренер і учасники швидко розуміли одне одного. Більшість кроків мають короткі назви.", "Знання термінів допомагає швидко засвоювати нові комбінації та розуміти пояснення інструктора."], "ul": ["Марш (march) — ходьба на місці.", "Степ-тач (step touch) — крок у сторону і приставлення.", "Ві-степ (V-step) — кроки вперед-нарізно і назад-разом.", "Грейпвайн (grapevine) — схресний крок у сторону.", "Ні-ліфт (knee lift) — підйом коліна."]}], "f": "Більшість назв кроків аеробіки англійські, тому їх розуміють на заняттях у різних країнах світу.", "pr": ["Вивчи правила безпеки для петанку й доджболу та запиши їх у вигляді пам'ятки з 6 пунктів.", "Склади словничок аеробіки з 5 термінів і виконай кожен крок по 8 разів на місці."], "q": ["Які стійки використовують у петанку?", "Чому важливо розминати кисті й плечі перед петанком?", "Які дії належать до захисту в доджболі?", "Що означають терміни «марш» і «степ-тач»?"]}, {"n": "29", "t": "Захват кулі в петанку. Імітація і самоконтроль у доджболі. Невербальні команди в аеробіці", "g": "Учень знатиме правильний захват кулі для петанку, значення імітаційних вправ і самоконтролю в доджболі та основні невербальні команди в аеробіці.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Захват кулі", "спосіб утримання кулі в долоні перед кидком."], ["Імітаційні вправи", "вправи, які повторюють рух без предмета або в спрощених умовах."], ["Самоконтроль", "спостереження за власним самопочуттям і станом організму під час занять."], ["Невербальні команди", "жести інструктора, якими він показує напрямок, кількість повторень чи зміну руху без слів."]], "th": [{"h": "Петанк. Захват кулі. Історія спорту", "p": ["Кулю тримають пальцями, долонею донизу, без сильного стискання. Під час кидка рука рухається знизу вперед, а куля злітає з пальців, отримуючи зворотне обертання, яке допомагає їй зупинитися ближче до цілі.", "Петанк став популярним у Франції, а потім поширився по всьому світу. Сьогодні існують національні федерації та міжнародні змагання."], "ul": ["Долоня — донизу, пальці охоплюють кулю.", "Не стискай кулю всією силою.", "Мах рукою — плавний, знизу вперед.", "Кисть наприкінці кидка трохи «підкручує» кулю.", "Після кидка рука проводить кулю до цілі."]}, {"h": "Доджбол. Імітаційні вправи, самоконтроль", "p": ["Імітаційні вправи (кидок без м'яча, ухилення від уявного м'яча, бокові переміщення) дозволяють засвоїти рух без ризику травми. Вони особливо корисні для вивчення техніки кидка.", "Самоконтроль — це вміння стежити за пульсом, диханням, самопочуттям і настроєм. Після напруженої гри корисно порахувати пульс і перевірити, як швидко він відновлюється."], "ul": ["Імітація кидка: замах, крок, рух руки вперед.", "Ухилення: нахил, присід, крок у сторону.", "Слідкуй за диханням і пульсом.", "Ознаки перевтоми: запаморочення, біль, нудота.", "Записуй самопочуття у щоденник самоконтролю."]}, {"h": "Аеробіка. Невербальні команди", "p": ["Під час заняття під гучну музику голосові команди погано чути, тому інструктор використовує жести. Вони попереджають про зміну руху або напрямку за кілька рахунків до неї.", "Знання жестів допомагає виконувати комбінації синхронно з групою."], "ul": ["Показ пальцями — кількість повторень, що залишилися.", "Рука вказує напрямок — рух у той бік.", "Рука над головою з круговим рухом — повторити з початку.", "Долоня до себе — рух уперед до інструктора.", "Показ на ногу — змінити опорну ногу."]}], "f": "Зворотне обертання, яке гравці надають кулі в петанку, допомагає їй гальмувати після приземлення і менше відкочуватися.", "pr": ["Опиши в зошиті правильний захват кулі в петанку й намалюй положення руки.", "Виконай вправи для формування постави: повільні підйоми рук через сторони вгору стоячи біля стіни (15 разів), «супермен» (3×10 секунд), стійка на носках біля стіни (30 секунд)."], "q": ["Як правильно тримати кулю в петанку?", "Чим корисні імітаційні вправи?", "Що таке самоконтроль і як його здійснювати?", "Навіщо в аеробіці потрібні невербальні команди?"]}, {"n": "30", "t": "Визначення відстані до кошонета. Розташування гравців у доджболі. Заборонені вправи в аеробіці", "g": "Учень навчиться оцінювати відстань до цілі в петанку, знатиме, як розташовуються гравці в доджболі, і які вправи заборонені в оздоровчій аеробіці.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Окомір", "здатність точно оцінювати відстань на око."], ["Ігрова позиція", "місце гравця на майданчику, з якого він виконує свої завдання в команді."], ["Перерозгинання", "надмірне розгинання суглоба, яке може призвести до травми."], ["Балістичні рухи", "різкі пружні ривки під час розтягування, які підвищують ризик травми."]], "th": [{"h": "Петанк. Визначення відстані до цілі (кошонета)", "p": ["Успішний кидок у петанку неможливий без точної оцінки відстані. Гравець дивиться на кошонет і місце, де куля має приземлитися, ураховуючи, що після приземлення вона ще прокотиться. Тому точку приземлення обирають трохи ближче за ціль.", "Спірні відстані між кулями й кошонетом вимірюють, а не визначають «на око»."], "ul": ["Обери точку приземлення до кидка.", "Враховуй рельєф і покриття майданчика.", "Окомір тренують, оцінюючи відстань і перевіряючи її кроками.", "Під час вимірювання не зрушуй кулі.", "Висота кидка впливає на те, наскільки далеко прокотиться куля."]}, {"h": "Доджбол. Розташування гравців на майданчику", "p": ["Гравці мають розташовуватися так, щоб не заважати одне одному і щоб суперникам було важко влучити. Сильні кидальники стоять ближче до центральної лінії, а ті, хто краще ловить, — трохи позаду.", "Купчитися в одному місці небезпечно: суперники легше влучать у групу."], "ul": ["Розосереджуйтеся по майданчику.", "Не стійте впритул до задньої лінії — немає куди відступати.", "Ближче до центру — атакуючі гравці.", "Ловці страхують і підбирають м'ячі.", "Стежте за кількома суперниками одночасно."]}, {"h": "Аеробіка. Заборонені вправи в аеробіці", "p": ["В оздоровчій аеробіці уникають рухів, що створюють надмірне навантаження на суглоби і хребет. Наприклад, кругові рухи головою з закиданням назад, різкі пружні нахили з прямими ногами, глибокі присіди з навантаженням на коліна, перерозгинання колін і ліктів.", "Безпечна альтернатива — плавні повороти й нахили голови, нахили з трохи зігнутими колінами, присідання до кута приблизно 90° у колінах."], "ul": ["Не закидай голову назад різким рухом.", "Не виконуй пружні ривки в розтяжці.", "Не перерозгинай коліна і лікті.", "Коліна під час присідання — над стопами, не заходять усередину.", "Не затримуй дихання під час вправ."]}], "f": "У розтяжці безпечніше повільно утримувати положення, ніж робити пружні ривки: м'язи краще розслабляються.", "pr": ["Потренуй окомір вдома: оціни на око відстань до 5 предметів, а потім перевір її кроками чи рулеткою. Запиши результати.", "Виконай вправи для формування постави: стійка біля стіни (1 хвилина), «кішечка» (10 разів), «місток» лежачи — підйом таза (2×12)."], "q": ["Чому точку приземлення кулі обирають ближче, ніж кошонет?", "Як треба розташовуватися гравцям у доджболі?", "Назви три заборонені вправи в оздоровчій аеробіці.", "Яка безпечна альтернатива пружним нахилам?"]}, {"n": "31", "t": "Спеціальні вправи для кидків у петанку. Кидки м'яча зверху в парах. Рухи руками в аеробіці", "g": "Учень знатиме спеціальні вправи для точних кидків у петанку, техніку кидка м'яча зверху в доджболі та вимоги до рухів руками в аеробіці.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Кидок зверху", "кидок м'яча однією рукою над плечем, найпоширеніший у доджболі."], ["Влучність", "здатність точно потрапити в ціль."], ["Амплітуда руху", "розмах руху від початкового до кінцевого положення."], ["Фіксація положення", "коротка зупинка руки в кінцевій точці руху, яка робить рух чітким."]], "th": [{"h": "Петанк. Спеціальні бігові вправи і вправи для кидків", "p": ["Хоча в петанку не бігають з кулею, розминка з легким бігом і бігові вправи розігрівають тіло. Для кидків виконують вправи на точність: кидки м'ячика в обруч, на позначку, на різні відстані.", "Важливо повторювати однаковий рух руки щоразу, щоб кидок ставав стабільним."], "ul": ["Розминка: легкий біг, бігові вправи, кола руками.", "Кидки в обруч з різних відстаней.", "Кидки на позначку з приземленням точно в ціль.", "Тренування однакового маху руки.", "Безпека: кидки — лише в одному напрямку."]}, {"h": "Доджбол. Кидки м'яча зверху в парах", "p": ["Кидок зверху виконують так: м'яч у руці над плечем, лікоть на рівні плеча або вище, ліва нога (для правші) попереду. Кидок починається з повороту корпусу, далі рука рухається вперед, кисть наприкінці «підштовхує» м'яч.", "У парах партнери кидають і ловлять м'яч, поступово збільшуючи відстань."], "ul": ["Лікоть високо, м'яч над плечем.", "Протилежна нога попереду.", "Поворот корпусу додає силу.", "Ловля: руки назустріч м'ячу, амортизація.", "Спочатку точність, потім сила."]}, {"h": "Аеробіка. Вимоги до виконання рухів руками", "p": ["Рухи руками роблять аеробіку яскравішою й додають навантаження. Вони мають бути чіткими, з контролем, без різких ривків і перерозгинання ліктів. Плечі опущені, спина рівна.", "Руки рухаються узгоджено з кроками і в темпі музики."], "ul": ["Рухи чіткі, з фіксацією положення.", "Лікті не перерозгинаються.", "Плечі розслаблені й опущені.", "Руки узгоджені з кроками.", "Почни з простих рухів: угору, у сторони, вперед."]}], "f": "У петанку бувають спеціальні змагання на точність стрільби, де гравці по черзі вибивають кулі, розташовані в певних позиціях.", "pr": ["Виконай вправу на влучність: 20 разів кинь згорнуту шкарпетку в коробку або кошик з відстані 2 метрів. Запиши кількість влучань.", "Виконай вправи для формування постави з рухами руками: марш на місці з підйомом рук угору і в сторони (2 хвилини), зведення лопаток (15 разів)."], "q": ["Які вправи допомагають зробити кидки в петанку точнішими?", "Опиши техніку кидка м'яча зверху.", "Як правильно ловити м'яч?", "Які вимоги до рухів руками в аеробіці?"]}, {"n": "32", "t": "Ігри для швидкості й сили. Вправи з м'ячем, кидок. Амплітуда рухів руками в аеробіці", "g": "Учень знатиме, як рухливі ігри розвивають швидкісно-силові якості, вправи з м'ячем для доджболу і як розрізняють рухи руками за амплітудою.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Швидкісно-силові якості", "здатність виконувати потужні рухи за короткий час, наприклад стрибок чи ривок."], ["Малоамплітудні рухи", "рухи руками з невеликим розмахом, наприклад згинання в ліктях."], ["Великоамплітудні рухи", "рухи руками з великим розмахом, наприклад махи прямими руками."], ["Вправи з м'ячем", "кидки, ловіння, передачі та маніпуляції м'ячем для розвитку спритності."]], "th": [{"h": "Петанк. Рухливі ігри для розвитку швидкісно-силових здібностей", "p": ["Під час занять петанком використовують рухливі ігри, які розвивають швидкість і силу, — наприклад, естафети з короткими прискореннями, ігри з наздоганянням. Вони роблять уроки цікавішими й покращують загальну фізичну підготовку.", "Такі ігри завжди проводять після розминки та з дотриманням правил безпеки."], "ul": ["Ігри з ривками розвивають швидкість.", "Ігри з подоланням опору розвивають силу.", "Чергуй навантаження й відпочинок.", "Не штовхайся і не зачіпай інших.", "Після гри — відновлення дихання."]}, {"h": "Доджбол. Вправи з м'ячем, кидок", "p": ["Вправи з м'ячем: перекидання з руки в руку, підкидання і ловіння, кидки у стіну з ловінням, передачі в парах. Вони розвивають «відчуття м'яча», реакцію та влучність.", "Кидок у доджболі має бути не лише сильним, а й точним, бо промах дає суперникові м'яч."], "ul": ["Перекидання з руки в руку — розвиває координацію.", "Кидки у стіну — реакція і ловіння.", "Кидки в ціль — влучність.", "Чергуй праву й ліву руку.", "Не кидай м'яч у людей поза грою."]}, {"h": "Аеробіка. Розподіл рухів руками залежно від амплітуди", "p": ["За амплітудою рухи руками поділяють на малоамплітудні (згинання і розгинання в ліктях, рухи кистями), середньоамплітудні (рухи від ліктя, наприклад до плеча) та великоамплітудні (махи і кола прямими руками).", "Великоамплітудні рухи створюють більше навантаження на серце, тому їх використовують в основній частині заняття. У розминці та заминці переважають малі й середні рухи."], "ul": ["Малі: згинання рук, рухи кистями.", "Середні: рухи від ліктя, руки до плечей.", "Великі: махи, кола прямими руками.", "Великі рухи підвищують пульс.", "Рухи виконуються чітко, без ривків."]}], "f": "Підняття рук вище рівня серця під час аеробіки помітно збільшує частоту пульсу — це спосіб регулювати навантаження без зміни кроків.", "pr": ["Склади комплекс загальнорозвивальних вправ (ЗРВ) з 6 вправ із поступовим збільшенням амплітуди рухів руками і запиши його.", "Виконай цей комплекс під музику (по 8 повторень кожної вправи)."], "q": ["Які рухливі ігри розвивають швидкісно-силові якості?", "Які вправи з м'ячем розвивають реакцію?", "На які групи поділяють рухи руками за амплітудою?", "Чому великі рухи використовують в основній частині заняття?"]}, {"n": "33", "t": "Вправи для кидків у петанку. Кидок по цілі в доджболі. Low, Middle, High impact в аеробіці", "g": "Учень знатиме вправи для точності кидків, техніку кидка м'яча по визначеній цілі та як розрізняють вправи аеробіки за інтенсивністю.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Low impact", "низькоударні вправи аеробіки, під час яких одна нога завжди торкається підлоги."], ["High impact", "високоударні вправи аеробіки з фазою польоту, тобто зі стрибками й підскоками."], ["Middle impact", "вправи середньої інтенсивності, що поєднують кроки з невеликими пружними рухами без значного польоту."], ["Інтенсивність", "ступінь напруженості роботи організму під час вправи."]], "th": [{"h": "Петанк. Спеціальні вправи для кидків", "p": ["Для точності в петанку тренують однаковий рух руки і точку приземлення кулі. Корисні вправи: кидки в обруч, кидки з кола на різні відстані, кидки по черзі «ближче-далі».", "Стабільний результат дає зосередженість: перед кожним кидком гравець зупиняється, дивиться на ціль і лише потім кидає."], "ul": ["Однаковий захват кулі щоразу.", "Плавний мах рукою, без ривка.", "Погляд — на точку приземлення.", "Кидки на різні відстані.", "Записуй, скільки разів поклав кулю в ціль."]}, {"h": "Доджбол. Кидок м'яча по визначеній цілі", "p": ["У грі суперник рухається, тому кидок потрібно спрямовувати туди, де він буде. Ціль обирають у ноги або тулуб, оскільки туди важче ухилитися і заборонено влучати в голову.", "Вправи: кидки в мішень на стіні, кидки в кеглю, кидки в рухому ціль (м'яч, що котиться)."], "ul": ["Обирай ціль до кидка.", "Цілься в ноги чи тулуб, ніколи — в голову.", "Кидок має бути швидким, без довгого замаху.", "Тренуй кидки обома руками.", "Влучність важливіша за силу."]}, {"h": "Аеробіка. Розподіл вправ за інтенсивністю та навантаженням на опорно-руховий апарат", "p": ["Low impact — вправи без стрибків (марш, степ-тач, ві-степ). Вони безпечні для суглобів і підходять для початківців і розминки. High impact — вправи зі стрибками (підскоки, джампінг-джек), які створюють найбільше навантаження на суглоби та серце. Middle impact займає проміжне місце.", "Поєднуючи вправи різної інтенсивності, інструктор регулює навантаження протягом заняття."], "ul": ["Low impact: марш, крок у сторону, підйом коліна.", "Middle impact: пружні кроки, присід із підйомом на носки.", "High impact: підскоки, стрибки ноги нарізно-разом.", "Початківцям краще почати з low impact.", "Приземлення після стрибка — м'яке, на передню частину стопи з перекатом."]}], "f": "Low impact аеробіку часто радять людям, які лише починають займатися або відновлюються після травм, бо вона менше навантажує суглоби.", "pr": ["Склади таблицю з трьох колонок (Low, Middle, High impact) і запиши в кожну по 2–3 вправи.", "Виконай вправи на гнучкість: нахил уперед сидячи (3×20 секунд), «метелик» сидячи (30 секунд), розтягування задньої поверхні стегна стоячи з опорою (по 20 секунд)."], "q": ["Як зробити кидки в петанку стабільнішими?", "Куди дозволено цілитися в доджболі?", "Чим відрізняються Low impact і High impact вправи?", "Чому початківцям краще починати з Low impact?"]}, {"n": "34", "t": "Гра в петанк за простими правилами. Навчальна гра в доджбол. Структура заняття з аеробіки", "g": "Учень знатиме, як провести гру в петанк за простими правилами, головні елементи гри в доджбол і з яких частин складається заняття з аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Підготовча частина", "розминка на початку заняття, що готує організм до навантаження."], ["Основна частина", "частина заняття, у якій виконують головні вправи з найбільшим навантаженням."], ["Заключна частина", "заминка наприкінці заняття для відновлення та розтягування м'язів."], ["Спрощені правила", "правила, адаптовані для навчання чи початківців."]], "th": [{"h": "Петанк. Гра за простими правилами", "p": ["Для гри за простими правилами досить кількох куль, кошонета та рівного майданчика. Гравці по черзі кидають кошонет, потім кулі. Після кону рахують, хто ближче, і нараховують очки. Гру можна вести до меншої кількості очок, щоб вона була коротшою.", "У грі можна використовувати замінники: м'які м'ячики замість металевих куль і маленький м'ячик замість кошонета."], "ul": ["Креслимо коло і кидаємо кошонет.", "Кидаємо по черзі, стоячи в колі.", "Рахуємо очки після кожного кону.", "Наступний кон починає переможець попереднього.", "Перемагає перший, хто набрав домовлену кількість очок."]}, {"h": "Доджбол. Елементи навчальної гри", "p": ["У навчальній грі закріплюють кидки, ловіння, ухилення та взаємодію в команді. Можна вводити спрощення: менше м'ячів, менший майданчик, повернення вибулих гравців за певних умов.", "Головне — грати безпечно і чесно: визнавати влучання в себе, не кидати в голову і не сперечатися."], "ul": ["Атакуй точно, захищайся спритно.", "Підбирай м'ячі для команди.", "Визнавай, якщо в тебе влучили.", "Підтримуй партнерів.", "Дотримуйся меж майданчика."]}, {"h": "Аеробіка. Структура заняття", "p": ["Заняття з аеробіки має три частини. Підготовча частина (розминка) — прості рухи в помірному темпі, розігрів м'язів і суглобів. Основна частина — комбінації кроків і рухів руками з найбільшим навантаженням, а також вправи на силу. Заключна частина — поступове зниження темпу, дихальні вправи й розтяжка.", "Правильна структура робить заняття ефективним і безпечним."], "ul": ["Розминка — поступове збільшення пульсу.", "Основна частина — аеробні комбінації, силові вправи.", "Заминка — повільні рухи, відновлення дихання.", "Розтяжка наприкінці — 5–10 хвилин.", "Не пропускай розминку й заминку."]}], "f": "", "pr": ["Намалюй схему заняття з аеробіки у вигляді «гори»: як змінюється навантаження від розминки до заминки, і підпиши кожну частину.", "Виконай вправи на гнучкість: нахили в сторони (по 10), «кішечка» (10 разів), розтягування м'язів стегна стоячи з опорою (по 20 секунд)."], "q": ["Що потрібно, щоб зіграти в петанк за простими правилами?", "Які спрощення можна вводити в навчальну гру в доджбол?", "З яких частин складається заняття з аеробіки?", "Що виконують у заключній частині заняття?"]}, {"n": "35", "t": "Стратегія гри й кидок кошонета. Естафети з елементами доджболу. Темп музики в аеробіці", "g": "Учень знатиме, як правильно кидати кошонет і використовувати це в стратегії, як проводять естафети з елементами доджболу та як темп музики залежить від частини заняття.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Кидок кошонета", "кидок маленької кульки-цілі на початку кону, з якого починається гра."], ["Темп музики", "швидкість музики, яку вимірюють кількістю ударів (долей) за хвилину."], ["Музичний акцент", "сильна доля в музиці, на яку зручно починати рух."], ["Плоскостопість", "сплощення склепіння стопи, яке погіршує амортизацію під час ходьби та бігу."]], "th": [{"h": "Петанк. Стратегія гри, кидок кошонета", "p": ["Команда, що кидає кошонет, обирає відстань і місце, вигідні для себе. Якщо твої гравці краще кидають на коротку відстань, кошонет кидають ближче, якщо на дальню — далі. Кошонет має лягти на визначеній правилами відстані від кола.", "Також ураховують рельєф майданчика: на нерівному місці кулі котяться непередбачувано, і це може допомогти або заважати."], "ul": ["Кошонет кидає команда, яка починає кон.", "Обирай відстань, зручну для своєї команди.", "Враховуй рельєф і покриття.", "Кошонет кидають із кола, як і кулі.", "Якщо кошонет кинуто неправильно, його перекидають за правилами."]}, {"h": "Доджбол. Естафети з елементами гри", "p": ["Естафети з елементами доджболу допомагають відпрацювати кидки, ловіння і ухилення в ігровій формі. Наприклад: пробігти до позначки, влучити м'ячем у ціль, повернутися й передати м'яч наступному.", "Естафети розвивають швидкість, влучність і командний дух."], "ul": ["Етап з кидком у мішень.", "Етап з ловінням м'яча від партнера.", "Етап з веденням м'яча.", "Передача естафети — лише за лінією.", "Вболівайте за свою команду."]}, {"h": "Аеробіка. Темп музики й рухи залежно від структури заняття", "p": ["Темп музики визначає швидкість рухів. У розминці темп помірний, рухи прості. В основній частині темп швидший, рухи складніші. У заминці темп поступово сповільнюється, і заняття закінчується спокійною музикою для розтяжки.", "Рухи починають на сильну долю музики, рахуючи «вісімками»."], "ul": ["Розминка — помірний темп.", "Основна частина — найшвидший темп.", "Заминка — повільна музика.", "Рахунок «вісімками» допомагає тримати ритм.", "Якщо важко — зменш амплітуду, а не зупиняйся різко."]}], "f": "Швидкість музики вимірюють у ударах за хвилину, а інструктори аеробіки добирають треки саме за цим показником.", "pr": ["Обери 3 пісні: для розминки, основної частини й заминки. Поясни, чому кожна підходить за темпом.", "Виконай вправи для профілактики плоскостопості: ходьба на носках і на зовнішньому краї стоп (по 1 хвилині), збирання пальцями ніг дрібних предметів чи хустки (2 хвилини), перекати м'ячика стопою (по 1 хвилині)."], "q": ["Як команда обирає, куди кинути кошонет?", "Як можна побудувати естафету з елементами доджболу?", "Як змінюється темп музики протягом заняття з аеробіки?", "Чому важливо запобігати плоскостопості?"]}, {"n": "36", "t": "Ігри «Вовк і кози», «У довгої лози». Ловіння й кидки знизу. Базові кроки аеробіки", "g": "Учень ознайомиться з українськими народними рухливими іграми, техніки ловіння й кидка знизу в доджболі та основними базовими кроками аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Народна рухлива гра", "гра, створена народом і передавана з покоління в покоління."], ["Кидок знизу", "кидок м'яча рухом руки знизу вперед, точніший на коротку відстань."], ["Ловіння з амортизацією", "ловіння м'яча, під час якого руки рухаються назустріч м'ячу, а потім пом'якшують його удар."], ["Мамбо", "базовий крок аеробіки: крок уперед, переступ на місці, крок назад і переступ."]], "th": [{"h": "Петанк. Рухливі ігри «Вовк і кози», «У довгої лози»", "p": ["На уроках петанку використовують українські народні рухливі ігри для розвитку швидкості та спритності. «Вовк і кози» — гра з наздоганянням: «вовк» ловить «кіз», які тікають у безпечну зону. «У довгої лози» — гра, у якій учасники по черзі перестрибують через товаришів, що стоять зігнувшись.", "Ігри в стрибки через партнера проводять лише під наглядом учителя, на м'якій поверхні, з правильною стійкою «лози»."], "ul": ["Перед грою — розминка.", "Ловити можна лише дотиком, без поштовхів.", "«Лоза» стоїть стійко, голову ховає.", "Стрибати лише за командою, по черзі.", "Народні ігри зберігають традиції й розвивають командний дух."]}, {"h": "Доджбол. Ловіння та кидки м'яча знизу в парах", "p": ["Кидок знизу виконують прямою рукою знизу вперед, як у боулінгу, але з польотом м'яча. Він повільніший, проте точніший, і зручний для передач партнеру.", "Ловіння: руки витягнуті назустріч м'ячу, пальці розставлені, у момент контакту руки згинаються і притискають м'яч до грудей."], "ul": ["Кидок знизу — плавний мах прямою рукою.", "Ловіння — руки назустріч, потім до себе.", "Пальці не напружуй, щоб не травмувати.", "Дивись на м'яч до моменту ловіння.", "Поступово збільшуй відстань між партнерами."]}, {"h": "Аеробіка. Основні та базові кроки", "p": ["Базові кроки — основа будь-якої комбінації. До них належать марш, степ-тач, ві-степ, грейпвайн, мамбо, ні-ліфт, кік (мах ногою вперед) та інші.", "Кожен крок спершу вивчають повільно, без рук, потім додають рухи руками й темп музики."], "ul": ["Марш — ходьба на місці.", "Степ-тач — крок убік і приставлення.", "Ві-степ — кроки вперед-нарізно і назад-разом.", "Грейпвайн — схресний крок убік.", "Мамбо — крок вперед і назад з переступом."]}], "f": "Багато українських народних ігор мають схожі версії в інших країнах, але з власними назвами та примовками.", "pr": ["Розпитай рідних, у які рухливі ігри вони грали в дитинстві, і запиши правила однієї з них.", "Виконай комплекс загальної фізичної підготовки з базовими кроками аеробіки: марш, степ-тач, ві-степ, грейпвайн — по 16 рахунків кожен, 3 повтори, без стрибків."], "q": ["Які правила гри «Вовк і кози»?", "Як правильно ловити м'яч?", "Чим кидок знизу відрізняється від кидка зверху?", "Назви 4 базові кроки аеробіки."]}, {"n": "37", "t": "Навчальна гра в петанк. Кидки зверху в парах і трійках. Базові кроки зі зміною напрямку", "g": "Учень закріпить знання правил петанку в навчальній грі, техніку кидків зверху в парах і трійках та навчиться змінювати напрямок під час базових кроків аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Тріплет", "гра в петанк трьох проти трьох."], ["Дуплет", "гра в петанк двох проти двох."], ["Тет-а-тет", "гра в петанк один на один."], ["Зміна напрямку", "виконання кроку з поворотом або переміщенням уперед, назад, у сторону чи по діагоналі."]], "th": [{"h": "Петанк. Навчальна гра", "p": ["У петанк грають у форматах тет-а-тет (1 на 1), дуплет (2 на 2) та тріплет (3 на 3). У тет-а-теті й дуплеті кожен гравець має по три кулі, у тріплеті — по дві.", "Під час навчальної гри дотримуйся черговості, не заходь на майданчик, поки хтось кидає, і чесно визнавай, чия куля ближче."], "ul": ["Тет-а-тет: 1 на 1, по 3 кулі.", "Дуплет: 2 на 2, по 3 кулі.", "Тріплет: 3 на 3, по 2 кулі.", "Кидає та команда, що не має найближчої кулі.", "Спірні відстані вимірюють."]}, {"h": "Доджбол. Кидки м'яча зверху в парах, трійках", "p": ["У трійках гравці стоять трикутником і передають м'яч по колу кидком зверху, потім змінюють напрямок. Це вчить швидко ловити й одразу кидати, як у грі.", "Важливо стежити, кому кидаєш, і попереджати партнера поглядом або голосом."], "ul": ["Стійка: протилежна нога попереду.", "Лікоть високо, м'яч над плечем.", "Ловля з амортизацією.", "Швидкий перехід від ловіння до кидка.", "Зміна напрямку передач за сигналом."]}, {"h": "Аеробіка. Базові кроки зі зміною напрямку під час переміщення", "p": ["Базові кроки можна виконувати на місці, з переміщенням уперед-назад, у сторони, по діагоналі або з поворотом. Зміна напрямку робить комбінації цікавішими та розвиває координацію й орієнтування в просторі.", "Спершу виконують кроки з переміщенням повільно, потім — у темпі музики."], "ul": ["Марш з переміщенням уперед і назад.", "Грейпвайн — у праву і ліву сторони.", "Ві-степ із поворотом на 90°.", "Степ-тач по діагоналі.", "Слідкуй, щоб не зачепити сусідів."]}], "f": "У петанку одні й ті самі правила застосовуються для всіх форматів гри, різниться лише кількість гравців і куль.", "pr": ["Склади таблицю форматів гри в петанк: назва, кількість гравців, кількість куль у кожного.", "Виконай вправи для формування постави з кроками аеробіки: марш з переміщенням уперед-назад із прямою спиною (2 хвилини), грейпвайн у сторони (8 разів у кожен бік), стійка біля стіни (1 хвилина)."], "q": ["Які формати гри є в петанку?", "Скільки куль має кожен гравець у тріплеті?", "Як виконують кидки зверху в трійках?", "Як можна змінювати напрямок у базових кроках?"]}, {"n": "38", "t": "Рухливі ігри «Лоза», «У річку, гоп». Фіксована позиція гравців. Кроки аеробіки з рухами руками", "g": "Учень знатиме правила народних ігор «Лоза» та «У річку, гоп», значення фіксованих позицій гравців у доджболі та як поєднувати базові кроки з рухами руками в різному темпі.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Гра на увагу", "гра, у якій потрібно правильно реагувати на команди ведучого й не помилитися."], ["Фіксована позиція", "закріплене місце гравця на майданчику з певним завданням."], ["Темпо-ритм", "співвідношення швидкості рухів і їх ритмічного малюнка."], ["Координація рухів", "здатність узгоджувати рухи різних частин тіла."]], "th": [{"h": "Петанк. Рухливі ігри «Лоза», «У річку, гоп»", "p": ["«Лоза» — гра з перестрибуванням через партнерів, що стоять зігнувшись, як і «У довгої лози». «У річку, гоп» — гра на увагу: гравці стоять на «березі» (біля лінії). На команду «У річку!» вони стрибають за лінію, на «На берег!» — повертаються. Ведучий може подавати хибні команди, і той, хто помилився, вибуває або отримує штрафне очко.", "Ці ігри розвивають стрибучість, увагу та швидкість реакції."], "ul": ["Стрибай лише за командою ведучого.", "Приземляйся м'яко, на обидві ноги.", "Не штовхай інших гравців.", "Слухай уважно — ведучий може «хитрувати».", "Ігри з перестрибуванням — лише під наглядом учителя."]}, {"h": "Доджбол. Фіксована позиція гравців", "p": ["Фіксована позиція означає, що кожен гравець має своє місце і завдання: атакувати з передньої зони, ловити в середній, підбирати м'ячі й страхувати позаду. Так команда менше метушиться і краще використовує сильні сторони кожного.", "Під час гри позиції можуть змінюватися, але кожен гравець має пам'ятати свою основну роль."], "ul": ["Атакуючі — ближче до центральної лінії.", "Ловці — у середині, готові до ловіння.", "Захисники — збирають м'ячі й страхують.", "Кожен знає своє завдання.", "Після вибування гравця позиції перерозподіляють."]}, {"h": "Аеробіка. Базові кроки з рухами руками, різний темп і ритм", "p": ["Коли базові кроки засвоєно, до них додають рухи руками: ві-степ з руками вгору, грейпвайн із хлопком, марш з рухами в сторони. Це вимагає координації й уваги.", "Комбінацію спершу виконують повільно (навіть у половинному темпі), потім у темпі музики. Можна змінювати ритм, додаючи паузи чи подвійні рухи."], "ul": ["Спочатку ноги, потім руки.", "Почни в повільному темпі.", "Узгоджуй рухи з рахунком.", "Додавай один новий рух за раз.", "Посміхайся й отримуй задоволення!"]}], "f": "Ігри на увагу на кшталт «У річку, гоп» використовують і як розминку для мозку: вони тренують швидкість реакції на сигнал.", "pr": ["Опиши, як провести гру «У річку, гоп» з молодшими братами чи сестрами, використовуючи не стрибки, а кроки через лінію.", "Виконай вправи для формування постави з рухами руками: марш з піднятими вгору руками (1 хвилина), ві-степ з рухами рук у сторони (16 рахунків), зведення лопаток (15 разів)."], "q": ["Які правила гри «У річку, гоп»?", "Що означає фіксована позиція в доджболі?", "Як поєднувати базові кроки з рухами руками?", "Чому нову комбінацію спочатку виконують у повільному темпі?"]}, {"n": "39", "t": "Ігри «Переправа через річку», «Класики». Взаємодія в доджболі. Додаткові кроки аеробіки", "g": "Учень знатиме правила ігор «Переправа через річку» й «Класики», способи взаємодії гравців у доджболі після ловіння й кидка та додаткові кроки аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Класики", "гра, у якій стрибають на одній або двох ногах по намальованих клітинках у певному порядку."], ["Повернення гравця", "правило доджболу, за яким після ловіння м'яча у гру повертається раніше вибулий партнер."], ["Додаткові кроки", "кроки аеробіки, що доповнюють базові й ускладнюють комбінації."], ["Музичний супровід", "музика, під яку виконують вправи."]], "th": [{"h": "Петанк. Рухливі ігри «Переправа через річку», «Класики»", "p": ["«Переправа через річку» — гра, у якій учасники переходять з одного «берега» на інший по «камінчиках» (позначках, обручах), не наступаючи у «воду». «Класики» — стрибки по пронумерованих клітинках у певному порядку, часто з кидком камінчика в потрібну клітинку.", "Ці ігри розвивають рівновагу, точність рухів і окомір, що важливо і для петанку."], "ul": ["Позначки мають бути нековзкими.", "Стрибай по черзі, не штовхайся.", "Слідкуй за рівновагою.", "Кидок камінчика у класиках тренує окомір.", "Гра на рівній поверхні без перешкод."]}, {"h": "Доджбол. Взаємодія гравців під час ловіння м'яча і після кидка", "p": ["Після ловіння м'яча гравець має швидко вирішити: атакувати сам чи передати м'яч партнеру в кращій позиції. Ловіння також повертає в гру вибулого партнера, тому команда має домовитися про порядок повернення.", "Після власного кидка гравець одразу повертається в захисну позицію, бо суперник може атакувати."], "ul": ["Спіймав — подумай, кому вигідніше атакувати.", "Після кидка — одразу в захист.", "Домовтеся про порядок повернення гравців.", "Підказуйте партнерам, звідки летить м'яч.", "Допомагайте одне одному ухилятися."]}, {"h": "Аеробіка. Виконання комбінацій під музику. Додаткові кроки", "p": ["Додаткові кроки урізноманітнюють комбінації: наприклад, ні-ап (підйом коліна з переступом), гамстрінг-кьорл (згинання ноги назад), пивот (поворот на опорній нозі), ліфт-кік.", "Комбінацію спершу вивчають по частинах, а потім виконують повністю під музику."], "ul": ["Гамстрінг-кьорл — п'ятка тягнеться до сідниці.", "Пивот — поворот на передній частині стопи.", "Кік — мах ногою вперед.", "Лег-кьорл додає навантаження на задню поверхню стегна.", "Виконуй кроки без стрибків, якщо займаєшся вдома."]}], "f": "Гра «Класики» відома в багатьох країнах світу, але малюнок клітинок і правила в різних місцях відрізняються.", "pr": ["Намалюй схему «Класиків» і опиши правила гри так, як грають у тебе у дворі.", "Виконай вправи для розвитку сили нижніх кінцівок: присідання (3×15), випади на місці (по 10 на кожну ногу), «стільчик» біля стіни (3×30 секунд), підйоми на носки (20 разів)."], "q": ["Які правила гри «Переправа через річку»?", "Що вирішує гравець після ловіння м'яча в доджболі?", "Назви 3 додаткові кроки аеробіки.", "Як вивчають нову комбінацію?"]}, {"n": "40", "t": "Ігри «Сміхота», «Гречка». Взаємодія в доджболі. Методи побудови комбінацій в аеробіці", "g": "Учень ознайомиться з народними іграми на увагу й витримку, удосконалить знання про взаємодію в доджболі та знатиме методи побудови комбінацій в аеробіці.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Лінійний метод", "спосіб побудови заняття з аеробіки, коли рухи змінюються один за одним без повернення до попередніх."], ["Метод «від голови до хвоста»", "спосіб вивчення комбінації, коли її розучують частинами від початку, поступово додаючи наступні елементи."], ["Витримка", "уміння контролювати свої емоції та реакції."], ["Командна тактика", "спільний план дій команди для перемоги."]], "th": [{"h": "Петанк. Рухливі ігри «Сміхота», «Гречка»", "p": ["Народні ігри на зразок «Сміхоти» перевіряють витримку: учасники мають не розсміятися, хоча ведучий чи інші гравці намагаються їх розсмішити. Такі ігри вчать контролювати себе, що потрібно й у петанку, де кожен кидок вимагає спокою.", "Правила гри «Гречка» та її варіантів пояснить учитель на уроці: вони можуть відрізнятися в різних регіонах."], "ul": ["Ігри на витримку вчать зосереджуватися.", "Не ображай інших, смішити можна лише жартами.", "Поважай правила ведучого.", "Спокій і зосередженість — важливі для точного кидка.", "Народні ігри можуть мати місцеві варіанти правил."]}, {"h": "Доджбол. Взаємодія гравців під час ловіння і після кидка", "p": ["Ефективна команда атакує разом: кілька гравців одночасно кидають м'ячі в одного суперника, щоб йому було важче ухилитися чи спіймати. Це і є елемент командної тактики.", "Важливо постійно спілкуватися: хто кидає, у кого цілимося, хто прикриває."], "ul": ["Атака кількома м'ячами одночасно.", "Домовтеся про сигнал для спільної атаки.", "Прикривайте гравця, який підбирає м'яч.", "Не залишайте команду без м'ячів.", "Хваліть одне одного за вдалі дії."]}, {"h": "Аеробіка. Комбінації під музику: лінійний метод і метод «від голови до хвоста»", "p": ["Лінійний метод: інструктор показує рух, учасники повторюють його кілька разів, потім рух змінюється на інший, і так далі, без повернення назад. Метод простий і підходить для розминки та початківців.", "Метод «від голови до хвоста»: комбінацію вивчають частинами, починаючи з першого елемента, і щоразу додають наступний, повторюючи всю ланку з початку. Так учасники запам'ятовують усю комбінацію."], "ul": ["Лінійний метод — легкий, без запам'ятовування.", "«Від голови до хвоста» — комбінація росте поступово.", "Кожну нову частину повторюють разом із попередніми.", "Під музику кроки починають на сильну долю.", "Рахуй «вісімками»."]}], "f": "", "pr": ["Склади комбінацію аеробіки з 4 кроків і опиши, як її вивчити методом «від голови до хвоста».", "Виконай вправи для розвитку сили рук: віджимання від стіни або підлоги (3×10), «відведення рук» з пляшками води (3×12), утримання рук у сторони (3×20 секунд)."], "q": ["Чого вчать ігри на витримку?", "Як команда може атакувати разом у доджболі?", "У чому суть лінійного методу?", "Як працює метод «від голови до хвоста»?"]}, {"n": "41", "t": "Рухливі ігри «Півник», «Пускайте нас». Навчальна гра в доджбол. Силові вправи в аеробіці", "g": "Учень знатиме особливості народних рухливих ігор на рівновагу та спритність, правила навчальної гри в доджбол зі спрощеними правилами та силові вправи для різних груп м'язів.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Рівновага", "здатність зберігати стійке положення тіла в спокої та під час руху."], ["Силові вправи", "вправи, що зміцнюють м'язи за допомогою власної ваги або обтяжень."], ["М'язи кору", "м'язи живота, спини й таза, що стабілізують тулуб."], ["Плечовий пояс", "кістки й м'язи, що з'єднують руки з тулубом."]], "th": [{"h": "Петанк. Рухливі ігри «Півник», «Пускайте нас»", "p": ["«Півник» — народна гра на рівновагу: учасники стоять на одній нозі й намагаються вивести суперника з рівноваги, щоб той став на обидві ноги. Грають лише легкими дотиками плечем, без поштовхів руками і на м'якій поверхні. «Пускайте нас» — колективна гра з наближенням і відступом шеренг; її точні правила пояснить учитель.", "Ігри на рівновагу корисні для петанку: стійке положення в колі допомагає кидати точно."], "ul": ["У «Півнику» — лише легкі дотики плечем.", "Руки тримають за спиною або на поясі.", "Грай на м'якому покритті, далеко від стін.", "Не грай з тим, хто значно більший чи важчий за тебе.", "Рівновага потрібна для точного кидка."]}, {"h": "Доджбол. Навчальна гра зі спрощеними правилами", "p": ["У грі зі спрощеними правилами можна, наприклад, дозволити вибулим гравцям повертатися через певний час, грати меншою кількістю м'ячів або на меншому майданчику. Так усі учні довше беруть участь у грі й більше тренуються.", "Незалежно від правил, діє головне: безпека, чесність і повага."], "ul": ["Узгодьте правила перед грою.", "Кидки лише в тулуб і ноги.", "Визнавай влучання в себе.", "Не виходь за межі майданчика.", "Після гри — подякуй суперникам."]}, {"h": "Аеробіка. Вправи для розвитку сили різних груп м'язів", "p": ["В основній частині заняття з аеробіки виконують силові вправи з вагою власного тіла. Для м'язів шиї — плавні нахили й утримання голови з легким опором долоні. Для рук і плечового поясу — віджимання, утримання рук у сторони. Для тулуба — скручування, планка, «човник». Для ніг — присідання, випади, підйоми на носки.", "Силові вправи виконують повільно, з правильною технікою, без затримки дихання."], "ul": ["Шия: плавні нахили, легкий опір долонею, без різких рухів.", "Руки й плечі: віджимання, утримання рук.", "Тулуб: планка, скручування, «човник».", "Ноги: присідання, випади, «стільчик».", "Видих — під час зусилля."]}], "f": "М'язи кору працюють майже в кожному русі, від ходьби до кидка кулі, тому їх тренування покращує поставу і рівновагу.", "pr": ["Склади комплекс силових вправ із 4 вправ (по одній для шиї, рук, тулуба й ніг) і запиши кількість повторень.", "Виконай вправи для розвитку сили м'язів тулуба: планка (3×30 секунд), бокова планка (по 20 секунд на кожен бік), «скручування» (3×12), «човник» (3×10 секунд)."], "q": ["Як безпечно грати в «Півника»?", "Які спрощення можна вводити в навчальну гру в доджбол?", "Назви вправи для м'язів тулуба.", "Коли потрібно робити видих під час силової вправи?"]}, {"n": "42", "t": "Рухливі ігри «У царя», «Хвіст». Підвідні вправи для кидка. Складання комбінацій з базових кроків", "g": "Учень знатиме народні ігри для розвитку спритності, підвідні вправи для кидка в доджболі та навчиться складати комбінацію з базових кроків аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Ланцюжок", "шеренга або колона гравців, що тримаються одне за одного."], ["Замах", "рух руки назад перед кидком, що додає силу."], ["Блок комбінації", "частина комбінації аеробіки тривалістю 32 рахунки (4 «вісімки»)."], ["Симетричність комбінації", "виконання однакової послідовності рухів з правої та лівої ноги."]], "th": [{"h": "Петанк. Рухливі ігри «У царя», «Хвіст»", "p": ["У грі «Хвіст» гравці стають ланцюжком, тримаючись за пояс один одного. Перший гравець («голова») намагається впіймати останнього («хвоста»), а ланцюжок не повинен розірватися. «У царя» — народна рухлива гра, правила якої пояснить учитель.", "Такі ігри вчать діяти злагоджено й розвивають спритність."], "ul": ["Тримайся за пояс, а не за одяг чи шию.", "Не роби різких ривків ланцюжком.", "Якщо ланцюжок розірвався — зупинка.", "Міняйтеся ролями «голови» і «хвоста».", "Гра — на рівній поверхні без перешкод."]}, {"h": "Доджбол. Підвідні вправи для кидка", "p": ["Підвідні вправи допомагають засвоїти рух поетапно: замах без м'яча, кидок з місця без кроку, кидок з кроком, кидок у ціль. Корисні також вправи з гумовим джгутом для зміцнення плечей.", "Важливо засвоїти правильний порядок руху: ноги — тулуб — плече — лікоть — кисть."], "ul": ["Імітація замаху без м'яча.", "Кидок з місця у стіну.", "Кидок із кроком уперед.", "Кидок у мішень з різних відстаней.", "Розминай плечі перед кожним тренуванням."]}, {"h": "Аеробіка. Складання комбінацій з базових кроків", "p": ["Комбінацію складають з базових кроків, кожен з яких займає певну кількість рахунків. Зазвичай блок має 32 рахунки (4 «вісімки»). Наприклад: марш (8), степ-тач (8), ві-степ (8), грейпвайн (8).", "Добре, коли комбінацію можна повторити з іншої ноги — так навантаження буде симетричним."], "ul": ["Обери 4 базові кроки.", "Кожен крок — 8 рахунків.", "Подбай про плавні переходи.", "Перевір, чи можна почати з іншої ноги.", "Виконай під музику кілька разів."]}], "f": "У багатьох групових фітнес-програмах комбінації складаються саме з блоків по 32 рахунки, бо так їх зручно поєднувати з музикою.", "pr": ["Склади свою комбінацію аеробіки з 4 базових кроків на 32 рахунки і запиши її у вигляді таблиці.", "Виконай вправи для гнучкості тіла: нахили вперед стоячи з трохи зігнутими колінами (10 разів), «кішечка» (10 разів), розтягування плечей (по 20 секунд на кожну руку), «метелик» (30 секунд)."], "q": ["Які правила гри «Хвіст»?", "У якому порядку рухаються частини тіла під час кидка?", "Скільки рахунків займає один блок комбінації?", "Чому комбінацію варто виконувати з обох ніг?"]}, {"n": "43", "t": "Рухливі ігри «Крук», «Вуж». Кидок м'яча зверху. Комбінації з додаткових кроків лінійним методом", "g": "Учень знатиме народні ігри для розвитку спритності, удосконалить знання техніки кидка зверху та навчиться складати комбінації з додаткових кроків лінійним методом.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Ведучий ланцюжка", "перший гравець у колоні, за яким повторюють рух інші учасники."], ["Хльостоподібний рух", "рух руки під час кидка, коли швидкість передається від плеча до кисті, як у батога."], ["Перехід між кроками", "спосіб плавно поєднати два кроки аеробіки без зупинки."], ["Опорна нога", "нога, на якій тримається вага тіла під час руху."]], "th": [{"h": "Петанк. Рухливі ігри «Крук», «Вуж»", "p": ["«Вуж» — гра, у якій учасники стають колоною, тримаючись одне за одного, і рухаються за ведучим, повторюючи його рухи та зміни напрямку, як змія. «Крук» — гра з ловінням, де «крук» намагається піймати гравців; правила пояснить учитель.", "Ігри вчать уважності, узгодженості й розвивають спритність."], "ul": ["Рухайся за ведучим, не обганяй.", "Тримайся легко, без ривків.", "Ловити — лише дотиком.", "Слухай сигнали ведучого.", "Міняйтеся ролями."]}, {"h": "Доджбол. Кидок м'яча зверху", "p": ["Кидок зверху — основний у доджболі. Його сила залежить від хльостоподібного руху: ноги й тулуб починають рух, плече й лікоть продовжують, а кисть завершує. Після кидка рука продовжує рух униз, і корпус повертається до цілі.", "Типові помилки: кидок тільки рукою, низький лікоть, відсутність кроку вперед."], "ul": ["Крок протилежною ногою вперед.", "Лікоть на рівні плеча або вище.", "Поворот корпусу.", "Кисть наприкінці «підштовхує» м'яч.", "Рука після кидка продовжує рух униз."]}, {"h": "Аеробіка. Комбінації з додаткових кроків лінійним методом", "p": ["Лінійним методом кроки змінюють послідовно: кілька повторень одного кроку, потім перехід на інший. Наприклад: марш — ні-ап — гамстрінг-кьорл — кік — і назад до маршу. Переходи мають бути плавними, щоб не збитися з ритму.", "Під час переходу важливо правильно визначити опорну ногу."], "ul": ["Кожен крок — 8 або 16 рахунків.", "Перехід — без зупинки.", "Слідкуй за опорною ногою.", "Утримуй рівну поставу.", "Додаткові кроки виконуй з контролем, без ривків."]}], "f": "Хльостоподібний рух використовують не лише в кидках, а й у подачах у волейболі та ударах у тенісі.", "pr": ["Склади ланцюжок із 5 кроків аеробіки для виконання лінійним методом і запиши, скільки рахунків займає кожен.", "Виконай присідання та вправи для ніг без стрибків: присідання (3×15), присідання з підйомом на носки в кінці (2×10), випади на місці (по 10 на кожну ногу)."], "q": ["Як грають у гру «Вуж»?", "Що таке хльостоподібний рух?", "Які типові помилки під час кидка зверху?", "Як працює лінійний метод для додаткових кроків?"]}, {"n": "44", "t": "Рухливі ігри «У відьми», «Яструб». Кидок збоку. Складання флешмобу й показової програми", "g": "Учень знатиме народні ігри з ловінням, техніку кидка м'яча збоку в доджболі та як скласти флешмоб або показову програму з аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Кидок збоку", "кидок м'яча рухом руки збоку на рівні пояса або плеча."], ["Показова програма", "комбінація вправ, яку виконують перед глядачами для демонстрації вмінь."], ["Змагальна програма", "комбінація вправ, складена за правилами змагань і оцінювана суддями."], ["Синхронність", "одночасне й однакове виконання рухів усіма учасниками."]], "th": [{"h": "Петанк. Рухливі ігри «У відьми», «Яструб»", "p": ["«Яструб» — гра, у якій «яструб» намагається піймати «курчат», що стоять ланцюжком позаду «квочки», а «квочка» розставленими руками їх захищає. «У відьми» — народна гра з ловінням, правила якої пояснить учитель.", "Такі ігри розвивають швидкість, спритність і вміння захищати команду."], "ul": ["Ловити — лише дотиком.", "«Курчата» тримаються за пояс одне одного.", "Без різких ривків і падінь.", "Міняйтеся ролями після кожного раунду.", "Грайте на просторому безпечному майданчику."]}, {"h": "Доджбол. Кидок м'яча збоку", "p": ["Кидок збоку виконують горизонтальним рухом руки на рівні пояса або плеча. Він неочікуваний для суперника і зручний для влучання в ноги. Крок уперед і поворот корпусу додають силу.", "Кидок збоку важче контролювати по висоті, тому його треба тренувати в мішень."], "ul": ["Рука відводиться вбік-назад.", "Рух — горизонтальний, з поворотом корпусу.", "Цілься в ноги суперника.", "Кисть фіксує напрямок м'яча.", "Тренуй точність у мішень."]}, {"h": "Аеробіка. Складання флешмобу, показової та змагальної програми", "p": ["Флешмоб — коротка проста комбінація, яку може повторити багато людей. Показова програма — яскрава композиція для свята, а змагальна — складена за правилами змагань і оцінюється суддями. Усі вони вимагають синхронності й гарного музичного супроводу.", "Етапи складання: обрати музику, скласти комбінації, продумати побудови й перешикування, відрепетирувати."], "ul": ["Обери музику з чітким ритмом.", "Склади прості рухи, доступні для всіх.", "Продумай побудови: лінії, колона, коло.", "Додай яскравий початок і фінал.", "Репетируй, щоб рухи були синхронними."]}], "f": "Флешмоби часто знімають на відео, а сама ідея полягає в тому, щоб багато людей одночасно й несподівано для глядачів виконали однакові дії.", "pr": ["Обери пісню для класного флешмобу та запиши першу «вісімку» рухів.", "Замість стрибків зі скакалкою виконай безпечну імітацію: обертання кистями, наче тримаєш скакалку, з підйомами на носки без відриву від підлоги (3 рази по 30 секунд)."], "q": ["Як грають у гру «Яструб»?", "Чим зручний кидок збоку?", "Чим відрізняється флешмоб від змагальної програми?", "Які етапи складання показової програми?"]}, {"n": "45", "t": "Естафети в петанку. Кидок знизу і гра. Флешмоб і показова програма з аеробіки", "g": "Учень знатиме, як побудувати естафети для тренування навичок петанку, закріпить техніку кидка знизу в грі та продовжить складати показову програму з аеробіки.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Тренувальна естафета", "естафета, у якій відпрацьовують окремі навички виду спорту."], ["Точність кидка", "здатність спрямувати снаряд саме туди, куди задумано."], ["Перешикування", "зміна побудови учасників під час виконання програми."], ["Композиція", "цілісна програма з рухів, музики й побудов."]], "th": [{"h": "Петанк. Різноманітні естафети з тренуванням", "p": ["Естафети для петанку поєднують рух і точність: пробігти до позначки, кинути м'ячик або кулю в обруч, повернутися і передати естафету. Очки отримують не лише за швидкість, а й за влучання.", "Такі естафети вчать зберігати точність навіть після навантаження, коли пульс частий."], "ul": ["Етап з кидком у ціль.", "Бонусні очки за влучання.", "Біг лише в межах своєї доріжки.", "Кидки — тільки на свою ціль.", "Справедливий підрахунок очок."]}, {"h": "Доджбол. Кидок м'яча знизу. Гра", "p": ["Кидок знизу використовують для точних передач партнеру та для неочікуваної атаки на близькій відстані. У грі його поєднують з іншими кидками, щоб суперник не міг передбачити атаку.", "Під час гри стеж за сигналами судді та дотримуйся правил."], "ul": ["Кидок знизу — прямою рукою, плавним махом.", "Зручний для передачі партнеру.", "Поєднуй різні види кидків.", "Дотримуйся правил і меж.", "Визнавай влучання в себе."]}, {"h": "Аеробіка. Складання флешмобу, показової та змагальної програми", "p": ["На цьому етапі до комбінацій додають перешикування: учасники переходять з ліній у коло, з колони в шахове розташування. Перешикування мають бути простими й чітко відрепетируваними.", "Композиція має початок, основну частину і фінальну позу."], "ul": ["Перешикування — на конкретні рахунки.", "Кожен знає свою позицію.", "Фінальна поза — чітка й одночасна.", "Відео репетиції допомагає виправити помилки.", "Підтримуйте одне одного під час репетицій."]}], "f": "", "pr": ["Придумай естафету для тренування точності в петанку з трьох етапів і опиши правила підрахунку очок.", "Виконай спеціальні вправи для модулів: імітація захвату й кидка кулі (10 разів), імітація кидка зверху без м'яча (10 разів кожною рукою), комбінація з 4 базових кроків аеробіки (2 повтори)."], "q": ["Як побудувати естафету для тренування навичок петанку?", "Для чого використовують кидок знизу в доджболі?", "Що таке перешикування?", "З яких частин складається композиція?"]}, {"n": "46", "t": "Навчальна гра в петанк. Комбінації кидків у доджболі. Флешмоб. Діагностувальна робота (ГР1)", "g": "Учень закріпить знання про гру в петанк і доджбол, представить фрагмент флешмобу та підготується до діагностувальної роботи за групою результатів ГР1.", "k": "Модулі: Петанк · Доджбол · Аеробіка", "terms": [["Комбінація кидків", "поєднання різних видів кидків у грі, щоб суперник не міг передбачити атаку."], ["Пошукове завдання", "завдання, під час якого учень самостійно знаходить інформацію і представляє її."], ["Підрахунок очок", "визначення результату кону або гри за правилами."], ["Оцінювання техніки", "перевірка правильності виконання рухів."]], "th": [{"h": "Петанк. Навчальна гра", "p": ["У навчальній грі застосовують усе вивчене: правильну стійку, захват, кидок кошонета, вибір між пойнтингом і стрільбою, підрахунок очок. Важливо грати чесно й уважно.", "Після гри корисно проаналізувати, які кидки були вдалими і чому."], "ul": ["Стійка в колі, ноги не відриваються.", "Правильний захват кулі.", "Вибір: підкласти чи вибити.", "Чесний підрахунок очок.", "Аналіз гри після завершення."]}, {"h": "Доджбол. Комбінації різноманітних кидків. Гра", "p": ["Досвідчений гравець
