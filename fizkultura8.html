далегідь.", "Однакова техніка кожного удару.", "Помірна сила — більше контролю.", "Записуй найкращу серію.", "Окремо тренуй слабший бік."]}], "f": "Записуючи після тренування 1–2 думки про те, що вдалося, легше помітити свій поступ і зрозуміти, над чим працювати далі.", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, віджимання 3×10, планка 3×30 с, обертання кистей з пляшкою води 3×15.", "Проведи рефлексію за останні уроки: запиши 3 вдалі моменти й 2 речі, які хочеш покращити в Cool Games, футболі й бадмінтоні."], "q": ["Що таке рефлексія і навіщо вона після естафети?", "Як команда маневрує в атаці й захисті у футболі?", "Що таке компактність у захисті?", "Як підвищити стабільність серії ударів у бадмінтоні?"]}, {"n": "98", "t": "Парні естафети Cool Games. Удари головою по м’ячу. Захист від «смешу»", "g": "Учень знатиме особливості парних естафет, техніку удару головою з місця й у стрибку та способи відбивання нападного удару в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Парна естафета", "естафета, у якій двоє учасників виконують завдання разом, узгоджуючи рухи."], ["Синхронність", "одночасне й узгоджене виконання рухів кількома людьми."], ["Удар серединою лоба", "основний спосіб удару головою, що дає змогу точно й безпечно спрямувати м’яч."], ["Захисна стійка в бадмінтоні", "низька стійка з ракеткою перед тілом для прийому сильних ударів."]], "th": [{"h": "Cool Games. Естафети в парах", "p": ["У парних естафетах двоє учасників діють разом: несуть предмет удвох, рухаються, тримаючись за руки, передають м’яч одне одному на ходу. Успіх залежить від того, наскільки злагоджено вони рухаються.", "Перед стартом пари домовляються про темп і сигнали. Більш підготовлений партнер підлаштовується під іншого, а не тягне його за собою."], "ul": ["Домовтеся про темп і сигнали.", "Рухайтеся синхронно.", "Підлаштовуйтеся одне під одного.", "Не тягни партнера силою.", "Якщо падає предмет — зупиніться й підніміть разом."]}, {"h": "Футбол. Удари головою по м’ячу зменшеної ваги без стрибка та у стрибку", "p": ["Удари головою спочатку вчать з легким м’ячем, щоб не було неприємних відчуттів. Удар виконують серединою лоба: ноги на ширині плечей, тулуб відхиляється назад, а потім різким рухом уперед зустрічає м’яч. Очі відкриті, шия напружена.", "У стрибку важливо вистрибнути вчасно, вигнутися в повітрі й ударити м’яч у найвищій точці. Удари головою виконують лише під наглядом учителя й обмежену кількість разів."], "ul": ["Тільки серединою лоба.", "Очі відкриті до моменту дотику.", "Рух тулуба, а не лише голови.", "Шия напружена.", "Легкий м’яч і невелика кількість повторень."]}, {"h": "Бадмінтон. Навчальна гра: захист від «смешу»", "p": ["Коли суперник б’є «смеш», у тебе дуже мало часу. Тому треба стати в захисну стійку: ноги ширше за плечі, коліна зігнуті, ракетка перед тілом на рівні пояса.", "Відповідати на «смеш» краще коротким блоком біля сітки або довгим ударом назад — так суперник не зможе одразу атакувати знову."], "ul": ["Низька стійка, ракетка попереду.", "Короткий рух ракеткою, без замаху.", "Блок — біля сітки.", "Довгий удар — до задньої лінії.", "Не відвертайся від волана."]}], "f": "У футболі для навчання ударів головою дітям і підліткам радять використовувати легші м’ячі — так тренування безпечніше.", "pr": ["Виконай вправи на розвиток витривалості: марширування на місці 3×2 хв, «степ» 3×30, повільні присідання 2×20.", "Опиши послідовність удару головою з місця (4–5 кроків) і назви правила безпеки під час цієї вправи."], "q": ["Що найважливіше в парній естафеті?", "Якою частиною голови виконують удар і чому?", "Чому на початку навчання використовують легкий м’яч?", "Як відбивати «смеш» у бадмінтоні?"]}, {"n": "99", "t": "Естафети-квести Cool Games. Фінти в ігрових вправах. Серії ударів по діагоналі: робота ніг", "g": "Учень знатиме, як проходити естафету-квест, види фінтів у футболі та роль роботи ніг у серіях ударів у бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Квест", "гра, у якій учасники проходять послідовність завдань, щоб дійти до фіналу."], ["Відволікальна дія", "рух, що змушує суперника відреагувати не туди, куди рухатиметься гравець."], ["Фінт корпусом", "обманний нахил тулуба в один бік з подальшим рухом в інший."], ["Робота ніг", "система кроків і переміщень, що допомагає гравцю вчасно опинитися в місці удару."]], "th": [{"h": "Cool Games. Естафети-квести", "p": ["Естафета-квест — це низка етапів, на кожному з яких команда отримує підказку для наступного. Тут поєднуються рух, кмітливість і творчість — усе, що закладено в девізі Cool Games.", "Квест можна провести і на майданчику, і в форматі онлайн-уроку, де завдання — це вправи, загадки й питання з теми."], "ul": ["Кожен етап — підказка для наступного.", "Чергуйте рухові й розумові завдання.", "Працюйте всією командою.", "Дотримуйтеся меж території гри.", "Фінал — спільне свято для всіх команд."]}, {"h": "Футбол. Відволікальні дії (фінти) в ігрових вправах з активним двобоєм", "p": ["Фінт змушує захисника зробити крок не в той бік. Найпростіші фінти: корпусом (нахил в один бік, рух в інший), «замах на удар» (захисник намагається заблокувати, а гравець проводить м’яч повз нього), «переступання» над м’ячем.", "У ігрових вправах фінти виконують проти активного захисника. Важливо робити фінт на відстані 1–2 м від суперника і після нього одразу прискорюватися."], "ul": ["Фінт — переконливий, але швидкий.", "Відстань до суперника — 1–2 м.", "Після фінту — прискорення.", "Не захоплюйся фінтами, коли є вільний партнер.", "Тренуй фінти в обидва боки."]}, {"h": "Бадмінтон. Серії ударів справа та зліва по діагоналі: робота ніг", "p": ["Щоб серія була довгою, удар має починатися з ніг. Між ударами гравець робить сплит-степ, потім крок-два до волана, удар і повернення. Якщо стояти на місці, волан доводиться «доганяти» рукою, і удар стає неточним.", "Для ударів зліва ставлять праву ногу (для правші) в бік волана, розвертаючи корпус."], "ul": ["Сплит-степ перед кожним ударом.", "Кроки до волана, а не тягнутися рукою.", "Удар зліва — права нога вперед (правша).", "Після удару — назад у центр.", "Ракетка завжди перед собою."]}], "f": "Хороший фінт у футболі змушує суперника перенести вагу тіла на одну ногу — після цього йому потрібен час, щоб рушити в інший бік.", "pr": ["Виконай вправи на розвиток швидкості: «тепінг» стопами сидячи 3×10 с, швидкі оплески 3×10 с, імітація сплит-степу без підскоку (швидке перенесення ваги) 3×10.", "Склади естафету-квест з 5 етапів для дистанційного уроку (вправи + загадки про спорт)."], "q": ["Що таке естафета-квест?", "Назви 3 види фінтів у футболі.", "На якій відстані до суперника краще виконувати фінт?", "Чому в бадмінтоні удар починається з роботи ніг?"]}, {"n": "100", "t": "Cool Games з елементами ігор. Вкидання м’яча. Бадмінтон: матч до двох сетів", "g": "Учень знатиме, як включати в естафети елементи вивчених ігор, правила й техніку вкидання м’яча у футболі та порядок проведення матчу в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Вкидання м’яча", "відновлення гри у футболі руками з-за бокової лінії, коли м’яч повністю перетнув її."], ["Бокова лінія", "лінія, що обмежує довжину футбольного поля з боків."], ["Матч", "повна гра в бадмінтоні, що триває до перемоги в двох сетах."], ["Вирішальний сет", "третій сет, який грають за рахунку 1:1 у сетах."]], "th": [{"h": "Cool Games. Естафети з елементами вивчених ігор", "p": ["В естафети Cool Games можна включати прийоми з інших модулів: баскетбольне ведення, гандбольну передачу, футбольне ведення між фішками, підбивання волана ракеткою. Так ми повторюємо вивчене в новій формі.", "Важливо, щоб кожен етап був безпечним і зрозумілим, а інвентар — підготовлений заздалегідь."], "ul": ["Етап з баскетбольним веденням.", "Етап з гандбольною передачею.", "Етап з футбольним веденням.", "Етап з підбиванням волана.", "Чіткі правила для кожного етапу."]}, {"h": "Футбол. Вкидання м’яча з різних вихідних положень на дальність і точність", "p": ["Вкидання виконують обома руками з-за голови, обличчям до поля. В момент кидка обидві ноги мають торкатися землі на боковій лінії або за нею. Якщо правила порушено, право вкидання переходить до суперника.", "Вкидати можна з місця (ноги на ширині плечей або одна попереду) і після розбігу. На дальність працює все тіло: вигин назад і різкий рух уперед; на точність — спокійний контрольований рух."], "ul": ["М’яч — обома руками, з-за голови.", "Обидві ноги на землі.", "Обличчям до поля.", "Не можна забити гол безпосередньо з вкидання.", "Розбіг закінчується до кидка, ноги не відриваються."]}, {"h": "Бадмінтон. Навчальна гра: матч до двох виграних сетів", "p": ["Матч у бадмінтоні триває до перемоги в двох сетах. Кожен сет — до 21 очка; при рахунку 20:20 гра йде до переваги у 2 очки, але не далі ніж до 30. Між сетами гравці можуть відпочити й змінити сторони.", "У вирішальному третьому сеті сторони міняють, коли один із гравців набере 11 очок."], "ul": ["Сет — до 21 очка.", "20:20 — до переваги в 2 очки.", "29:29 — виграє той, хто набере 30-те очко.", "Зміна сторін після кожного сету.", "У третьому сеті — зміна сторін на 11 очках."]}], "f": "У футболі з вкидання не можна забити гол безпосередньо — м’яч спочатку має торкнутися іншого гравця.", "pr": ["Виконай вправи на розвиток гнучкості: розтягування плечей біля стіни, легкий прогин лежачи на животі з опорою на передпліччя, нахили вперед сидячи, розтягування грудей біля дверного отвору — по 20 с.", "Запиши правила вкидання м’яча у футболі та порядок підрахунку очок у матчі з бадмінтону."], "q": ["Які елементи інших ігор можна включити в естафету?", "Яких правил треба дотримуватися під час вкидання м’яча?", "До скількох очок триває сет у бадмінтоні і що відбувається за рахунку 20:20?", "Коли міняють сторони у вирішальному сеті?"]}, {"n": "101", "t": "Cool Games надворі. Ігри в малих складах. Подача й прийом у парній грі", "g": "Учень знатиме правила безпеки під час естафет надворі, особливості навчальних ігор у малих складах та подачу й прийом у парній грі в бадмінтоні.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Відкритий майданчик", "спортивна площа надворі, де умови залежать від погоди та покриття."], ["Перегрівання", "стан, коли організм не встигає охолоджуватися, — виникає під час навантаження в спеку."], ["Удар від воріт", "спосіб відновлення гри, коли м’яч перетнув лінію воріт після дотику нападника."], ["Прийом подачі в парі", "перший удар приймаючого, яким він намагається одразу перехопити ініціативу."]], "th": [{"h": "Cool Games. Естафети на свіжому повітрі", "p": ["Весною естафети часто переносять надвір. Тут більше простору, але є свої ризики: нерівне покриття, сонце, спека чи вітер. Тому перед стартом перевіряють майданчик і одягаються за погодою.", "У спекотні дні важливі головний убір, вода й тінь для відпочинку. Навантаження зменшують, якщо дуже жарко."], "ul": ["Огляньте майданчик: ями, скло, каміння.", "Головний убір і вода в спеку.", "Відпочинок у тіні.", "Одяг — за погодою.", "Ознаки перегрівання — зупинитися й повідомити дорослих."]}, {"h": "Футбол. Навчальні ігри у зменшених за чисельністю складах", "p": ["Ігри 4×4 чи 5×5 на невеликому полі дозволяють кожному частіше брати участь у грі. Правила спрощують: можуть не використовувати положення «поза грою», а замість вкидання — вводити м’яч ногою.", "Такі ігри вчать швидко переходити з атаки в захист і назад, відкриватися й обирати найкраще рішення."], "ul": ["Правила оголошують до гри.", "Кожен — і захисник, і нападник.", "Активно відкривайтеся для передачі.", "Без грубої гри.", "Змінюйте склади, щоб грали всі."]}, {"h": "Бадмінтон. Навчальна гра в парах: подача і прийом", "p": ["У парній грі найчастіше використовують коротку подачу, щоб суперники не могли одразу атакувати. Приймаючий стоїть ближче до передньої лінії поля подачі в готовій стійці з піднятою ракеткою і намагається атакувати першим ударом.", "Партнер подаючого стоїть позаду й готовий прийняти довгу відповідь."], "ul": ["Подача — переважно коротка.", "Приймаючий — ближче до сітки, ракетка вгорі.", "Атакуй першим ударом, якщо можливо.", "Партнер подаючого — позаду.", "Подача по діагоналі."]}], "f": "У спеку організм охолоджується потовиділенням, тому під час занять надворі важливо пити воду невеликими порціями.", "pr": ["Виконай вправи на розвиток гнучкості: нахили в сторони стоячи, розтягування задньої поверхні стегна сидячи, «метелик», розтягування плечей — по 20 с.", "Склади пам’ятку «Естафета надворі: правила безпеки» (5–6 пунктів)."], "q": ["Які ризики є під час естафет надворі?", "Які ознаки перегрівання і що робити?", "Чим корисні навчальні ігри в зменшених складах?", "Яку подачу найчастіше використовують у парній грі і чому?"]}, {"n": "102", "t": "Свято естафет Cool Games. Відбирання м’яча в іграх. Витривалість бадмінтоніста", "g": "Учень знатиме, як організувати свято естафет, удосконалить знання про відбирання м’яча в ігрових умовах і розумітиме, як витривалість впливає на гру в бадмінтон.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Спортивне свято", "захід, що поєднує змагання, ігри та розваги для учасників і глядачів."], ["Організаційний комітет", "група людей, які планують і проводять захід."], ["Прикриття м’яча", "прийом, коли гравець ставить тіло між м’ячем і суперником, не даючи відібрати м’яч."], ["Витривалість", "здатність тривалий час виконувати роботу без зниження її якості."]], "th": [{"h": "Cool Games. Підготовка свята естафет", "p": ["Завершуючи модуль, клас може влаштувати свято естафет Cool Games. Для цього створюють організаційну групу: хтось складає програму, хтось готує інвентар, хтось суддівство й нагородження.", "Програма свята включає найкращі естафети, створені учнями, і завдання на кмітливість. Мета — щоб усім було цікаво й безпечно."], "ul": ["Програма — 4–6 естафет.", "Судді й секретар призначені заздалегідь.", "Інвентар перевірений.", "Відзнаки — для всіх учасників.", "Фото й спогади — за згодою учасників."]}, {"h": "Футбол. Відбирання м’яча в ігрових вправах і навчальних іграх", "p": ["В іграх відбирання вимагає не лише техніки, а й правильної позиції: захисник стоїть між суперником і своїми воротами, не кидається на м’яч одразу, а чекає помилки суперника. Нападник, своєю чергою, прикриває м’яч тілом.", "Атакувати м’яч краще тоді, коли суперник опустив голову чи відпустив м’яч далеко від ноги."], "ul": ["Позиція — між суперником і воротами.", "Не кидайся в ноги.", "Чекай моменту, коли м’яч далеко від ноги.", "Після відбору — швидка передача.", "Порушення правил — штрафний удар суперникам."]}, {"h": "Бадмінтон. Навчальна гра: витривалість і відновлення між розіграшами", "p": ["Розіграші в бадмінтоні короткі, але їх дуже багато, тому гравцеві потрібна витривалість. Утома призводить до помилок: гравець пізніше рухається до волана, і удари стають неточними.", "Між розіграшами корисно відновити дихання, спокійно підготуватися до наступної подачі. Витривалість розвивають ходьбою, плаванням, їздою на велосипеді, рухливими іграми."], "ul": ["Глибоке дихання між розіграшами.", "Не поспішай з подачею, коли задихаєшся.", "Вода — у перерві між сетами.", "Регулярні аеробні заняття.", "Сон і харчування теж впливають на витривалість."]}], "f": "У бадмінтоні розіграші зазвичай тривають лише кілька секунд, але за матч їх буває дуже багато — тому гравцеві потрібна витривалість.", "pr": ["Виконай вправи на розвиток спритності: підкидання м’ячика з оплеском за спиною, ловіння м’ячика після відскоку від стіни різними руками, стійка «ластівка» 3×15 с.", "Склади план свята естафет Cool Games для свого класу: програма, ролі, інвентар, відзнаки."], "q": ["Що потрібно для організації свята естафет?", "Коли найкраще атакувати м’яч у суперника?", "Що таке прикриття м’яча?", "Як утома впливає на гру в бадмінтон?"]}, {"n": "103", "t": "Cool Games. Вкидання м’яча: помилки. Бадмінтон. Діагностувальна робота (ГР1)", "g": "Учень удосконалить вкидання м’яча, повторить правила бадмінтону та знатиме, як підготуватися до першої частини діагностувальної роботи з модулів чверті.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Неправильне вкидання", "вкидання з порушенням правил, після якого право вкидання отримує суперник."], ["Вихідне положення", "поза, з якої починають виконання вправи чи прийому."], ["Група результатів навчання", "частина навчальних результатів, за якою вчитель оцінює досягнення учня."], ["Критерії оцінювання", "ознаки, за якими визначають якість виконання завдання."]], "th": [{"h": "Cool Games. Естафети: повторення вивченого", "p": ["Повторюємо найкращі естафети чверті: з нестандартним інвентарем, на кмітливість, у парах, під музику. Звертаємо увагу на дотримання правил і злагодженість команди.", "Під час діагностувальної роботи можуть оцінювати і виконання завдань, і знання правил суддівства, і поведінку в команді."], "ul": ["Повтори девіз Cool Games.", "Повтори обов’язки суддів.", "Пригадай способи визначення результату.", "Будь готовий пояснити правила своєї естафети.", "Чесна гра — понад усе."]}, {"h": "Футбол. Вкидання м’яча з різних положень: типові помилки", "p": ["Найчастіші помилки під час вкидання: відрив однієї ноги від землі, кидок однією рукою, кидок не з-за голови, заступ на поле. Через них м’яч переходить до суперника.", "Для точності вкидання дивись на партнера й кидай м’яч йому під ногу чи на груди. Для дальності використовуй розбіг і вигин тулуба, але стеж, щоб ноги залишалися на землі."], "ul": ["Помилка: відрив ноги.", "Помилка: кидок однією рукою.", "Помилка: м’яч не з-за голови.", "Помилка: заступ на поле.", "Дивись на партнера, кому вкидаєш."]}, {"h": "Бадмінтон. Навчальна гра. Діагностувальна робота (ГР1)", "p": ["Діагностувальна робота перевіряє, чого ти навчився. У практичній частині можуть оцінювати подачу, удари, пересування та гру. Готуючись, повтори техніку основних ударів і правила гри.", "Оцінюй себе чесно: порівнюй свої результати з початком чверті. Наприклад, скільки коротких подач з 10 тепер влучає в ближню зону порівняно з першою спробою."], "ul": ["Повтори правила подачі й рахунку.", "Повтори техніку ударів справа й зліва.", "Розминка перед тестуванням — обов’язкова.", "Виконуй завдання спокійно, без поспіху.", "Порівняй результат зі своїм попереднім."]}], "f": "", "pr": ["Виконай вправи на розвиток сили: присідання 3×15, віджимання 3×10, планка 3×30 с, «човник» на животі 3×12.", "Склади для себе план підготовки до діагностувальної роботи: які правила й прийоми повторити з Cool Games, футболу й бадмінтону."], "q": ["Назви типові помилки під час вкидання м’яча.", "Що можуть оцінювати під час діагностувальної роботи з бадмінтону?", "Як правильно оцінити свій результат?", "Як ти готуватимешся до перевірки?"]}, {"n": "104", "t": "Cool Games. Порушення у футболі. Бадмінтон. Діагностувальна робота (ГР2)", "g": "Учень знатиме основні порушення й покарання у футболі, застосовуватиме вивчене в навчальних іграх і знатиме, як підготуватися до другої частини діагностувальної роботи.", "k": "Модулі: Cool Games · Футбол · Бадмінтон", "terms": [["Штрафний удар", "удар, яким відновлюють гру у футболі після порушення правил."], ["Пенальті", "удар з 11 метрів, що призначається за порушення у власному штрафному майданчику."], ["Жовта картка", "попередження гравцеві у футболі за неспортивну поведінку чи грубе порушення."], ["Червона картка", "вилучення гравця з поля до кінця гри."]], "th": [{"h": "Cool Games. Естафети: самостійне проведення", "p": ["Учні самостійно проводять естафету: пояснюють правила, стежать за виконанням, підраховують результат. Учитель лише спостерігає й допомагає за потреби.", "Це перевірка вміння організувати, судити й підтримувати чесну гру — усього, чого ми навчилися."], "ul": ["Організатори пояснюють правила.", "Судді — неупереджені.", "Результат записують у протокол.", "Учасники дотримуються правил.", "Після естафети — обговорення."]}, {"h": "Футбол. Навчальна гра: порушення і покарання", "p": ["У навчальній грі застосовуємо вивчені прийоми й дотримуємося правил. За підніжку, поштовх, ут function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
