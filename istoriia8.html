<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Всесвітня історія · 8 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{info:`<p><b>Ранньомодерна доба</b> — період в історії, що настав після Пізнього середньовіччя і тривав від <b>кінця XV до кінця XVIII ст.</b> Після неї почалася <b>Модерна доба</b>. В історії України цей час називають <b>Козацькою добою</b>.</p>
<h4>Головні події та явища доби</h4>
<ul><li>подорожі європейських мореплавців (Великі географічні відкриття);</li><li>Високе Відродження;</li><li>Реформація і Контрреформація, релігійні війни, Тридцятилітня війна;</li><li>виникнення сильних централізованих держав, абсолютних монархій, початок формування національних держав;</li><li>епоха Просвітництва та індустріальна (промислова) революція.</li></ul>
<p>Унаслідок подорожей мореплавців <b>світова цивілізація</b> (спільнота різних цивілізацій планети) набула <b>планетарного характеру</b>. Поступово занепадали традиційні цивілізації Сходу, формувалося панування Західного світу, постали колоніальні імперії. Це явище назвали <b>«великою дивергенцією»</b> (лат. <i>divergere</i> — «виявляти розбіжність»).</p>
<h4>Україна в Ранньомодерну добу</h4>
<p>Українські землі зазнали впливу Відродження, Реформації та Контрреформації: з’явилися переклади Святого Письма народною мовою, полемічна література; освіта, наука й мистецтво розвивалися на європейських традиціях. <b>Конституція Пилипа Орлика</b> засвідчила прагнення до демократії.</p>
<h4>Джерела історії доби</h4>
<ul><li><b>Речові</b> — знаряддя, зброя, монети, прикраси, споруди.</li><li><b>Писемні</b> — найбільшого значення набули саме вони: релігійні тексти, щоденники, листи, мемуари, автобіографії; з другої половини XVII ст. — <b>преса</b> (газети, журнали); наукові праці; документи органів влади (парламентські акти, судові рішення, податкові реєстри, договори); художня література.</li><li><b>Усні</b> — перекази, пісні, легенди.</li><li>Зображувальні: живопис набув світських рис, поширився жанр портрета.</li></ul>`,

// 2 §2 Експедиції європейських мореплавців
{info:`<p><b>Великі географічні відкриття</b> — умовний термін для історичного процесу середини XV — середини XVII ст., пов’язаного з найважливішими відкриттями європейських мандрівників.</p>
<h4>Причини і передумови</h4>
<ul><li>Османська імперія та араби перекрили шляхи на Схід, а європейцям потрібні були прянощі, тканини, а також <b>золото і срібло</b>.</li>
<li>Утворення великих централізованих держав (Іспанія, Португалія, Англія, Франція).</li>
<li>Після Реконкісти з’явилося багато дрібного дворянства, охочого воювати.</li>
<li>Підтримка католицької церкви (навернення язичників).</li>
<li>Компас, астролябія, портолан (морська карта), новий корабель — <b>карака</b> (і каравела).</li></ul>
<h4>Португальські експедиції</h4>
<ul><li>Принц <b>Енріке Мореплавець</b> започаткував дослідницькі експедиції.</li>
<li><b>1488 р.</b> — <b>Бартоломеу Діаш</b> обігнув південь Африки (мис Штормів → <b>мис Доброї Надії</b>).</li>
<li><b>1497–1498 рр.</b> — <b>Васко да Гама</b> вперше дістався Індії морем (порт <b>Калікут</b>, травень 1498 р.). Прибутки від прянощів сягали 800 %; почала формуватися <b>Португальська колоніальна імперія</b> (укріплені поселення на узбережжі, работоргівля, плантації).</li>
<li><b>1500 р.</b> — <b>Педру Кабрал</b> відкрив Бразилію.</li></ul>
<h4>Іспанські експедиції</h4>
<ul><li>Генуезець <b>Христофор Колумб</b> на службі в іспанських монархів Фернандо та Ізабелли на каравелах «Санта-Марія», «Пінта», «Нінья» досяг острова Сан-Сальвадор <b>12 жовтня 1492 р.</b> — дата відкриття Америки. Він вважав відкриті землі Індією (Вест-Індія).</li>
<li><b>1494 р.</b> — <b>Тордесільяський договір</b>: Іспанія й Португалія поділили світ по меридіану на захід від островів Зеленого Мису.</li>
<li>Назва <b>«Америка»</b> — на честь <b>Амеріго Веспуччі</b>, який заявив, що це «Новий Світ» (на картах з 1507 р.).</li>
<li><b>1513 р.</b> — Бальбоа перетнув Панамський перешийок і побачив Тихий океан.</li>
<li><b>1519–1522 рр.</b> — <b>перша навколосвітня подорож</b> експедиції <b>Фернана Магеллана</b> (5 кораблів); Магеллан загинув на Філіппінах, повернувся один корабель під командуванням <b>Хуана Себастьяна Елькано</b>. Доведено кулястість Землі.</li></ul>
<h4>Цивілізації доколумбової Америки</h4>
<p><b>Мая</b> (Юкатан), <b>ацтеки</b> (Мексика, столиця Теночтітлан), <b>інки</b> (Анди, столиця Куско) — розвинуті цивілізації з містами, храмами-пірамідами, календарем, писемністю; правителі мали необмежену владу (<b>деспотія</b>).</p>`,

// 3 §3 Конкіста
{info:`<p><b>Конкіста</b> (ісп. — «завоювання») — підкорення іспанськими й португальськими завойовниками Центральної і Південної Америки (кінець XV — середина XVI ст.). Учасників називали <b>конкістадорами</b>.</p>
<h4>Перебіг завоювання</h4>
<ul><li><b>1495 р.</b> — указ іспанських монархів дозволив усім охочим вирушати в експедиції по золото й срібло.</li>
<li><b>1508 р.</b> — Хуан Понсе де Леон заснував перше іспанське поселення в Новому Світі (Пуерто-Рико), згодом відкрив <b>Флориду</b> («квітуча земля»).</li>
<li><b>1517–1518 рр.</b> — підкорення держави <b>мая</b>.</li>
<li><b>1519–1521 рр.</b> — <b>Ернан Кортес</b> завоював державу <b>ацтеків</b>.</li>
<li><b>1524–1530-ті рр.</b> — <b>Франсіско Пісарро</b> підкорив державу <b>інків</b>.</li></ul>
<p>Перевага конкістадорів: вогнепальна зброя, коні, сталеві обладунки, розбрат між індіанськими народами, а також завезені хвороби (віспа), від яких загинула більшість місцевого населення.</p>
<h4>Колоніальна система</h4>
<p>Корінне населення змушували працювати на рудниках і в <b>латифундіях</b> (великих приватних маєтках, що виробляли продукцію на продаж). Через нестачу робочих рук почали завозити рабів з Африки. Більшість підкорених земель здобули незалежність лише на початку ХІХ ст.</p>
<h4>Наслідки Великих географічних відкриттів</h4>
<ul><li>Уявлення про світ розширилися; доведено кулястість Землі.</li>
<li>Торговельні шляхи перемістилися із Середземного моря в <b>Атлантику</b>; піднеслися Лісабон, Севілья, Антверпен, Амстердам, Лондон.</li>
<li><b>«Революція цін»</b> — знецінення грошей через приплив американського золота й срібла та зростання цін на товари першої потреби.</li>
<li><b>Обмін культурами</b>: до Європи потрапили картопля, кукурудза, томати, какао, тютюн; до Америки — коні, велика рогата худоба, пшениця.</li>
<li>Утворилися колоніальні імперії; почалися <b>колоніальні війни</b> — збройні зіткнення за захоплення чи перерозподіл колоній.</li>
<li>Негативні: винищення корінного населення, работоргівля.</li></ul>`,

// 4 §4 Розвиток ринкових відносин
{info:`<p><b>Ринкові відносини</b> — зв’язки, що виникають у процесі продажу та купівлі товарів між продавцями й покупцями. Після Великих географічних відкриттів торгівля стала світовою, зросли попит і обсяги виробництва.</p>
<p><b>Капітал</b> — гроші, які підприємці вкладають у розвиток виробництва з метою отримання прибутку.</p>
<h4>Мануфактури</h4>
<p><b>Мануфактура</b> (лат. — «виготовлення руками») — велике підприємство з <b>поділом праці</b>, де використовували переважно ручні знаряддя. Кожен робітник виконував одну операцію, тому продуктивність різко зросла.</p>
<ul><li><b>Розсіяна</b> — підприємець роздавав сировину ремісникам додому й скуповував готові вироби.</li>
<li><b>Централізована</b> — робітники працювали в одному приміщенні під наглядом.</li></ul>
<p>З’явилися нові верстви: <b>наймані працівники</b> (особисто вільні робітники, що працювали на власника засобів виробництва) і <b>буржуазія</b> (власники капіталів, підприємці). <b>Засоби виробництва</b> — знаряддя, обладнання, споруди, сировина.</p>
<h4>Банки, біржі, компанії</h4>
<p>Розвивалися банки, торговельні компанії, <b>біржі</b> (Антверпенська біржа — перша міжнародна; Амстердам). Укладали угоди, купували акції.</p>
<h4>Зміни в сільському господарстві</h4>
<ul><li>У Західній Європі селяни ставали особисто вільними, землю брали в <b>оренду</b> (тимчасове користування за плату), сплачуючи <b>ренту</b> — дохід землевласнику за користування землею. З’явилися фермерські господарства.</li>
<li>У Центрально-Східній Європі (Польща, Велике князівство Литовське, німецькі землі на схід від Ельби) поширилися <b>фільварки</b> (нім. — «маєток», «хутір») — великі господарства, що виробляли зерно на продаж, на основі <b>панщини</b> залежних селян. Тут посилювалося <b>кріпацтво</b> («друге видання кріпосного права»).</li>
<li>На українських землях за <b>«Уставою на волоки» 1557 р.</b> провели «волочну поміру» — землю поділили на однакові ділянки (волоки), що сприяло поширенню фільварків.</li></ul>`,

// 5 §5 Повсякденне життя населення Західної Європи
{info:`<h4>Населення</h4>
<p>Кількість населення Європи в Ранньомодерну добу зростала, хоча її стримували <b>війни, епідемії</b> (чума), <b>голод</b> через неврожаї. Поширилася <b>міграція населення</b> — переміщення людей зі зміною місця проживання, зокрема переселення до колоній Нового Світу.</p>
<h4>Харчування</h4>
<p>Основою раціону бідних був хліб і каші; багаті мали м’ясо, дичину, прянощі. Після відкриття Америки до європейського столу поступово увійшли <b>картопля, кукурудза, томати, квасоля</b>, а також нові напої — <b>какао (шоколад), кава, чай</b>. Поширилися виделка й порцеляновий посуд.</p>
<h4>Житло і міста</h4>
<p>Міста зростали, але залишалися тісними й брудними; багато будинків були дерев’яними, тож часто траплялися пожежі. Заможні будували кам’яні будинки, палаци.</p>
<h4>Шлюб, сім’я, становище жінки</h4>
<p>Сім’я була <b>патріархальною</b> — головою вважали чоловіка. Шлюби часто укладали за розрахунком батьків. Жінки займалися господарством і вихованням дітей, допомагали в ремеслі й торгівлі, але мали менше прав. До дітей стали ставитися як до наступників, що продовжать родинну справу; особисто вільний селянин міг заповісти майно дітям.</p>
<h4>Освіта</h4>
<p>Поширювалися школи (при церквах і міські), університети; книгодрукування зробило книги доступнішими. Протестанти заохочували вміння читати Біблію, а єзуїти створювали мережу колегіумів.</p>
<h4>Мода</h4>
<p><b>Мода</b> — сукупність звичок і смаків в одязі, що панують у суспільстві обмежений час. У XVI ст. законодавицею моди була Іспанія (темні тони, жорсткі силуети), у XVII ст. — Нідерланди (мережива, великі коміри — «млинові жорна») і Франція (пишні перуки, банти, підбори). Одяг підкреслював становище людини в суспільстві.</p>`,
terms:[["Міграція населення","переміщення людей зі зміною місця проживання назавжди або тимчасово"],["Патріархальна сім’я","сім’я, де головою вважається чоловік"],["Мода","сукупність звичок і смаків в одязі, що панують у суспільстві обмежений час"],["Епідемія","масове поширення інфекційної хвороби"]],

// 6 §6 Гуманізм і Високе Відродження: образотворче мистецтво
{info:`<p><b>Гуманізм</b> (лат. <i>humanus</i> — «людяний») — інтелектуальний рух епохи Відродження, у центрі якого — людина, її розум, гідність і творчі можливості. <b>Відродження (Ренесанс)</b> — епоха в культурі Європи, що прагнула відродити античні ідеали.</p>
<p><b>Високе Відродження</b> — вершина розвитку мистецтва Відродження в Італії (кінець XV — перша третина XVI ст.). Центром став <b>Рим</b>, де папи замовляли митцям храми й розписи.</p>
<h4>Леонардо да Вінчі (1452–1519)</h4>
<p>Універсальний геній — художник, скульптор, інженер, винахідник, анатом. Твори: фреска <b>«Таємна вечеря»</b> (Мілан), портрет <b>«Мона Ліза» (Джоконда)</b>, «Мадонна Літта». Використовував прийом <b>сфумато</b> — м’які переходи світла й тіні.</p>
<h4>Мікеланджело Буонарроті (1475–1564)</h4>
<p>Скульптор, художник, архітектор, поет — найбільш незалежний митець Відродження. Скульптура <b>«Давид»</b>, «П’єта»; розпис стелі та фреска <b>«Страшний суд»</b> у <b>Сікстинській капелі</b> Ватикану; працював над куполом <b>собору Святого Петра</b> в Римі (будівництво почалося 1506 р. за проєктом <b>Браманте</b>).</p>
<h4>Рафаель Санті (1483–1520)</h4>
<p>Майстер гармонії й краси; розписи станців (кімнат) Ватикану, зокрема фреска <b>«Афінська школа»</b>; <b>«Сікстинська мадонна»</b>.</p>
<h4>Тиціан Вечелліо (бл. 1488/1490–1576)</h4>
<p>Глава венеціанської школи живопису, майстер кольору: «Земне й небесне кохання», «Даная», портрети.</p>
<h4>Північне Відродження</h4>
<p>В Нідерландах і Німеччині: <b>Альбрехт Дюрер</b> (гравюри, автопортрети), <b>Ганс Гольбейн Молодший</b> (портрети), <b>Пітер Брейгель Старший</b> (сцени селянського життя). Для північного мистецтва характерні увага до деталей і побуту.</p>`,

// 7 §7 Література доби Високого Відродження
{info:`<h4>Нікколо Макіавеллі (1469–1527)</h4>
<p>Флорентійський мислитель і політик. У 1516 р. написав працю <b>«Державець»</b>, присвячену правителю Флоренції Лоренцо Медічі, де стверджував, що правитель заради сильної держави може вдаватися до будь-яких засобів («мета виправдовує засоби»). Термін <b>макіавеллізм</b> означає політику, що нехтує мораллю.</p>
<h4>Еразм Роттердамський (1469–1536)</h4>
<p>Нідерландський гуманіст, «король гуманістів». У сатирі <b>«Похвала глупоті»</b> висміював невігластво, зажерливість духовенства, марнославство. Видав грецький текст Нового Заповіту.</p>
<h4>Томас Мор (1478–1535)</h4>
<p>Англійський гуманіст, автор <b>«Утопії»</b> (1516) — опису ідеального суспільства без приватної власності. Слово «утопія» стало означати нездійсненну мрію.</p>
<h4>Франсуа Рабле (бл. 1494–1553)</h4>
<p>Французький письменник, автор єдиної книги <b>«Гаргантюа і Пантагрюель»</b> (1532–1564) — книги-казки про велетнів, що висміює середньовічні порядки й прославляє знання, свободу та радість життя.</p>
<h4>Вільям Шекспір (1564–1616)</h4>
<p>Англійський драматург і поет, працював у лондонському театрі <b>«Глобус»</b>. Трагедії <b>«Ромео і Джульєтта», «Гамлет», «Отелло», «Король Лір», «Макбет»</b>; комедії «Сон літньої ночі», «Дванадцята ніч»; історичні хроніки; 154 сонети. Його творчість гуманістична: «Яким чудовим є цей рід людський!»</p>
<h4>Мігель де Сервантес (1547–1616)</h4>
<p>Іспанський письменник, учасник битви при Лепанто. Роман <b>«Дон Кіхот»</b> — пародія на лицарські романи й водночас глибока історія про шляхетного мрійника; поряд із ним — практичний Санчо Панса. Твір утілює гуманістичні ідеали добра і справедливості.</p>`,
terms:[["Макіавеллізм","політика, що нехтує мораллю заради мети"],["Утопія","опис ідеального суспільства; нездійсненна мрія"],["Сатира","твір, що гостро висміює вади"],["Гуманістична література","література, що прославляє людину, її розум і почуття"]],

// 9 §8 Іспанія та Священна Римська імперія
{info:`<h4>Іспанія</h4>
<p><b>1492 р.</b> завершилася <b>Реконкіста</b> — увесь Піренейський півострів, крім Португалії, опинився під владою Іспанії. Шлюб <b>Фернандо Арагонського та Ізабелли Кастильської</b> об’єднав країну.</p>
<ul><li>Їхній онук <b>Карлос I</b> з 1517 р. правив Іспанією, а 1519 р. був обраний імператором Священної Римської імперії під ім’ям <b>Карл V</b>. Його володіння були такими великими, що казали: «над ними ніколи не заходить сонце».</li>
<li>Він придушив <b>повстання комунерос</b> (1520–1522), обмежив права міст і <b>кортесів</b> (станово-представницьких зборів, що затверджували податки). Найгучніша перемога — <b>оборона Відня 1529 р.</b> від османів. Після поразки від німецьких князів — прибічників Реформації в 1555 р. Карл V зрікся влади.</li>
<li><b>Феліпе II</b> (1556–1598) — ревний католик, будував абсолютну монархію; столицю перенесено до <b>Мадрида</b>, збудовано палац-монастир Ескоріал. Інквізиція переслідувала інакодумців; 1568 р. почалося повстання <b>маврів</b> (арабів-мусульман).</li>
<li><b>1571 р.</b> — у битві біля <b>Лепанто</b> Священна ліга (Іспанія, Венеція та ін.) розгромила османський флот.</li>
<li><b>1581 р.</b> Феліпе II приєднав Португалію з колоніями (до 1640 р.).</li>
<li>Попри багатства з Америки, Іспанія занепадала: золото витрачали на війни й розкоші, промисловість не розвивалася, вигнання маврів і євреїв підірвало ремесло. Поразка «Непереможної армади» (1588) послабила її.</li></ul>
<h4>Священна Римська імперія німецької нації</h4>
<p>Офіційна назва з 1512 р.; об’єднувала німецькі, австрійські, чеські та інші землі (≈40 млн осіб). Резиденція імператора — <b>Відень</b>, рейхстаг — у Регенсбурзі. Імператора обирали <b>курфюрсти</b>. Імперія була роздробленою: сотні князівств і вільних міст мали значну самостійність.</p>
<p>Після Карла V імперією правили австрійські <b>Габсбурги</b>: Фердинанд I (1556–1564), Максиміліан II (1564–1576), Рудольф II (1576–1611), за якого Прага стала культурним центром.</p>`,

// 10 §9 Початок Реформації
{info:`<p><b>Реформація</b> (лат. — «перетворення», «виправлення») — релігійно-суспільний рух у Європі XVI — середини XVII ст., що виступав за переосмислення ролі католицької церкви та повернення до біблійних витоків християнства.</p>
<h4>Причини</h4>
<ul><li>Багатство й розкіш церкви, продаж церковних посад, неосвіченість частини духовенства.</li>
<li>Продаж <b>індульгенцій</b> — грамот про «відпущення гріхів» за гроші.</li>
<li>Невдоволення князів, міщан і селян поборами на користь Рима; роздробленість Німеччини.</li>
<li>Поширення гуманізму й книгодрукування.</li></ul>
<h4>Мартін Лютер</h4>
<p><b>1517 р.</b> у <b>Віттенберзі</b> богослов <b>Мартін Лютер</b> оприлюднив <b>«95 тез»</b> проти продажу індульгенцій. Головні ідеї: людина рятується <b>вірою</b>, а не купівлею індульгенцій; єдине джерело віри — <b>Святе Письмо</b>; кожен вірянин може спілкуватися з Богом без посередництва церкви. 1520 р. Лютер спалив папську буллу і був відлучений від церкви. Він переклав Біблію німецькою мовою. (Пізніше, 1567 р., Папа Пій V заборонив продаж індульгенцій.)</p>
<h4>Селянська війна 1524–1525 рр.</h4>
<p>Селяни вимагали скасувати кріпацтво й непосильні повинності. Радикальний проповідник <b>Томас Мюнцер</b> закликав до встановлення справедливості силою. Навесні — влітку 1525 р. у війні брало участь близько 300 тис. осіб, але князі жорстоко придушили повстання. Лютер засудив повсталих.</p>`,

// 11 §10 Поширення Реформації та Контрреформація
{info:`<h4>Народження протестантизму</h4>
<p>1529 р. на рейхстазі в <b>Шпаєрі</b> католицька більшість ухвалила обов’язковість католицьких служб; прибічники Лютера склали <b>протест</b> — звідси назва <b>протестанти</b>. Протестантські князі створили Шмалькальденський союз; Карл V воював проти нього (1546–1547, 1552). <b>1555 р.</b> — <b>Аугсбурзький релігійний мир</b> за принципом <b>«чия влада, того й віра»</b>: князь визначав віру підданих.</p>
<p><b>Секуляризація</b> (лат. <i>saecularis</i> — «світський») — зменшення впливу церкви; у вузькому сенсі — вилучення державою церковного майна.</p>
<h4>Реформація у Швейцарії</h4>
<ul><li><b>Ульріх Цвінглі</b> у Цюриху 1523 р. оприлюднив «67 тез».</li>
<li><b>Жан Кальвін</b> із 1541 р. в <b>Женеві</b> створив суворе вчення — <b>кальвінізм</b>: ідея <b>божественного приречення</b> (Бог заздалегідь визначив долю людини, а ознака обраності — успіх у праці); заохочення працьовитості, ощадливості. Женеву називали «протестантським Римом». Кальвінізм поширився в Нідерландах, Шотландії, Франції (гугеноти), Англії (пуритани).</li></ul>
<h4>Контрреформація</h4>
<p><b>Контрреформація</b> — заходи католицької церкви для боротьби з Реформацією та оновлення (від Тридентського собору 1545 р. до 1648 р.).</p>
<ul><li>1542 р. Павло III створив Конгрегацію верховної <b>інквізиції</b>.</li>
<li><b>Тридентський собор (1545–1563)</b> підтвердив непохитність католицького віровчення, верховенство Папи, але заборонив продаж церковних посад, зобов’язав готувати освічених священників у семінаріях.</li>
<li>Запроваджено <b>«Індекс заборонених книг»</b>.</li></ul>
<h4>Орден єзуїтів</h4>
<p><b>«Товариство Ісуса»</b> заснував іспанський дворянин <b>Ігнатій Лойола</b> 1534 р. Єзуїти мали сувору дисципліну й беззаперечний послух Папі, діяли через освіту, проповідь, місії. 1615 р. орден налічував ≈13 тис. членів і 370 шкіл. На українських землях єзуїти діяли з 1569 р., засновували колегіуми.</p>`,

// 12 §11 Національно-визвольна війна в Нідерландах
{info:`<h4>Нідерланди під владою Іспанії</h4>
<p>Сімнадцять нідерландських провінцій (сучасні Нідерланди, Бельгія, Люксембург) були найрозвиненішою частиною володінь Габсбургів: мануфактури, торгівля, порти <b>Антверпен</b> і <b>Амстердам</b>. Король <b>Феліпе II</b> обмежив права місцевої знаті й міст, запровадив важкі податки, жорстоко переслідував протестантів-кальвіністів через інквізицію.</p>
<h4>Перебіг війни (1566–1648 рр.)</h4>
<ul><li><b>1566 р.</b> — <b>іконоборське повстання</b>: ремісники й селяни нищили католицькі церкви та ікони.</li>
<li>Феліпе II надіслав армію <b>герцога Альби</b> (1567–1573): терор, «Кривава рада», страта графа Егмонта (1568), податок «десятий гріш».</li>
<li>Повстанці — <b>гези</b> («жебраки»): лісові та морські. <b>1572 р.</b> морські гези захопили порт <b>Брілле</b> — почалося загальне повстання на Півночі. Провідником став принц <b>Вільгельм (Віллем) Оранський</b>.</li>
<li>1576 р. — «Іспанська лють» (пограбування Антверпена) і <b>Гентське примирення</b> всіх провінцій.</li>
<li><b>1579 р.</b> — південні провінції уклали <b>Арраську унію</b> і визнали владу Феліпе II, а північні — <b>Утрехтську унію</b>. 1581 р. вони оголосили про позбавлення Феліпе II влади й утворили державу <b>Сполучені провінції Нідерландів</b> (Голландію) — <b>республіку</b>.</li>
<li>Війна тривала до <b>1648 р.</b>, коли Іспанія визнала незалежність Сполучених провінцій (Мюнстерський договір у складі Вестфальського миру). Тому її називають <b>Вісімдесятилітньою війною</b>.</li></ul>
<h4>Значення</h4>
<p>Постала перша в Європі успішна буржуазна республіка. Голландія стала провідною морською й торговельною державою: <b>Голландська Ост-Індська компанія</b> (1602–1798), Амстердамський банк (1609), колонії (Новий Амстердам — майбутній Нью-Йорк, Капська земля). Владу в республіці мала невелика група багатих купців — <b>олігархія</b>.</p>`,

// 13 §12 Англія
{info:`<h4>Зміни в економіці та суспільстві</h4>
<p>Англійське сукно мало великий попит, вигідним стало вівчарство. Лорди захоплювали общинні землі й перетворювали орні поля на пасовища — <b>обгороджування</b>. Селян зганяли із землі, тож казали: <b>«вівці поїдають людей»</b>. Зубожілих карали «кривавими законами» проти жебраків. Розвивалися мануфактури, з’явилася <b>нова шляхта (джентрі)</b>, що вела господарство по-новому.</p>
<h4>Реформація в Англії</h4>
<p>Король <b>Генрі VIII</b> (1509–1547) хотів розірвати шлюб, на що Папа не погодився. <b>1534 р.</b> парламент ухвалив <b>«Акт про супрематію»</b>: главою церкви Англії став король. Виникла <b>англіканська церква</b> — державна протестантська церква, що зберегла багато католицьких обрядів. Монастирі закрили, їхні землі продали. 1571 р. оприлюднено «39 статей» — основи англіканства.</p>
<h4>Елізабетинська доба (1558–1603)</h4>
<p>Королева <b>Елізабет I</b> зміцнила англіканську церкву, підтримувала торгівлю, мореплавство й мистецтво (доба Шекспіра). Суперницю — шотландську королеву-католичку <b>Мері Стюарт</b> — після змов було страчено (1587).</p>
<ul><li><b>Пуритани</b> («чисті») — англійські кальвіністи, що вимагали очистити церкву від католицьких залишків і жити скромно й суворо.</li>
<li>Флібустьєри (пірати) <b>Френсіс Дрейк</b> (навколосвітня подорож 1577–1580) та <b>Волтер Релі</b> (заснував Вірджинію, 1584) грабували іспанські кораблі.</li>
<li><b>1588 р.</b> англійський флот і шторм знищили іспанську <b>«Непереможну армаду»</b> — початок перетворення Англії на «володарку морів».</li></ul>
<h4>Підкорення Ірландії</h4>

// 14 §13 Франція
{info:`<h4>Зміцнення королівської влади</h4>
<p>На початку XVI ст. Франція — одна з найбільших держав Європи. <b>Генеральні штати</b> (станово-представницький орган) не скликали з 1484 р.; королі правили самостійно. <b>Франциск I</b> (1515–1547) 1516 р. домовився з Папою, що король сам призначає людей на вищі церковні посади. Франція вела Італійські війни з Габсбургами.</p>
<h4>Реформація у Франції</h4>
<p>Кальвінізм поширився серед частини дворян і міщан півдня — <b>гугенотів</b>. Влада переслідувала їх (з 1540 р. діяла інквізиція), проте північ і Париж лишалися католицькими.</p>
<h4>Релігійні (гугенотські) війни 1562–1598 рр.</h4>
<ul><li>Приводом стало вбивство гугенотів у містечку <b>Вассі</b> 1 березня 1562 р.</li>
<li>Протистояли католики на чолі з герцогами <b>Гізами</b> та гугеноти на чолі з <b>Бурбонами</b>. Велику роль відігравала королева-мати <b>Катерина Медічі</b>.</li>
<li><b>Варфоломіївська ніч</b> — <b>24 серпня 1572 р.</b>: за згоди короля Шарля IX у Парижі, де зібралися гугеноти на весілля Генріха Наваррського, католики вбили тисячі гугенотів.</li>
<li>Війна трьох Генріхів завершилася приходом до влади <b>Генріха IV Бурбона</b> (Анрі IV), який перейшов у католицтво («Париж вартий меси»).</li></ul>
<h4>Нантський едикт 1598 р.</h4>
<p>Генріх IV видав <b>Нантський едикт</b>: католицизм визнано панівною релігією, але гугеноти отримали свободу віросповідання, право мати громади в усіх містах (крім Парижа), посади й фортеці. Релігійні війни завершилися, почалося відновлення країни.</p>`,

// 15 §14 Культура бароко. Нова наука
{info:`<h4>Бароко</h4>
<p><b>Бароко</b> (італ. — «химерний», «дивний») — художній стиль кінця XVI — середини XVIII ст., що виник в Італії. На відміну від спокійної гармонії Відродження, бароко прагне вразити: пишність, динаміка, контрасти світла й тіні, позолота, складні форми. Його підтримувала католицька церква в добу Контрреформації та абсолютні монархи.</p>
<ul><li><b>Архітектура та скульптура</b>: <b>Лоренцо Берніні</b> — колонада площі Святого Петра в Римі.</li>
<li><b>Живопис</b>: <b>Караваджо</b> (різкі контрасти світла й тіні), фламандець <b>Пітер Пауль Рубенс</b> (пишні, яскраві полотна), іспанець <b>Дієго Веласкес</b> («Меніни», портрет Папи Інокентія X — «занадто схожий»), голландець <b>Рембрандт ван Рейн</b> («Нічна варта», «Повернення блудного сина»).</li>
<li>Українське (козацьке) бароко — храми й мистецтво XVII–XVIII ст.</li></ul>
<h4>Наукова революція</h4>
<p>У XVI–XVII ст. склався новий підхід до пізнання — через <b>досвід і експеримент</b>, а не авторитет церкви.</p>
<ul><li><b>Медицина</b>: італійський лікар <b>Андреас Везалій</b> (1543 р., «Про будову людського тіла») заклав основи анатомії; <b>Вільям Гарвей</b> відкрив кровообіг.</li>
<li><b>Математика</b>: Рене Декарт (система координат), Блез Паскаль.</li>
<li><b>Астрономія</b> (грец. «зоря» + «закон»):
<ul><li><b>Миколай Коперник</b> обґрунтував <b>геліоцентричну систему</b> — Земля обертається навколо Сонця (1543).</li>
<li><b>Джордано Бруно</b> учив про нескінченність Всесвіту; 1600 р. спалений інквізицією.</li>
<li><b>Галілео Галілей</b> створив телескоп, 1632 р. видав «Діалоги…» на підтримку Коперника; інквізиція змусила його зректися поглядів.</li>
<li><b>Йоганн Кеплер</b> відкрив закони руху планет.</li></ul></li>
<li><b>Ісаак Ньютон</b> відкрив закон всесвітнього тяжіння та закони механіки.</li></ul>`,

// 17 §15 Річ Посполита та Московське царство
{info:`<h4>Польща в XVI ст.</h4>
<p>Корона Польська збагачувалася на продажу зерна до Західної Європи через Гданськ. Поширилися <b>фільварки</b>, зростала <b>панщина</b>: 1505 р. — один день на тиждень, наприкінці XVI ст. — до п’яти. Головну роль відігравала <b>шляхта</b>, що мала широкі права й контролювала <b>сейм</b>. Під впливом Відродження розвивалися освіта й література (Миколай Рей, Ян Кохановський).</p>
<h4>Люблінська унія 1569 р.</h4>
<p>Через загрозу з боку Московської держави у Лівонській війні король <b>Жигмунт (Сигізмунд) II Август</b> скликав у Любліні спільний сейм. У <b>липні 1569 р.</b> підписано <b>Люблінську унію</b>: Корона Польська та Велике князівство Литовське об’єдналися в одну державу — <b>Річ Посполиту</b> зі спільним королем, сеймом, зовнішньою політикою. Українські землі (Волинь, Київщина, Брацлавщина) перейшли до Корони Польської.</p>
<h4>Політичний устрій</h4>
<p>1572 р. припинилася династія Ягеллонів. Відтоді короля обирала шляхта на сеймі (<b>вільні елекції</b>), а кожен новий король підписував умови, що обмежували його владу. 1573 р. сейм гарантував <b>свободу віросповідання</b>. Річ Посполиту називають «шляхетською республікою».</p>
<p>Зовнішня політика: Лівонська війна (1558–1583) проти Московії, боротьба зі Швецією за Лівонію.</p>
<h4>Московське царство в XVI ст.</h4>
<ul><li>Утвердилася ідея <b>«Москва — третій Рим»</b> (чернець Філофей) — обґрунтування претензій на зверхність над православними та експансії (розширення панування).</li>
<li><b>1547 р.</b> — <b>Іван IV (Грозний)</b> вінчався на царство; держава стала <b>царством</b>. Утвердилося <b>самодержавство</b> — абсолютна монархія з необмеженою владою, близька до деспотії.</li>
<li>1549 р. — перший <b>Земський собор</b>; реформи «Вибраної ради»; створено військо <b>стрільців</b>.</li>
<li>Завоювання <b>Казанського</b> (1552) та Астраханського ханатів; 1582 р. почалося підкорення Сибірського ханату. 1571 р. кримський хан Девлет I Герай спалив Москву.</li>
<li><b>Опричнина</b> (1564–1577) — 1564 р. Іван IV залишив Москву й поділив державу на земщину та опричнину (землі під особистим управлінням царя); масові страти (у Москві страчено 120 бояр, під час погрому Новгорода загинуло дві третини населення). Після перемоги над Кримським ханатом у Молодинській битві цар у 1577 р. скасував опричнину.</li></ul>`,

// 18 §16 Османська імперія
{info:`<h4>Вершина могутності</h4>
<p>Після захоплення Константинополя (1453 р., столиця — <b>Стамбул</b>) Османська імперія стала однією з наймогутніших держав світу. Султан <b>Селім I Грізний</b> (1512–1520) захопив Сирію, Єгипет, Аравію; султан став <b>халіфом</b> — главою мусульман.</p>
<p>Найвищого розквіту імперія досягла за <b>Сулеймана I Пишного</b> (1520–1566), який правив 46 років. Його дружина — <b>Роксолана (Хюррем)</b>, родом з українських земель.</p>
<ul><li><b>1526 р.</b> — розгром чесько-угорського війська під <b>Могачем</b>; більша частина Угорщини підкорена.</li>
<li><b>1529 р.</b> — облога <b>Відня</b>, яку не вдалося завершити успіхом.</li>
<li>Флот панував у Середземному морі, доки <b>1571 р.</b> Священна ліга не здобула першої значної перемоги біля <b>Лепанто</b>.</li></ul>
<h4>Устрій та економіка</h4>
<p>Султан мав необмежену владу; державою керував <b>великий візир</b>. Основою армії були <b>яничари</b> (піхота, набрана з християнських хлопчиків, навернених в іслам) і кіннота <b>сипахів</b>, які за службу отримували землю (тимари). Імперія контролювала торговельні шляхи між Європою та Азією. Будували величні мечеті (Сулейманіє в Стамбулі, архітектор Сінан, 1550–1557).</p>
<h4>Кримський ханат</h4>
<p>Від 1475 р. Кримський ханат перебував під зверхністю Османської імперії, але зберігав самостійність; лише з 1584 р. султани почали впливати на вибір ханів. Хани контролювали Північне Причорномор’я, нападали на українські землі, брали <b>ясир</b> (полонених) і вступали в союзи то з Московією, то з Польщею, то з козаками.</p>
<h4>Народи під владою османів</h4>
<p>Балканські народи боролися проти османського панування: Прилепське повстання (1564–1565), Тирновське повстання в Болгарії (1598), рух <b>гайдуків</b> — загонів народних месників.</p>`,

// 19 §17 Індія та Іран
{info:`<h4>Держава Великих Моголів</h4>
<ul><li><b>Бабур</b>, нащадок Тамерлана, із сильним військом і артилерією 1526 р. розгромив делійського султана біля <b>Паніпата</b> й заснував <b>державу Великих Моголів</b>.</li>
<li>Його син <b>Хумаюн</b> довго відстоював владу.</li>
<li><b>Акбар I Великий</b> (1556–1605) — наймогутніший правитель: розширив державу на більшу частину Індії, провів реформи (поділ на провінції, єдині податки, упорядкування армії), проводив політику <b>віротерпимості</b> між мусульманами й індуїстами, скасував податок для немусульман.</li>
<li>За <b>Шах Джахана</b> збудовано мавзолей <b>Тадж-Махал</b> в Агрі на честь дружини.</li></ul>
<p>Індія була багатою країною (тканини, прянощі, коштовності). Друга офіційна назва Індії — <b>Бхарат</b>. У XVI–XVII ст. на узбережжі з’являються європейці: португальці (Гоа), згодом голландці, англійці (Ост-Індська компанія, 1600), французи.</p>
<h4>Іран за Сефевідів</h4>
<p>У <b>1502–1736 рр.</b> в Ірані правила династія <b>Сефевідів</b>, названа від шейха Сефі-ад-Діна. Державною релігією став шиїтський іслам. Сефевіди вели війни з Османською імперією.</p>
<p>Найвизначніший правитель — шах <b>Аббас I Великий</b> (1587–1629): зміцнив центральну владу, створив регулярну армію з рушницями й гарматами, провів фінансову реформу, зробив торгівлю шовком державною монополією. Столиця — <b>Ісфаган</b> із величними мечетями й палацами.</p>
<h4>Культура</h4>
<p>В Індії розвивалися архітектура (поєднання індійських та ісламських традицій), мініатюрний живопис, поезія; в Ірані — килимарство, кераміка, мініатюра, архітектура Ісфагана.</p>`,

// 20 §18 Китай і Японія в XVI — на початку XVII ст.
{info:`<h4>Китай за династії Мін</h4>
<p>У XVI ст. Китаєм правила династія <b>Мін</b>. Країна була густонаселеною, розвивалося землеробство: рисові поля (чеки), іригація, два врожаї на рік. Виробляли шовк, порцеляну, чай. Проте імператорська влада слабшала, зростали податки, корупція чиновників, набіги монголів (Алтан-хан) і японських піратів. Будували й зміцнювали <b>Велику китайську стіну</b>.</p>
<h4>Європейці в Китаї</h4>
<ul><li><b>1516 р.</b> берегів Китаю досягли португальці; 1549 р. їх вигнали, але згодом вони закріпилися в <b>Макао</b>.</li>
<li>Англійці силою домоглися права торгувати через Гуанчжоу (1637).</li>
<li>Місіонер-єзуїт <b>Маттео Річчі</b> навертав китайців у християнство й знайомив їх з європейською наукою.</li></ul>
<p>Китайська влада загалом обмежувала контакти з іноземцями, вважаючи Китай центром світу («Серединною державою»).</p>
<h4>Культура Китаю</h4>
<p>Розвивалися роман («Подорож на Захід», «Річкові заводі»), живопис, театр, архітектура (Заборонене місто в Пекіні).</p>
<h4>Японія</h4>
<p>У XVI ст. Японія була роздроблена між князями (<b>даймьо</b>), що воювали між собою. Формальним главою був імператор, але реальна влада належала <b>сьогуну</b> («великому полководцю») — військовому правителю.</p>
<ul><li><b>Самураї</b> — стан професійних воїнів, що служили своїм панам і мали привілеї.</li>
<li><b>Синтоїзм</b> («шлях богів») — давня релігія віри в духів; поширений також буддизм.</li>
<li><b>1543 р.</b> до Японії прибули португальці, привезли вогнепальну зброю; поширювалося християнство.</li></ul>`,

// 22 §19 Абсолютна монархія у Франції
{info:`<p><b>Абсолютна монархія (абсолютизм)</b> — форма правління, за якої вся влада зосереджена в руках монарха, а станово-представницькі органи не скликаються.</p>
<h4>Генріх IV (1594–1610)</h4>
<p>Після релігійних війн навів лад у господарстві, упорядкував і зменшив податки, підтримував мануфактури, торгівлю, будівництво доріг. 1604 р. почалася колонізація <b>Канади</b> (Самуель де Шамплен). Генріх IV загинув від руки фанатика-католика.</p>
<h4>Кардинал Рішельє</h4>
<p>За короля <b>Луї XIII</b> (1610–1643) Францією фактично керував перший міністр <b>кардинал Рішельє</b> (з 1624 р.). Його мета — <b>сильна королівська влада</b> і велич Франції:</p>
<ul><li>позбавив гугенотів фортець і військ (облога Ла-Рошелі), але «Едиктом милості» (1629) зберіг їм свободу віри;</li>
<li>приборкав непокірну знать, наказав руйнувати замки;</li>
<li>проводив політику <b>меркантилізму</b> (втручання держави в економіку, стимулювання торгівлі, колонії) і <b>протекціонізму</b> (захист власних виробників); заснував 22 торговельні компанії;</li>
<li>1635 р. Франція вступила в Тридцятилітню війну проти Габсбургів.</li></ul>
<h4>Луї XIV — «король-сонце» (1643–1715)</h4>
<p>За Луї XIV формування абсолютизму завершилося. Йому приписують слова <b>«Держава — це я»</b>.</p>
<ul><li>Під час його дитинства відбулася <b>Фронда</b> (1648–1653) — рух проти абсолютизму, який придушили.</li>
<li>Збудовано розкішний палац <b>Версаль</b> — символ абсолютизму; при дворі — суворий етикет.</li>
<li>Міністр фінансів <b>Жан-Батист Кольбер</b> підтримував мануфактури, торгівлю, флот, колонії.</li>
<li>Військовий інженер <b>Вобан</b> збудував систему фортець.</li>
<li><b>1685 р.</b> скасовано <b>Нантський едикт</b>: понад 200 тис. гугенотів залишили Францію.</li>
<li>Безперервні війни (зокрема за іспанську спадщину) виснажили країну.</li></ul>`,

// 23 §20 «Золотий вік» Нідерландів
{info:`<p><b>«Золотим віком»</b> історії Нідерландів називають період приблизно з <b>1588 р.</b> (народження Голландської республіки) до <b>1672 р.</b> — тоді торгівля, наука, мистецтво й армія Сполучених провінцій були серед найрозвиненіших у Європі.</p>
<h4>Морська й торговельна держава</h4>
<ul><li>Голландці мали найбільший у Європі торговельний флот — їх називали «морськими візниками».</li>
<li>1595–1597 рр. — перша голландська експедиція в Ост-Індію (Корнеліс де Гаутман).</li>
<li><b>1602 р.</b> створено <b>Ост-Індську компанію</b>; 1606 р. вона вперше випустила <b>акції</b>. 1619 р. штаб-квартира перенесена до <b>Батавії</b> (тепер Джакарта).</li>
<li>Амстердам став фінансовим центром Європи: банк (1609), біржа.</li>
<li><b>1652 р.</b> Ян ван Рібек заснував на півдні Африки базу, що стала містом <b>Кейптаун</b>.</li>
<li>1570–1670 рр. — «золотий вік» нідерландської картографії.</li></ul>
<h4>Нові Нідерланди</h4>
<p>1614 р. землі на сході Північної Америки приєднано як <b>Нові Нідерланди</b>; 1626 р. острів <b>Мангеттен</b> викупили в індіанців за 60 гульденів і заснували <b>Новий Амстердам</b>. 1664 р. колонію передано Англії, місто перейменовано на <b>Нью-Йорк</b>.</p>
<h4>Тюльпаноманія</h4>
<p>У 1630-х рр. тюльпани (батьківщина — Близький Схід) стали надзвичайно модними. Ціни на цибулини різко зросли (1633–1637), люди продавали будинки, укладали <b>ф’ючерсні угоди</b> — договори про купівлю товару в майбутньому за визначеною ціною. У <b>лютому 1637 р.</b> ціни обвалилися — це вважають однією з перших фінансових «бульбашок» в історії.</p>
<h4>Культура</h4>
<p>Голландський живопис: <b>Рембрандт</b>, <b>Ян Вермеер</b> («Дівчина з перловою сережкою»), Франс Хальс; «малі голландці» — побутові сцени, натюрморти, пейзажі. Наука: Гюйгенс, Левенгук (мікроскоп), Гуго Гроцій (міжнародне право).</p>
<p><b>1672 р.</b> — «рік лиха»: вторгнення Франції та її союзників; голландці відкрили шлюзи й затопили частину країни. Нідерланди вистояли, але втратили провідні позиції.</p>`,

// 24 §21 Англія в XVII ст. Англійська революція
{info:`<h4>Передумови революції</h4>
<p>З <b>1603 р.</b> в Англії правила династія <b>Стюартів</b>. <b>Джеймс I</b> і <b>Чарльз I</b> (1625–1649) прагнули абсолютної влади, збирали податки без згоди парламенту, переслідували пуритан. Частина пуритан переселилася до Америки: 1607 р. — перше постійне поселення (Вірджинія), <b>1620 р.</b> — <b>Мейфлаверська угода</b> переселенців.</p>
<p>1640 р. Чарльз I мусив скликати парламент для нових податків — <b>«Довгий парламент»</b> (діяв до 1653 р.), який обмежив владу короля.</p>
<p><b>Революція</b> — докорінна якісна зміна в житті суспільства. Термін у політичному сенсі почали вживати з «Славної революції» 1688–1689 рр.</p>
<h4>Громадянські війни</h4>
<ul><li><b>1642 р.</b> Чарльз I залишив Лондон — почалася <b>перша громадянська війна</b> (1642–1646) між прихильниками короля (<b>«кавалерами»</b>) і парламенту (<b>«круглоголовими»</b>).</li>
<li><b>Олівер Кромвель</b> створив дисципліновану армію «нового зразка»; перемоги при <b>Марстон-Мурі</b> (1644) і <b>Несбі</b> (1645).</li>
<li>Друга громадянська війна (1648–1649) також завершилася поразкою короля.</li>
<li><b>1649 р.</b> Чарльза I за рішенням суду <b>страчено</b>; Англію проголошено <b>республікою</b>.</li></ul>
<h4>Республіка і протекторат</h4>
<p>Різні угруповання: <b>індепенденти</b> (за обмеження монархії / республіку), <b>левелери</b> («зрівнювачі» — за рівні політичні права), <b>дигери</b> («копачі» — за спільну власність на землю). 1651 р. — <b>Навігаційний акт</b> (перевезення товарів лише англійськими суднами). 1653 р. Кромвель розігнав парламент і став <b>лордом-протектором</b> — фактично диктатором; документ «Знаряддя управління» проголошував: «Народ є основою будь-якої істинної влади».</p>
<h4>Реставрація і «Славна революція»</h4>
<ul><li>1658 р. Кромвель помер; <b>1660 р.</b> — <b>реставрація</b> Стюартів (Чарльз II).</li>
<li>Джеймс II (з 1685 р.) знову прагнув абсолютизму. <b>1688–1689 рр.</b> парламент запросив на трон голландського штатгальтера <b>Віллема Оранського</b> (Вільгельм III) — безкровний переворот назвали <b>«Славною революцією»</b>.</li>
<li><b>«Білль про права» (1689)</b> обмежив владу монарха: без згоди парламенту не можна видавати закони, збирати податки, тримати армію. В Англії утвердилася <b>парламентська (конституційна) монархія</b>.</li></ul>`,

// 25 §22 Міжнародні відносини. Тридцятилітня війна
{info:`<h4>Міжнародні відносини в XVI ст.</h4>
<p>Головне протистояння — між <b>Габсбургами</b> (Іспанія, Австрія) і <b>Францією</b>; найбільший його прояв — <b>Італійські війни (1494–1559)</b>. Османська імперія загрожувала Європі з південного сходу. Держави укладали союзи, щоб жодна не стала надто сильною, — складалася <b>система рівноваги</b>.</p>
<h4>Піднесення Швеції</h4>
<p>Швеція розвивала гірництво (залізо, мідь), мануфактури, флот. Король <b>Густав II Адольф</b> (1611–1632) провів військову реформу і створив одну з найсильніших армій Європи.</p>
<h4>Тридцятилітня війна 1618–1648 рр.</h4>
<p><b>Перша загальноєвропейська війна</b> між габсбурзьким союзом (іспанські й австрійські Габсбурги, католицькі князі Німеччини, Річ Посполита) та антигабсбурзькою коаліцією (Франція, Швеція, Данія, Нідерланди, протестантські князі).</p>
<p><b>Причини</b>: боротьба Габсбургів за панування в Європі; суперечності між католиками й протестантами (Євангелічна унія, 1608, та Католицька ліга, 1609).</p>

<tr><td><b>Франко-шведський</b> (1635–1648)</td><td>Франція (католицька!) відкрито вступила у війну проти Габсбургів; розгром іспанців під <b>Рокруа</b> (1643).</td></tr></table>
<h4>Вестфальський мир 1648 р.</h4>
<ul><li>Визнано незалежність <b>Сполучених провінцій Нідерландів</b> і Швейцарії.</li>
<li>Франція отримала Ельзас, Швеція — землі на узбережжі Балтики; Швеція стала великою державою.</li>
<li>Підтверджено принцип Аугсбурзького миру; кальвіністи отримали рівні права.</li>
<li>Закріплено роздробленість Німеччини; Габсбурги ослабли.</li>
<li>Склалася <b>Вестфальська система</b> міжнародних відносин — на основі <b>суверенітету держав</b> і рівноваги сил.</li></ul>
<p>Німецькі землі були спустошені, населення значно скоротилося. Війна Франції та Іспанії тривала до Піренейського миру 1659 р.</p>`,

// 26 §23 Річ Посполита
{info:`<h4>Внутрішнє становище</h4>
<p>1572 р. зі смертю Жигмунта II Августа припинилася династія <b>Ягеллонів</b>. Королів обирали на вільних елекціях. Королі з династії <b>Ваза</b>: Жигмунт III (1587–1632), Владислав IV (1632–1648), Ян II Казимир (1648–1668).</p>
<p>Посилювалися влада магнатів і шляхетські вольності. 1652 р. вперше застосовано право <b>liberum veto</b> («вільне вето»): один посол міг зірвати рішення сейму. Це паралізувало державу.</p>
<h4>Зовнішня політика</h4>
<ul><li><b>Польсько-московська війна 1609–1618 рр.</b>: Річ Посполита втрутилася в боротьбу за московський престол; значну роль відіграли козаки (похід Сагайдачного на Москву, 1618). Деулінське перемир’я 1618 р., <b>Поляновський мир 1634 р.</b> підтвердили кордони.</li>
<li><b>Хотинська війна 1621 р.</b>: козацько-польське військо зупинило вторгнення Османської імперії.</li>
<li>Останнє десятиліття Владислава IV — <b>«золотий спокій»</b>.</li></ul>
<h4>Криза середини XVII ст. («Потоп»)</h4>
<ul><li><b>1648 р.</b> — Національно-визвольна війна українського народу під проводом <b>Богдана Хмельницького</b>. Зборівська (1649) та Білоцерківська (1651) угоди не розв’язали головного — визнання Української козацької держави.</li>
<li>1654 р. у війну втрутилася Московська держава.</li>
<li>1655 р. шведи захопили більшу частину Польщі та Литви — <b>«Шведський потоп»</b>. Оборона монастиря Ясна Гора (Ченстохова) надихнула поляків на опір. Олівський мир 1660 р. зі Швецією.</li>
<li><b>«Вічний мир» 1686 р.</b>: Річ Посполита остаточно втратила на користь Московської держави Смоленщину, <b>Лівобережну Україну</b>, Київ і Запорожжя.</li></ul>
<h4>Ян III Собеський</h4>
<p>Король <b>Ян III Собеський</b> (1674–1696) уславився перемогою над османами під <b>Віднем 1683 р.</b>. За <b>Карловицьким миром 1699 р.</b> Річ Посполита повернула Західне Поділля з Кам’янцем.</p>
<p>Наприкінці XVII ст. Річ Посполита ослабла через війни, шляхетську анархію та втручання сусідів.</p>`,

// 27 §24 Османська імперія в XVII ст.
{info:`<h4>«Жіночий султанат»</h4>
<p><b>«Жіночий султанат»</b> — період, коли жінки, зокрема матері султанів (<b>валіде-султани</b>), впливали на політичні рішення. Почався з <b>Роксолани (Хюррем)</b>. Валіде-султани також сприяли культурі, будували мечеті й громадські споруди. Мати султана Мехмеда IV <b>Турхан</b> у 1656 р. домоглася призначення великим візиром <b>Мехмеда Кепрюлю</b>.</p>
<h4>Криза імперії</h4>
<ul><li>Слабкі султани, палацові змови, свавілля яничарів, корупція.</li>
<li>Занепад системи тимарів (військових ленів), зростання податків, повстання.</li>
<li>Відставання від Європи у військовій справі та економіці; торгові шляхи перемістилися в Атлантику.</li>
<li>Візири з роду <b>Кепрюлю</b> тимчасово зміцнили імперію: навели лад у фінансах, армії, вели війни (зокрема захопили Кам’янець-Подільський у 1672 р.).</li></ul>
<h4>Поразка під Віднем і Карловицький мир</h4>
<p><b>1683 р.</b> великий візир <b>Кара Мустафа-паша</b> з величезною армією обложив <b>Відень</b>, але польсько-австрійсько-німецьке військо під проводом <b>Яна III Собеського</b> розгромило османів. Це стало переломом: почалися війни Священної ліги (Австрія, Венеція, Річ Посполита, Московія) проти Османської імперії.</p>
<p><b>Карловицький мир 1699 р.</b> — Османська імперія вперше визнала значні територіальні втрати: Угорщина й Трансільванія відійшли до Австрії, Західне Поділля — до Речі Посполитої, частина Далмації та Морея — до Венеції. 1700 р. Московія отримала Азов (Константинопольський мир).</p>
<p>Відтоді Османська імперія перестала бути загрозою для Європи і перейшла до оборони.</p>`,

// 28 §25 Московська держава в XVII ст.
{info:`<h4>«Смутний час» (1598–1613)</h4>
<ul><li>1591 р. в Угличі за нез’ясованих обставин загинув царевич Дмитро, 1598 р. помер цар Федір — припинилася династія <b>Рюриковичів</b>.</li>
<li>Царем обрали <b>Бориса Годунова</b>; голод 1601–1603 рр. спричинив невдоволення.</li>
<li>Самозванці: <b>Лжедмитрій I</b> (1604 р. перейшов кордон, 1605 р. посів трон), <b>Лжедмитрій II</b> («Тушинський злодій», 1608). 1610 р. бояри скинули царя Василя Шуйського; Москву зайняв польський гарнізон.</li>
<li>1612 р. <b>земське ополчення</b> (Мінін і Пожарський) вигнало поляків.</li>
<li><b>Січень 1613 р.</b> — Земський собор обрав царем 16-річного <b>Михайла Романова</b> — почалася династія <b>Романових</b>.</li></ul>
<h4>Утвердження абсолютизму</h4>
<p>Земські собори скликалися дедалі рідше. <b>1649 р.</b> ухвалено <b>«Соборне уложення»</b> — збірник законів, що закріпив <b>кріпосне право</b> (безстроковий розшук утікачів) і самодержавство. Повстання: Соляний бунт (1648), Мідний бунт (1662), повстання Степана Разіна (1670–1671).</p>
<h4>Церковний розкол</h4>
<p>Патріарх <b>Никон</b> провів церковну реформу (виправлення книг і обрядів за грецькими зразками: хреститися трьома пальцями тощо). Противники — <b>старообрядці</b> (протопоп Авакум) — відмовилися визнавати зміни. Стався <b>церковний розкол</b> — утворення окремих церков із власними правилами.</p>
<h4>Колонізація Сибіру</h4>
<p>Почалася з походу козацького отамана <b>Єрмака</b> (1580-ті рр.), найнятого купцями Строгановими, проти Сибірського ханату. Колоністи будували <b>остроги</b> (укріплення), підкорювали місцеві народи, збирали данину хутром (ясак); до 1700 р. знищили три чверті хутрових багатств Сибіру. Найактивніший опір чинили чукчі. За <b>Нерчинським договором 1689 р.</b> з Китаєм Московія закріпила Забайкалля, але відмовилася від Приамур’я.</p>`,

// 29 §26 Китай: династія Цін. Японія
{info:`<h4>Установлення династії Цін у Китаї</h4>
<ul><li>Наприкінці правління династії Мін зросли податки й голод; <b>1628 р.</b> спалахнула <b>селянська війна</b>, яку очолили Чжан Сяньчжун і <b>Лі Цзичен</b>. 1644 р. повстанці захопили Пекін, останній імператор Мін наклав на себе руки.</li>
<li>Тим часом на північному сході посилилися <b>маньчжури</b> — кочовий народ Маньчжурії. Їхній вождь <b>Нурхачі</b> об’єднав племена й 1616 р. проголосив себе ханом.</li>
<li>Скориставшись смутою, маньчжури захопили Пекін і <b>1644 р.</b> започаткували династію <b>Цін</b> (правила до 1912 р.). Опір придушували до 1683 р.</li>
<li>Маньчжури не змішувалися з китайцями: заборони шлюбів, обов’язкова маньчжурська зачіска — <b>коса</b> для чоловіків.</li></ul>
<h4>Об’єднання Японії</h4>
<ul><li><b>Ода Нобунага</b> почав об’єднання країни, використовуючи вогнепальну зброю.</li>
<li><b>Тойотомі Хідейосі</b> завершив об’єднання; провів перепис земель, роззброїв селян; 1587 р. наказав європейцям-місіонерам залишити країну; 1592 р. почав невдалу війну за завоювання <b>Кореї</b>.</li>
<li><b>Токугава Ієясу</b> переміг у битві при <b>Секігахарі</b> (1600, найбільша в історії Японії) і 1603 р. став сьогуном. Почався <b>сьогунат Токугава</b> (до 1868 р.), столиця сьогунів — <b>Едо</b> (Токіо).</li></ul>
<h4>«Закриття» Японії</h4>
<p>Сьогуни боялися, що християнство й європейці підірвуть їхню владу. Християн переслідували, і <b>1639 р.</b> проголошено <b>«закриття» країни</b> — політику <b>самоізоляції</b>: японцям заборонили виїжджати за кордон, європейцям — в’їзд; торгувати дозволили лише голландцям і китайцям у порту <b>Нагасакі</b> (острів Дедзіма). Ізоляція тривала понад 200 років.</p>`,

// 31 §27, §29, §30 Просвітництво. Промислова революція. Освічений абсолютизм. «Війни розкоші»
{info:`<h4>Просвітництво</h4>
<p><b>Просвітництво</b> — філософсько-ідейний рух другої половини XVII — XVIII ст. Його представники вважали, що метою суспільства є людське щастя, якого можна досягти, перебудувавши суспільство на засадах <b>розуму</b> (<b>раціоналізм</b>).</p>
<ul><li><b>Джон Локк</b> — природні права людини на життя, свободу, власність.</li>
<li><b>Шарль Монтеск’є</b> — ідея <b>поділу влади</b> на законодавчу, виконавчу й судову.</li>
<li><b>Вольтер</b> — критика церкви й деспотизму, віротерпимість.</li>
<li><b>Жан-Жак Руссо</b> — суверенітет народу, суспільний договір.</li>
<li><b>Дені Дідро</b> — видання <b>«Енциклопедії»</b> (перший том 1751 р.).</li></ul>
<p>Художні стилі: <b>бароко</b> → <b>класицизм</b> (впорядкованість на засадах розуму, наслідування античності; драматурги П. Корнель, Ж. Расін, Мольєр) → <b>рококо</b> (витонченість, легкість) → неокласицизм.</p>
<h4>Початок індустріальної (промислової) революції</h4>
<p>Почалася в <b>Англії</b> в другій половині XVIII ст. — перехід від ручної праці мануфактур до <b>машинного виробництва</b> на фабриках.</p>
<ul><li>1733 р. — <b>Джон Кей</b>: «літаючий» ткацький човник.</li>
<li>Джеймс Гаргрівс — прядильна машина «Дженні».</li>
<li>1771 р. — <b>Річард Аркрайт</b>: фабрика з прядильними машинами на водяному колесі.</li>
<li><b>Джеймс Ватт</b> — універсальна <b>парова машина</b>.</li>
<li>1784 р. — <b>Едмунд Картрайт</b>: механічний ткацький верстат (продуктивність зросла в 40 разів).</li></ul>
<h4>Освічений абсолютизм</h4>
<p><b>Освічений абсолютизм</b> — політика деяких монархів другої половини XVIII ст., які під впливом ідей Просвітництва проводили реформи «згори», зберігаючи необмежену владу.</p>
<ul><li><b>Австрія</b>: <b>Марія-Терезія</b> (єдина жінка на престолі Габсбургів; Прагматична санкція) і <b>Йосиф II</b> (1780–1790): 1781 р. скасовано особисту залежність селян, віротерпимість, школи.</li>
<li><b>Пруссія</b>: король <b>Фрідріх II Великий</b> (1740–1786) — сильна армія, віротерпимість, обов’язкова початкова освіта (1763).</li>
<li><b>Росія</b>: <b>Катерина II</b> (1762–1796) листувалася з просвітниками, але посилила кріпацтво; скасувала гетьманство в Лівобережній Україні та козацький устрій у Слобідській Україні (1765), ліквідувала <b>Запорозьку Січ (1775)</b>, поширила кріпацтво на Лівобережжя (1783). Селянська війна під проводом О. Пугачова (1773–1775).</li></ul>
<h4>Міжнародні відносини XVIII ст. «Війни розкоші»</h4>
<ul><li><b>Війна за іспанську спадщину</b> (1701–1714) — Утрехтський (1713) і Раштадтський (1714) мири.</li>
<li><b>Північна війна</b> (1700–1721) — Швеція втратила панування на Балтиці.</li>
<li>Війна за польську спадщину (1733–1735), <b>за австрійську спадщину</b> (1740–1748) і <b>Семилітня війна</b> (1756–1763) — їх називають <b>«війнами розкоші»</b>, бо їх зумовили амбіції й марнотратство правителів, а не інтереси народів. Семилітню війну вважають першою світовою за масштабом; за Паризьким миром 1763 р. Англія отримала Канаду і зміцнилася в Індії.</li>
<li><b>Поділи Речі Посполитої</b> між Росією, Пруссією та Австрією: <b>1772, 1793, 1795 рр.</b>; спроби порятунку — Конституція 3 травня 1791 р., повстання Тадеуша Костюшка (1794).</li>
<li>Російсько-турецькі війни: Кючук-Кайнарджийський мир (1774), анексія Криму (1783), Ясський мир (1791).</li></ul>`,

// 32 §28 Утворення Російської імперії
{info:`<h4>Початок правління Петра I</h4>
<p><b>Петро I</b> самостійно правив у <b>1689–1725 рр.</b> Головна мета зовнішньої політики — вихід до морів (Чорного та Балтійського).</p>
<ul><li>1695 і 1696 рр. — два <b>Азовські походи</b>; 1696 р. захоплено турецьку фортецю Азов.</li>
<li>1697–1698 рр. — <b>«Велике посольство»</b> до Європи: цар вивчав корабельну справу, ремесла; повернувся через заколот стрільців, який жорстоко придушив.</li></ul>
<h4>Північна війна (1700–1721)</h4>
<ul><li>1700 р. — поразка московського війська під <b>Нарвою</b> від шведського короля <b>Карла XII</b>.</li>
<li>1703 р. — у гирлі Неви споруджено Петропавлівську фортецю, засновано <b>Санкт-Петербург</b> (з 1712 р. — столиця).</li>
<li>1708 р. — поразка шведів під Лісною; гетьман <b>Іван Мазепа</b> перейшов на бік Карла XII. Московські війська знищили гетьманську столицю <b>Батурин</b> разом з усім населенням.</li>
<li><b>Червень 1709 р.</b> — <b>Полтавська битва</b>: шведи зазнали поразки.</li>
<li>1711 р. — невдалий Прутський похід проти османів.</li>
<li>Перемоги флоту при Гангуті (1714) і Гренгамі (1720).</li>
<li><b>1721 р.</b> — <b>Ніштадтський мир</b>: Московія отримала Естляндію, Ліфляндію, Інгерманландію, частину Карелії.</li></ul>
<p><b>Жовтень 1721 р.</b> Петро I прийняв титул <b>імператора</b>, а Московське царство стало <b>Російською імперією</b>.</p>
<h4>Реформи</h4>
<ul><li><b>Державне управління</b>: поділ на <b>губернії</b> (1708); <b>Сенат</b> (1711) — найвищий орган при царі; замість приказів — <b>колегії</b> (1718–1720); Таємна канцелярія (1718).</li>
<li>Указ про єдиноспадковість (1714) зрівняв боярство й дворянство — усі мали служити державі; <b>«Табель про ранги»</b> (1722) встановив 14 чинів, просування за службу.</li>
<li><b>Церква</b>: після 1700 р. патріарха не обирали; 1721 р. створено <b>Синод</b> на чолі зі світською особою — церква підпорядкувалася державі.</li>
<li><b>Армія і флот</b>: рекрутські набори, регулярна армія, Балтійський флот.</li>
<li><b>Економіка</b>: мануфактури (на праці кріпаків), меркантилізм; культура: нові школи, календар, гоління борід, європейський одяг.</li></ul>
<p>Реформи зміцнили імперію, але супроводжувалися посиленням кріпацтва, гнобленням народів, зокрема ліквідацією автономії України.</p>`,

// 33 §31 Індія, Іран та Китай у XVIII ст.
{info:`<h4>Занепад імперії Великих Моголів</h4>
<p>Падишах <b>Аурангзеб</b> (1658–1707) — ревний сунітський мусульманин — переслідував індуїстів, руйнував храми, що викликало повстання (маратхи, сикхи). Після його смерті імперія розпалася на окремі князівства (1720 р. один із намісників утворив власну державу). <b>1739 р.</b> іранський правитель <b>Надір-шах</b> захопив і пограбував Делі (вивіз «Павичевий трон»).</p>
<h4>Англійська колонізація Індії</h4>
<ul><li><b>1600 р.</b> Елізабет I створила англійську <b>Ост-Індську компанію</b>; 1612 р. — перша факторія (торговельне поселення). Компанія мала власне військо.</li>
<li>Англійці витісняли португальців, голландців і французів.</li>
<li><b>Битва біля Плессі (1756)</b> — перемога англійців (Роберт Клайв) над правителем Бенгалії.</li>
<li><b>1765 р.</b> падишах Шах Алам II передав компанії право збирати податки в Бенгалії, Біхарі та Орісі. За 15 років компанія вивезла близько 1 млрд фунтів — ці кошти стали фінансовою основою промислової революції в Англії.</li>
<li>1803 р. війська компанії захопили Делі; Індія перетворилася на колонію.</li></ul>
<h4>Іран</h4>
<p>Після падіння Сефевідів (1736) владу захопив полководець <b>Надір</b>, який заснував династію <b>Афшаридів</b> (1736–1747) і вів загарбницькі війни (Індія, Середня Азія). Після його вбивства країна поринула в міжусобиці; наприкінці XVIII ст. до влади прийшла династія Каджарів.</p>
<h4>Китай у XVIII ст.</h4>
<p>Цінська імперія досягла найбільших розмірів за імператорів <b>Кансі</b> і <b>Цяньлуна</b>: приєднано Монголію, Тибет, Сіньцзян. Зросло населення, розвивалося землеробство. Проте влада обмежувала контакти з іноземцями: з 1757 р. торгівлю з європейцями дозволили лише через порт <b>Гуанчжоу</b> (Кантон) — політика <b>«закритих дверей»</b>. Англійці продавали в Китай опій, що згодом призвело до «опіумних воєн».</p>`,

// 34 §32 Англійські колонії в Північній Америці. Утворення США
{info:`<h4>Англійські колонії</h4>
<ul><li><b>1607 р.</b> — перше постійне англійське поселення <b>Джеймстаун</b> у Вірджинії.</li>
<li><b>1620 р.</b> — пуритани-переселенці на кораблі <b>«Мейфлавер»</b> підписали угоду про самоврядування й заснували Плімут (Нова Англія).</li>
<li>До середини XVIII ст. виникло <b>13 колоній</b> уздовж Атлантичного узбережжя. Північ — фермерство, ремесла, торгівля, суднобудування; південь — <b>плантації</b> тютюну, рису, бавовни на праці рабів з Африки.</li>
<li>Колоністи мали виборні збори, але залежали від Англії. Індіанців витісняли із земель.</li></ul>
<h4>Причини Війни за незалежність</h4>
<p>Після Семилітньої війни Англія посилила контроль: заборонила переселятися на захід за Аппалачі, запровадила нові податки (Гербовий акт, 1765). Колоністи протестували: «Жодних податків без представництва!». <b>1773 р.</b> — <b>«Бостонське чаювання»</b>: колоністи викинули в море вантаж чаю Ост-Індської компанії.</p>
<h4>Війна за незалежність (1775–1783)</h4>
<ul><li><b>1775 р.</b> — перші бої біля Лексінгтона і Конкорда. Головнокомандувачем армії колоній став <b>Джордж Вашингтон</b>.</li>
<li><b>4 липня 1776 р.</b> — Континентальний конгрес ухвалив <b>Декларацію незалежності</b> (автор — <b>Томас Джефферсон</b>): проголошено рівність людей, їхні невід’ємні права на життя, свободу і прагнення щастя, право народу скинути владу, що порушує ці права. Утворилися <b>Сполучені Штати Америки</b>. Цей день — День незалежності США.</li>
<li>1777 р. — перемога під <b>Саратогою</b>; Франція (а згодом Іспанія) стали союзниками США; <b>Бенджамін Франклін</b> — дипломат.</li>
<li>1781 р. — капітуляція англійців під <b>Йорктауном</b>.</li>
<li><b>1783 р.</b> — <b>Паризький (Версальський) мир</b>: Англія визнала незалежність США.</li></ul>
<h4>Утворення США</h4>
<p><b>1787 р.</b> ухвалено <b>Конституцію США</b>: федеративна республіка, <b>поділ влади</b> (Конгрес, президент, Верховний суд), система «стримувань і противаг». 1789 р. першим президентом став <b>Джордж Вашингтон</b>; 1791 р. ухвалено <b>Білль про права</b> (перші 10 поправок — свобода слова, віри, зібрань тощо). Проте рабство на півдні зберігалося, а індіанці не мали прав.</p>`,

const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let done = store.get("vi8_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};const m=/^Розділ\s+([IVXІ]+)\.\s*(.*)$/.exec(l.section); s.lab=m?m[1].replace(/І/g,'I'):''; s.short=m?m[2]:(l.section==='Вступ'?'Вступ до курсу':l.section); SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

    </div>` : "";

  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);

  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>

          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>

    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});

    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("vi8_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Всесвітня історія 8`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("vi8_theme",d.dataset.theme); }
const th=store.get("vi8_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
