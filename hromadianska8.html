<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Громадянська освіта · 8 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>

// 1 §1 Культура
{info:`<p>Слово <b>культура</b> походить від латинського <i>cultura</i> — «обробіток», «плекання». У широкому розумінні культура — це все, що створила людина, на відміну від того, що дала природа. Розрізняють <b>матеріальну</b> культуру (будинки, знаряддя, одяг, техніка) і <b>духовну</b> (мова, знання, вірування, мистецтво, цінності, норми).</p>
<p><b>Культура</b> — система цінностей, норм, моделей поведінки та форм об’єднання, яка згуртовує людей в окрему спільноту.</p>
<h4>Культура і суспільство</h4>
<p>Саме культура творить суспільство: людина стає людиною лише засвоївши культуру. Діти, які виросли серед тварин (наприклад, вигодувані вовками), без культури не змогли навчитися говорити й жити серед людей. Головні ознаки, що відрізняють людину від тварин (мислення, мова, знаряддя праці), пов’язані не з біологією, а з культурою.</p>
<h4>Базові компоненти культури</h4>
<ul>
<li><b>Мова</b> — «наріжний камінь» культури: через неї ми мислимо, передаємо знання й цінності. Мова відображає спосіб життя народу: наприклад, у мовах ескімосів дуже багато слів на позначення снігу. У світі понад <b>7 тисяч мов</b>; близько 40 % людей розмовляють десятьма найпоширенішими. Українською мовою говорять близько 40 млн людей — вона входить до трьох десятків найпоширеніших мов світу.</li>
<li><b>Цінності</b> — те, що суспільство вважає добрим, правильним і бажаним. Учені порівнюють суспільства за двома парами цінностей: <b>традиційні — світсько-раціональні</b> і <b>цінності виживання — цінності самовираження</b>. Україна перебуває на межі між цими групами.</li>
<li><b>Норми</b> (лат. <i>norma</i> — «правило», «взірець») — правила поведінки, що ґрунтуються на цінностях. Це <b>звичаї</b>, <b>традиції</b> (лат. <i>traditio</i> — «передавання»), <b>норми моралі</b> та <b>правові норми</b>. Правові норми встановлює й охороняє держава; найважливіші з них записані в <b>законах</b>. Розрізняють звичаєве право (неписане) і юридичне (закріплене державою).</li>
</ul>
<h4>Домінантна культура, субкультура, контркультура</h4>
<ul>
<li><b>Домінантна культура</b> — цінності, норми й мова, які поділяє більшість суспільства.</li>
<li><b>Субкультура</b> — культура окремої групи, що має свої особливості (мову, сленг, одяг, звичаї), але не заперечує домінантну культуру: молодіжні, етнографічні, професійні субкультури.</li>
<li><b>Контркультура</b> — субкультура, що відкрито протиставляє себе домінантній культурі й заперечує її цінності (хіпі, панки, андеграунд).</li>
</ul>`,

// 2 §2 Суспільство
{info:`<p>Сама собою кількість людей не творить суспільства. Воно виникає, коли між людьми складається система цінностей, норм, моделей поведінки та форм об’єднання — тобто <b>культура</b>, яка пов’язує їх численними ниточками соціальних взаємодій.</p>
<h4>Ознаки суспільства</h4>
<ol>
<li><b>Спільна культура.</b></li>
<li><b>Спільна територія</b>, на якій реалізовується ця культура.</li>
<li><b>Спільна ідентичність</b> (лат. <i>identicus</i> — «тотожний») — усвідомлення своєї приналежності до спільноти носіїв цієї культури.</li>
<li><b>Сталість</b> — існування впродовж тривалого часу, довше за життя одного покоління.</li>
</ol>
<p>Тому стотисячний натовп на стадіоні — не суспільство, а невелика спільнота, що має культуру, територію й ідентичність та існує десятки чи сотні років, — повноцінне суспільство.</p>
<h4>Структура суспільства</h4>
<p><b>Соціальна структура</b> (лат. <i>structura</i> — «будова») описує, з яких елементів складається суспільство. Будь-яке суспільство збудоване з п’яти видів елементів: <b>статусів, ролей, груп, організацій і соціальних інститутів</b>. Унікальність суспільства визначає кількість цих елементів, порядок розміщення і характер взаємодій між ними.</p>
<ul>
<li><b>Соціальний статус</b> — місце особи в суспільстві (бабуся, учень, покупець, волонтерка). Кожен має багато статусів.</li>
<li><b>Соціальна роль</b> — модель поведінки, орієнтована на статус. Що престижніший статус, то жорсткіше суспільство контролює його носіїв.</li>
<li><b>Група</b> — двоє і більше людей, які взаємодіють, усвідомлюють свою приналежність до групи і вважаються її членами з погляду інших. <b>Соціальна група</b> виділяється за соціально значущими критеріями (стать, вік, професія, дохід, освіта тощо).</li>
<li><b>Організації</b> — формальні групи, створені цілеспрямовано для певної діяльності (підприємство, школа, банк, армія).</li>
<li><b>Соціальні інститути</b> — стійкі види соціальних взаємодій, які склалися історично, самовідтворюються і задовольняють життєво важливі потреби людей (сім’я, держава, суд, освіта). <b>Інституціалізація</b> — заміна спонтанної поведінки на передбачувану, регульовану.</li>
</ul>
<h4>Соціальна нерівність і стратифікація</h4>
<p>Люди різні, тому нерівність є неодмінною умовою існування спільнот. Її слід відрізняти від <b>рівності в правах</b>. Нерівність може спричиняти напруження, але й спонукає людей старатися: <i>нерівність є джерелом суспільної енергії, яка стимулює розвиток суспільства</i>.</p>
<p><b>Соціальна стратифікація</b> — сукупність розміщених ієрархічно соціальних прошарків — <b>страт</b> (лат. <i>stratum</i> — «прошарок»). Базові показники: <b>дохід, влада, освіта, престиж</b>. Основних страт три: багаті, заможні, бідні.</p>
<h4>Соціальна мобільність і міграції</h4>
<ul>
<li><b>Горизонтальна мобільність</b> — перехід в іншу групу в межах того самого прошарку (робітник змінив завод на такий самий).</li>
<li><b>Вертикальна мобільність</b> — переміщення з одного прошарку в інший: <b>висхідна</b> (вгору) і <b>низхідна</b> (вниз).</li>
<li><b>Міграція</b> — зміна постійного місця проживання (в інший регіон чи країну). Вимушена міграція виникає через стихійні лиха або війни — як-от міграція українців через агресію РФ.</li>
</ul>
<h4>Різноманітність і рівність</h4>
<p>Зробити людей однаковими неможливо, але демократичні суспільства забезпечують <b>формальну рівність</b>: рівність усіх перед законом, рівність прав, свобод і обов’язків незалежно від національності, релігії, становища. Для груп, яким важче скористатися своїми правами (люди з інвалідністю, літні люди тощо), передбачають пільги й гарантії, щоб вирівняти шанси.</p>`,

// 3 §3 Людина в суспільстві. Особистість
{info:`<p>«Людина — істота суспільна» (Аристотель). Щоб стати повноцінною людиною, мало народитися представником біологічного виду <i>homo sapiens</i> — треба ще засвоїти культуру певного суспільства.</p>
<h4>Людина — індивід — особистість</h4>
<ul>
<li><b>Людина</b> — видове поняття, що вказує на приналежність до біологічного виду <i>homo sapiens</i>.</li>
<li><b>Індивід</b> (лат. <i>individ</i> — «неподільний») — окремий представник людського виду.</li>
<li><b>Особистість</b> — людина, вихована суспільством.</li>
</ul>
<p>Новонароджена дитина — індивід, але ще не особистість. Приклад — дівчинка <b>Камала</b>, знайдена 1920 р. в Індії серед вовків: вона пересувалася на чотирьох кінцівках, вила на місяць і так і не навчилася говорити. Вона була людиною й індивідом, але, відірвана від суспільства, не стала особистістю.</p>
<h4>Соціалізація</h4>
<p><b>Соціалізація</b> — процес засвоєння індивідом культури суспільства (мови, цінностей, норм, зразків поведінки), завдяки чому він стає дієздатним учасником соціальних зв’язків. Ми входимо в суспільство через конкретні групи: сім’ю, садочок, клас, друзів, підприємство. Переходячи з групи в групу, людина пристосовується до нових норм, тому соціалізація триває <b>від народження до глибокої старості</b>.</p>
<h4>Агенти та інститути соціалізації</h4>
<table class="tbl"><tr><th></th><th>Первинні</th><th>Вторинні</th></tr>
<tr><td><b>Агенти</b> (люди)</td><td>батьки, родичі, друзі; функції взаємозамінні, винагороди не отримують</td><td>представники школи, церкви, армії, підприємства, ЗМІ; функції спеціалізовані, зазвичай оплачувані</td></tr>
<tr><td><b>Інститути</b> (установи)</td><td>сім’я (найважливіший), компанія друзів, колектив однокласників</td><td>заклад освіти (особливо школа), підприємство, армія, церква, ЗМІ</td></tr></table>
<p>У сім’ї людина оволодіває мовою та головними елементами культури; у школі соціалізація відбувається за ретельно розробленим планом.</p>
<h4>Соціалізація серед однолітків</h4>
<ul>
<li><b>Формальні групи</b> (клас, гуртки, секції) — соціалізація за планом, під контролем дорослих. Тут діти знайомляться з поняттям «обов’язок» і формальним оцінюванням.</li>
<li><b>Неформальні групи</b> (компанії друзів) — соціалізація без плану; вчать здобувати й відстоювати свій статус, адже в сім’ї статус набувається автоматично, а серед ровесників його треба заслужити.</li>
</ul>
<p><b>Молодіжна субкультура</b> — культура груп молоді з особливостями мови (сленг), зовнішньої атрибутики, текстів, норм і цінностей. Її відправна точка — інновації в музиці, моді та поглядах (гіпі, рокери, байкери, панки, готи, ґеймери, косплеєри).</p>`,

// 5 §4 Самореалізація особистості
{info:`<p>Притча про таланти: батько дав трьом синам по таланту срібла (талант — давня міра ваги, ≈30 кг). Перший розтринькав, другий закопав, третій — примножив. Мораль: кожна людина має природний потенціал, який можна згаяти, частково загубити або старанною працею розкрити якомога повніше.</p>
<h4>Самореалізація і розвиток</h4>
<p><b>Самореалізація</b> — процес розкриття особою її можливостей. Вважають, що пересічна людина розкриває лише близько 10 % свого потенціалу — ніби піаніст грає одним пальцем замість десяти.</p>
<p>За <b>Абрагамом Маслоу</b>, особистість реалізується, задовольняючи власні потреби; що вищий рівень потреб, то повніша самореалізація. <b>«Піраміда Маслоу»</b>:</p>
<ol><li>фізіологічні потреби (їжа, повітря, одяг, тепло);</li><li>потреби безпеки;</li><li>соціальні потреби (належність до колективу, спілкування);</li><li>престижні потреби (повага, визнання, статус);</li><li>потреби в самовираженні (творчість, розвиток здібностей).</li></ol>
<p>Згодом Маслоу додав пізнавальні, естетичні, духовні потреби. Нижчі рівні задовольняють, щоб уникнути неприємного, вищі — це <b>потреби зростання</b>.</p>
<h4>Здібності</h4>
<p><b>Здібності</b> — індивідуальні особливості, які визначають схильність до певної діяльності. Види: <b>загальні</b> (розумові, пам’ять, мова), <b>спеціальні</b> (математичні, музичні, спортивні), <b>теоретичні</b>, <b>практичні</b>, <b>навчальні</b>, <b>творчі</b>. Здібність — лише можливість, як засіяне поле: врожай буде тільки за умови праці.</p>
<h4>Життєві цінності й пріоритети</h4>
<p><b>Цінності</b> — те, що суспільство вважає добрим, правильним і порядним. Три групи життєвих цінностей:</p>
<ul><li><b>власний розвиток</b> (освіта, творчість, спілкування);</li><li><b>професія, робота, суспільні відносини</b> (мир, держава, праця, свобода слова);</li><li><b>особисте життя і стосунки</b> (кохання, здоров’я, сім’я, честь, гідність).</li></ul>
<p>Система цінностей кожної людини <b>індивідуальна, як відбитки пальців</b>; усталюється у 15–20 років, але змінюється впродовж життя.</p>
<h4>Активна громадянська позиція</h4>
<p><b>Громадянська позиція</b> — ставлення людини до держави, громадянином якої вона є, та участь у формах самоорганізації громадян. Формують її <b>зовнішній чинник</b> (статус) і <b>внутрішній</b> (система цінностей). Найважливіший прояв громадянської активності — <b>відстоювання незалежності та суверенітету країни</b>.</p>
<p><b>Громадянський обов’язок</b> — обов’язок усіх громадян відповідно до законів і моральних норм: виконання законів, відповідальність перед суспільством, участь у виборах, захист країни, допомога співгромадянам.</p>
<p><b>Громадянський опір</b> збройній агресії РФ: добровільний вступ до армії, волонтерство, інформаційна активність, гуманітарна допомога; на окупованих територіях — правила безпеки, уникання співпраці з окупантами, фіксація їхніх злочинів.</p>`,

{info:`<h4>Стереотипи</h4>
<p>Слово <b>стереотип</b> (грец. <i>стерео</i> — «об’ємний», <i>типос</i> — «відбиток») спершу означало металеву друкарську пластину. <b>Стереотипи</b> — спрощені, схематизовані, часто спотворені або навіть помилкові уявлення про людину чи групу людей. Бувають <b>позитивні</b> («німці пунктуальні»), <b>негативні</b> і <b>нейтральні</b> («діти люблять солодощі»).</p>
<p>Стереотипи економлять зусилля, дають загальне уявлення, коли треба швидко ухвалити рішення. Але вони змушують бачити людину через призму групи, тому часто помилкові: пілотом винищувача може бути тендітна жінка, а не кремезний чоловік.</p>
<ul><li><b>Упередження</b> — негативні стереотипи; породжують нетерпимість, несправедливість, ворожість.</li>
<li><b>Забобони</b> — упередження, за якого людина приймає за реальність невідомі сили, здатні провіщати чи змінювати події (чорний кіт, порожнє відро, розсипана сіль). Виникають через брак знань і некритичне сприйняття.</li></ul>
<p>Щоб долати стереотипи, треба мислити гнучко, набувати нового досвіду й спиратися на <b>здоровий глузд, логіку і факти</b>.</p>
<h4>Дискримінація</h4>
<p><b>Дискримінація</b> (англ. <i>discrimination</i> — «розрізнення») — обумовлені упередженнями несправедливі дії щодо членів певних суспільних груп. Види: <b>расова</b>, <b>гендерна</b>, <b>вікова</b>, етнічна, релігійна тощо. Форми — від прихованого психологічного тиску до насильства (депортації кримських татар, чеченців, інгушів, калмиків в СРСР). Принцип <b>недискримінації</b> вимагає однакового ставлення до всіх.</p>
<h4>Мова ворожнечі</h4>
<p><b>Мова ворожнечі</b> — публічні висловлювання, спрямовані на розпалювання ненависті або заохочення до насильства проти особи чи групи за ознакою раси, національності, релігії, статі, інвалідності тощо. Вона суперечить принципу рівності й може призвести до злочинів: руандійське «Радіо тисячі пагорбів» розпалювало ворожнечу, що призвела до геноциду тутсі.</p>
<h4>Толерантність та інклюзія</h4>
<p><b>Толерантність</b> (лат. <i>tolerantia</i> — «терпіння») — не байдужа терпимість (як у середньовічних гетто), а <b>здатність взаємодіяти</b> з людьми іншої культури й способу життя, без агресії сприймати інші думки, поважати особливості інших.</p>
<p><b>Інклюзія</b> (англ. <i>inclusion</i> — «включення») — процес розширення участі всіх громадян у суспільному житті. Її основний принцип: усі діти навчаються разом, незважаючи на відмінності. <i>Усі люди різні — не кращі й не гірші, а просто різні.</i></p>`,

// 7 §6 Проблеми, з якими стикаються різні спільноти
{info:`<p>«Якщо у вашому житті немає конфліктів, перевірте, чи є у вас пульс» (Ч. Ліксон). Ідеалом є мир і злагода, але нормою — конфлікт, тому треба навчитися їх розв’язувати.</p>
<p><b>Конфлікт</b> (лат. <i>conflictus</i> — «зіткнення») — зіткнення протилежних цілей, позицій та поглядів. Конфлікт буває навіть у людини із самою собою. Він має не лише руйнівну, а й стабілізаційну роль.</p>
<h4>Типи конфліктів</h4>
<ul>
<li><b>Між особистостями</b>: суперечка (найпоширеніша, низька напруженість), чвари (тривала ворожість), сварка (дріб’язкова суперечка з образами), сутичка (нетривала ворожа взаємодія).</li>
<li><b>Між суспільними групами</b> — через боротьбу за обмежені ресурси (владу, багатство, територію). Суспільства різняться не наявністю конфліктів, а способом їх розв’язання: у демократичних переважають раціональні методи, у недемократичних — силові.</li>
<li><b>Між державами</b> — <b>міжнародний конфлікт</b>: зіткнення держав із взаємовиключними цілями. Стадії: усвідомлення несумісності → зростання напруженості → тиск без військової сили → військова інтервенція або війна. Перші дві стадії латентні (приховані).</li>
</ul>
<h4>Булінг</h4>
<p><b>Булінг</b> (англ. <i>bully</i> — «залякувати») — систематична агресивна поведінка однієї дитини або групи щодо іншої (психологічне, фізичне, економічне, сексуальне насильство; через інтернет — <b>кібербулінг</b>). Жертва зазвичай не здатна сама себе захистити, тож цей конфлікт не розв’язати самостійно: <b>треба звернутися до дорослих</b> і не тримати цього в секреті. За булінг передбачена адміністративна відповідальність: з 16 років — самих кривдників, до 16 — їхніх батьків.</p>
<h4>Війна</h4>
<p><b>Війна</b> — найсерйозніша форма соціально-політичного конфлікту між двома або більше групами людей. Вона регулюється <b>міжнародним гуманітарним правом</b>, за воєнні злочини настає покарання. За К. фон Клаузевіцем, війна — це «продовження політики іншими засобами».</p>
<ul><li><b>Оборонна війна</b> — війна країни, у яку вторглися, для відсічі агресору.</li>
<li><b>Завойовницька (загарбницька)</b> — для розширення впливу на території іншої держави; суперечить міжнародному праву.</li>
<li><b>Збройний конфлікт</b> відрізняється від війни відсутністю акту оголошення війни.</li></ul>
<h4>Способи подолання конфліктів</h4>
<p>Три кроки: зрозуміти, що відбувається (причини); з’ясувати інтереси кожної сторони; зробити все необхідне для подолання. Способи: <b>переговори</b>; <b>посередництво (медіація)</b> третьої сторони; <b>арбітраж</b> — посередник має владу нав’язати рішення.</p>
<ul><li><b>Компроміс</b> (лат. <i>compromissum</i> — «угода») — згода, досягнута <b>взаємними поступками</b>; буває вимушений і добровільний.</li>
<li><b>Консенсус</b> (лат. <i>consensus</i> — «згода», «одностайність») — загальна згода, що враховує думки <b>всіх</b> сторін на основі спільних базових цінностей.</li></ul>`,
terms:[["Конфлікт","зіткнення протилежних цілей, позицій та поглядів"],["Булінг","систематична агресивна поведінка щодо іншої дитини"],["Міжнародний конфлікт","зіткнення держав із взаємовиключними цілями"],["Війна","найсерйозніша форма соціально-політичного конфлікту"],["Збройний конфлікт","воєнні дії без офіційного оголошення війни"],["Компроміс","згода, досягнута взаємними поступками"],["Консенсус","загальна згода, що враховує думки всіх сторін"],["Арбітраж","розв’язання конфлікту посередником, що має владу нав’язати рішення"]],

// 9 §7 Громадянське суспільство і держава
{info:`<p>«Громадянське суспільство — суспільство, створивши яке, громадянин усвідомлює, що не він повинен служити державі, а держава — йому» (Євген Головаха).</p>
<h4>Громадянське суспільство</h4>
<p>Громадянське суспільство не тотожне суспільству загалом: воно зароджується на певному етапі розвитку, щоб <b>стримувати державу</b> в її прагненні все контролювати, і орієнтоване на інтереси конкретних людей та їхні природні права (на життя, свободу, власність, рівність перед законом).</p>
<p><b>Громадянське суспільство</b> — спільнота рівноправних, небайдужих, активних громадян, які взаємодіють між собою, можуть об’єднуватися в громадські формування, щоб відстоювати свої права й законні інтереси та забезпечувати умови для самореалізації.</p>
<p>Його основа — <b>вільний, відповідальний та ініціативний громадянин</b>, який усвідомлює свою гідність, мислить критично, відповідає за свої вчинки і здатен співпрацювати з іншими.</p>
<p><b>Інститути громадянського суспільства</b>: територіальні громади, незалежні медіа, заклади освіти, церква, політичні партії, професійні й інші громадські об’єднання, асоціації, спілки. Що більше громадських об’єднань, то розвиненішим вважається громадянське суспільство.</p>
<h4>Держава</h4>
<p><b>Держава</b> — політико-територіальна організація влади, яка за допомогою системи державних органів здійснює управління суспільством і вирішує загальносуспільні справи.</p>
<p><b>Ознаки держави</b>:</p>
<ol><li>територія у визначених кордонах;</li><li>населення (переважно громадяни);</li><li><b>суверенна</b> влада — незалежна від інших держав; її символи — герб, гімн, прапор;</li><li>публічна влада, що представляє все суспільство;</li><li>система органів, зокрема примусу (поліція, суд, армія);</li><li>податки, з яких формується бюджет;</li><li>право — загальнообов’язкові правила, які держава встановлює й охороняє.</li></ol>
<p><b>Функції держави</b> — напрями її діяльності для досягнення завдань: внутрішні (політична, економічна, соціальна, правоохоронна, екологічна, культурна) і зовнішні (оборона, зовнішня політика, міжнародна співпраця). Україна визнає 196 незалежних держав.</p>
<h4>Форма держави</h4>
<p><b>Форма держави</b> — спосіб організації та здійснення державної влади. Три елементи:</p>
<ul><li><b>Форма правління</b> — як організована вища влада: <b>монархія</b> (необмежена або обмежена) чи <b>республіка</b> (парламентська, президентська, змішана).</li>
<li><b>Форма державного устрою</b> — територіальна організація влади: <b>унітарна</b> держава чи <b>федерація</b>.</li>
<li><b>Політичний режим</b> — методи здійснення влади: демократичний чи недемократичний (авторитарний, тоталітарний).</li></ul>
<p>Україна — змішана (парламентсько-президентська) республіка, унітарна держава з демократичним режимом.</p>
<h4>Громадянство</h4>
<p><b>Громадянство</b> — правовий зв’язок між фізичною особою і державою, що виявляється у взаємних правах і обов’язках. Його регулюють Конституція і Закон «Про громадянство України» (2001). Рішення про прийняття до громадянства та його припинення ухвалює указами <b>Президент України</b>; при ньому діє Комісія з питань громадянства; питаннями громадянства займається також Державна міграційна служба. Документи: паспорт громадянина України, закордонний паспорт тощо.</p>
<p>Обов’язки громадян: захист Вітчизни, шанування державних символів, сплата податків, додержання Конституції й законів, збереження природи й культурної спадщини. Бути добрим громадянином — ще й поважати інших, дбати про спільний простір, уміти домовлятися.</p>`,
terms:[["Громадянське суспільство","спільнота рівноправних активних громадян, що об’єднуються для захисту своїх прав та інтересів"],["Держава","політико-територіальна організація влади, що управляє суспільством"],["Суверенітет","незалежність і верховенство державної влади"],["Функції держави","напрями діяльності держави для досягнення її завдань"],["Форма держави","форма правління, форма устрою і політичний режим"],["Громадянство","правовий зв’язок особи з державою, що виявляється у взаємних правах і обов’язках"]],

// 10 §8 Демократичні цінності та інститути
{info:`<p><b>Демократія</b> («влада народу») — державно-політичний режим, за якого єдиним джерелом влади є <b>народ</b>, що здійснює її безпосередньо і через обраних представників, і за якого існують рівні можливості здійснення прав і свобод кожного.</p>
<h4>Цінності демократії</h4>
<ul><li><b>Право на вибір</b> — чесні й відкриті вибори.</li><li><b>Свобода слова</b> — без страху переслідування; дозволяє контролювати владу.</li><li><b>Громадянські права</b> — свобода зібрань, совісті тощо.</li><li><b>Рівність перед законом</b> — немає «привілейованих».</li><li><b>Контроль за владою</b> — суди, незалежні ЗМІ.</li></ul>
<p><b>Державна влада в демократичній державі</b> здійснюється від імені народу через державні органи. Конституція обмежує владу. Важливі умови — <b>поділ влади</b> на законодавчу, виконавчу й судову та система <b>«стримувань і противаг»</b>.</p>
<h4>Партисипативна демократія</h4>
<p><b>Демократія участі</b> наголошує на активній участі громадян в ухваленні рішень, доповнюючи вибори. Вона робить рішення прозорішими, якіснішими й легітимнішими, підвищує довіру до влади й згуртовує громади. Приклад — <b>громадський (партисипативний) бюджет</b>.</p>
<h4>Електронне урядування</h4>
<ul><li><b>Електронна демократія</b> — використання цифрових технологій для участі громадян в ухваленні рішень.</li>
<li><b>Електронне урядування</b> — використання інформаційних і комунікаційних технологій для покращення державного управління, якості послуг і прозорості.</li>
<li><b>Онлайн-сервіси</b>: портал «Дія», онлайн-банкінг, платформа <b>e-DEM</b> (місцеві е-петиції, громадський бюджет, консультації).</li></ul>
<p>Переваги: доступність, економія часу, прозорість, зниження корупції, ефективність управління.</p>
<h4>Безпосередня і представницька демократія</h4>
<p><b>Інститути безпосередньої демократії</b>: <b>референдум</b> (ухвалення рішень прямим голосуванням), <b>вибори</b>, загальні збори громадян за місцем проживання, <b>народні ініціативи</b> (пропозиції, підтримані підписами). <b>Представницька</b> демократія — влада через обраних депутатів.</p>
<p>Вибори в Україні: <b>президентські</b>; <b>парламентські</b> — до Верховної Ради (450 депутатів на 5 років; загальне, рівне, пряме виборче право, таємне голосування); <b>місцеві</b>.</p>
<p><b>Свобода асоціації</b> — право створювати громадські організації, партії, профспілки. <b>Партії</b> змагаються за державну владу, а <b>громадські організації</b> захищають соціальні, професійні, творчі та інші спільні інтереси громадян.</p>`,

// 11 §9 Право як нормативний регулятор
{info:`<p>Люди здавна створювали <b>соціальні норми</b>: звичаї, традиції, моральні, релігійні норми. На певному етапі виникає <b>право</b>.</p>
<p><b>Право</b> — сукупність загальнообов’язкових, закріплених і гарантованих державою правил поведінки. Воно захищає права і свободи, запобігає конфліктам, встановлює відповідальність і є «дороговказом у суспільному лабіринті».</p>
<h4>Джерела права</h4>
<p><b>Джерело права</b> — «вмістилище» правових норм, звідки їх можна пізнати: правовий звичай, правовий прецедент, нормативно-правовий акт, договір. В Україні основне джерело — <b>нормативно-правовий акт</b>. <b>Законодавство</b> — сукупність усіх нормативно-правових актів держави, передусім законів.</p>
<h4>Право і закон</h4>
<p>Право — загальне поняття, що охоплює всі правові норми; <b>закон</b> — конкретне джерело права, офіційний документ органу влади з юридичною силою. Основний Закон — <b>Конституція</b>. Закони поділяють на конституційні та звичайні; <b>кодифіковані</b> закони (кодекси) системно регулюють цілу сферу (Цивільний, Сімейний, Податковий кодекси). Закони в Україні ухвалює Верховна Рада.</p>
<h4>Система права</h4>
<p><b>Правова норма</b> — найменший елемент права, конкретне загальнообов’язкове правило поведінки. <b>Система права</b> — внутрішня структура права, що об’єднує норми в <b>галузі, підгалузі та інститути</b>. Основні галузі: конституційне, адміністративне, цивільне, трудове, кримінальне право, а також сімейне, господарське, фінансове, земельне та ін. Приклад: цивільне право → підгалузь «спадкове право» → інститут заповіту → норма «Заповіт складається у письмовій формі…».</p>
<h4>Правовідносини</h4>
<p><b>Правовідносини</b> — відносини між суб’єктами, врегульовані нормами права. Елементи: <b>суб’єкти</b> (фізичні, юридичні особи, держава), <b>об’єкти</b> (майно, послуги, інформація, поведінка), <b>зміст</b> (права й обов’язки). Для виникнення потрібні правова норма і <b>юридичний факт</b> — обставина, з якою пов’язане виникнення, зміна чи припинення правовідносин. Юридичні факти: <b>події</b>, <b>дії</b>, <b>бездіяльність</b>, <b>стан</b>.</p>
<h4>Правова держава</h4>
<p><b>Правова держава</b> — держава, у якій існує <b>верховенство права</b>: усі, включно з посадовцями, підкоряються справедливим законам, рівним для всіх. Жодна особа чи група не стоїть над законом. Фундамент правової держави — демократія.</p>`,
terms:[["Право","загальнообов’язкові, гарантовані державою правила поведінки"],["Джерело права","форма, у якій закріплюються правові норми"],["Законодавство","сукупність нормативно-правових актів держави"],["Закон","офіційний документ органу влади, що має юридичну силу"],["Система права","структура права: галузі, підгалузі, інститути"],["Правовідносини","відносини, врегульовані нормами права"],["Юридичний факт","обставина, з якою пов’язане виникнення, зміна чи припинення правовідносин"],["Правова держава","держава, у якій діє верховенство права"]],

// 12 §10 Права, свободи та законні інтереси людини
{info:`<h4>Права, свободи, законні інтереси</h4>
<ul><li><b>Права людини</b> — базові можливості й гарантії, які кожен має від народження незалежно від національності, віку, статі, віросповідання. Головне — <b>право на життя</b>, без якого інші права втрачають сенс.</li>
<li><b>Свободи</b> — межі вільного вибору (свобода пересування, віросповідання); існують, доки не порушують свобод інших.</li>
<li><b>Законні інтереси</b> — конкретніші, персональні потреби, які закон захищає навіть тоді, коли конкретне право не порушено (захист майна, репутації).</li></ul>
<p>Образно: права — набір інструментів, свободи — можливість ними користуватися, законні інтереси — конкретні ситуації, де вони мають спрацювати.</p>
<h4>Концепція прав людини</h4>
<p>Витоки — у давніх цивілізаціях (Кодекс Хаммурапі, XVIII ст. до н. е.). Ідеї природних прав сформувалися в добу Просвітництва (Дж. Локк, Ж.-Ж. Руссо: права на життя, свободу, власність). Етапи: Білль про права США (1791), <b>Загальна декларація прав людини (1948)</b>. Ключові цінності прав людини: <b>гідність, свобода, рівність</b>. Права поділяють на категорії (класифікують), щоб краще зрозуміти, які сфери життя вони захищають.</p>
<h4>Права дитини</h4>
<p>Особливі права осіб до 18 років закріплені в Декларації прав дитини (1959), <b>Конвенції ООН про права дитини (1989)</b>, Всесвітній декларації про забезпечення виживання, захисту і розвитку дітей (1990). Основні: право на життя, ім’я, громадянство, освіту, охорону здоров’я, відпочинок, захист від насильства й дискримінації, свободу думки. Діти мають право бути почутими, а також обов’язки — поважати права інших і дотримуватися правил.</p>
<h4>Гідність, рівність, справедливість</h4>
<ul><li><b>Гідність</b> — відчуття кожною людиною своєї цінності; ніхто не має права принижувати іншого.</li>
<li><b>Рівність</b> — однакові права і можливості; рівність не означає однаковість.</li>
<li><b>Справедливість</b> — кожен отримує належне за законом і мораллю; рівновага прав і обов’язків.</li></ul>
<h4>Права людини в умовах воєнного стану</h4>
<p><b>Воєнний стан</b> — особливий правовий режим у разі збройної агресії чи загрози нападу; вводиться <b>Указом Президента</b>, який затверджує Верховна Рада. Під час нього заборонено проводити вибори й референдуми, змінювати Конституцію, страйки й масові зібрання. Обмеження прав мають бути <b>законними, необхідними й пропорційними, тимчасовими</b>.</p>
<h4>Міжнародне гуманітарне право</h4>
<p><b>МГП</b> («право війни») — система міжнародних норм, що захищає жертв збройних конфліктів, обмежує методи і засоби ведення війни та встановлює відповідальність за порушення. Діє лише під час збройних конфліктів; захищає цивільних, поранених, медичний персонал. Основні принципи: <b>гуманність, розрізнення</b> (удари лише по військових цілях), <b>пропорційність</b>.</p>`,
terms:[["Права людини","базові можливості й гарантії, які людина має від народження"],["Свободи","межі вільного вибору людини"],["Законні інтереси","персональні потреби, що захищаються законом"],["Права дитини","особливі права осіб до 18 років"],["Гідність","усвідомлення людиною своєї цінності"],["Воєнний стан","особливий правовий режим у разі збройної агресії"],["Міжнародне гуманітарне право","норми, що захищають жертв збройних конфліктів і обмежують засоби війни"]],

// 14 §11 Ефективна комунікація
{info:`<p><b>Комунікація</b> (лат. <i>communicare</i> — «ділитися», «робити спільним») — передача інформації від відправника до отримувача за допомогою певного середовища (звуку, письма, рухів, електронних засобів). Спілкування — важлива потреба особистості (третій рівень піраміди Маслоу).</p>
<h4>Види спілкування</h4>
<ul><li>За учасниками: <b>внутрішньоособистісне</b> (із собою), <b>міжособистісне</b> (безпосереднє), <b>масове</b> (опосередковане, через засоби масової комунікації).</li>
<li>За використанням мови: <b>вербальне</b> (лат. <i>verbalis</i> — «словесний»: усне, письмове, мова жестів людей з порушенням слуху) і <b>невербальне</b> (жести, міміка, рухи тіла).</li></ul>
<p>Невербальне спілкування дуже важливе: за А. Меграбяном, у передаванні емоцій на слова припадає 7 %, на інтонацію — 38 %, на міміку й жести — 55 %.</p>
<h4>Різновиди невербальної комунікації</h4>
<ul><li><b>«Мова тіла»</b> — жести, пози, хода, погляд (відкриті долоні — щирість, схрещені руки — закритість).</li>
<li><b>«Парамова»</b> — тональність, темп, паузи, зітхання; навіть мовчання щось означає.</li>
<li><b>«Розміщення»</b> — використання простору: соціальна зона (≈1,3 м), особистісна (≈1 м), інтимна (≈45 см).</li></ul>
<p><b>Комунікативна компетентність</b> — здатність ефективно спілкуватися; складники: <b>бажання, знання, вміння</b>. Важливо вміти сказати і вміти почути.</p>
<h4>Спілкування онлайн</h4>
<p>Перевага — ліквідація фізичних і соціальних перешкод. Особливості:</p>
<ul><li><b>Анонімність</b> — допомагає сором’язливим, але має негативний бік — <b>токсичне розгальмування</b> (лайка, погрози, кібербулінг).</li>
<li><b>Асинхронність</b> — відповідь не одразу, зате можна обміркувати.</li>
<li><b>Дефіцит емпатії</b> — без невербальних сигналів важче співпереживати; допомагають емодзі.</li></ul>
<p><b>Блогер</b> регулярно публікує контент про своє життя й думки; на відміну від журналіста, ставить на перше місце особисті погляди. <b>Інфлюенсер</b> (англ. <i>influence</i> — «вплив») — людина, думка якої важлива для аудиторії. Блогери відповідальні: мають поширювати лише перевірені дані, не принижувати гідність інших, не працювати на замовлення; поширення незаконного контенту тягне кримінальну відповідальність.</p>
<h4>Свобода слова і відповідальність</h4>
<p><b>Свобода слова</b> — право висловлювати свої погляди усно й письмово, зокрема через ЗМІ. Вона — фундамент демократії: виборці мають бути поінформовані. «Наша свобода залежить від свободи преси» (Т. Джефферсон). Свобода слова не звільняє від відповідальності за слова.</p>`,

// 15 §12 Формування громадської думки (ч. 1)
{info:`<p>«Громадська думка — як атмосферний тиск: тисне на тебе, навіть якщо ти не задумуєшся про його існування».</p>
<h4>Що таке громадська думка</h4>
<p>Колись важливі питання вирішувала еліта, не питаючи підданих (князь Володимир не цікавився думкою людей щодо хрещення). Нині жодне важливе рішення неможливе без підтримки громадської думки, бо: джерелом влади є народ; громадськість впливає на владу через вибори, референдуми, демонстрації; зростає поінформованість суспільства.</p>
<p><b>Громадська думка</b> — сукупність поглядів представників соціальної спільноти щодо проблем, які зачіпають інтереси цієї групи.</p>
<ol><li>Це саме <b>думка</b> (судження), а не наукове знання — вона допускає розбіжності.</li>
<li>Її носії — <b>соціальні спільноти</b>: територіальні, демографічні, професійні, релігійні, етнонаціональні, державні.</li>
<li>Вона формується лише щодо <b>актуальних проблем</b>, що зачіпають інтереси спільноти (довіра політику, якість води), а не щодо, скажімо, хімічної формули води.</li></ol>
<p><b>Плюралізм думок</b> — наявність різних позицій і поглядів, що вчить суспільство поважати розбіжності.</p>
<h4>Інформація і засоби її поширення</h4>
<p>Спільнота існує, поки між її членами можлива передача інформації. Етапи розвитку: усне спілкування → <b>писемність</b> (великі держави — Єгипет, Вавилон) → <b>книгодрукування</b> (середина XV ст.) → <b>телеграф, телефон, радіо, телебачення</b> (кінець XIX — початок XX ст.) → <b>персональні комп’ютери та інтернет</b>.</p>
<h4>Масмедіа</h4>
<p><b>Масмедіа</b> (лат. «маса» + «медіум» — «посередник між великою кількістю людей») — засоби передавання, зберігання та відтворення інформації: преса, радіо, телебачення, інтернет-видання, соціальні мережі. Повідомлення, які вони поширюють, — <b>медіатексти</b> (новини, статті, відео, реклама, пости).</p>
<p>У демократичному суспільстві медіа — головний канал висловлення громадської думки. Вони привертають увагу до подій, дають трибуну для обміну думками, доносять громадську думку до влади. Що вищою є поінформованість громадськості, то <b>компетентнішою</b> є громадська думка. Але медіа — це водночас і один з найголовніших інструментів <b>маніпулювання</b> громадською думкою.</p>`,

// 16 §11–12 Обмеження свободи слова. Маніпуляції і пропаганда. Медіаграмотність
{info:`<h4>Обмеження свободи слова</h4>
<p>Свобода слова не абсолютна. За міжнародним правом обмеження мусять: <b>а)</b> строго узгоджуватися із законом; <b>б)</b> мати на меті благо людини й суспільства; <b>в)</b> бути необхідними й адекватними цій меті. Підстави: захист репутації й гідності, загроза національній безпеці, мова ненависті, дискримінація, насильство. Обмеження не можуть бути цензурою політичних думок. Під час війни агресор використовує інформацію як зброю, тому потрібен баланс між свободою слова і захистом від дезінформації.</p>
<h4>Маніпуляції</h4>
<p><b>Маніпуляція</b> (лат. <i>manus</i> — «рука») — «прибрати до рук» іншого. <b>Маніпулювання</b> — приховане програмування думок, намірів, почуттів, установок поведінки. Риси:</p>
<ol><li>маніпулятор усвідомлює свої цілі й засоби;</li><li>приховує їх;</li><li>адресат бере на себе відповідальність за те, що відбувається.</li></ol>
<p>Від звичайного обману маніпуляція відрізняється тим, що маніпулятор змушує людину <b>хотіти</b> зробити те, чого бажає він.</p>
<h4>Пропаганда</h4>
<p><b>Пропаганда</b> (лат. <i>propagare</i> — «поширювати») використовує ті самі технології, що й маніпуляція, але це <b>масштабніший і триваліший</b> процес, який під силу лише державам або потужним корпораціям. Стала психологічною зброєю з Першої світової війни, активно використовувалась тоталітарними режимами. Мета — щоб люди сприйняли нав’язані ідеї як власні.</p>
<p>Перше правило захисту — відмовитися від думки, що пропаганда діє на всіх, крім вас. Важливо стежити не за словами, а за діями («не стежте за губами, стежте за руками»), перевіряти джерела, відрізняти факти від думок, звертати увагу на тиск на емоції.</p>
<h4>Медіаграмотність</h4>
<p><b>Медіаграмотність</b> — знання, уміння й навички, що допомагають розуміти, як працюють медіа, аналізувати й критично оцінювати інформацію. Медіаграмотна людина відрізняє факти від думок, реальність від симуляції, виявляє логічні помилки й маніпуляції. Навчатися їй треба все життя: «у безмежному океані інформації потрібен надійний компас».</p>
<h4>Інформаційна безпека</h4>
<p><b>Інформаційна безпека</b> — забезпечення національної безпеки та оборони країни в інформаційній сфері. Три рівні:</p>
<ul><li><b>особи</b> — раціональне, критичне мислення;</li><li><b>суспільства</b> — якісний інформаційний простір, плюралізм, незалежні ЗМІ;</li><li><b>держави</b> — захист інформації, протидія кіберзлочинам і інформаційним атакам.</li></ul>`,

<tr><td><b>I. Культура. Суспільство. Особистість</b></td><td>Культура (мова, цінності, норми) творить суспільство. Суспільство має спільну культуру, територію, ідентичність і сталість; складається зі статусів, ролей, груп, організацій, соціальних інститутів. Індивід стає особистістю через соціалізацію.</td></tr>
<tr><td><b>II. Мистецтво жити в суспільстві</b></td><td>Самореалізація — розкриття своїх здібностей; цінності індивідуальні; активна громадянська позиція. Треба долати стереотипи, протидіяти дискримінації та мові ворожнечі, бути толерантними й підтримувати інклюзію. Конфлікти розв’язують переговорами, медіацією, компромісом і консенсусом.</td></tr>
<tr><td><b>III. Мистецтво жити в державі</b></td><td>Громадянське суспільство стримує державу й захищає права людей. Держава має ознаки, функції і форму. Демократія: влада народу, поділ влади, вибори, референдуми, е-демократія. Право регулює суспільні відносини; правова держава — верховенство права. Права, свободи, законні інтереси; права дитини; МГП.</td></tr>
<tr><td><b>IV. Мистецтво спілкування</b></td><td>Ефективна комунікація — вербальна й невербальна; правила онлайн-спілкування; свобода слова і відповідальність. Громадська думка формується через медіа; треба розпізнавати маніпуляції і пропаганду, розвивати медіаграмотність.</td></tr></table>
<h4>Головні вміння, які варто винести з курсу</h4>
<ul><li>критично оцінювати стереотипи, упередження та інформацію з медіа;</li>
<li>шукати мирні способи розв’язання конфліктів і не мовчати про булінг;</li>
<li>знати свої права й обов’язки як громадянина / громадянки України;</li>
<li>долучатися до життя громади, поважати гідність кожної людини.</li></ul>`,
terms:[["Культура","система цінностей, норм, моделей поведінки та форм об’єднання"],["Соціалізація","засвоєння індивідом культури суспільства"],["Толерантність","здатність взаємодіяти з людьми, відмінними від нас"],["Демократія","режим, за якого джерелом влади є народ"],["Правова держава","держава з верховенством права"],["Медіаграмотність","уміння критично оцінювати інформацію"]],
q:[["Що є «наріжним каменем» культури?",["Мова","Архітектура","Економіка","Клімат"],0],
["Процес засвоєння індивідом культури суспільства — це…",["соціалізація","стратифікація","міграція","інклюзія"],0],
["Негативні стереотипи називають…",["упередженнями","традиціями","цінностями","консенсусом"],0],
["Загальна згода, що враховує думки всіх сторін, — це…",["консенсус","компроміс","арбітраж","булінг"],0],
["Хто в демократичній державі є єдиним джерелом влади?",["Народ","Президент","Парламент","Армія"],0],
["Ухвалення рішень прямим голосуванням громадян — це…",["референдум","указ","кодекс","прецедент"],0],
["Які принципи є основними в міжнародному гуманітарному праві?",["Гуманність, розрізнення, пропорційність","Сила, швидкість, раптовість","Секретність, контроль, покарання","Прибуток, конкуренція, ринок"],0],
["Масштабний і тривалий вплив на громадську думку з прихованими цілями — це…",["пропаганда","плюралізм","комунікація","толерантність"],0],
["Що допомагає не стати жертвою маніпуляцій?",["Медіаграмотність і критичне мислення","Довіра до будь-яких новин","Відмова від навчання","Поширення чуток"],0],
["Яка ознака суспільства означає усвідомлення приналежності до спільноти?",["Спільна ідентичність","Спільна територія","Сталість","Структура"],0]]}
);


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"🎭", d:"📚🗣️👪🧩✨"},
  {c:"#3a6fd8", i:"🤝", d:"🌱🪞🌈🕊️🎯"},
  {c:"#c0392b", i:"🏛️", d:"⚖️🗳️📜🛡️🇺🇦"},
  {c:"#1c9aa8", i:"💬", d:"📰📱🔎📡🧠"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("go8_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};const m=/^Розділ\s+([IVXІ]+)\.\s*(.*)$/.exec(l.section); s.lab=m?m[1].replace(/І/g,'I'):''; s.short=m?m[2]:(l.section==='Вступ'?'Вступ до курсу':l.section); SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 8 клас</div>
      <h1>Громадянська освіта</h1>
      <p>Уроки за календарно-тематичним плануванням: основний теоретичний матеріал з параграфа підручника, ключові поняття й тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${s.lab||"★"}</div><h2>${esc(s.short)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">${s.lab?"РОЗДІЛ "+s.lab:"ВСТУП"}</div><div class="rn">${esc(s.short)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Громадянська освіта · 8 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">${s.lab?"Розділ "+s.lab:"Вступ"}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("go8_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Громадянська освіта 8`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("go8_theme",d.dataset.theme); }
const th=store.get("go8_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
