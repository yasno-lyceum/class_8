<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Театральне мистецтво — курс</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0644FF;--lb:#517BFF;--y:#FFCD01;--t:#0B1640;--bg:#F5F6FA}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--t);background:var(--bg);line-height:1.55}
h1,h2,h3,.mt{font-family:Montserrat,Arial,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid #dde2f0;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 0 4px;color:var(--b)}
.prog{font-size:12px;color:#5a658f;margin-bottom:10px}.bar{height:8px;background:#e3e8fb;border-radius:8px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--b);width:0;transition:.3s}
#q{width:100%;padding:8px 10px;border:2px solid var(--lb);border-radius:10px;font:inherit;margin-bottom:10px}
.mod{font:800 12px Montserrat;color:var(--b);margin:14px 0 4px;text-transform:uppercase}
.les{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.les:hover{background:#eef2ff}.les.on{background:var(--b);color:#fff}.les .n{min-width:22px;font-weight:700}.les .d{margin-left:auto;color:#1a9b4b;font-weight:800}.les.on .d{color:var(--y)}
main{padding:28px;max-width:900px;width:100%}
h2{font-size:26px;margin:4px 0 18px;line-height:1.25}
.card{background:#fff;border:2px solid var(--lb);border-radius:14px;margin:0 0 18px;overflow:hidden}
.card .top{height:22px;background:var(--y);display:flex;align-items:center;gap:5px;padding-left:10px}.card .top i{width:8px;height:8px;border-radius:50%;background:#fff}
.card .in{padding:16px 20px}.card h3{margin:0 0 10px;font-size:18px;color:var(--b)}
.card ul{margin:0;padding-left:20px}.card li{margin:7px 0}
.fact{cursor:pointer;background:#FFF9D6;border-color:var(--y)}.fact .hide{filter:blur(6px);transition:.3s}.fact.open .hide{filter:none}.hint{font-size:12px;color:#7a6a00}
.q{margin:0 0 18px}.q p{font-weight:700;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:2px solid #cdd6f7;background:#fff;border-radius:10px;font:inherit;cursor:pointer;color:var(--t)}
.opt:hover:not(:disabled){border-color:var(--b)}.opt.ok{background:#dcf7e6;border-color:#1a9b4b}.opt.bad{background:#fde1e1;border-color:#d33}
.ex{font-size:13px;color:#4a5580;margin-top:4px}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:700 14px Manrope;cursor:pointer}.btn.s{background:#fff;color:var(--b);border:2px solid var(--b)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.res{font:800 18px Montserrat;color:var(--b);margin-top:8px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:300px}main{padding:16px}}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tb{background:#fff;border:0;border-radius:18px;padding:12px 20px;font:700 15px Manrope;color:var(--t);cursor:pointer;box-shadow:0 1px 4px rgba(6,68,255,.1)}
.tb.on{background:var(--b);color:#fff}.tb.m{background:var(--y)}
.min{font-size:12px;font-weight:700;color:#5a658f;margin:0 0 4px}
.rib{display:inline-block;background:var(--lb);color:#fff;font:800 16px Montserrat;padding:6px 22px;transform:skew(-10deg);margin:6px 0 14px}.rib span{display:inline-block;transform:skew(10deg)}
.blue{background:var(--b);color:#fff;border-radius:14px;padding:22px;margin-bottom:16px}.blue h3{color:#fff;margin:0 0 10px;font-size:22px}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.plan span{background:rgba(255,255,255,.2);border-radius:10px;padding:4px 10px;font-size:12px}
.wx{display:flex;flex-wrap:wrap;gap:10px}.wc{background:#fff;border:2px solid #cdd6f7;border-radius:14px;padding:12px 16px;text-align:center;cursor:pointer;min-width:100px;font:inherit}
.wc b{display:block;font-size:30px}.wc em{display:block;font-style:normal;font-weight:700;font-size:20px;color:var(--b)}.wc.ro{cursor:default}
.chip{display:inline-block;background:#e3e8fb;border-radius:14px;padding:4px 12px;margin:4px;font-weight:700}
input.t,textarea.t{width:100%;padding:9px 11px;border:2px solid var(--lb);border-radius:10px;font:inherit;margin:4px 0}
.step{display:block;width:100%;text-align:left;padding:10px;margin:4px 0;border:2px solid #cdd6f7;border-radius:10px;background:#fff;font:inherit;cursor:pointer}.step.on{background:var(--y);border-color:var(--y)}
</style></head><body>
<div class="app"><aside>
<h1>Театральне мистецтво</h1><div class="prog" id="pt"></div><div class="bar"><i id="pb"></i></div>
<input id="q" placeholder="Пошук теми…"><div id="list"></div></aside>
<main id="main"></main></div>
<script>
const LESSONS=[{"n": 1, "title": "Дійсність та театральне мистецтво", "theory": ["Театр — вид мистецтва, що <b>відтворює дійсність</b> засобами сценічної дії. Актор і глядач зустрічаються «тут і зараз».", "Сцена не копіює життя, а <b>художньо переосмислює</b> його: добирає, поєднує, підсилює.", "Головна умова театру — <b>умовність</b>: глядач знає, що бачить гру, але вірить у події на сцені.", "Складники вистави: п’єса, режисура, акторська гра, сценографія, музика."], "fact": "Слово «театр» походить від давньогрецького <b>theatron</b> — «місце для видовищ».", "qs": [["Що означає умовність у театрі?", "Глядач знає, що це гра, але приймає її правила", "Дія на сцені повністю збігається з реальним життям", "Вистава відбувається лише в спеціальних будівлях", "Умовність — згода глядача вірити в сценічну гру."], ["Що відрізняє театр від кіно?", "Безпосередня зустріч актора й глядача під час вистави", "Наявність музики", "Використання костюмів", "Кожна вистава «живе» лише тут і зараз."], ["Від якого грецького слова походить «театр»?", "theatron — місце для видовищ", "choros — спів", "mythos — переказ", "Theatron — буквально «місце, де дивляться»."]]}, {"n": 2, "title": "Завдання театру — навчати глядача мислити й шукати шляхи розв’язання проблем", "theory": ["Театр не лише розважає, а й <b>ставить питання</b>: показує конфлікт і змушує глядача шукати відповідь.", "Глядач <b>співпереживає</b> героям і разом із ними проходить вибір, помилки та наслідки.", "Так формується <b>критичне мислення</b> й моральний досвід: проживши чужу історію, легше зрозуміти свою.", "У реалістичному театрі XIX ст. особливо важливі соціальні проблеми: бідність, нерівність, відповідальність."], "fact": "В Афінах існував фонд <b>теорикон</b>, із якого бідним громадянам оплачували вхід до театру.", "qs": [["Яке завдання театру наголошує тема уроку?", "Навчати глядача мислити й шукати розв’язання проблем разом із персонажами", "Лише розважати публіку", "Ілюструвати шкільні підручники", "Театр — не тільки розвага, а й школа мислення."], ["Що допомагає глядачеві «прожити» чужий досвід?", "Співпереживання героям", "Ігнорування сюжету", "Запам’ятовування реклами вистави", "Співпереживання — основа впливу театру."], ["Що в п’єсі змушує глядача шукати відповідь?", "Конфлікт", "Афіша", "Антракт", "Конфлікт ставить проблему, яку треба осмислити."]]}, {"n": 3, "title": "Організація дії в часі та просторі", "theory": ["У часі: <b>темп</b> (швидкість подій), <b>ритм</b> (чергування подій і пауз), наростання й спади емоційної напруги.", "У просторі: розробка сценічного майданчика, <b>мізансцени</b>, декорації, рух акторів.", "<b>Мізансцена</b> — розташування акторів і предметів на сцені в певний момент дії.", "Режисер будує виставу як систему: від зав’язки до <b>кульмінації</b> — найвищої точки напруги."], "fact": "Слово «мізансцена» — французьке <i>mise en scène</i>, «розміщення на сцені».", "qs": [["Що таке мізансцена?", "Розташування акторів і предметів на сцені в певний момент", "Текст репліки", "Список акторів", "Мізансцена — «картинка» в просторі сцени."], ["Що називають темпом вистави?", "Швидкість розгортання подій", "Кількість декорацій", "Тривалість антракту", "Темп разом із ритмом організує дію в часі."], ["Що таке кульмінація?", "Найвища точка напруги в розвитку дії", "Початок вистави", "Список дійових осіб", "Після кульмінації напруга спадає."]]}, {"n": 4, "title": "Зоровий образ спектаклю", "theory": ["Зоровий образ створюють <b>декорації, костюми, освітлення, театральна техніка</b>.", "Декорації позначають місце й епоху дії та створюють настрій.", "Костюм розповідає про характер і соціальний стан героя.", "<b>Світло</b> керує увагою глядача, виділяє головне й змінює атмосферу.", "Автор візуального рішення — <b>сценограф</b> (художник-постановник)."], "fact": "Лондонський театр «Савой» у 1881 р. став першою публічною будівлею з повним електричним освітленням.", "qs": [["Що входить до зорового образу вистави?", "Декорації, костюми, освітлення, техніка", "Лише текст п’єси", "Тільки музика", "Зоровий образ — усе, що глядач бачить."], ["Яку роль відіграє світло в театрі?", "Спрямовує увагу й змінює атмосферу", "Лише освітлює залу", "Замінює костюми", "Світло — повноцінний засіб виразності."], ["Хто відповідає за візуальне рішення вистави?", "Сценограф", "Суфлер", "Касир", "Сценограф створює простір і образ вистави."]]}, {"n": 5, "title": "Заснування першого професійного українського театру", "theory": ["Українська сцена довго була обмежена забороною українського слова: <b>Валуєвський циркуляр</b> (1863), <b>Емський указ</b> (1876).", "У <b>1882 р.</b> Марко Кропивницький заснував у <b>Єлисаветграді</b> перший професійний український театр.", "Згодом до справи долучилися Михайло Старицький, Іван Карпенко-Карий, Микола Садовський, Панас Саксаганський, Марія Заньковецька.", "Основа репертуару — п’єси Котляревського, Шевченка, Кропивницького, Старицького, Карпенка-Карого."], "fact": "Єлисаветград, де постав театр, нині називається <b>Кропивницький</b> — на честь засновника.", "qs": [["Хто заснував перший професійний український театр?", "Марко Кропивницький", "Тарас Шевченко", "Іван Франко", "Театр постав у Єлисаветграді в 1882 р."], ["У якому місті виник цей театр?", "Єлисаветград", "Львів", "Харків", "Нині це місто Кропивницький."], ["Що обмежувало розвиток українського театру?", "Заборони українського слова (Валуєвський циркуляр, Емський указ)", "Брак глядачів", "Відсутність п’єс", "Заборони стримували український театр."]]}, {"n": 6, "title": "Корифеї українського театру", "theory": ["<b>Корифеї</b> — найвидатніші засновники й провідні митці українського професійного театру.", "Це Марко Кропивницький, Михайло Старицький, Іван Карпенко-Карий (Тобілевич), Микола Садовський, Панас Саксаганський, Марія Заньковецька.", "Багато корифеїв поєднували ролі <b>актора, режисера й драматурга</b>.", "Відомі п’єси: «Мартин Боруля», «Хазяїн» (Карпенко-Карий), «Дай серцю волю, заведе в неволю» (Кропивницький)."], "fact": "Іван Карпенко-Карий і Іван Тобілевич — <b>одна людина</b>: Карпенко-Карий — псевдонім. Микола Садовський і Панас Саксаганський — його брати (теж Тобілевичі).", "qs": [["Хто такий Іван Карпенко-Карий?", "Драматург Іван Тобілевич (псевдонім)", "Художник-декоратор", "Композитор", "Карпенко-Карий — літературний псевдонім."], ["Який з корифеїв є автором «Мартина Борулі»?", "Іван Карпенко-Карий", "Михайло Старицький", "Марія Заньковецька", "«Мартин Боруля» — п’єса Карпенка-Карого."], ["Хто серед корифеїв — видатна актриса?", "Марія Заньковецька", "Марко Кропивницький", "Панас Саксаганський", "Заньковецька — зірка театру корифеїв."]]}, {"n": 7, "title": "Стиль театру корифеїв", "theory": ["Стиль поєднує <b>драматичне й комедійне</b> дійство з <b>музичними, вокальними</b> сценами.", "У виставах були хорові й танцювальні ансамблі, народні пісні.", "Сюжети ґрунтувалися на побуті, історії й фольклорі, тому були близькі широкому глядачеві.", "Основа — яскрава народна мова й національна тема."], "fact": "«Наталку Полтавку» Івана Котляревського вперше поставили в Полтаві 1819 р.; пісні з неї стали народними.", "qs": [["Що характерне для стилю театру корифеїв?", "Поєднання драми й комедії з музикою, співом і танцями", "Лише трагедія без музики", "Абстрактні декорації без тексту", "Це був синтез драматичної гри, співу й танцю."], ["Яких сцен було багато у виставах корифеїв?", "Музичних, вокальних, хорових", "Циркових", "Кінопроєкцій", "Музика й пісня були органічною частиною дії."], ["Чому вистави корифеїв були близькі глядачам?", "Побутові й народні сюжети, зрозуміла мова", "Іноземні сюжети", "Складна символіка", "Глядач впізнавав своє життя на сцені."]]}, {"n": 8, "title": "Особливості акторської майстерності: універсальність", "theory": ["<b>Універсальність</b> — уміння актора грати різні ролі й жанри: драматичні, комічні, героїчні.", "Актор корифеїв часто ще й <b>співав і танцював</b>, тому трупа могла показати музично-драматичну виставу.", "Через невелику кількість акторів один митець міг поєднувати акторство, режисуру й драматургію.", "Гра ґрунтувалася на щирості, вірі в роль і зв’язку з глядачем."], "fact": "Марко Кропивницький був водночас актором, режисером, драматургом і композитором — часто його називають «батьком українського професійного театру».", "qs": [["Що означає універсальність актора?", "Здатність грати різні ролі й жанри", "Гра лише одного амплуа", "Гра без глядачів", "Універсальний актор змінює жанри й образи."], ["Чому корифеї були універсальними?", "Поєднували гру, спів, танець, режисуру", "Не мали глядачів", "Не мали п’єс", "Трупи були невеликими, потрібні були різні вміння."], ["Що поєднував у собі Марко Кропивницький?", "Акторство, режисуру, драматургію, музику", "Лише живопис", "Лише архітектуру", "Кропивницький — універсальна творча особистість."]]}, {"n": 9, "title": "Реалізм у театрі — «відзеркалення» дійсності", "theory": ["<b>Реалізм</b> — художня система, що прагне <b>правдивого відображення</b> життя в типових обставинах.", "Герой — <b>типовий характер</b>; його вчинки пояснюють середовище й соціальні причини.", "Актор прагне природності: мова, жести й поведінка наближені до життя.", "Умовна <b>«четверта стіна»</b> — межа між сценою й залою: актори діють так, ніби глядачів немає."], "fact": "Поняття «четвертої стіни» пов’язують із ім’ям французького просвітника <b>Дені Дідро</b>.", "qs": [["Що є метою реалізму в театрі?", "Правдиве відображення дійсності", "Створення фантастичних світів без зв’язку з життям", "Повний відхід від сюжету", "Реалізм — «відзеркалення» життя."], ["Що таке «четверта стіна»?", "Уявна межа між сценою й залою", "Задня декорація", "Вхід до театру", "Актори поводяться так, ніби глядачів немає."], ["Яким є герой реалістичної п’єси?", "Типовим характером у типових обставинах", "Казковим персонажем", "Безіменною маскою", "Реалізм шукає типове в житті."]]}, {"n": 10, "title": "Трагедія особистості в суспільстві", "theory": ["Реалістичний театр показує <b>конфлікт людини й суспільства</b>: традиції, гроші, нерівність, несправедливість.", "Трагедія — не лише загибель героя, а й <b>зіткнення його прагнень із обставинами</b>.", "Приклад: «Безталанна» Карпенка-Карого — драма жінки, чия доля зламана умовами життя.", "Глядач бачить причини трагедії й шукає, що можна змінити."], "fact": "Трагедія як жанр виникла в Давній Греції: її авторами були Есхіл, Софокл, Евріпід.", "qs": [["Який конфлікт типовий для реалістичної драми?", "Конфлікт особистості й суспільства", "Конфлікт двох декорацій", "Конфлікт актора з режисером", "Ідеться про зіткнення людини й обставин."], ["Хто автор драми «Безталанна»?", "Іван Карпенко-Карий", "Леся Українка", "Іван Котляревський", "«Безталанна» — драма Карпенка-Карого."], ["Де виник жанр трагедії?", "У Давній Греції", "У Китаї", "У Римській імперії XV ст.", "Греки Есхіл, Софокл, Евріпід — класики трагедії."]]}, {"n": 11, "title": "Взаємодія акторів у п’єсі: зір, звук, дотик", "theory": ["У реалістичному театрі актор <b>слухає й реагує</b> на партнера, а не просто виголошує текст.", "Оточення передають через деталь: <b>зір</b> (погляд, предмет), <b>звук</b> (інтонація, шум), <b>дотик</b> (жест, контакт).", "Важливий <b>підтекст</b> — те, що відчувається за словами.", "Станіславський вимагав сценічної правди: глядач має «повірити»."], "fact": "Станіславський реагував на фальшиву гру коротко: «Не вірю!»", "qs": [["Що означає взаємодія акторів?", "Реакція на партнера й спільна дія", "Гра кожного окремо", "Читання тексту без емоцій", "Взаємодія — основа сценічної правди."], ["Що таке підтекст?", "Прихований зміст, що відчувається за словами", "Підпис на афіші", "Назва вистави", "Підтекст — те, що не сказано прямо."], ["Які канали сприйняття використовують для передачі оточення?", "Зір, звук, дотик", "Лише нюх", "Лише смак", "Деталі допомагають створити достовірний світ."]]}, {"n": 12, "title": "Велика реформа театру", "theory": ["<b>1898 р.</b> — Костянтин Станіславський і Володимир Немирович-Данченко засновують <b>Московський художній театр</b> (МХТ).", "<b>Система Станіславського</b>: актор працює над собою, шукає «правду переживання» й сценічну віру.", "Режисер стає <b>автором вистави</b>, а не лише організатором.", "Головні принципи: ансамбль, увага до деталі, підтекст."], "fact": "Їхня легендарна зустріч у «Слов’янському базарі» (1897) тривала близько <b>18 годин</b>.", "qs": [["Хто заснував МХТ?", "Станіславський і Немирович-Данченко", "Кропивницький і Старицький", "Брехт і Арто", "МХТ — театр-реформатор 1898 р."], ["Що є центром «системи Станіславського»?", "Робота актора над собою й сценічна правда", "Лише декорації", "Лише голосна декламація", "Актор шукає внутрішню правду ролі."], ["Яка нова роль закріпилася за режисером?", "Автор і організатор усієї вистави", "Касир", "Гример", "Режисер створює цілісну виставу."]]}, {"n": 13, "title": "Вічні сюжети та образи", "theory": ["<b>Вічні сюжети</b> повторюються в різні епохи: злочин і кара, зрада, вірність, повстання, кохання.", "Злочин і кара — «Макбет» Шекспіра; зрада — Яго в «Отелло»; вірність — «Антігона» Софокла.", "Кохання людини та чарівної істоти — «Лісова пісня» Лесі Українки (Мавка й Лукаш).", "Образ <b>Дон Жуана</b> — спокусника — отримав інтерпретації в Тірсо де Моліни, Мольєра, Моцарта."], "fact": "Образ Дон Жуана вперше з’явився у п’єсі Тірсо де Моліни «Севільський спокусник» (бл. 1630 р.).", "qs": [["Що таке вічні сюжети?", "Теми, що повторюються в різні епохи", "Сюжети тільки античності", "Рекламні тексти", "Вічні сюжети переосмислюють у кожну епоху."], ["Хто автор «Лісової пісні»?", "Леся Українка", "Іван Франко", "Тарас Шевченко", "Мавка й Лукаш — герої її драми-феєрії."], ["Який образ пов’язаний із Тірсо де Моліною?", "Дон Жуан", "Гамлет", "Мартин Боруля", "Тірсо де Моліна створив літературного Дон Жуана."]]}, {"n": 14, "title": "Модернізм як переосмислення реалістичного театру", "theory": ["<b>Модернізм</b> (кін. XIX — поч. XX ст.) відходить від буквальної правдоподібності.", "Замість копіювання життя — <b>символ, метафора, настрій, умовність</b>.", "Театр шукає нові форми: символізм, експресіонізм, футуризм.", "Приклад: «Синій птах» Метерлінка — п’єса-символ про пошуки щастя."], "fact": "«Синього птаха» Метерлінка у 1908 р. поставив Станіславський у МХТ.", "qs": [["Чим модернізм відрізняється від реалізму?", "Більше умовності, символів і настрою", "Прагне лише копіювати життя", "Не має сюжетів", "Модернізм переосмислює реалістичну традицію."], ["Що таке символ у театрі?", "Образ із узагальненим, глибшим змістом", "Підпис художника", "Квиток", "Символ відсилає до ширшого значення."], ["Хто автор «Синього птаха»?", "Моріс Метерлінк", "Антон Чехов", "Бертольт Брехт", "Метерлінк — представник символізму."]]}, {"n": 15, "title": "Жіноча тема в театрі", "theory": ["У модерному театрі жінка — <b>повноцінна особистість</b>, а не лише тло для чоловіка.", "«Ляльковий дім» Ібсена (1879): Нора залишає родину, щоб бути собою.", "Леся Українка: «Кассандра», «Лісова пісня» — сильні жіночі образи.", "Важливі актриси: Марія Заньковецька, Сара Бернар, Елеонора Дузе."], "fact": "Фінал «Лялькового дому» (Нора йде з дому) був настільки шокуючим, що для німецького театру Ібсен написав інший кінець.", "qs": [["Хто головна героїня «Лялькового дому»?", "Нора", "Мавка", "Наталка", "Ібсен показав право жінки на самостійність."], ["Хто авторка «Кассандри»?", "Леся Українка", "Марія Заньковецька", "Ірина Вільде", "Леся Українка створила сильні жіночі образи."], ["Що характерне для жіночої теми в модернізмі?", "Жінка — самостійна особистість з власним вибором", "Жінка лише допоміжний персонаж", "Жіночі образи заборонені", "Модернізм посилює голос жіночого героя."]]}, {"n": 16, "title": "Підсумкове оцінювання результатів навчання", "final": true, "pool": [1, 15]}, {"n": 17, "title": "Модернізм як мистецтво, що прагнуло змінити світ", "theory": ["На початку XX ст. митці вірили, що мистецтво може <b>перетворити суспільство</b>.", "Течії: <b>футуризм</b>, <b>експресіонізм</b>, <b>конструктивізм</b>.", "Театр стає місцем експерименту: нова сценічна мова, нова роль глядача.", "Часто вистава — маніфест, заклик, політичний жест."], "fact": "Маніфест футуризму Філіппо Марінетті опублікували 20 лютого 1909 р. у паризькій газеті «Фігаро».", "qs": [["Яка ідея об’єднувала модерністів?", "Мистецтво може змінити світ", "Мистецтво має лише прикрашати життя", "Мистецтво не пов’язане з суспільством", "Модерністи вірили у перетворювальну силу мистецтва."], ["Що з названого — художня течія початку XX ст.?", "Футуризм", "Класицизм", "Бароко", "Футуризм прагнув зламати традиції."], ["Яким стає глядач у модерністському театрі?", "Активним учасником", "Пасивним спостерігачем", "Відсутнім", "Нові форми активізують глядача."]]}, {"n": 18, "title": "Український театральний авангард", "theory": ["Український авангард 1910–20-х рр. — експериментальний, пов’язаний зі змінами в мистецтві й суспільстві.", "<b>1916 р.</b> — Лесь Курбас створює у Києві «Молодий театр».", "<b>1922 р.</b> — заснування «Березоля» в Києві (з 1926 — у Харкові).", "Сценографи Анатолій Петрицький і Вадим Меллер створювали конструктивістські декорації."], "fact": "Назва «Березіль» нагадує про березень — початок весни, символ відродження.", "qs": [["Хто очолив «Молодий театр» і «Березіль»?", "Лесь Курбас", "Марко Кропивницький", "Михайло Старицький", "Курбас — головна постать українського авангарду."], ["Коли заснували «Березіль»?", "1922", "1882", "1898", "Спершу працював у Києві, потім у Харкові."], ["Хто з митців — сценограф українського авангарду?", "Анатолій Петрицький", "Іван Карпенко-Карий", "Бертольт Брехт", "Петрицький — відомий сценограф-конструктивіст."]]}, {"n": 19, "title": "«Рефлексологічний» театр Курбаса", "theory": ["<b>Лесь Курбас</b> (1887–1937) — режисер-реформатор, засновник «Березоля».", "Він шукав способи <b>активізувати глядача</b>, вплинути на його реакції (рефлекси).", "Вистава мала стимулювати до дії та осмислення, а не лише розважати.", "Відомий приклад — «Джиммі Гіггінс» за Ептоном Сінклером (1923)."], "fact": "Курбаса роз ра в Берліні, 1928) написав Курт Вайль.", "qs": [["Хто створив «епічний театр»?", "Бертольт Брехт", "Лесь Курбас", "Антонен Арто", "Брехт — німецький драматург і режисер."], ["Яким Брехт хотів бачити глядача?", "Мислячим спостерігачем", "Захопленим «жертвою ілюзії»", "Відсутнім", "Епічний театр апелює до розуму."], ["Яка п’єса належить Брехту?", "«Мати Кураж та її діти»", "«Мартин Боруля»", "«Ляльковий дім»", "«Мати Кураж» — одна з головних п’єс Брехта."]]}, {"n": 22, "title": "Методи побудови епічного театру", "theory": ["Поєднання <b>драматичної дії з епічною розповіддю</b>; в спектакль може «втручатися» сам автор.", "<b>Ефект очуження</b> (Verfremdungseffekt) — показати знайоме з несподіваного боку, щоб глядач замислився.", "<b>Дистанціювання</b>: актор не «розчиняється» в персонажі, а показує його й коментує.", "Безпосереднє спілкування актора з глядачем, зонги, таблички, проєкції."], "fact": "Брехт скорочено називав очуження <b>V-ефектом</b> (від нім. Verfremdung).", "qs": [["Що таке ефект очуження?", "Показ знайомого з несподіваного боку, щоб викликати роздум", "Повне злиття актора з роллю", "Відсутність музики", "Очуження руйнує автоматичність сприйняття."], ["Що означає дистанціювання актора від персонажа?", "Актор показує персонажа, а не розчиняється в ньому", "Актор уникає глядача", "Актор не вчить текст", "Він зберігає свідомий погляд на роль."], ["Як актор епічного театру може діяти?", "Звертатися безпосередньо до глядача", "Ніколи не говорити", "Лише мовчати", "Спілкування із залою — прийом епічного театру."]]}, {"n": 23, "title": "«Театр жорстокості» Антонена Арто", "theory": ["<b>Антонен Арто</b> (1896–1948) — французький поет і теоретик театру.", "«Театр жорстокості» — не насильство, а <b>різке потрясіння</b>, що змушує глядача відчути життя «до краю».", "Вплив на нерви й відчуття: звук, світло, жест, ритм; текст перестає бути головним.", "Книга <b>«Театр і його двійник»</b> (1938) — головна праця Арто."], "fact": "Арто мріяв про театр-обряд, що діє   opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{
   d.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===correct)x.classList.add('ok')});
   if(o===correct)score++;else b.classList.add('bad');ex.textContent=(o===correct?'Правильно! ':'Не зовсім. ')+q.e;answered++;
   if(answered===qs.length&&cb)cb(score,qs.length)};d.appendChild(b)});
  d.appendChild(ex);box.appendChild(d)})}
const card=(t,inner,cls)=>'<div class="card '+(cls||'')+'"><div class="top"><i></i><i></i><i></i></div><div class="in">'+(t?'<h3>'+t+'</h3>':'')+inner+'</div></div>';
function wxHTML(ph,ro){const k='w'+cur+ph;const c=S[k]||[0,0,0,0,0];return '<div class="wx">'+WX.map((w,i)=>'<button class="wc'+(ro?' ro':'')+'" data-k="'+k+'" data-i="'+i+'"><b>'+w[0]+'</b>'+w[1]+'<em>'+c[i]+'</em></button>').join('')+'</div>'}
function warmHTML(l){if(l.n===1)return card('Хмара асоціацій','<p>Які слова спадають вам на думку, коли ви чуєте «театр»? Запишіть і натисніть Enter.</p><input class="t" id="assoc" placeholder="Слово…"><div id="chips"></div>');
 let p=LESSONS.find(x=>x.n===cur-1);if(p&&p.final)p=LESSONS.find(x=>x.n===cur-2);
 return card('Питання з попереднього уроку','<div id="warm"></div>')}
function reflHTML(){const t=cur%5;
 if(t===0)return card('Незакінчені речення','<ul><li>Сьогодні я дізнався/дізналася, що…</li><li>Найцікавіше було…</li><li>Мене здивувало…</li></ul>');
 if(t===1)return card('Світлофор','<button class="step" data-s>🟢 Усе зрозуміло, можу пояснити іншим</button><button class="step" data-s>🟡 Загалом зрозуміло, є питання</button><button class="step" data-s>🔴 Потрібна допомога</button>');
 if(t===2)return card('3-2-1','<b>3</b> речі, які я дізнався/дізналася<textarea class="t" rows="2"></textarea><b>2</b> цікаві факти<textarea class="t" rows="2"></textarea><b>1</b> питання, яке залишилося<textarea class="t" rows="2"></textarea>');
 if(t===3)return card('Сходинки успіху','<button class="step" data-s>1. Я прочитав/прочитала теорію</button><button class="step" data-s>2. Я зрозумів/зрозуміла головну ідею</button><button class="step" data-s>3. Я виконав/виконала тест</button><button class="step" data-s>4. Я можу пояснити тему іншому</button><button class="step" data-s>5. Я можу навести приклад із вистав чи п’єс</button>');
 return card('Хмара «одне слово»','<p>Опишіть урок одним словом.</p><input class="t" id="oneword" placeholder="Слово…"><div id="chips2"></div>')}
function stageHTML(l,i){
 if(i===0)return card('Як ви почуваєтесь?',wxHTML('a'));
 if(i===1)return warmHTML(l);
 if(i===2){const bs=[...l.theory.join(' ').matchAll(/<b>(.*?)<\/b>/g)].map(m=>strip(m[1])).slice(0,2);
  return '<div class="blue"><h3>'+l.title+'</h3><b>Після уроку ви зможете:</b><ul>'+bs.map(b=>'<li>пояснити «'+b+'»</li>').join('')+'<li>відповісти на питання тесту</li></ul><div class="plan">'+STAGES.slice(3,7).map(x=>'<span>'+x[0]+' · '+x[1]+'</span>').join('')+'</div></div>'}
 if(i===3)return card('Коротко про головне','<ul>'+l.theory.map(t=>'<li>'+t+'</li>').join('')+'</ul>')+'<div class="card fact" id="fact"><div class="top"><i></i><i></i><i></i></div><div class="in"><h3>💡 Цікавий факт</h3><div class="hide">'+l.fact+'</div><div class="hint">Натисніть, щоб прочитати</div></div></div>';
 if(i===4)return card('Тест','<div id="test"></div><div class="res" id="res"></div><button class="btn s" id="again" style="display:none;margin-top:10px">Пройти ще раз</button>');
 if(i===5)return card('Вірю — не вірю','<div id="bel"></div>');
 if(i===6)return reflHTML();
 return card('Настрій після вивчення теми','<p>Початок уроку:</p>'+wxHTML('a',true)+'<p>Зараз:</p>'+wxHTML('b'))}
function wire(l,i){const m=document.getElementById('main');
 if(i===0||i===7)m.querySelectorAll('.wc:not(.ro)').forEach(b=>b.onclick=()=>{const k=b.dataset.k,c=S[k]||[0,0,0,0,0];c[+b.dataset.i]++;S[k]=c;save();b.querySelector('em').textContent=c[+b.dataset.i]});
 if(i===1){if(l.n===1){const inp=document.getElementById('assoc');inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){document.getElementById('chips').insertAdjacentHTML('beforeend','<span class="chip"></span>');document.getElementById('chips').lastChild.textContent=inp.value.trim();inp.value=''}}}
  else{let p=LESSONS.find(x=>x.n===cur-1);if(p&&p.final)p=LESSONS.find(x=>x.n===cur-2);mkQuiz(document.getElementById('warm'),qsOf(p))}}
 if(i===3){const f=document.getElementById('fact');f.onclick=()=>f.classList.add('open')}
 if(i===4){const run=()=>{document.getElementById('res').textContent='';document.getElementById('again').style.display='none';
   mkQuiz(document.getElementById('test'),qsOf(l),(sc,n)=>{document.getElementById('res').textContent='Результат: '+sc+' із '+n;document.getElementById('again').style.display='inline-block';S['d'+l.n]=Math.max(S['d'+l.n]||0,sc);save();renderList()})};
   document.getElementById('again').onclick=run;run()}
 if(i===5){const qs=qsOf(l),it=[[qs[0].q+' — '+qs[0].o[0],true,qs[0].e],[qs[1].q+' — '+qs[1].o[1],false,qs[1].e+' (правильно: '+qs[1].o[0]+')'],[qs[2].q+' — '+qs[2].o[0],true,qs[2].e],[qs[0].q+' — '+qs[0].o[2],false,qs[0].e+' (правильно: '+qs[0].o[0]+')']];
  const b=document.getElementById('bel');it.forEach(x=>{const d=document.createElement('div');d.className='q';d.innerHTML='<p></p>';d.firstChild.textContent=x[0];const ex=document.createElement('div');ex.className='ex';
   [['Вірю',true],['Не вірю',false]].forEach(z=>{const o=document.createElement('button');o.className='opt';o.textContent=z[0];o.onclick=()=>{d.querySelectorAll('.opt').forEach(y=>y.disabled=true);o.classList.add(z[1]===x[1]?'ok':'bad');ex.textContent=(z[1]===x[1]?'Так! ':'Ні. ')+x[2]};d.appendChild(o)});d.appendChild(ex);b.appendChild(d)})}
 if(i===6){m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(b.parentNode.querySelector('.step')&&b.textContent.match(/^[🟢🟡🔴]/u))b.parentNode.querySelectorAll('.step').forEach(x=>x.classList.remove('on'));b.classList.toggle('on')});
  const o=document.getElementById('oneword');if(o)o.onkeydown=e=>{if(e.key==='Enter'&&o.value.trim()){const c=document.getElementById('chips2');c.insertAdjacentHTML('beforeend','<span class="chip"></span>');c.lastChild.textContent=o.value.trim();o.value=''}}}}
function render(){const l=LESSONS.find(x=>x.n===cur),m=MODULES[modOf(cur)];
 let h='<div class="mt" style="font-size:12px;color:#5a658f;margin-bottom:4px">'+m.title+'</div><h2>'+l.title+'</h2>';
 if(l.final){h+=card('Підсумковий тест','12 випадкових питань за матеріалами розділів '+(cur===16?'1–4':'5–9')+'. Щоразу набір різний.')+card('Тест','<div id="test"></div><div class="res" id="res"></div><button class="btn s" id="again" style="display:none;margin-top:10px">Пройти ще раз</button>')+'<div class="nav"><button class="btn s" id="pv">← Попередня</button><button class="btn" id="nx"'+(cur<LESSONS.length?'':' disabled style="opacity:.4"')+'>Наступна →</button></div>';
  document.getElementById('main').innerHTML=h;
  const run=()=>{document.getElementById('res').textContent='';document.getElementById('again').style.display='none';mkQuiz(document.getElementById('test'),finalQs(l),(sc,n)=>{document.getElementById('res').textContent='Результат: '+sc+' із '+n;document.getElementById('again').style.display='inline-block';S['d'+l.n]=Math.max(S['d'+l.n]||0,sc);save();renderList()})};
  document.getElementById('again').onclick=run;run();nav();return}
 h+='<div class="tabs">'+STAGES.map((s,i)=>'<button class="tb'+(!allMode&&i===stage?' on':'')+'" data-i="'+i+'">'+s[0]+'</button>').join('')+'<button class="tb m'+(allMode?' on':'')+'" id="all">Теорія + вправи</button></div>';
 if(allMode){h+=[3,4,5].map(i=>'<div class="rib"><span>'+STAGES[i][0]+'</span></div>'+stageHTML(l,i)).join('')}
 else h+='<div class="min">'+STAGES[stage][1]+'</div><div class="rib"><span>'+STAGES[stage][0]+'</span></div>'+stageHTML(l,stage);
 h+='<div class="nav"><button class="btn s" id="pv">← Назад</button><button class="btn" id="nx">Далі →</button></div>';
 document.getElementById('main').innerHTML=h;
 document.querySelectorAll('.tb[data-i]').forEach(b=>b.onclick=()=>{allMode=false;stage=+b.dataset.i;render()});
 document.getElementById('all').onclick=()=>{allMode=!allMode;render()};
 if(allMode){[3,4,5].forEach(i=>wire(l,i))}else wire(l,stage);nav()}
function step(d){const l=LESSONS.find(x=>x.n===cur);if(l.final||allMode){const n=cur+d;if(n>=1&&n<=LESSONS.length)go(n);return}
 const s=stage+d;if(s<0){if(cur>1)go(cur-1);return}if(s>7){if(cur<LESSONS.length)go(cur+1);return}stage=s;render();window.scrollTo(0,0)}
function nav(){document.getElementById('pv').onclick=()=>step(-1);document.getElementById('nx').onclick=()=>step(1)}
document.getElementById('q').oninput=renderList;
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
render();renderList();
</script></body></html>
