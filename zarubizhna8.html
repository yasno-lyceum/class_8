<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 8 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const BOOK_NAME = "Ніколенко О. М., Мацевко-Бекерська Л. В., Рудніцька Н. П. Зарубіжна література, 8 клас (2025)";
const META = [{"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Роди літератури, їхні характерні ознаки. Літературний процес. Провідні літературні епохи", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Античність, її хронологічні межі, специфіка (Давня Греція, Давній Рим). Роди і жанри античної літератури. Міфи троянського циклу", "codes": "", "ktp": "", "hw": "Опрацювати інформацію на тему \"Роди і жанри античної літератури\".", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Троя. Паріс викрадає Єлену. Облога Трої. Відображення історичних подій у міфах троянського циклу", "codes": "", "ktp": "", "hw": "За допомогою інтернету дізнайтеся, як одягалися давні греки, якими були їхні помешкання.", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Смерть Ахілла. Троянський кінь. Ключові образи та символи троянського циклу. Особливості розвитку давньогрецької літератури", "codes": "", "ktp": "", "hw": "Чого навчають герої та героїні давньогрецьких міфів? Які ідеї та цінності втілено в них?", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Створення власного міфу", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Гомер. «Іліада». Гомер та його значення в історії розвитку європейських літератур. Уривок «Викуп Пріамом тіла Гектора»", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Тіртей (VII ст. до н. е.). «Добре вмирати тому...». Ідея захисту рідної країни у творі. Античний ідеал героя", "codes": "", "ktp": "", "hw": "Прочитати вірш  «Добре вмирати тому...» та опрацювати матеріали.", "pages": ""}, {"section": "Вступ. Літературний процес. Ідеали античності з нами", "title": "Діагностувальн {pages:"с. 17–25",
info:`<p><b>Античність</b> (від лат. <i>antiquus</i> — давній) — культура Давньої Греції та Давнього Риму. <b>Хронологічні межі:</b> приблизно VIII ст. до н. е. — V ст. н. е. Це «колиска» європейської літератури: тут виникли основні роди й жанри, театр, філософія, демократія, Олімпійські ігри.</p>
<p><b>Специфіка:</b> міфологічне мислення, культ гармонії тіла й духу, ідеал героя, що служить полісу (місту-державі), зв'язок літератури з музикою й театром.</p>
<p><b>Роди і жанри античної літератури:</b></p>
<ul><li><b>епос</b> — героїчна поема (Гомер «Іліада», «Одіссея»; Вергілій «Енеїда»);</li><li><b>лірика</b> — елегія (Тіртей), ода, гімн, епіграма (Сапфо, Анакреонт, Горацій);</li><li><b>драма</b> — трагедія (Есхіл, Софокл, Евріпід) і комедія (Арістофан).</li></ul>
<p><b>Міфи троянського циклу</b> — оповіді про Троянську війну: її причини (суперечка богинь, викрадення Єлени), десятирічну облогу Трої, подвиги героїв (Ахілл, Гектор, Одіссей), падіння міста.</p>`,

{pages:"с. 22–29",
info:`<p><b>Причина Троянської війни.</b> На весілля Пелея і Фетіди не запросили богиню розбрату Еріду. Вона кинула золоте яблуко з написом «Найпрекраснішій». Його не поділили Гера, Афіна й Афродита. Суддею обрали троянського царевича <b>Паріса</b>. Афродита пообіцяла йому найвродливішу жінку світу — і отримала яблуко.</p>
<p><b>Паріс викрадає Єлену.</b> Із допомогою Афродити Паріс викрадає <b>Єлену</b> — дружину спартанського царя Менелая. Ахейці (греки) на чолі з Агамемноном об'єднуються й вирушають на Трою.</p>
<p><b>Облога Трої</b> триває десять років. Серед героїв — <b>Ахілл, Одіссей, Аякс, Агамемнон</b> з боку ахейців; <b>Гектор, Пріам, Еней</b> — з боку троянців. Боги допомагають то одним, то іншим.</p>
<p><b>Історичні події в міфах:</b> Троя (Іліон) справді існувала в Малій Азії; археолог <b>Генріх Шліман</b> у XIX ст. розкопав її руїни. Війна, ймовірно, була пов'язана з боротьбою за торговельні шляхи. Міфи поетично переосмислили реальні події.</p>`,

{pages:"с. 30–34",
info:`<p><b>Смерть Ахілла.</b> Ахілл — син смертного Пелея і богині Фетіди. Мати занурила немовля у води підземної річки Стікс, тримаючи за п'яту, і все тіло стало невразливим, окрім п'яти. Ахілл убив троянського героя Гектора, але загинув від стріли Паріса, яку Аполлон спрямував йому в п'яту. Звідси вислів <b>«ахіллесова п'ята»</b> — вразливе місце.</p>
<p><b>Троянський кінь.</b> За порадою хитромудрого <b>Одіссея</b> ахейці збудували величезного дерев'яного коня, сховали в ньому воїнів, а самі вдали, що відпливли. Троянці, попри застереження жерця Лаокоона й пророчиці Кассандри, затягли коня в місто. Уночі воїни вийшли й відчинили ворота — Троя впала. <b>«Троянський кінь»</b> — підступний дарунок.</p>
<p><b>Ключові образи й символи:</b> яблуко розбрату (причина ворожнечі), ахіллесова п'ята (вразливість), троянський кінь (підступ), Кассандра (пророцтво, якому не вірять).</p>
<p><b>Особливості давньогрецької літератури:</b> міфологічна основа, героїчний ідеал, гармонія, зв'язок з усною творчістю, вплив на всю європейську культуру.</p>`,

{pages:"с. 22–34",
info:`<p><b>Створення власного міфу.</b></p>
<p><b>Ознаки міфу:</b> боги й герої з надзвичайними здібностями; героїчний казковий світ (подвиги, чудовиська, чарівні предмети); міфологічний конфлікт (добро й зло, світло й темрява); чітка будова (початок, розвиток подій, завершення); мораль.</p>
<p><b>Інструкція для написання міфу:</b></p>
<ol><li><b>Зовнішність героя:</b> зріст, будова тіла, волосся, очі, одяг.</li><li><b>Характерні риси:</b> мужній, винахідливий, мудрий, сильний, мрійливий…</li><li><b>Завдання:</b> що герой має виконати (знайти втрачену реліквію, врятувати місто, пояснити явище природи).</li><li><b>Дії:</b> вороги й друзі на шляху, випробування, добрі вчинки.</li><li><b>Мораль:</b> чого навчає ваш міф.</li></ol>
<p><b>Зразок:</b> «Герой міфу — високий мужній чоловік із темним волоссям і карими очима. Він сміливий і впевнений, шукає втрачену реліквію, щоб урятувати свою родину. На шляху зустрічає ворогів, долає перешкоди і, зміцнений досвідом та відвагою, досягає мети».</p>
<p>Обсяг — 1 сторінка. Можна пояснити походження якогось явища природи чи назви місцевості.</p>`,

{pages:"с. 46–59",
info:`<p><b>Гомер</b> — легендарний давньогрецький поет (приблизно VIII ст. до н. е.), якого вважали сліпим співцем-аедом. За переказом, за честь називатися його батьківщиною сперечалися сім міст. Йому приписують поеми <b>«Іліада»</b> і <b>«Одіссея»</b> — основу європейської літератури. Існує «гомерівське питання»: чи був Гомер одним автором.</p>
<p><b>«Іліада»</b> (від Іліон — Троя) — героїчний епос про 51 день десятого року Троянської війни. Тема — <b>гнів Ахілла</b> і його наслідки. Написана гекзаметром, має 24 пісні.</p>
<p><b>Уривок «Викуп Пріамом тіла Гектора»</b> (пісня XXIV). Ахілл убив Гектора, мстячись за друга Патрокла, і щодня волочив тіло ворога за колісницею. Старий троянський цар <b>Пріам</b> з допомогою бога Гермеса таємно приходить у табір ахейців, падає Ахіллові до ніг і цілує руки, що вбили його сина. Він нагадує Ахіллові про його батька Пелея. Ахілл, зворушений, плаче разом із Пріамом, повертає тіло й дає перемир'я для поховання.</p>
<p><b>Гуманізм епізоду:</b> навіть на війні людяність, співчуття і повага до горя ворога перемагають гнів.</p>`,

{pages:"с. 60–62",
info:`<p><b>Тіртей</b> (VII ст. до н. е.) — давньогрецький поет. За переказом, афіняни на прохання Спарти прислали їй кульгавого вчителя Тіртея; його вірші так надихали спартанців, що вони перемагали. Казали, що його слово сильніше за зброю.</p>
<p><b>«Добре вмирати тому…»</b> — <b>елегія</b> (у давніх греків — повчальний вірш із закликом і роздумом), написана двовіршами (гекзаметр + пентаметр). Римування немає.</p>
<p><b>Тема:</b> заклик до боротьби за свободу свого народу. <b>Ідея:</b> краще загинути за вітчизну, ніж стати втікачем і жебракувати. <b>Мотив:</b> вірність громадянському обов'язку й особиста відповідальність. <b>Настрій:</b> піднесений, героїчний.</p>
<p><b>Дві долі:</b></p>
<ul><li><b>хоробрий воїн</b> — може загинути, але смерть почесна, бо заради батьківщини й родини; його шанують;</li><li><b>воїн-утікач</b> — вигнаний з полісу, жебракує разом із сім'єю, не знаходить ні пошани, ні співчуття.</li></ul>
<p><b>Античний ідеал героя:</b> мужність, честь, служіння полісу. Для ліричного героя безчестя страшніше за смерть. Ці слова особливо зрозумілі сьогодні українцям, які захищають свою землю.</p>`,

{pages:"с. 38–43",
info:`<p><b>Давньогрецький театр</b> виник із культу бога виноробства й родючості <b>Діоніса</b>. На святах на його честь хор співав пісні (дифірамби), учасники вбиралися в козячі шкури. Слово <b>«трагедія»</b> означає «пісня козлів».</p>
<p><b>Будова театру:</b> просто неба, на схилі пагорба; <b>орхестра</b> — кругла майданчик для хору; <b>скена</b> — будівля за сценою, де переодягалися актори; <b>театрон</b> — місця для глядачів (до 17 тисяч). Чудова акустика.</p>
<p><b>Особливості:</b> грали лише чоловіки; актори носили <b>маски</b> й котурни (взуття на високій підошві); вистави тривали цілий день; були змагання драматургів.</p>
<p><b>Основні жанри:</b></p>
<ul><li><b>трагедія</b> — зображення трагічних конфліктів, загибель героя (Есхіл «Прометей закутий», Софокл «Цар Едіп», Евріпід «Медея»);</li><li><b>комедія</b> — висміювання вад суспільства (Арістофан).</li></ul>
<p><b>Катарсис</b> — очищення душі глядача через співчуття й страх (за Арістотелем).</p>`,

info:`<p><b>Публій Вергілій Марон</b> (70–19 рр. до н. е.) — найвидатніший поет Давнього Риму. Народився в селі біля Мантуї. Автор «Буколік» і «Георгік». Останні 11 років життя присвятив <b>«Енеїді»</b>, яку не встиг завершити й просив спалити, але імператор Август наказав її видати.</p>
<p><b>«Енеїда»</b> — героїчний епос (12 книг) про троянця <b>Енея</b>, сина богині Венери, який після падіння Трої шукає нову батьківщину в Італії й стає предком римлян.</p>
<p><b>Зв'язок із гомерівським епосом:</b></p>
<table class="tbl"><tr><th>«Енеїда»</th><th>Гомер</th></tr>

<p><b>Відмінності:</b> Еней — ідеал римлянина, що завжди кориться волі богів і долі (фатуму); твір утверджує велич Римської держави; на щиті Енея — майбутнє Риму. Вплив міфології: боги (Юнона, Венера, Юпітер) втручаються в долю героя.</p>`,

{pages:"с. 69–76",
info:`<p><b>Ідея громадського служіння.</b> Головна риса Енея — <b>pietas</b> (благочестя, вірність обов'язку перед богами, батьківщиною й родиною). Він виносить із палаючої Трої на плечах батька Анхіза, веде сина Асканія, береже святині. Заради місії він жертвує особистим щастям: залишає кохану царицю Карфагена <b>Дідону</b>, бо боги велять йому плисти до Італії.</p>
<p><b>Утвердження величі держави.</b> Поема прославляє Рим і його призначення — правити народами, встановлювати мир і закони. У підземному царстві батько Анхіз показує Енеєві майбутніх великих римлян; на щиті Енея, викуваному Вулканом, — майбутня історія Риму аж до перемог Августа.</p>
<p><b>Образ Енея</b> — герой нового типу: не лише воїн, а й відповідальний правитель, батько народу, що кориться долі заради спільного блага. Його особисті почуття поступаються обов'язку.</p>
<p><b>Сучасна інтерпретація:</b> в Україні «Енеїду» знають завдяки <b>Івану Котляревському</b>, який 1798 р. створив бурлескно-травестійну поему «Енеїда» — перший твір нової української літератури, де троянці стали запорозькими козаками.</p>`,

{pages:"с. 77–86",
info:`<p><b>Річард Бах</b> (нар. 1936, м. Оак-Парк, США) — американський письменник, пілот, журналіст, редактор авіаційного видання «Політ». Його книжки про небо й політ — водночас роздуми про свободу й сенс життя; за стилем вони подібні до творів Сент-Екзюпері. Інші твори: «Дар крил», «Міст через вічність».</p>
<p><b>«Чайка Джонатан Лівінґстон»</b> (1970) — повість-притча, що стала світовим бестселером. Прототипом героя став Джонатан (Джонні) Лівінґстон — один із пілотів, що виступали на авіашоу у 1920–1930-х роках.</p>
<p><b>Сюжет як філософська метафора людського буття:</b> звичайні чайки літають лише для того, щоб добути їжу. А Джонатан прагне <b>досконалості польоту</b> — для нього політ є сенсом життя. Зграя виганяє його за «безвідповідальність». На самоті він удосконалюється, потрапляє у світ досконалих чайок, де вчитель Чіанг відкриває йому таємницю: досконалість — це свобода, обмежень немає. Джонатан повертається, щоб учити інших.</p>
<p><b>Метафора:</b> чайка — людина; політ — творчість, саморозвиток, пошук сенсу; зграя — суспільство, яке боїться всього нового.</p>`,
terms:[["Повість-притча","твір з алегоричним сюжетом і філософським змістом"],["Метафора","перенесення значення за подібністю"]],

{pages:"с. 80–86",
info:`<p><b>Алегоричні образи</b> повісті:</p>
<ul><li><b>Джонатан</b> — людина, що прагне вищої мети, свободи, самовдосконалення;</li><li><b>Зграя</b> — натовп, що живе буденністю й боїться всього, що виходить за межі звичного;</li><li><b>Рада Зграї</b> — влада, яка карає інакодумців;</li><li><b>Чіанг</b> — мудрий учитель;</li><li><b>учні Джонатана</b> — ті, хто наважується шукати свій шлях;</li><li><b>політ</b> — творчість, свобода, пошук сенсу;</li><li><b>небо</b> — досконалість, яку можна знайти в собі.</li></ul>
<p><b>Утілення прагнення до високої мети:</b> Джонатан падає, ламається, але не здається; тренується вночі, на межі можливостей; не мститься зграї, а повертається, щоб навчити інших. Він доводить: кожен має право бути собою й літати, а межі — лише в наших думках.</p>
<p><b>Ідея:</b> людина здатна безкінечно вдосконалюватися, якщо має мету, віру в себе й любов до інших.</p>`,

{pages:"", nobook:"Притч немає в підручнику — працюйте з текстами за матеріалами вчителя.",
info:`<p><b>Притча</b> — невелика повчальна розповідь з алегоричним змістом, у якій через простий сюжет передано глибоку мудрість. На відміну від байки, притча не має тварин-персонажів обов'язково й не завжди формулює мораль прямо — читач сам має її зрозуміти.</p>
<p><b>Джерела притч:</b> Біблія (притчі Ісуса Христа: про блудного сина, про милосердного самарянина, про сіяча, про таланти), Схід (суфійські, дзен-буддійські притчі), народна мудрість.</p>
<p><b>Ознаки притчі:</b> стислість; узагальненість персонажів (часто без імен); повчальність; алегоричність; філософський зміст.</p>
<p><b>Приклад:</b> притча про блудного сина — молодший син забрав свою частку спадку, розтратив її, жив у злиднях і, покаявшись, повернувся до батька. Батько радо прийняв його. <b>Мудрість:</b> любов і прощення сильніші за помилки.</p>
<p>«Чайка Джонатан Лівінґстон» — сучасна притча.</p>`,
terms:[["Притча","коротка повчальна розповідь з алегоричним змістом"],["Алегорія","передача абстрактного через конкретний образ"]],

{pages:"с. 87–93",
info:`<p><b>Середньовіччя</b> — доба в історії Європи від падіння Західної Римської імперії (476 р.) до кінця XV ст. На Сході середньовічна культура розвивалася в Китаї, Японії, Індії, арабському світі, Персії.</p>
<p><b>Основні ознаки доби в Європі:</b></p>
<ul><li><b>теоцентризм</b> — Бог є центром Усесвіту, усе підпорядковано релігії;</li><li>провідна роль Церкви в освіті, науці, мистецтві; латина — мова науки й Церкви;</li><li>поєднання релігійних форм із народною фантазією;</li><li>лицарська культура, ідеал служіння Богу, сюзерену й Прекрасній Дамі;</li><li>символізм: світ сприймали як систему знаків Божої волі.</li></ul>
<p><b>Жанри:</b> житія святих, героїчний епос («Пісня про Роланда»), лицарський роман, поезія трубадурів і мінезингерів, міська література.</p>
<p><b>Видатні митці:</b> Лі Бо, Ду Фу (Китай), Рудакі, Омар Хаям, Хафіз, Фірдоусі, Румі (Персія), Данте Аліґ'єрі (Італія).</p>
<p>Назву «Середні віки» (між Античністю й Відродженням) дали гуманісти, які вважали цю добу «темною». Насправді в ній було багато світла — це підкреслює назва розділу.</p>`,

{pages:"с. 94–99",
info:`<p><b>Омар Хаям</b> (бл. 1048 — після 1122) — перський поет, математик, астроном і філософ. Народився в Нішапурі (Іран). Створив точний календар, точніший за григоріанський, написав праці з алгебри. Жив при дворі султана в Ісфахані, керував обсерваторією.</p>
<p><b>Рубаї</b> — жанр, розвинутий Хаямом: <b>чотиривірш</b> філософського змісту з римуванням <b>ааба</b> (третій рядок не римується). Рубаят — зібрання рубаї. Українською рубаї Хаяма переклав <b>Василь Мисик</b>.</p>
<p><b>Лаконізм і місткість жанру:</b> у чотирьох рядках поет висловлює цілу філософію: перші два рядки ставлять проблему, третій — «зламний», підготовка до висновку, четвертий — несподіваний афористичний підсумок.</p>
<p>Рубаї Хаяма прославились у Європі в XIX ст. завдяки англійському перекладу Едварда Фіцджеральда.</p>`,
terms:[["Рубаї","філософський чотиривірш із римуванням ааба"],["Лаконізм","стислість, вміння сказати багато небагатьма словами"],["Афоризм","короткий влучний вислів"]],

{pages:"с. 97–99",
info:`<p><b>Основні теми й мотиви рубаї Омара Хаяма:</b></p>
<ul><li><b>швидкоплинність життя</b> — життя коротке, тому треба цінувати кожну мить;</li><li><b>таємниця буття</b> — звідки ми прийшли й куди підемо, людині не дано знати;</li><li><b>радість життя</b> — любов, дружба, вино, краса природи як прояви повноти буття;</li><li><b>гідність людини</b>, незалежність думки, критика лицемірства й святенництва;</li><li><b>мудрість і знання</b> — людина прагне пізнати світ, але її розум обмежений;</li><li><b>доля</b> — «скрижалі Долі», які людина хотіла б переписати.</li></ul>
<p><b>Філософське тлумачення.</b> Хаям не закликає до бездумних насолод: вино в його поезії — символ радості й свободи духу. Він протестує проти несправедливості світу й закликає жити гідно, чесно, по-людськи, бо життя — найбільша цінність.</p>
<p><b>Виразне читання рубаї:</b> повільно, з паузою перед четвертим рядком, де звучить головна думка.</p>`,

{pages:"с. 100–104",
info:`<p><b>Данте Аліґ'єрі</b> (1265–1321) — великий італійський поет, «останній поет Середньовіччя і перший поет Нового часу». Народився у Флоренції. Брав участь у політичному житті, був вигнаний з рідного міста й до смерті жив у вигнанні; помер у Равенні.</p>
<p>У дев'ять років Данте зустрів <b>Беатріче Портінарі</b>. Вони бачилися лише двічі, Беатріче рано померла, але її образ пронизує всю творчість поета. Їй присвячено книгу <b>«Нове життя»</b> (1295) — поєднання прози й віршів, і вона веде поета Раєм у <b>«Божественній комедії»</b> — головному творі Данте (поема з трьох частин: «Пекло», «Чистилище», «Рай»).</p>
<p><b>Сонет 11 «В своїх очах вона несе Кохання…»</b> (з «Нового життя») оспівує чарівну силу Беатріче: її погляд облагороджує все довкола, перед нею схиляються, гордість і гнів зникають, серця сповнюються смирення й любові. Її усмішку неможливо описати словами — це диво.</p>
<p>Кохана в Данте — <b>ідеальна, майже неземна</b>, посланниця Бога, що робить людей кращими.</p>`,
terms:[["Сонет","вірш із 14 рядків, зі строгою схемою рим"],["Ідеальний образ","образ, у якому втілено найвищі уявлення про красу й добро"]],
q:[["Хто надихнув Данте на творчість?",["Беатріче","Лаура","Джульєтта","Дульсінея"],0],
["Як називається книга Данте, де є сонет 11?",["«Нове життя»","«Божественна комедія»","«Книга пісень»","«Канцоньєре»"],0],

{pages:"с. 100–104",
info:`<p><b>Художні засоби сонетів Данте:</b></p>
<ul><li><b>епітети</b> («чарівна», «шляхетна») — підкреслюють досконалість коханої;</li><li><b>метафори</b> («в своїх очах вона несе Кохання») — кохання постає живою силою;</li><li><b>уособлення</b> — Кохання діє, як жива істота;</li><li><b>антитеза</b> — гордість і смирення, гнів і любов;</li><li><b>гіпербола</b> — силу погляду й усмішки неможливо передати словами;</li><li><b>образи світла</b> — кохана сяє, як небесне світло.</li></ul>
<p><b>Будова сонета:</b> 14 рядків — два катрени (чотиривірші) і два терцети (тривірші).</p>
<p><b>Данте як ключова постать</b> італійського Середньовіччя та Відродження:</p>

info:`<p><b>Ерік-Вольф Сігел</b> (1937–2010) — американський письменник, сценарист, професор літератури Гарвардського університету, де сам навчався. Теми його творів — університетське життя, кохання, родина.</p>
<p><b>«Історія кохання»</b> (1970) — роман, що став світовим бестселером. Спершу видавець не зацікавився рукописом, тож Сігел переробив його на сценарій; фільм (режисер Артур Гіллер, 1970) приніс твору славу.</p>
<p><b>Сюжет:</b> <b>Олівер Беррет IV</b> — студент Гарварду, спортсмен, син мільйонера з відомої родини. <b>Дженніфер (Дженні) Кавіллері</b> — студентка-музикантка, дочка бідного італійського емігранта-кондитера. Вони різні за походженням і характером, але закохуються одне в одного.</p>

info:`<p><b>Урок-диспут.</b> Тема: <b>бунт молодого покоління проти традиційного способу життя батьків</b>.</p>
<p>Наприкінці 1960-х — на початку 1970-х років у США молодь прагнула жити по-новому: слухала «Бітлз», протестувала проти консервативного суспільства (рух гіпі). Олівер — бунтар: він не хоче бути лише «Беррет IV», продовжувачем родинних традицій, грошей і кар'єри, а шукає власний шлях.</p>
<p><b>Питання для диспуту:</b></p>
<ol><li>Чи мав Олівер рацію, відмовившись від батькових грошей?</li><li>Чи справді батько був «ворогом»? Як змінюється його ставлення наприкінці?</li><li>Порівняйте стосунки Олівера з батьком і Дженні з її батьком Філом.</li><li>Чи можна бути вільним, не пориваючи з батьками?</li><li>Що важливіше: традиції чи особисте щастя?</li></ol>
<p><b>Правила диспуту:</b> висловлюй думку аргументовано; поважай опонентів; спирайся на текст; не перебивай.</p>
<p><b>Корисні фрази:</b> «Я переконаний(а), що…», «На мою думку…», «Не погоджуюся, бо…», «Доказом цього є…».</p>`,

info:`<p><b>Додаткове читання.</b> <b>Йоун Колфер</b> (нар. 1965) — ірландський письменник, колишній учитель, автор серії романів про Артеміса Фаула, перекладених понад сорока мовами.</p>
<p><b>«Артеміс Фаул»</b> (2001) — роман-фентезі. <b>Артемісові</b> лише дванадцять років, але він — вундеркінд із надзвичайним інтелектом. Його родина колись мала величезні статки; тепер батько зник безвісти, мати хворіє, грошей бракує. Артеміс вирішує відновити родинну славу й багатство — дістати золото <b>Чарівного Народу</b> (лепреконів, ельфів, фей).</p>
<p>Він здобуває священну Книгу Чарівного Народу, розшифровує її й викрадає ельфійку-поліцейську <b>Холлі Куць</b>, вимагаючи викуп. Йому допомагають вірний охоронець <b>Лаккей</b> і його сестра Джульєтта. Проти Артеміса виступає вся підземна поліція на чолі з командувачем Корчем.</p>
<p><b>Міфологічні мотиви:</b> ім'я Артеміс — від богині Артеміди (мисливиці, захисниці дому); прізвище Фаул — «птах». Поступово Артеміс розуміє, що золото — не найголовніше, і знаходить справжніх друзів.</p>`,

{pages:"с. 126–139",
info:`<p><b>Ренесанс (Відродження)</b> — епоха в культурі Європи XIV–XVI ст. Назва пов'язана з відродженням інтересу до античної культури. Батьківщина Ренесансу — Італія.</p>
<p><b>Ознаки:</b> <b>гуманізм</b> і <b>антропоцентризм</b> (людина — центр світу); культ античності; віра в безмежні можливості людини; інтерес до земного життя, природи, краси тіла й душі; розквіт науки й мистецтва (Леонардо да Вінчі, Мікеланджело, Рафаель).</p>
<p><b>Франческо Петрарка</b> (1304–1374) — італійський поет, «батько гуманізму», зачинатель європейської любовної лірики. Народився в Ареццо, жив у Франції (Авіньйон) та Італії. 1341 р. увінчаний у Римі лавровим вінком.</p>
<p><b>Історія кохання:</b> 1327 р. в церкві Святої Клари в Авіньйоні 23-річний Петрарка вперше побачив 20-річну <b>Лауру</b> й покохав її на все життя. Вона була заміжньою й померла в сорок років, але поет оспівував її понад 20 років і після смерті. Збірка «Книга пісень» («Канцоньєре») — 366 віршів, переважно сонетів.</p>
<p><b>Сонет 61</b> («Благословенні будьте, день і рік…») — вдячність за мить зустрічі з коханою, за все, що пов'язане з нею, навіть за біль кохання. <b>Сонет 132</b> — роздуми про суперечливу природу кохання: «Коли не любов — то що ж мене пече?»; кохання — водночас радість і мука.</p>`,

{pages:"с. 140–143",
info:`<p><b>Вільям Шекспір</b> (1564–1616) — великий англійський драматург і поет. Народився в м. Стретфорд-на-Ейвоні; його батько пройшов шлях від ремісника до мера міста. Юнаком поїхав до Лондона, був актором, драматургом і співвласником театру <b>«Глобус»</b>.</p>
<p>Створив <b>37 п'єс</b> (трагедії «Ромео і Джульєтта», «Гамлет», «Король Лір», «Отелло», «Макбет»; комедії «Сон літньої ночі», «Дванадцята ніч»; історичні хроніки), <b>154 сонети</b>, поеми.</p>
<p><b>Значення Шекспіра:</b></p>
<ul><li>збагатив англійську мову тисячами слів і виразів;</li><li>створив вічні образи (Ромео і Джульєтта, Гамлет, Лір, Отелло);</li><li>поєднав у п'єсах трагічне й комічне, глибоко розкрив людську психологію;</li><li>його п'єси досі ставлять театри всього світу, за ними знімають фільми, балети, опери.</li></ul>
<p>Існує «шекспірівське питання» — сумніви, чи справді автором творів був саме Шекспір із Стратфорда.</p>`,

{pages:"с. 144–147", nobook:"Сонетів 66, 116 і 130 є в підручнику (с. 144–146); сонета 143 у підручнику немає — прочитайте його за матеріалами вчителя.",
info:`<p><b>Основні теми сонетів Шекспіра:</b> кохання, дружба, краса, швидкоплинність часу, безсмертя поезії, несправедливість світу. Сонети звернені до юного друга й до «смаглявої леді». <b>Шекспірівський сонет:</b> три катрени й заключний двовірш (абаб вгвг деде єє); у двовірші — головна думка.</p>
<p><b>Сонет 66</b> — «Стомившися, вже смерті я благаю…»: ліричний герой обурений несправедливістю світу (талант у злиднях, нікчема в розкошах, віра зраджена, честь зганьблена). Лише кохання тримає його в житті. <b>Відображення внутрішнього світу ренесансної людини:</b> розчарування в суспільстві й віра в людину.</p>
<p><b>Сонет 116</b> — гімн вірному коханню: справжнє кохання не змінюється з часом, воно — «маяк», що світить у бурі, «зоря» для кораблів.</p>
<p><b>Сонет 130</b> — полеміка з поетичними штампами: очі коханої «на сонце не скидаються», губи не як корал, але вона — найкраща «поміж тими, що славлені похвалами пустими». Цінність — у правді, а не в прикрасах.</p>
<p><b>Сонет 143</b> — ліричний герой порівнює себе з дитиною, що біжить за матір'ю, яка ловить курку: він просить кохану повернутися до нього й бути ласкавою.</p>`,

<p><b>Місце дії</b> — італійське місто Верона; події тривають лише <b>п'ять днів</b>.</p>
<p><b>Художній конфлікт:</b> зіткнення справжнього почуття і забобонів, кохання і родової ворожнечі. З боку <b>Монтеккі</b> — Ромео, його батьки, друзі Меркуціо й Бенволіо; з боку <b>Капулетті</b> — Джульєтта, її батьки, кузен Тібальт, Няня. Ворожнеча, причину якої вже ніхто не пам'ятає, руйнує життя молодих.</p>
<p><b>Теми:</b> кохання, суспільна ворожнеча, родова помста, стосунки батьків і дітей, життя і смерть, доля.</p>

info:`<p>Шекспір <b>оспівує чисте, пристрасне кохання</b> Ромео і Джульєтти — почуття, що з'являється з першого погляду й сильніше за ворожнечу, закони, навіть смерть.</p>
<p><b>Вплив кохання на особистість:</b></p>
<ul><li><b>Ромео</b> на початку — мрійливий юнак, закоханий у Розаліну, який страждає від «книжкового» кохання. Зустрівши Джульєтту, він змінюється: стає рішучим, мужнім, щирим. Кохання робить його дорослим.</li><li><b>Джульєтта</b> — їй немає ще й 14 років, вона жила під опікою батьків і Няні, «не знаючи ні себе, ні світу». Кохання відкриває їй очі: вона стає сміливою, самостійною, готовою на все заради коханого — навіть випити снодійне зілля брата Лоренцо.</li></ul>
<p><b>Сцена на балконі</b> — гімн коханню: Джульєтта говорить, що ім'я — лише назва, і троянда пахла б так само солодко під будь-яким іменем. Ім'я, рід — це умовності; важлива людина.</p>

<p><b>Проблема життя і смерті.</b> Закохані обирають смерть, а не життя одне без одного. Їхня смерть — не поразка, а <b>перемога кохання</b>: над тілами дітей батьки Монтеккі й Капулетті примиряються й обіцяють поставити золоті статуї закоханим.</p>

{pages:"с. 178–191",
info:`<p><b>Дон Кіхот</b> — мрійник, ідеаліст, шляхетний і безкорисливий лицар, що прагне захищати скривджених і відновити справедливість. Він смішний своєю невідповідністю реальності, але його мрія — висока. <b>Санчо Панса</b> — простий селянин, його зброєносець: практичний, тверезий, хитруватий, любить поїсти й мріє стати губернатором острова. Але й він вірний, добрий і поступово переймає від лицаря віру в ідеали.</p>
<p><b>Вічні образи:</b> Дон Кіхот і Санчо Панса — два полюси людської природи: <b>висока мрія</b> і <b>прагматизм</b>, дух і тіло, ідеал і реальність. Вони доповнюють одне одного.</p>

{pages:"с. 192–209",
info:`<p><b>Барбара Космовська</b> (нар. 1958, м. Битів, Польща) — польська письменниця, колишня вчителька польської мови, доктор гуманітарних наук. Пише для дітей і підлітків. 2022 р. написала лист до українських читачів «Буби» зі словами підтримки й вірою в перемогу.</p>
<p><b>«Буба»</b> — повість (дилогія: «Буба» і «Буба: мертвий сезон») про життя сучасної польської родини очима шістнадцятирічної школярки <b>Агнешки</b>, яку в сім'ї називають <b>Бубою</b>.</p>
<p><b>Сучасні дорослі й підлітки.</b> Довкола Буби багато людей: мати Марися (письменниця жіночих романів), батько Павел (працює на телебаченні), дідусь Генрик, сестра Олька з чоловіком Робертом, сусіди Маньчаки, хатня робітниця. Але між ними немає справжнього порозуміння: ніхто не цікавиться, як живе Буба, навіть про її день народження забули. Буба порівнює свою сім'ю із симфонічним оркестром, у якому втрачено гармонію.</p>
<p><b>Проблеми твору:</b> самотність, взаємини дітей і батьків, ставлення до старших, шкільне життя, перше кохання, дорослішання.</p>`,

["Ким працює мати Буби?",["Письменницею","Лікаркою","Вчителькою","Акторкою"],0],

{pages:"с. 195–209",
info:`<p><b>Спілкування з дідусем як шлях до духовного дорослішання.</b> У повісті найближча до Буби людина — <b>дідусь Генрик</b>. Він мудрий, іронічний, уважний. «Дорослі діти» прагнуть його контролювати й навіть намагаються розпоряджатися його пенсією, але він зберігає гідність і почуття гумору.</p>
<p>Тільки з дідусем Буба може відверто поговорити про все: про родину, школу, кохання, страхи. Він не повчає, а допомагає їй самій зрозуміти людей. Саме дідусь каже, що дорослі «смішні й трагічні водночас», — і вчить Бубу не засуджувати їх, а розуміти.</p>
<p><b>Дідусь вірить у здібності онуки</b> й підтримує її на чемпіонаті Польщі з бриджу, де Буба перемагає. Ця перемога піднімає її в очах однокласників, але вона залишається собою — доброю й уважною.</p>
<p><b>Висновок:</b> спілкування поколінь — шлях до мудрості. Мудрий старший друг допомагає підлітку стати дорослим, зберігши себе.</p>
<p><i>Примітка: у КТП тема сформульована як «дорослішання хлопчика», але в повісті «Буба» це шлях дівчинки-героїні.</i></p>`,
terms:[["Духовне дорослішання","розвиток внутрішнього світу, мудрості, відповідальності"]],
q:[["Хто найближча людина для Буби?",["Дідусь Генрик","Мати","Сестра Олька","Сусідка"],0],

["У якій грі Буба перемогла на чемпіонаті?",["У бриджі","У шахах","У тенісі","У волейболі"],0],
["Чого вчить дідусь Бубу?",["Розуміти людей, а не засуджувати","Слухатися всіх","Мовчати","Не довіряти нікому"],0]]},

{pages:"с. 195–209",
info:`<p><b>Стосунки Буби з рідними.</b> Батьки постійно сваряться, сестра Олька сварится з Робертом, сусіди — між собою. Буба почувається в безпеці лише за зачиненими дверима своєї кімнати. Її рятують книжки, музика й розмови з дідусем.</p>
<p><b>Самотність дитинства:</b> Буба — «ані вродлива, ані негарна, ані висока, ані низенька», звичайна школярка. Вона переживає перше нерозділене кохання до Адама Куницького (Адася), який захопився найпривабливішою дівчиною класу — Йолькою, і зраду найкращої подруги.</p>
<p><b>Радісні відкриття:</b> Буба вчиться розрізняти «справжнє» і «фальшиве», «виростає» з уявного кохання до Адася й доростає до справжнього почуття до <b>Мілоша</b>. Вона може порадити Адамові: «Ти повинен сам вирости з Йольки, Адасю».</p>
<p><b>Любов і порозуміння:</b> Буба не тримає зла на Йольку, мирить сестру з Робертом, співчуває однокласниці Агаті, у якої складні проблеми в родині. Вона завжди обирає <b>внутрішню гідність і порядність</b>. Звичайна дівчинка виявляється незвичайною.</p>`,
terms:[["Характеристика персонажа","опис рис героя з прикладами вчинків"]],
q:[["Де Буба почувається в безпеці?",["У своїй кімнаті","У школі","На вулиці","У сусідів"],0],

{pages:"с. 192–209",
info:`<p><b>Психологічний аналіз повісті.</b> Космовська не засуджує дорослих, а придивляється до них: кожен має свої вади й позитивні риси, право на помилки, розуміння й прощення дітей. Але для цього потрібна мудрість — і дорослим, і дітям.</p>
<p><b>Дискусія: «Життя — велетенська лотерея, і тільки виграші у ній видимі всім».</b></p>
<ul><li>Що означає цей вислів? (Люди бачать лише чужі успіхи, а не зусилля, поразки, біль, що за ними.)</li><li>Як це стосується родини Буби: зовні успішна (мати — відома письменниця, батько — на телебаченні), а всередині — самотність і сварки?</li><li>Чи справді життя — лише лотерея, чи успіх залежить і від самої людини?</li><li>Що «виграла» Буба? (Перемога в бриджі, справжнє кохання, мудрість.)</li><li>Чи порівнюєте ви себе з іншими, бачачи лише їхні «виграші» (наприклад, у соцмережах)?</li></ul>
<p><b>Висновок:</b> за чужими успіхами завжди стоять невидимі зусилля; щастя — не тільки випадок, а й наш вибір і праця.</p>`,
terms:[["Дискусія","обговорення питання з різними поглядами"],["Психологізм","глибоке зображення внутрішнього світу героїв"]],
q:[["Що означає вислів «тільки виграші видимі всім»?",["Люди бачать лише чужі успіхи, а не зусилля й поразки","Усі завжди виграють","Лотерея — найкраща гра","Нічого"],0],

{pages:"с. 210–226",
info:`<p><b>Бароко</b> (від італ. <i>barocco</i> — химерний, дивний) — доба і художній напрям кінця XVI — XVII ст. <b>Ознаки:</b> відчуття мінливості, суперечливості світу; контрасти (життя і смерть, земне й небесне); пишність, ускладненість форми; символізм, алегорії, метафори; поєднання релігійного й світського. Представники: Л. де Гонгора, П. Кальдерон, Дж. Мільтон; в Україні — Г. Сковорода, І. Величковський.</p>
<p><b>Класицизм</b> (від лат. <i>classicus</i> — взірцевий) — напрям XVII — початку XIX ст., що виник у Франції за часів абсолютної монархії Людовика XIV. <b>Філософська основа</b> — раціоналізм Декарта (культ розуму).</p>
<p><b>Ознаки класицизму:</b> наслідування античних зразків; культ розуму, обов'язку перед державою; поділ жанрів на «високі» (трагедія, ода, епопея) і «низькі» (комедія, байка, сатира); <b>правило трьох єдностей</b> у драмі — <b>місця, часу</b> (події тривають до доби) і <b>дії</b> (одна сюжетна лінія); герої — носії однієї риси; повчальність.</p>
<p>Представники: П. Корнель, Ж. Расін, Ж.-Б. Мольєр, Ж. Лафонтен, Н. Буало.</p>`,
terms:[["Бароко","напрям XVII ст. із контрастами, пишністю й символізмом"],["Класицизм","напрям, що наслідував античні зразки й культивував розум"],["Правило трьох єдностей","єдність місця, часу й дії в драмі класицизму"]],

{pages:"с. 227–233",
info:`<p><b>Жан-Батист Мольєр</b> (справжнє прізвище — Поклен, 1622–1673) — французький комедіограф, актор, режисер. Син королівського шпалерника, отримав добру освіту, але обрав театр. 13 років мандрував із трупою провінцією, потім здобув прихильність короля Людовика XIV. Помер майже на сцені — після вистави «Уявний хворий», де грав головну роль.</p>
<p><b>Майстер класицистичної комедії.</b> <b>Художнє новаторство:</b> поєднав класицистичні правила з народним фарсом; створив <b>«високу комедію»</b> — комедію характерів, що висміює не лише смішні ситуації, а й вади суспільства; персонажі живі, мова соковита. Найкращі комедії (1664–1670): «Тартюф», «Дон Жуан», «Скнара», «Міщанин-шляхтич».</p>
<p><b>Історія створення «Міщанина-шляхтича»</b> (1670): 1669 р. Людовик XIV приймав у Версалі турецьких послів, які не виявили очікуваного захоплення розкішшю двору. Король доручив Мольєрові створити комедію з кумедною «турецькою церемонією» — так з'явилася комедія-балет «Міщанин-шляхтич» (музика Люллі).</p>`,
terms:[["Комедія","драматичний твір, що висміює вади"],["Комедія-балет","комедія з музичними й танцювальними номерами"],["Фарс","легка комедія з грубуватим гумором"]],

["Хто був покровителем Мольєра?",["Людовик XIV","Наполеон","Генріх VIII","Філіп II"],0],
["Що спонукало до створення «Міщанина-шляхтича»?",["Візит турецьких послів до Людовика XIV","Війна","Свято врожаю","Весілля короля"],0],
["Жанр «Міщанина-шляхтича»:",["Комедія-балет","Трагедія","Роман","Ода"],0],

{pages:"с. 234–258",
info:`<p><b>Основні образи комедії «Міщанин-шляхтич»:</b></p>
<ul><li><b>Пан Журден</b> — багатий міщанин, син торговця сукном, який понад усе хоче стати «шляхтичем». Наймає вчителів музики, танців, фехтування, філософії; замовляє розкішне вбрання; ладен віддати дочку лише за дворянина. Він наївний, марнославний, смішний, але не злий.</li><li><b>Пані Журден</b> — його дружина, жінка здорового глузду; висміює забаганки чоловіка й захищає щастя дочки.</li><li><b>Люсіль</b> — дочка Журденів, закохана в Клеонта.</li><li><b>Клеонт</b> — чесний, освічений юнак, не дворянин; відмовляється брехати про своє походження.</li><li><b>Ков'єль</b> — дотепний слуга Клеонта, вигадник «турецької церемонії».</li><li><b>Ніколь</b> — служниця, весела й розумна, кохана Ков'єля.</li><li><b>Граф Дорант</b> — збіднілий аристократ-шахрай, позичає в Журдена гроші й використовує його.</li><li><b>Маркіза Дорімена</b> — вдова, за якою Журден невдало упадає; Дорант видає подарунки Журдена за свої.</li></ul>
<p><b>Сюжет:</b> Журден відмовляє Клеонтові в руці дочки. Тоді Ков'єль влаштовує маскарад: Клеонт, переодягнений «сином турецького султана», «присвячує» Журдена в «мамамуші» і отримує згоду на шлюб.</p>
<p><b>Читання в особах:</b> оберіть яву й розподіліть ролі.</p>`,
terms:[["Дійові особи","персонажі драматичного твору"],["Ява","частина дії, у якій склад персонажів не змінюється"]],

{pages:"с. 234–258",
info:`<p><b>Засоби комічного</b> в комедії «Міщанин-шляхтич»:</p>
<table class="tbl"><tr><th>Засіб</th><th>Що це</th><th>Приклад</th></tr>
<tr><td><b>Гумор</b></td><td>доброзичливий сміх</td><td>Журден радіє, дізнавшись, що все життя говорив прозою</td></tr>
<tr><td><b>Іронія</b></td><td>прихована насмішка</td><td>учителі вихваляють «таланти» Журдена, думаючи про його гроші</td></tr>
<tr><td><b>Сатира</b></td><td>гостре викриття вад</td><td>марнославство міщанина, шахрайство аристократа Доранта</td></tr>
<tr><td><b>Сарказм</b></td><td>зла, уїдлива насмішка</td><td>репліки пані Журден і Ніколь про «шляхетність» Журдена</td></tr></table>
<p><b>Інші прийоми:</b> комізм ситуацій (бійка вчителів, урок фехтування, де Журдена «вбиває» Ніколь); комізм характерів; комізм мови («мамамуші», безглузді «турецькі» слова); переодягання; повтори.</p>
<p><b>Що висміює Мольєр:</b> марнославство, бажання здаватися тим, ким не є; плазування перед знаттю; паразитизм збіднілої аристократії.</p>

{pages:"с. 277–289",
info:`<p><b>Сью Таунсенд</b> (1946–2014) — англійська письменниця й драматургиня. Рано покинула школу, працювала на різних роботах, самотужки виховувала дітей, захоплювалася читанням. Першу п'єсу написала 1978 р. Читачі найбільше полюбили цикл «Щоденники Адріана Моула». 2001 р. письменниця осліпла, але продовжувала писати.</p>
<p><b>«Таємний щоденник Адріана Моула»</b> (повна назва — «…розпочатий у тринадцять і три чверті років», 1982). Ідея виникла, коли син письменниці спитав, чому їхня родина не їде на сафарі, як інші. Сью згадала себе-підлітка — і вирішила «поговорити» з 14–16-річними.</p>
<p><b>Вразлива душа підлітка:</b> Адріан пише щоденник з 1 січня 1981 р. до 3 квітня 1982 р. Він переживає через прищі, зріст, стосунки в родині, школу; вважає себе інтелектуалом і непризнаним поетом; закохується в однокласницю <b>Пандору</b>. Він багато читає (Джейн Остін, Орвелла, Дарвіна), «усе хоче пізнати власним розумом».</p>
<p><b>Мрії й пошуки себе:</b> бути визнаним, коханим, зрозумілим; знайти своє місце у світі дорослих.</p>`,
terms:[["Щоденник","записи особистих подій і думок за днями"],["Повість-щоденник","твір у формі щоденникових записів героя"]],

{pages:"с. 279–289",
info:`<p><b>Драматичні ситуації</b> в житті Адріана: батьки сваряться; мама йде з дому до сусіда містера Лукаса, згодом повертається; тато втрачає роботу; у родині бракує грошей; Адріан почувається покинутим.</p>
<p><b>Комічні пригоди:</b> Адріан приклеює модель літака до носа; фарбує стіни своєї кімнати в чорний колір; ретельно стежить за своїм зростом; бореться зі шкільними хуліганами; пише «геніальні» вірші й надсилає їх на радіо Бі-Бі-Сі.</p>
<p><b>Душевні переживання:</b> перше кохання до Пандори, ревнощі, сором, гнів на батьків, страх, що він «нікому не потрібен».</p>
<p><b>Самотність та її подолання.</b> Адріан дружить зі старим <b>Бертом Бакстером</b>: допомагає йому в домашніх справах, піклується про нього, а Берт вислуховує хлопця й дає поради. Друг <b>Найджел</b>, пес, бабуся — теж опора.</p>
<p><b>Любов і вірність — провідні теми:</b> попри конфлікти, Адріан щиро любить рідних і завжди готовий допомогти; він вірний Пандорі й своїм друзям.</p>`,

{pages:"с. 279–289",
info:`<p><b>Підлітковий погляд на проблеми дорослих.</b> Адріан бачить світ дорослих наївно, але часто влучно: помічає їхні сварки, слабкості, безвідповідальність, лицемірство політиків, байдужість суспільства до старих людей. Іноді він виявляється мудрішим за дорослих.</p>
<p><b>Гумор та іронія:</b> смішне виникає з <b>розбіжності</b> між тим, як Адріан оцінює події, і тим, що бачить читач. Він пише серйозно — а читачеві смішно. Наприклад, його новорічні обіцянки («Буду вішати штани у шафу», «Буду добрим до нашого пса», «Припиню видушувати прищі»), «наукові» спостереження за своїм зростом, пафосні вірші. Це <b>іронія</b> автора, яка водночас ніжна й співчутлива.</p>
<p><b>Утвердження цінності людини:</b> за смішними записами — вразлива, добра душа, яка шукає любові й розуміння. Таунсенд показує: внутрішній світ підлітка — складний і цінний, його переживання треба поважати.</p>`,
terms:[["Іронія","прихована насмішка; невідповідність сказаного й справжнього"],["Гумор","доброзичливий сміх"]],

{pages:"с. 279–289",
info:`<p><b>Щоденник як форма розвитку сюжету.</b> Повість складається з датованих записів. Це дає змогу:</p>
<ul><li>показати події <b>зсередини</b>, очима героя;</li><li>передати його <b>щирі думки й почуття</b> (щоденник «таємний» — для себе);</li><li>створити ефект присутності й довіри читача;</li><li>поєднати важливе й дріб'язкове, смішне й сумне;</li><li>простежити, як змінюється герой із часом.</li></ul>
<p><b>Адріан Моул — оповідач і головний герой.</b> Ми знаємо лише те, що знає й думає він. Тому читач часто розуміє більше за героя (наприклад, причини сварок батьків) — і це джерело гумору й співчуття.</p>
<p><b>Творче завдання: складіть продовження щоденника Адріана Моула</b> (3–5 записів). Зберігайте форму: дата, день тижня, короткі записи від першої особи, стиль і характер Адріана (серйозний тон, «інтелектуальні» слова, переживання про Пандору, піклування про Берта).</p>`,

info:`<p><b>Додаткове читання.</b> <b>«Буба: мертвий сезон»</b> — друга частина дилогії Барбари Космовської про Агнешку-Бубу.</p>
<p>Буба дорослішає: вона вже має досвід першого кохання й дружби, але життя знову ставить нові випробування. Родина, як і раніше, занурена у власні справи; дорослі продовжують «смішно й трагічно» плутатися у своїх проблемах. «Мертвий сезон» — час, коли здається, що нічого не відбувається, світ завмер, але саме тоді в душі людини відбуваються найважливіші зміни.</p>
<p><b>Питання для читання:</b></p>
<ol><li>Як змінилася Буба порівняно з першою книгою?</li><li>Які нові стосунки з'являються в її житті?</li><li>Як розвиваються її взаємини з батьками, сестрою, дідусем Генриком?</li><li>Що означає назва «мертвий сезон» для героїні?</li></ol>`,

about:"Цикл міфів про Троянську війну — від суперечки богинь за золоте яблуко до падіння Трої. Історія про пристрасті, героїзм, підступ і долю, що стала джерелом для «Іліади», «Одіссеї», «Енеїди» та всієї європейської культури.",
plot:["На весілля Пелея і Фетіди не запросили богиню розбрату Еріду, і вона кинула золоте яблуко «Найпрекраснішій». Його не поділили Гера, Афіна й Афродита.","Суддя — троянський царевич Паріс — віддав яблуко Афродиті за обіцянку найвродливішої жінки. З її допомогою він викрав Єлену, дружину спартанського царя Менелая.","Ахейці на чолі з Агамемноном вирушили на Трою. Облога тривала десять років; у битвах прославилися Ахілл, Гектор, Аякс, Одіссей.","Ахілл убив Гектора, але сам загинув від стріли Паріса, яку Аполлон спрямував у його єдине вразливе місце — п'яту.","За задумом Одіссея ахейці збудували дерев'яного коня з воїнами всередині. Троянці, не послухавши Лаокоона й Кассандру, затягли його в місто — і Троя впала."],

romeo:{name:"«Ромео і Джульєтта»", author:"Вільям Шекспір, 1594", genre:"Трагедія",

plot:["У Вероні ворогують дві шляхетні родини — Монтеккі й Капулетті. На балу в Капулетті Ромео й Джульєтта закохуються з першого погляду.","У сцені на балконі вони зізнаються в коханні, а наступного дня брат Лоренцо таємно їх вінчає.","Тібальт убиває друга Ромео Меркуціо; Ромео вбиває Тібальта й мусить піти у вигнання.","Батьки хочуть видати Джульєтту за Паріса. Брат Лоренцо дає їй зілля, від якого вона здаватиметься мертвою, але лист до Ромео не доходить.","Ромео, вважаючи кохану мертвою, отруюється в склепі; Джульєтта, прокинувшись, заколюється його кинджалом. Над тілами дітей родини примиряються."],
heroes:[["Ромео","юнак із роду Монтеккі; палкий, щирий, рішучий"],["Джульєтта","донька Капулетті; ніжна, смілива, віддана"],["Брат Лоренцо","монах, що допомагає закоханим"],["Меркуціо","дотепний друг Ромео"],["Тібальт","запальний кузен Джульєтти"],["Няня","вихователька Джульєтти"],["Паріс","граф, наречений, обраний батьками Джульєтти"]]},

quixote:{name:"«Дон Кіхот»", author:"Міґель де Сервантес Сааведра, 1605 (I частина)", genre:"Роман",
about:"Роман-пародія на лицарські романи, що став філософським твором про людину, яка вірить в ідеали в недосконалому світі. Смішний і зворушливий лицар Дон Кіхот і його практичний зброєносець — вічні образи світової літератури.",
plot:["Бідний гідальго Алонсо Кіхано з Ламанчі, начитавшись лицарських романів, уявляє себе мандрівним лицарем Дон Кіхотом.","Він бере старого коня Росинанта, обирає Прекрасною Дамою селянку Альдонсу — «Дульсінею Тобоську» — і просить корчмаря висвятити його в лицарі.","Зброєносцем стає селянин Санчо Панса, якому Дон Кіхот обіцяє губернаторство на острові.","Лицар б'ється з вітряками, вважаючи їх велетнями, нападає на отару овець, визволяє каторжників — і щоразу зазнає побоїв.","Друзі-односельці хитрістю повертають Дон Кіхота додому, але він не зрікається своєї мрії."],
heroes:[["Дон Кіхот (Алонсо Кіхано)","мрійник-ідеаліст, шляхетний і смішний"],["Санчо Панса","зброєносець; практичний, хитруватий, вірний"],["Дульсінея Тобоська","уявна Прекрасна Дама (селянка Альдонса)"],["Росинант","старий кінь лицаря"]]},

buba:{name:"«Буба»", author:"Барбара Космовська", genre:"Повість",
about:"Повість про шістнадцятирічну польську школярку, яка в шумній, але відчуженій родині почувається самотньою. Через перше кохання, розчарування й дружбу з мудрим дідусем вона дорослішає, залишаючись собою.",
plot:["Агнешка, яку вдома звуть Бубою, живе в Варшаві з батьками, сестрою, дідусем Генриком; у родині всі зайняті собою, навіть про її день народження забувають.","Буба закохана в однокласника Адася, але він захоплюється найпривабливішою дівчиною класу — Йолькою.","Розради Буба шукає в книжках, музиці й відвертих розмовах із дідусем.","Дідусь підтримує її на чемпіонаті Польщі з бриджу — і Буба перемагає.","Буба вчиться розрізняти «справжнє» і «фальшиве», знаходить справжнє почуття до Мілоша, мирить рідних і залишається доброю та порядною."],
heroes:[["Буба (Агнешка)","звичайна школярка з незвичайною душею; добра, чесна, мудра"],["Дідусь Генрик","мудрий, іронічний, найближчий друг Буби"],["Мати Марися й батько Павел","зайняті кар'єрою батьки"],["Олька","старша сестра Буби"],["Адась і Мілош","перше уявне й перше справжнє кохання Буби"]]},

bourgeois:{name:"«Міщанин-шляхтич»", author:"Жан-Батист Мольєр, 1670", genre:"Комедія-балет",
about:"Комедія про багатого міщанина, який понад усе хоче стати «шляхтичем» і через це стає здобиччю шахраїв і посміховиськом. Мольєр висміює марнославство й бажання здаватися не тим, ким ти є.",
plot:["Пан Журден, багатий син торговця сукном, наймає вчителів музики, танців, фехтування й філософії, щоб стати схожим на аристократів.","Збіднілий граф Дорант позичає в Журдена гроші й підтримує його мрії, а подарунки Журдена маркізі Дорімені видає за власні.","Клеонт просить руки Люсіль, дочки Журдена, але той відмовляє: зять має бути дворянином.","Слуга Ков'єль вигадує маскарад: Клеонт переодягається «сином турецького султана», а Журдена «присвячують» у «мамамуші».","Журден радо віддає Люсіль за «турецького принца»; пані Журден, зрозумівши хитрість, погоджується. Закохані щасливі, а Журден залишається в полоні своїх ілюзій."],
heroes:[["Пан Журден","марнославний, наївний міщанин"],["Пані Журден","дружина Журдена, жінка здорового глузду"],["Люсіль і Клеонт","закохані"],["Ков'єль і Ніколь","дотепні слуги"],["Граф Дорант","аристократ-шахрай"],["Маркіза Дорімена","вдова, за якою упадає Журден"]]},

mole:{name:"«Таємний щоденник Адріана Моула»", author:"Сью Таунсенд, 1982", genre:"Повість-щоденник",
about:"Гумористична повість у формі щоденника англійського підлітка, який переживає перше кохання, сімейні негаразди, шкільні проблеми й шукає себе. За смішними записами — вразлива й добра душа.",
plot:["1 січня 1981 р. Адріан, якому 13¾ років, починає щоденник зі списку новорічних обіцянок.","Він закохується в нову однокласницю Пандору, переживає через прищі, школу, хуліганів.","Батьки сваряться; мама йде до сусіда містера Лукаса, тато втрачає роботу. Адріан почувається покинутим.","Хлопець опікується старим Бертом Бакстером і його собакою, пише «геніальні» вірші й надсилає їх на Бі-Бі-Сі.","Мама повертається, Адріан і Пандора стають парою; він дорослішає, хоча й лишається наївним і кумедним."],
heroes:[["Адріан Моул","оповідач, підліток-«інтелектуал»; вразливий, добрий, кумедний"],["Пандора","кохана Адріана"],["Батьки Адріана","люблячі, але заплутані у своїх проблемах"],["Берт Бакстер","літній друг Адріана"],["Найджел","друг Адріана"]]},

bubas:{name:"«Буба: мертвий сезон»", author:"Барбара Космовська", genre:"Повість",
about:"Продовження історії Буби: героїня, уже маючи досвід першого кохання й розчарувань, проходить нові випробування в родині, школі й стосунках, учиться розуміти дорослих і себе.",
plot:["Буба повертається до звичного життя після подій першої книги.","Родина, як і раніше, занурена у свої клопоти, а Буба шукає з рідними порозуміння.","У її житті з'являються нові випробування й стосунки.","Дідусь Генрик і далі — її опора й порадник.","Буба дорослішає: стає впевненішою й мудрішою, залишаючись доброю й щирою."],
heroes:[["Буба (Агнешка)","героїня, що дорослішає"],["Дідусь Генрик","мудрий друг онуки"],["Родина Буби","батьки, сестра Олька, Роберт"]]}
};
const WORK_OF = {3:"troy",4:"troy",6:"iliad",7:"tyrt",10:"aeneid",11:"aeneid",12:"seagull",13:"seagull",
16:"khayyam",17:"khayyam",18:"dante",19:"dante",20:"love",21:"love",23:"artemis",
25:"petrarca",27:"shsonnets",28:"romeo",29:"romeo",30:"romeo",31:"romeo",
32:"quixote",33:"quixote",34:"quixote",36:"buba",37:"buba",38:"buba",39:"buba",
41:"bourgeois",42:"bourgeois",43:"bourgeois",45:"mole",46:"mole",47:"mole",48:"mole",50:"bubas",51:"bubas"};


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"🏛️", d:"🐎🏺⚔️🎭🪶"},
  {c:"#c0392b", i:"🦅", d:"⛵🛡️🕊️🌊📜"},
  {c:"#3a6fd8", i:"🕯️", d:"🏰📿🌹🍷✒️"},
  {c:"#d6336c", i:"🎭", d:"🌹🗡️💌🌙🎻"},
  {c:"#1c9aa8", i:"🛡️", d:"🐴🌬️📚🃏🏡"},
  {c:"#7b4fd6", i:"👑", d:"🎩🎶📓🧚🌀"},
  {c:"#c0562a", i:"⭐", d:"🏆📚✨🎓📝"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("zl8_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS.find(x=>x.name===l.section); if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 8 клас</div>
      <h1>Зарубіжна література</h1>
      <p>Уроки за календарно-тематичним плануванням: основна інформація, про що твір, сюжет і герої, тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${si+1}</div><h2>${esc(s.name)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">РОЗДІЛ ${si+1}</div><div class="rn">${esc(s.name)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Зарубіжна література · 8 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl8_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 8`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl8_theme",d.dataset.theme); }
const th=store.get("zl8_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
