<style>

.term.f .in{transform:rotateY(180deg)}

.q.done label{cursor:default}
.q label.ok{border-color:#10b981;background:#e7f9f0}
.q label.no{border-color:#ef4444;background:#fdecec}

.btnp{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}

.home h1{font-size:32px;margin:6px 0}
.topic{margin:24px 0 10px;padding:10px 16px;border-radius:14px;color:#fff;font-weight:700;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.recap h4{margin:14px 0 4px}
@media(max-width:600px){.hero:after{font-size:70px;opacity:.15;bottom:-8px}.hero h1{font-size:24px;max-width:100%}body{font-size:16px}.top b{font-size:15px}}

</style>

sum:["==Картографічна проєкція== — математичний спосіб перенесення поверхні Землі (кулі) на площину.","Без ==спотворень== це неможливо: спотворюються ==довжини, площі, кути, форми==.","Види проєкцій за спотвореннями: ==рівнокутні== (зберігають кути — навігація), ==рівновеликі== (зберігають площі), ==довільні==.","За допоміжною поверхнею: ==циліндричні, конічні, азимутальні==.","Для карт України частіше використовують ==конічні== проєкції — спотворення в середніх широтах мінімальні."],

["p","Земля — куля (точніше, геоїд). Розгорнути кулю на площині без розривів і розтягнень неможливо, як не можна розплющити шкірку апельсина. ==Картографічна проєкція== визначає, ==як саме== переносять сітку меридіанів і паралелей на площину."],

D({n:43,top:4,par:"§ 37",pg:"187–193",e:"🌳",t:"Захист і відновлення екосистем суші. Раціональне лісокористування. Збереження біорізноманіття",

D({n:63,top:7,par:"§ 53–54",pg:"255–258",e:"🏙️",t:"Адміністративно-територіальний устрій. Населені пункти",
hook:"Після реформи децентралізації в Україні замість 490 районів стало 136, а тисячі сільрад об’єдналися в ~1470 громад. Як влаштований адміністративний поділ України?",
sum:["==Адміністративно-територіальний устрій (АТУ)== — поділ території для управління.","Рівні: ==регіональний== — ==24 області, Автономна Республіка Крим, міста зі спеціальним статусом Київ і Севастополь==; ==субрегіональний== — ==136 районів==; ==базовий== — ==~1470 територіальних громад== (з 2020 р.).","==Децентралізація== (з 2014 р.) — передача ==повноважень і коштів== громадам.","Населені пункти: ==міста, селища, села== (з 2024 р. — без «селищ міського типу»).","Найбільші міста: ==Київ, Харків, Одеса, Дніпро, Львів, Запоріжжя==."],

["h","Населені пункти",257],

["life","Знай назву своєї громади й району: саме громада відповідає за твою школу, освітлення вулиць, маршрутки та ЦНАП."]],

D({n:65,top:7,par:"§ 56",pg:"262–265",e:"🗺️",t:"Місце України на політичній карті світу. Сусідні країни. Збройні конфлікти. Європейська і євроатлантична інтеграція",

L.sort((a,b)=>a.n-b.n);
const $=s=>document.querySelector(s);
const esc=s=>String(s);
function fmt(s){return esc(s).replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
const store={get(k,d){try{return JSON.parse(localStorage.getItem("geo8_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("geo8_"+k,JSON.stringify(v))}catch(e){}}};
if(store.get("dark",false))document.body.classList.add("dark");
$("#dk").onclick=()=>{document.body.classList.toggle("dark");store.set("dark",document.body.classList.contains("dark"))};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setTheme(t){const T=TOPICS[t];document.documentElement.style.setProperty("--ac",T.c1);document.documentElement.style.setProperty("--ac2",T.c2);document.documentElement.style.setProperty("--soft",document.body.classList.contains("dark")?"#1d2b3d":T.s)}
function block(b){
 const [k,a,c]=b;
 if(k=="h"){H++;return `<h2 class="sec"><span class="num">${H}</span><span>${fmt(a)}</span>${c?`<span class="src">📘 с. ${c}</span>`:""}</h2>`}
 if(k=="p")return `<p>${fmt(a)}</p>`;
 if(["key","fact","life","ua"].includes(k))return `<div class="${k}">${fmt(a)}</div>`;
 if(k=="ul")return `<ul class="l">${a.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
 if(k=="tbl")return `<div class="tw"><table><tr>${a[0].map(x=>`<th>${fmt(x)}</th>`).join("")}</tr>${a.slice(1).map(r=>`<tr>${r.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
 if(k=="cards")return `<div class="cards">${a.map(x=>`<div><div class="e">${x[0]}</div><div class="big">${fmt(x[1])}</div><div class="lb">${fmt(x[2])}</div></div>`).join("")}</div>`;
 return "";
}
let H=0;
function topicLessons(t){return L.filter(x=>x.top==t&&!x.sumOf)}
function quiz(qs,id){
 const items=qs.map((q,i)=>{const opts=shuffle(q.slice(1,5).map((o,j)=>({o,ok:j==0})));
  return `<div class="q" data-i="${i}"><div class="qt">${i+1}. ${fmt(q[0])}</div>${opts.map(x=>`<label data-ok="${x.ok?1:0}"><input type="radio" name="q${i}">${fmt(x.o)}</label>`).join("")}<div class="ex">${q[5]?"💡 "+fmt(q[5]):""}</div></div>`}).join("");
 return `<div id="tests">${items}<div class="score" id="sc">Відповідай на запитання — результат з’явиться тут</div><p style="text-align:center"><button class="btnp" onclick="route()">🔄 Пройти ще раз</button></p></div>`;
}
function bindQuiz(n,total){
 let got=0,ans=0;
 document.querySelectorAll(".q").forEach(q=>{q.querySelectorAll("label").forEach(l=>l.onclick=()=>{
  if(q.classList.contains("done"))return;q.classList.add("done");ans++;
  q.querySelectorAll("label").forEach(x=>{if(x.dataset.ok=="1")x.classList.add("ok")});
  if(l.dataset.ok=="1"){got++}else l.classList.add("no");
  const sc=$("#sc");sc.textContent=ans<total?`Правильно: ${got} з ${ans} (усього запитань: ${total})`:`🎉 Результат: ${got} з ${total} — ${Math.round(got/total*12)} балів із 12`;
  if(ans==total){const best=store.get("s"+n,0);if(got/total>best)store.set("s"+n,got/total);}
 })});
}
function lessonView(n){
 const x=L.find(y=>y.n==n);if(!x)return home();
 setTheme(x.top);H=0;const T=TOPICS[x.top];
 let h=`<div class="hero" data-e="${x.e||T.e}"><div class="k">Урок ${x.n} · ${T.name}</div><h1>${fmt(x.t)}</h1>${x.par?`<span class="pg">📘 Підручник: ${x.par}${x.pg?", с. "+x.pg:""}</span>`:""}</div>`;
 let qs=x.q||[];
 if(x.sumOf){
  const ls=x.sumOf=="all"?L.filter(y=>!y.sumOf):Array.isArray(x.sumOf)?L.filter(y=>!y.sumOf&&x.sumOf.includes(y.top)):topicLessons(x.top);
  if(x.hook)h+=`<div class="card hook"><h3>🎯 Мета уроку</h3>${fmt(x.hook)}</div>`;
  if(x.b)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  h+=`<div class="card recap"><h2 class="sec"><span class="num">📌</span><span>Повторюємо головне з кожного уроку</span></h2>${ls.map(y=>`<h4>Урок ${y.n}. ${fmt(y.t)}</h4><ul class="l">${(y.sum||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ul>`).join("")}</div>`;
  const pool=[];ls.forEach(y=>(y.q||[]).forEach(q=>pool.push(q)));
  qs=(x.q||[]).concat(shuffle(pool).slice(0,x.cnt||(x.sumOf=="all"?24:16)));
  const terms=[];ls.forEach(y=>(y.terms||[]).forEach(t=>terms.push(t)));x._terms=terms;
 }else{
  if(x.hook)h+=`<div class="card hook"><h3>🤔 Для початку — подумай</h3>${fmt(x.hook)}</div>`;
  if(x.sum)h+=`<div class="card sum"><h3>⚡ Урок за 30 секунд</h3><ol>${x.sum.map(s=>`<li>${fmt(s)}</li>`).join("")}</ol></div>`;
  h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  x._terms=x.terms||[];
 }
 if(x._terms.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔑</span><span>Ключові поняття — натисни на картку</span></h2><div class="terms">${x._terms.map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[0])}</div><div class="ba">${fmt(t[1])}</div></div></div>`).join("")}</div></div>`;
 if(x.link)h+=`<div class="card"><p>📝 Онлайн-тест від учителя: <a class="btnp" href="${x.link}" target="_blank" rel="noopener">Відкрити тест на «Всеосвіті»</a></p></div>`;
 if(qs.length)h+=`<div class="card"><h2 class="sec"><span class="num">✅</span><span>Тест: перевір себе (${qs.length} запитань)</span></h2>${quiz(qs)}</div>`;
 const pv=L.find(y=>y.n==n-1),nx=L.find(y=>y.n==n+1);
 h+=`<div class="nav">${pv?`<a href="#${pv.n}"><small>← Попередній</small>${pv.n}. ${fmt(pv.t)}</a>`:"<span></span>"}${nx?`<a class="n" href="#${nx.n}"><small>Наступний →</small>${nx.n}. ${fmt(nx.t)}</a>`:"<span></span>"}</div>`;
 $("#app").innerHTML=h;bindQuiz(n,qs.length);scrollTo(0,0);document.title=`Урок ${n}. ${x.t.replace(/==|\*\*/g,"")}`;
}
function home(){
 document.documentElement.style.setProperty("--ac","#0ea5a4");
 const done=L.filter(x=>store.get("s"+x.n,0)>0).length;
 let h=`<div class="home"><div class="hero" data-e="🇺🇦" style="background:linear-gradient(135deg,#0f766e,#2563eb,#7c3aed)"><div class="k">Ліцей «Ясно» · 8 клас</div><h1>Географія України: природа, ресурси, держава</h1><span class="pg">📘 За підручником С. Запотоцького та ін. (2025) · ${L.length} уроків</span></div>
 <div class="card"><b>Твій прогрес:</b> пройдено тестів — ${done} з ${L.length}<div class="bar"><i style="width:${done/L.length*100}%"></i></div><small style="color:var(--mute)">Кожен урок: загадка → «урок за 30 секунд» → теорія з виділеним головним → картки понять → тест із поясненнями.</small></div>`;
 TOPICS.forEach((T,i)=>{const ls=L.filter(x=>x.top==i);if(!ls.length)return;
  h+=`<div class="topic" style="background:linear-gradient(90deg,${T.c1},${T.c2})">${T.e} ${T.name}</div><div class="grid">${ls.map(x=>{const s=store.get("s"+x.n,0);return `<a class="ls" href="#${x.n}"><span class="nb" style="background:linear-gradient(135deg,${T.c1},${T.c2})">${x.n}</span><span><div class="tt">${fmt(x.t)}</div><div class="st">${s?`✅ найкраще: ${Math.round(s*100)}%`:(x.sumOf?"🏁 узагальнення":(x.par||""))}</div></span></a>`}).join("")}</div>`});
 $("#app").innerHTML=h+"</div>";document.title="Географія · 8 клас";scrollTo(0,0);
}
function route(){const n=parseInt(location.hash.slice(1));n?lessonView(n):home()}
addEventListener("hashchange",route);route();
</script>
